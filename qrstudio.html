<!DOCTYPE html>
<!--
================================================================================
 QR Studio  -  make, design, export, print and re-edit single QR codes
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (light/dark, follows html[data-theme] and the system),
                     layout (phones: preview then editor; wide: editor beside a
                     sticky preview), sheets, toasts, print
  §2 HTML .......... top bar, preview + export, content editor, design
  §3 LIBRARIES ..... QRious (make codes) and jsQR (read codes), same vendor
                     paths as QR Loop, with a node_modules fallback for dev
  §4 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), storage
  §5 LAYERS/INPUT .. history-backed sheets (Back closes the top one), presses
                     act on release, gamepad
  §6 CONTENT ....... message types: fields, encoders, and parsers that turn a
                     scanned code back into editable fields  (pure functions)
  §7 CODE .......... QR matrix (from QRious' own frame), one vector geometry
                     for both PNG and SVG, module/corner styles, centre image
  §8 STATE ......... everything autosaves, so a reload never loses work
  §9 UI ............ editor, design controls, preview, scan check, export,
                     print, import (file, paste, drop, camera)
  §10 BOOT
 STORAGE
  qrstudio-v1 ...... {type, f:{<type>:{fields}}, d:{design}, out:{size, printCm}, raw}
  qrstudio-logo .... centre image as a PNG data URL (downscaled to 512 px)
================================================================================
-->

    row('Corner eyes', seg('Corner eyes', [['square', 'Square'], ['rounded', 'Rounded'], ['circle', 'Circle']], () => d.eyes, v => { d.eyes = v; changed(true); })),
    row('Error correction', seg('Error correction', LEVELS.map(([v, n, pc]) => [v, `${v} · ${pc}`, n]), () => d.level, v => { d.level = v; syncLevel(); changed(true); }), levelHelp),
    row('Margin', range(0, 10, 1, 'quiet', v => `${v} module${v === 1 ? '' : 's'}`, syncQuiet, 'Margin'), quietWarn),
    row('Centre image', logoBox)));
  syncContrast();
}
function syncContrast() {
  const el = $('#contrast-warn'); if (!el) return;
  const c = contrast(STATE.d.fg, STATE.d.bg); let msg = '';
  if (c.inverted) msg = 'Light code on a dark background: many phone cameras cannot read inverted codes.';
  else if (c.ratio < 4) msg = `Low contrast (${c.ratio.toFixed(1)} : 1). Darker code or a lighter background reads more reliably.`;
  el.hidden = !msg; el.innerHTML = msg ? ICON.warn + `<span>${msg}</span>` : '';
}
function loadImage(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
async function setLogo(file) {
  try {
    const src = await loadImage(URL.createObjectURL(file)), k = Math.min(1, 512 / Math.max(src.naturalWidth, src.naturalHeight));
    const c = h('canvas'); c.width = Math.max(1, Math.round(src.naturalWidth * k)); c.height = Math.max(1, Math.round(src.naturalHeight * k));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); URL.revokeObjectURL(src.src);
    LOGO.url = c.toDataURL('image/png'); LOGO.img = await loadImage(LOGO.url);
    if (!store.set(LOGO_KEY, LOGO.url)) toast('The centre image is too big to keep after a reload. It works for now.', 'error');
    if (STATE.d.level !== 'H') { STATE.d.level = 'H'; toast('Error correction set to High so the code still reads with a centre image.', 'info', 5000); }
    buildDesign(); changed(true);
  } catch (e) { toast('That image could not be opened.', 'error'); }
}

/* ---- preview and scan check ---- */
let raf = 0;
function changed(designOnly) {
  save(); if (designOnly) syncContrast(); else renderImported();
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); });
}
function update() {
  const T = TYPE[STATE.type], text = T.encode(cur()), err = $('#pv-err'), empty = $('#pv-empty');
  VIEW.text = text; VIEW.error = ''; VIEW.plan = null;
  $('#raw').value = text;
  if (!text) {
    empty.hidden = false; empty.innerHTML = ICON.qr + `<b>Fill in the ${T.what} details</b><span class="help">Or read an existing code with the camera or from an image.</span>`;
  } else if (!VIEW.ready) {
    empty.hidden = false; empty.innerHTML = ICON.qr + '<b>Loading…</b>';
  } else if (!window.QRious) {
    empty.hidden = false; empty.innerHTML = ICON.warn + '<b>The QR code library did not load</b><span class="help">Check your connection and reload.</span>';
  } else {
    const bytes = utf8(text).length, cap = CAP[STATE.d.level];
    if (bytes > cap) VIEW.error = `Too much content: ${bytes} bytes, but error correction ${STATE.d.level} fits at most ${cap}. Shorten it or choose a lower level.`;
    else { try { VIEW.plan = buildPlan(QR.matrix(text, STATE.d.level), STATE.d, !!(LOGO.url && LOGO.img)); } catch (e) { VIEW.error = 'This content could not be turned into a QR code.'; console.error(e); } }
    empty.hidden = !!VIEW.plan;
    if (!VIEW.plan) empty.innerHTML = ICON.warn + '<b>No code yet</b>';
  }
  err.hidden = !VIEW.error; err.innerHTML = VIEW.error ? ICON.warn + `<span>${VIEW.error}</span>` : '';
  drawPreview();
  const P = VIEW.plan, bytes = utf8(text).length;
  $('#meta').textContent = P ? `${bytes} byte${bytes === 1 ? '' : 's'} · version ${(P.n - 17) / 4} · ${P.n} × ${P.n} modules · error correction ${STATE.d.level}` : '';
  $$('#dl-png, #dl-svg, #copy-img, #share-img, #print-btn').forEach(b => { b.disabled = !P; });
  $('#copy-raw').disabled = !text;
  syncSize();
  scheduleCheck();
}
function drawPreview() {
  const c = $('#pv'), w = Math.max(64, Math.round(c.clientWidth * (devicePixelRatio || 1)));
  if (!VIEW.plan) { c.width = w; c.height = w; c.getContext('2d').clearRect(0, 0, w, w); return; }
  paint(c, w, VIEW.plan, STATE.d, LOGO.img);
  c.setAttribute('aria-label', `QR code preview: ${TYPE[STATE.type].what}`);
}
let checkT = 0;
function scheduleCheck() {
  clearTimeout(checkT); const el = $('#check');
  if (!VIEW.plan) { el.className = 'check wait'; el.replaceChildren(); return; }
  el.className = 'check wait'; el.textContent = 'Checking that the code reads…';
  checkT = setTimeout(runCheck, 350);
}
/** read the design back with jsQR, as a phone would, and compare bytes */
function runCheck() {
  const el = $('#check'), set = (cls, icon, msg) => { el.className = 'check ' + cls; el.innerHTML = icon + `<span>${msg}</span>`; };
  if (!VIEW.plan) return;
  if (typeof jsQR === 'undefined') { set('wait', ICON.warn, 'Scan check unavailable (reader library did not load).'); return; }
  const c = paint(h('canvas'), 600, VIEW.plan, STATE.d, LOGO.img, '#ffffff'), g = c.getContext('2d'), img = g.getImageData(0, 0, 600, 600);
  const want = utf8(VIEW.text), same = code => code && code.binaryData && code.binaryData.length === want.length && code.binaryData.every((b, i) => b === want[i]);
  const normal = jsQR(img.data, 600, 600, { inversionAttempts: 'dontInvert' });
  if (same(normal)) return set('ok', ICON.check, STATE.d.transparent ? 'Reads correctly on a white background.' : 'Scan check passed: reads back exactly.');
  const inv = jsQR(img.data, 600, 600, { inversionAttempts: 'onlyInvert' });
  if (same(inv)) return set('warn', ICON.warn, 'Reads only in apps that support light-on-dark codes.');
  if (normal || inv) return set('bad', ICON.warn, 'Reads back wrongly. Try a lower-detail style or a higher error correction level.');
  set('bad', ICON.warn, 'Could not read this design back. Try more contrast, squares, a smaller centre image or a higher error correction level.');
}

/* ---- export ---- */
const PRESETS = [256, 512, 1024, 2048, 4096];
function syncSize() {
  const s = STATE.out.size, inp = $('#size'); if (document.activeElement !== inp) inp.value = s;
  $$('#size-presets .btn').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === s)));
  const P = VIEW.plan, mod = P ? s / P.total : 0;
  $('#size-help').textContent = `About ${(s / 300 * 2.54).toFixed(1)} cm wide when printed at 300 dpi` + (P && mod < 3 ? '. Small for this much content: modules are under 3 px.' : '.');
}
function fileBase() {
  const T = TYPE[STATE.type], slug = String(T.slug(cur()) || '').normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').toLowerCase().slice(0, 40);
  return `qr-${T.id}${slug ? '-' + slug : ''}`;
}
const pngBlob = () => new Promise(res => paint(h('canvas'), STATE.out.size, VIEW.plan, STATE.d, LOGO.img).toBlob(res, 'image/png'));
function download(blob, name) {
  const u = URL.createObjectURL(blob), a = h('a', { href: u, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
  toast(`Saved ${name}`, 'success');
}
async function exportPNG() { if (!VIEW.plan) return; const b = await pngBlob(); if (b) download(b, fileBase() + '.png'); else toast('Could not make the image (too large for this device?).', 'error'); }
function exportSVG() { if (!VIEW.plan) return; download(new Blob([toSVG(VIEW.plan, STATE.d, STATE.out.size, LOGO.url)], { type: 'image/svg+xml' }), fileBase() + '.svg'); }
async function copyImage() {
  if (!VIEW.plan) return;
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]); toast('Image copied. Paste it into a document or chat.', 'success'); }
  catch (e) { toast('This browser cannot copy images. Use Save PNG instead.', 'error'); }
}
async function shareImage() {
  if (!VIEW.plan) return;
  const b = await pngBlob(), file = new File([b], fileBase() + '.png', { type: 'image/png' });
  try { await navigator.share({ files: [file], title: 'QR code' }); } catch (e) { if (e && e.name !== 'AbortError') toast('Sharing failed.', 'error'); }
}
function openPrint() {
  if (!VIEW.plan) return;
  LAYERS.open('Print', b => {
    const cm = h('input', { class: 'inp', type: 'number', min: '1', max: '25', step: '0.5', value: STATE.out.printCm, inputmode: 'decimal', id: 'print-cm', 'data-autofocus': true, style: 'width:7em' });
    cm.addEventListener('input', () => { const v = +cm.value; if (v >= 1 && v <= 25) { STATE.out.printCm = v; save(); } });
    b.append(h('p', { text: 'The code prints on its own, centred at the top of the page.' }),
      h('label', { class: 'field', for: 'print-cm' }, h('span', { text: 'Printed width (cm)' }), cm,
        h('small', { text: 'Rule of thumb: the scanning distance is about 10 times the code\u2019s width. 2 cm is the smallest that reads reliably.' })),
      h('div', { class: 'bar' }, h('span', { class: 'grow' }), h('button', { class: 'btn primary', type: 'button', html: btnHTML(ICON.print, 'Print'), onclick: () => {
        const c = paint(h('canvas'), 2048, VIEW.plan, STATE.d, LOGO.img), img = $('#print-img');
        img.src = c.toDataURL('image/png'); document.documentElement.style.setProperty('--print-w', `${STATE.out.printCm}cm`);
        LAYERS.back(); setTimeout(() => window.print(), 120);
      } })));
  });
}

/* ---- import: image file, paste, drop, camera ---- */
function decodeQR(code) {
  if (code.binaryData && code.binaryData.length) { try { return new TextDecoder('utf-8', { fatal: true }).decode(new Uint8Array(code.binaryData)); } catch (e) { /* not UTF-8 */ } }
  return code.data;
}
/** try several scales, with and without a white border (screenshots often crop the margin) */
async function readImageFile(file) {
  if (typeof jsQR === 'undefined') { toast('The QR reader did not load. Reload and try again.', 'error'); return; }
  let img;
  try { img = await loadImage(URL.createObjectURL(file)); } catch (e) { toast('That file is not an image this browser can open.', 'error'); return; }
  URL.revokeObjectURL(img.src);
  const W = img.naturalWidth, H = img.naturalHeight, c = h('canvas'), g = c.getContext('2d', { willReadFrequently: true });
  for (const max of [1400, 900, 600, 2200]) for (const border of [0, .08]) {
    const k = Math.min(1, max / Math.max(W, H)), w = Math.round(W * k), hh = Math.round(H * k), b = Math.round(Math.max(w, hh) * border);
    c.width = w + 2 * b; c.height = hh + 2 * b; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, b, b, w, hh);
    const code = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    if (code) { applyDecoded(decodeQR(code)); return; }
    await new Promise(r => setTimeout(r));   // keep the page responsive between attempts
  }
  toast('No QR code found in that image. Try a closer crop, or the camera.', 'error');
}
function applyDecoded(text) {
  const before = { state: clone(STATE) }, parsed = parseContent(text);
  STATE.type = parsed.type; STATE.f[parsed.type] = parsed.f; STATE.raw = text;
  renderTypes(); buildFields(); renderImported(); changed();
  $('#main').scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  toast(`Read a ${TYPE[parsed.type].what} code. You can edit it now.`, 'success', 8000, { label: 'Undo', fn: () => { STATE = before.state; renderTypes(); buildFields(); buildDesign(); renderImported(); changed(); toast('Restored your previous code.'); } });
}
const CAM = {
  stream: null, scanning: false, facing: null, mirrored: false, c: null, g: null,
  open() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Camera not available. It needs HTTPS (or localhost) and a camera.', 'error'); return; }
    LAYERS.open('Scan a QR code', b => {
      const video = h('video', { autoplay: true, muted: true, playsinline: true }), msg = h('div', { class: 'msg', text: 'Starting the camera…' });
      const errEl = h('p', { class: 'camerr', role: 'alert', hidden: true });
      const sw = h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.switch, 'Switch camera'), onclick: () => this.start(this.facing === 'environment' ? 'user' : 'environment') });
      const mir = h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.mirror, 'Mirror'), 'aria-pressed': 'false', onclick: () => { this.mirrored = !this.mirrored; video.classList.toggle('mirrored', this.mirrored); mir.setAttribute('aria-pressed', String(this.mirrored)); } });
      b.append(h('div', { class: 'camstage' }, video, h('div', { class: 'guide' }), msg), errEl,
        h('div', { class: 'bar' }, sw, mir, h('span', { class: 'grow' }), h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.image, 'Use an image instead'), onclick: () => { LAYERS.back(); setTimeout(() => $('#open-file').click(), 80); } })));
      this.ui = { video, msg, errEl };
      this.start(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 'environment' : null);
    }, { cls: 'cam', onClose: () => this.stop() });
  },
  async start(facing) {
    this.stop(); const ui = this.ui; ui.errEl.hidden = true;
    try {
      const v = { width: { ideal: 1280 }, height: { ideal: 720 } }; if (facing) v.facingMode = facing;
      this.stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
      if (!LAYERS.top() || !ui.video.isConnected) { this.stop(); return; }   // sheet closed while waiting for permission
      this.facing = facing; ui.video.srcObject = this.stream; ui.msg.textContent = 'Hold the code inside the square';
      this.scanning = true; this.loop();
    } catch (e) { ui.msg.textContent = ''; ui.errEl.textContent = 'Could not start the camera. Check the camera permission for this site, or use an image instead.'; ui.errEl.hidden = false; }
  },
  stop() { this.scanning = false; if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } if (this.ui) this.ui.video.srcObject = null; },
  loop() {
    if (!this.scanning) return;
    requestAnimationFrame(() => {
      const v = this.ui.video;
      if (this.scanning && v.readyState >= 2 && v.videoWidth && typeof jsQR !== 'undefined') {
        const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * k), hh = Math.round(v.videoHeight * k);
        if (!this.c) { this.c = h('canvas'); this.g = this.c.getContext('2d', { willReadFrequently: true }); }
        if (this.c.width !== w || this.c.height !== hh) { this.c.width = w; this.c.height = hh; }
        this.g.drawImage(v, 0, 0, w, hh);
        const code = jsQR(this.g.getImageData(0, 0, w, hh).data, w, hh, { inversionAttempts: 'attemptBoth' });
        if (code && (code.data || (code.binaryData && code.binaryData.length))) {
          this.stop(); try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ignore */ }
          const text = decodeQR(code); LAYERS.back(); setTimeout(() => applyDecoded(text), 80); return;
        }
      }
      this.loop();
    });
  },
};

function openHelp() {
  LAYERS.open('How QR Studio works', b => b.append(
    h('ol', {}, h('li', { html: '<b>Choose a type</b> (link, Wi-Fi, contact, event and so on) and fill in the details. The preview updates as you type.' }),
      h('li', { html: '<b>Style it</b> with colours, module shapes, corner eyes and an optional centre image. The scan check under the preview reads the code back after every change.' }),
      h('li', { html: '<b>Export</b> a PNG at the size you need, or an SVG that stays sharp at any size (best for print and websites). You can also copy, share or print it.' }),
      h('li', { html: '<b>Edit an existing code</b>: scan it with the camera, open an image or screenshot, paste an image (Ctrl+V), or drop one onto the preview.' })),
    h('p', { html: 'Your work is saved on this device as you go, so a reload or closing the tab loses nothing. Nothing is uploaded.' }),
    h('p', { html: '<b>Tips:</b> keep dark codes on light backgrounds, leave a margin of at least 2 modules, and print at least 2 cm wide. Test the printed code with a phone before printing many.' })));
}

/** measure, never guess: drop button labels, then the title, only when the bar would overflow */
function fitTop() {
  const top = $('#top'); top.classList.remove('compact', 'tiny');
  const sp = $('.spacer', top), over = () => top.scrollWidth > top.clientWidth || sp.getBoundingClientRect().width < 8;   // spacer = room left; under 8 px, compact
  if (over()) top.classList.add('compact');
  if (over()) top.classList.add('tiny');
}
function setViewportHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty('--app-h', `${Math.round(vv ? vv.height : innerHeight)}px`); }

// =============================================================================
// §10 BOOT
// =============================================================================
async function boot() {
  LAYERS.init(); GAMEPAD.init();
  const m = $('meta[name="theme-color"]'); if (m) m.content = css('--surface') || '#ffffff';
  $('#games').innerHTML = btnHTML(ICON.back, 'Games');
  $('#scan-btn').innerHTML = btnHTML(ICON.camera, 'Scan');
  $('#open-btn').innerHTML = btnHTML(ICON.image, 'Open image');
  $('#help-btn').innerHTML = ICON.help;
  $('#dl-png').innerHTML = btnHTML(ICON.save, 'Save PNG'); $('#dl-svg').innerHTML = btnHTML(ICON.save, 'Save SVG');
  $('#copy-img').innerHTML = btnHTML(ICON.copy, 'Copy'); $('#share-img').innerHTML = btnHTML(ICON.share, 'Share'); $('#print-btn').innerHTML = btnHTML(ICON.print, 'Print');
  $('#copy-raw').innerHTML = btnHTML(ICON.copy, 'Copy text');
  $('#clear-content').innerHTML = btnHTML(ICON.trash, 'Clear'); $('#reset-design').innerHTML = btnHTML(ICON.undo, 'Reset');
  $('#share-img').hidden = !(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] }));
  if (!(navigator.clipboard && window.ClipboardItem)) $('#copy-img').hidden = true;

  $('#types').append(...TYPES.map(t => h('button', { class: 'btn', type: 'button', 'data-type': t.id, html: btnHTML(ICON[t.icon], t.label), onclick: () => setType(t.id) })));
  $('#size-presets').append(...PRESETS.map(v => h('button', { class: 'btn', type: 'button', 'data-v': v, text: String(v), onclick: () => { STATE.out.size = v; save(); syncSize(); } })));
  $('#size').addEventListener('input', e => { const v = Math.round(+e.target.value); if (v >= 64 && v <= 4096) { STATE.out.size = v; save(); syncSize(); } });
  $('#size').addEventListener('blur', () => { $('#size').value = STATE.out.size; });

  $('#scan-btn').addEventListener('click', () => CAM.open());
  $('#open-btn').addEventListener('click', () => $('#open-file').click());
  $('#open-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) readImageFile(f); });
  $('#help-btn').addEventListener('click', openHelp);
  $('#dl-png').addEventListener('click', exportPNG); $('#dl-svg').addEventListener('click', exportSVG);
  $('#copy-img').addEventListener('click', copyImage); $('#share-img').addEventListener('click', shareImage); $('#print-btn').addEventListener('click', openPrint);
  $('#copy-raw').addEventListener('click', () => navigator.clipboard.writeText(VIEW.text).then(() => toast('Text copied.', 'success'), () => toast('Copy failed.', 'error')));
  $('#clear-content').addEventListener('click', () => {
    const before = clone(STATE.f[STATE.type]), t = STATE.type;
    STATE.f[t] = clone(DEFAULT_FIELDS[t]); STATE.raw = ''; buildFields(); renderImported(); changed();
    toast('Content cleared.', 'info', 8000, { label: 'Undo', fn: () => { STATE.f[t] = before; if (STATE.type === t) buildFields(); changed(); } });
  });
  $('#reset-design').addEventListener('click', () => {
    const before = clone(STATE.d); STATE.d = clone(DEFAULT_DESIGN); buildDesign(); changed(true);
    toast('Design reset.', 'info', 8000, { label: 'Undo', fn: () => { STATE.d = before; buildDesign(); changed(true); } });
  });

  // paste an image anywhere; drop an image anywhere (shown on the preview)
  addEventListener('paste', e => {
    if (LAYERS.stack.length) return;
    const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
    if (item) { e.preventDefault(); readImageFile(item.getAsFile()); }
  });
  let dragDepth = 0; const stage = $('#stage'), hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; dragDepth++; stage.classList.add('dragging'); });
  addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; stage.classList.remove('dragging'); } });
  addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; stage.classList.remove('dragging');
    const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) readImageFile(f); else toast('Drop an image file to read its QR code.', 'error'); });

  // Escape closes the top sheet (on release, same layer only)
  const KEYS = {};
  addEventListener('keydown', e => { if (!e.repeat) KEYS[e.key] = LAYERS.stack.length; });
  addEventListener('keyup', e => { const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (same && e.key === 'Escape' && LAYERS.stack.length) LAYERS.back(); });

  setViewportHeight();
  if (window.visualViewport) visualViewport.addEventListener('resize', setViewportHeight); else addEventListener('resize', setViewportHeight);
  new ResizeObserver(fitTop).observe($('#top')); fitTop();
  new ResizeObserver(() => drawPreview()).observe($('#pv'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (m) m.content = css('--surface'); });

  renderTypes(); buildFields(); buildDesign(); renderImported();
  update();   // shows "loading" state until the libraries arrive
  if (LOGO.url) { try { LOGO.img = await loadImage(LOGO.url); } catch (e) { LOGO.url = ''; store.del(LOGO_KEY); } }
  await window.LIBS; VIEW.ready = true;
  update();
}
boot();
</script>
