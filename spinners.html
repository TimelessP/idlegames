<!DOCTYPE html>
<!--
================================================================================
 Smart Spinners  -  as many decision wheels as you like, each with its own
                    entries, colours and feel; everything is remembered
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (Automatic / Light / Dark), frame, wheel cards, sheets
  §2 HTML .......... top bar, wheel grid
  §3 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), colour helpers
  §4 LAYERS/INPUT .. history-backed sheets, act on release, gamepad
  §5 STATE ......... wheels (unchanged record shape and key), autosave
  §6 WHEEL ......... draw, spin (unchanged maths: result lands at the right-hand
                     pointer), remove-and-spin, reset
  §7 UI ............ cards, editor sheet (live, with Revert), help, settings, boot
 STORAGE (unchanged)
  idlegames-spinners-state-v1 ... [{id, label, items:[{id,label}], activeItemIds, rotation,
                                    colors:{segmentColor, selectedColor, outlineColor, textColor,
                                    selectedTextColor}, outlineWidth, spin:{duration}, lastSelectedId}]
  idlegames-spinners-theme ...... "system" | "light" | "dark"
================================================================================
-->

      h('li', { html: '<b>Spin</b> picks an entry at random; it lands under the pointer on the right.' }),
      h('li', { html: '<b>Remove & spin</b> takes the last pick out of this round (great for turn-taking), then spins again. <b>Reset</b> puts everyone back.' }),
      h('li', { html: 'Add as many wheels as you like with <b>Wheel</b>. Tap a wheel’s name to change its entries, colours, outline and spin time.' }),
      h('li', { html: 'Everything is remembered on this device, including each wheel’s round.' })),
    h('div', { class: 'sec' }, h('h3', { text: 'Keyboard' }), h('p', { html: 'Focus a wheel and press <kbd>Space</kbd> or <kbd>Enter</kbd> to spin. <kbd>N</kbd> adds a wheel, <kbd>?</kbd> opens this help, <kbd>Esc</kbd> closes a panel.' }))));
}
function fitTop() { const t = $('#top'), sp = $('.spacer', t), over = () => t.scrollWidth > t.clientWidth || sp.getBoundingClientRect().width < 8; t.classList.remove('compact', 'tiny'); for (const c of ['compact', 'tiny']) if (over()) t.classList.add(c); }
function setViewportHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty('--app-h', `${Math.round(vv ? vv.height : innerHeight)}px`); }
function boot() {
  LAYERS.init(); GAMEPAD.init();
  $('#games').innerHTML = btnHTML(ICON.back, 'Games'); $('#add-btn').innerHTML = btnHTML(ICON.plus, 'Wheel'); $('#help-btn').innerHTML = ICON.help; $('#settings-btn').innerHTML = ICON.settings;
  $('#add-btn').addEventListener('click', addWheel); $('#help-btn').addEventListener('click', openHelp); $('#settings-btn').addEventListener('click', openSettings);
  const KEYS = {};
  addEventListener('keydown', e => { if (!e.repeat) KEYS[e.key] = LAYERS.stack.length; });
  addEventListener('keyup', e => { const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (!same) return;
    if (e.key === 'Escape') { if (LAYERS.stack.length) LAYERS.back(); return; }
    if (LAYERS.stack.length || (e.target.closest && e.target.closest('input,textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') addWheel(); else if (e.key === '?') openHelp(); });
  setViewportHeight();
  if (window.visualViewport) visualViewport.addEventListener('resize', setViewportHeight); else addEventListener('resize', setViewportHeight);
  new ResizeObserver(fitTop).observe($('#top')); fitTop();
  THEME.apply(); CARDS.render();
}
boot();
</script>
<script src="parental.js" defer></script>
