/* rectangle-ish with gentle irregularity, for hand-made look */

/* ==========================================================================
   PAINT ENGINE
   Shapes are SVG path data (rounded irregular polygons) rendered via Path2D.
   Each shape is painted the way an acrylic/oil painter would: a toned
   under-layer, a low-poly faceted value pass (colour + highlight + shadow of
   the same hue), then broad strokes, then finer strokes. Every stroke carries
   impasto relief (a lit ridge + a cast shadow), with relief scaled by stroke
   size so small details get less of the effect.
   ========================================================================== */
const Paint = { L: [-0.55, -0.83], detail: 1, relief: 1, wetGlobal: 0 };

function polyD(pts, round = .2, closed = true) {
  const n = pts.length, f = v => (Math.round(v * 10) / 10);
  if (round <= 0 || n < 3) { let d = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]); for (let i = 1; i < n; i++) d += 'L' + f(pts[i][0]) + ',' + f(pts[i][1]); return closed ? d + 'Z' : d; }

  if (!closed) d = 'M' + f(pts[0][0]) + ',' + f(pts[0][1]);
  for (let i = closed ? 0 : 1; i < lim; i++) {
    const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
    const p1x = lerp(b[0], a[0], round), p1y = lerp(b[1], a[1], round), p2x = lerp(b[0], c[0], round), p2y = lerp(b[1], c[1], round);
    d += (d === '' ? 'M' : 'L') + f(p1x) + ',' + f(p1y) + 'Q' + f(b[0]) + ',' + f(b[1]) + ' ' + f(p2x) + ',' + f(p2y);
  }
  if (!closed) d += 'L' + f(pts[n - 1][0]) + ',' + f(pts[n - 1][1]);
  return closed ? d + 'Z' : d;
}
const polyPath = (pts, round = .2, closed = true) => new Path2D(polyD(pts, round, closed));

/* a single brush stroke with bristle streaks and impasto relief */
Paint.stroke = function (ctx, x, y, len, w, ang, col, a, r, rel = 1) {

  const n = pts.length;
  P.moveTo((pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2);
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; P.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
  P.closePath();

  if (R0 > .2) {
    const ox = -Paint.L[0] * R0, oy = -Paint.L[1] * R0;
    ctx.translate(ox, oy); ctx.globalAlpha = ga * a * .32; ctx.fillStyle = css(csh(col, 1.6)); ctx.fill(P);
    ctx.translate(-ox * 1.6, -oy * 1.6); ctx.globalAlpha = ga * a * .28; ctx.fillStyle = css(chi(col, 1.5)); ctx.fill(P);
    ctx.translate(ox * .6, oy * .6);
  }
  ctx.globalAlpha = ga * a; ctx.fillStyle = css(col); ctx.fill(P);
  if (w > 3 && Paint.detail > .5) { /* bristle streaks */
    ctx.lineWidth = Math.max(.35, w * .07); ctx.lineCap = 'round';
    const k = w > 9 ? 3 : 2;
    for (let i = 0; i < k; i++) {

/* the main painterly fill. pts: polygon; col: HSL; o: options */
Paint.shape = function (ctx, pts, col, o = {}) {

  const P = o.path || polyPath(pts, o.round ?? .22);
  const bb = o.bb || bbox(pts), w = bb[2] - bb[0], h = bb[3] - bb[1];
  const ext = Math.max(4, Math.max(w, h) / 2), cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
  const al = o.alpha ?? 1, hk = o.hk ?? 1, sk = o.sk ?? 1, size = o.size || clamp(Math.sqrt(w * h) / 7, 2.5, 26);
  ctx.save(); ctx.globalAlpha = al;

  if (o.under !== false && size > 3) { ctx.save(); ctx.translate(r.range(-.8, .8), r.range(-.8, .8)); ctx.globalAlpha = al * .35; ctx.fillStyle = css(csh(col, 1.2)); ctx.fill(P); ctx.restore(); }
  ctx.fillStyle = css(col); ctx.fill(P);
  ctx.clip(P);

    const c0 = centroid(pts); c0[0] += L[0] * ext * .22; c0[1] += L[1] * ext * .22;
    const n = pts.length, inner = pts.map(p => [lerp(c0[0], p[0], r.range(.42, .6)), lerp(c0[1], p[1], r.range(.42, .6))]);
    const shadeOf = (mx, my, k) => {
      let nx = mx - c0[0], ny = my - c0[1]; const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
      const d = (nx * L[0] + ny * L[1]) * k + r.range(-.12, .12);

    };

      ctx.beginPath(); ctx.moveTo(ia[0], ia[1]); ctx.lineTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(ib[0], ib[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
      const cB = shadeOf((ia[0] + ib[0]) / 2, (ia[1] + ib[1]) / 2, .55); ctx.fillStyle = ctx.strokeStyle = css(cB);
      ctx.beginPath(); ctx.moveTo(c0[0], c0[1]); ctx.lineTo(ia[0], ia[1]); ctx.lineTo(ib[0], ib[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    ctx.fillStyle = g; ctx.fillRect(bb[0] - 2, bb[1] - 2, w + 4, h + 4);
  }
  if (!o.flat) {
    const dens = (o.dens ?? 1) * Paint.detail, ang = o.ang ?? r.range(-.5, .5), aj = o.angJ ?? .45;
    const passes = [[size, .62, 1], [size * .55, .5, .45]];
    for (const [sz, ak, frac] of passes) {
      const N = Math.min(o.max || 650, Math.floor(w * h / (sz * sz) * .55 * dens * frac));
      for (let i = 0; i < N; i++) {

        let c = v > 0 ? cmix(col, chi(col, hk * 1.2), v) : cmix(col, csh(col, sk * 1.1), -v);
        c = cj(c, r, o.hj ?? 4, 4, 3);
        const a = ang + r.range(-aj, aj) + (o.follow ? Math.atan2(py - cy, px - cx) + Math.PI / 2 : 0);

    ctx.stroke(P); ctx.restore();
  }

};

/* wet sheen nearest the light source */
Paint.sheen = function (ctx, bb, wet, L, r) {
  const w = bb[2] - bb[0], h = bb[3] - bb[1], ext = Math.max(w, h) / 2, cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;

    const px = sx + r.range(-ext, ext) * .5, py = sy + r.range(-ext, ext) * .5;
    ctx.globalAlpha = ga * wet * r.range(.15, .4); ctx.lineWidth = r.range(.6, 1.8);
    const a = Math.atan2(L[1], L[0]) + Math.PI / 2 + r.range(-.4, .4), l = r.range(4, 14);
    ctx.beginPath(); ctx.moveTo(px - Math.cos(a) * l, py - Math.sin(a) * l); ctx.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); ctx.stroke();

};
/* snow resting on upper surfaces (inside current clip) */
Paint.snowCap = function (ctx, bb, k, r) {
  const w = bb[2] - bb[0], h = bb[3] - bb[1], n = Math.floor(w / 3 * k) + 4;
  const ga = ctx.globalAlpha;
  for (let i = 0; i < n; i++) {
    const px = bb[0] + r.f() * w, py = bb[1] + Math.abs(r.gauss()) * h * .22 * k + r.range(-2, 2);
    const c = r.chance(.3) ? [210, 35, 84] : [205, 25, r.range(93, 99)];
    Paint.stroke(ctx, px, py, r.range(5, 14), r.range(2.5, 6), r.range(-.25, .25), c, r.range(.6, .95), r, .4);
  }
  ctx.globalAlpha = ga;
};
/* tapered brush line along a polyline (branches, trunks, ropes) */
Paint.line = function (ctx, pts, w0, w1, col, a, r, o = {}) {
  const n = pts.length; if (n < 2) return;
  const L = [], Rr = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[Math.min(n - 1, i + 1)], pp = pts[Math.max(0, i - 1)];
    let dx = q[0] - pp[0], dy = q[1] - pp[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const w = lerp(w0, w1, i / (n - 1)) * .5 * (1 + (i && i < n - 1 ? r.range(-.12, .12) : 0));
    L.push([p[0] - dy * w, p[1] + dx * w]); Rr.push([p[0] + dy * w, p[1] - dx * w]);
  }

  const P = polyPath(poly, .45), ga = ctx.globalAlpha, R0 = clamp(w0 * .12, .3, 2) * Paint.relief;
  ctx.globalAlpha = ga * a * .35; ctx.fillStyle = css(csh(col, 1.4)); ctx.save(); ctx.translate(-Paint.L[0] * R0, -Paint.L[1] * R0); ctx.fill(P); ctx.restore();

  ctx.globalAlpha = ga * a * .5; ctx.strokeStyle = css(chi(col, 1.2)); ctx.lineWidth = Math.max(.4, w0 * .18); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0] + Paint.L[0] * w0 * .2, pts[0][1] + Paint.L[1] * w0 * .2);

/* grass blade: curved tapered stroke, no outline */
Paint.blade = function (ctx, x, y, h, lean, w, col, a) {
  const tx = x + lean * h, ty = y - h, mx = x + lean * h * .35, my = y - h * .55;

  ctx.beginPath(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(mx - w * .5, my, tx, ty); ctx.quadraticCurveTo(mx + w * .5, my, x + w, y); ctx.closePath(); ctx.fill();

/* a cluster of dabs (foliage texture, flowers, blossom, moss) */
Paint.dabs = function (ctx, cx, cy, rx, ry, n, colFn, size, r, rel = .6) {
  for (let i = 0; i < n; i++) {
    const a = r.f() * TAU, d = Math.sqrt(r.f());
    const x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
    const c = colFn(x, y, r);
    if (c) Paint.stroke(ctx, x, y, size * r.range(.9, 1.8), size * r.range(.5, .8), r.range(-.8, .8) + (r.chance(.5) ? Math.PI / 2 : 0), c, r.range(.55, .9), r, rel);

/* background wash: big soft gradient + broad translucent blotches */
Paint.wash = function (ctx, x0, y0, x1, y1, cTop, cBot, r, o = {}) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, css(cTop)); g.addColorStop(1, css(cBot));

/* canvas weave texture (tileable), generated once: the physical canvas */
Paint.weave = function (seed, size = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const cx = x >> 2, cy = y >> 2, over = (cx + cy) & 1;
    const fx = ((x & 3) + .5) / 4, fy = ((y & 3) + .5) / 4;
    const slubH = h2(cy, 3, seed) * .5 + h2(cy >> 3, 9, seed) * .5, slubV = h2(cx, 5, seed) * .5 + h2(cx >> 3, 11, seed) * .5;
    let v = over ? Math.sin(Math.PI * fy) * (.8 + slubH * .4) : Math.sin(Math.PI * fx) * (.8 + slubV * .4);
    v = 120 + v * 95 + (h2(x, y, seed) - .5) * 40 + (noise2(x / 23, y / 23, seed + 7) - .5) * 30;
    const i = (y * size + x) * 4; d[i] = v + 4; d[i + 1] = v; d[i + 2] = v - 8; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv;
};

/* ---------- sprite cache: everything static is painted once, then blitted ---------- */
const Sprites = {
  m: new Map(), px: 0, budget: 42e6, frame: 0, S: 1.25, queue: [], timeBudget: 7, spent: 0,
  key(...a) { return a.join('|'); },
  /* request a sprite: returns it if ready; builds now if time allows; else queues */
  get(key, spec, urgent) {
    let s = this.m.get(key);
    if (s) { s.used = this.frame; return s; }
    if (urgent || this.spent < this.timeBudget) { const t0 = performance.now(); s = this.build(key, spec); this.spent += performance.now() - t0; return s; }
    if (!this.queue.find(q => q[0] === key)) this.queue.push([key, spec]);
    return null;
  },
  build(key, spec) {
    const S = this.S * (spec.scale || 1), w = Math.max(1, spec.w), h = Math.max(1, spec.h);
    const cv = document.createElement('canvas'); cv.width = Math.ceil(w * S); cv.height = Math.ceil(h * S);
    const ctx = cv.getContext('2d');
    ctx.scale(S, S); ctx.translate(-spec.x0, -spec.y0);
    const LL = Paint.L; if (spec.light) Paint.L = spec.light;
    try { spec.draw(ctx); } catch (e) { console.error('sprite', key, e); }
    Paint.L = LL;
    const s = { cv, x0: spec.x0, y0: spec.y0, w, h, used: this.frame, px: cv.width * cv.height };
    this.m.set(key, s); this.px += s.px; this.evict();
    return s;
  },
  evict() {
    if (this.px < this.budget) return;
    const arr = [...this.m.entries()].sort((a, b) => a[1].used - b[1].used);
    for (const [k, s] of arr) { if (this.px < this.budget * .8) break; if (s.used >= this.frame - 2) continue; this.m.delete(k); this.px -= s.px; s.cv.width = s.cv.height = 0; }
  },
  tick() { this.frame++; this.spent = 0; },
  pump(ms) { const t0 = performance.now(); while (this.queue.length && performance.now() - t0 < ms) { const [k, sp] = this.queue.shift(); if (!this.m.has(k)) this.build(k, sp); } },
  clear() { for (const s of this.m.values()) s.cv.width = s.cv.height = 0; this.m.clear(); this.px = 0; this.queue.length = 0; },
  draw(ctx, s, x, y, alpha = 1) { if (!s) return; if (alpha < 1) ctx.globalAlpha = alpha; ctx.drawImage(s.cv, x + s.x0, y + s.y0, s.w, s.h); if (alpha < 1) ctx.globalAlpha = 1; }
};

  },
  menuFocus() { return [...document.querySelectorAll('.menu .focusable')]; },
  markFocus() { this.focusList.forEach((el, i) => el.classList.toggle('pfocus', i === this.focusIdx && (this.usingPad || this.lastKind === 'key'))); const el = this.focusList[this.focusIdx]; if (el && (this.usingPad || this.lastKind === 'key')) el.focus({ preventScroll: false }); },
  moveFocus(d) { if (!this.focusList.length) return; this.focusIdx = (this.focusIdx + d + this.focusList.length) % this.focusList.length; this.markFocus(); },
  /* gamepad: polled each frame */
  poll() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    if (!pads.length) { this.padDir = 0; return; }
    const gp = pads[0], b = gp.buttons.map(x => x.pressed), prev = this.padPrev, dz = Settings.v.controls.deadzone;
    const edge = i => b[i] && !prev[i];
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const any = b.some(Boolean) || Math.abs(ax) > dz || Math.abs(ay) > dz;
    if (any) { if (!this.padSeen) { this.padSeen = true; UI.say('Gamepad connected.'); } this.usingPad = true; this.lastKind = 'pad'; Audio.init(); if (!Game.started) { Game.begin(); this.padPrev = b; return; } }
    const left = b[14] || ax < -dz, right = b[15] || ax > dz, up = b[12] || ay < -.6, down = b[13] || ay > .6;
    const upE = up && !this.upPrev, downE = down && !this.downPrev; this.upPrev = up; this.downPrev = down;
    if (UI.menuOpen || UI.modal || Dialog.active) {
      this.padDir = 0;
      if (upE) this.moveFocus(-1); if (downE) this.moveFocus(1);
      const el = this.focusList[this.focusIdx];
      if (el && el.type === 'range' && (left || right) && (this.lrT = (this.lrT || 0) - 1) <= 0) { this.lrT = 6; el.value = +el.value + (right ? 1 : -1) * +el.step; el.dispatchEvent(new Event('input')); }
      if (edge(0) && el && el._tap) el._tap();
      if (edge(1)) { if (Dialog.active) Dialog.close(); else UI.back(); }
      if (edge(9) && UI.menuOpen) UI.closeMenu();
    } else if (Game.started) {
      this.padDir = right ? 1 : left ? -1 : 0;
      if (upE) G.player.tryClimb(true); if (downE) G.player.tryClimb(false);
      if (edge(0)) { const n = G.nearestInteractable(); if (n) G.interact(n); }
      if (edge(1)) { G.held = null; UI.refreshInv(); }
      if (edge(2) && G.held) G.eat(G.held);
      if (edge(4)) { this.slotCursor = (this.slotCursor + 7) % 8; UI.refreshInv(); } if (edge(5)) { this.slotCursor = (this.slotCursor + 1) % 8; UI.refreshInv(); }
      if (edge(3)) G.slotTap(this.slotCursor);
      if (edge(9)) UI.openMenu();
      const lt = gp.buttons[6] ? gp.buttons[6].value : 0, rt = gp.buttons[7] ? gp.buttons[7].value : 0;
      if (lt > .2) this.zoom(1 - lt * .02); if (rt > .2) this.zoom(1 + rt * .02);
    }
    this.padPrev = b;
  },
  rumble(ms) { try { const gp = [...navigator.getGamepads()].find(Boolean); if (gp && gp.vibrationActuator && Settings.v.controls.vibrate) gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: .4, weakMagnitude: .6 }); } catch (e) { } },
};

/* ==========================================================================
   GAME CONTROLLER: boot, loading & proof, pause/resume, loop, autosave
   ========================================================================== */
const Game = {
  started: false, paused: false, saveT: 0, lastRender: 0,
  boot() {
    Settings.load(); UI.build(); Render.init(); Input.init();
    window.addEventListener('resize', () => { Render.resize(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.player) G.save(); Audio.suspend(); } else if (!this.paused && this.started) Audio.resume(); });
    window.addEventListener('pagehide', () => { if (G.player) G.save(); });
    const steps = ['Stretching the canvas...', 'Grinding pigments...', 'Laying down the wash...'];
    let i = 0; const tick = () => { UI.loadingMsg(steps[i++ % steps.length]); };
    tick();
    setTimeout(() => {
      let saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { }
      this.isNew = true;
      if (saved) { try { G.restore(saved); this.isNew = false; } catch (e) { console.warn('save invalid, starting fresh', e); saved = null; } }
      if (!saved) { tick(); G.newGame((((Date.now() * 2654435761) ^ 0x5bd1e995) >>> 0)); }
      UI.loadingMsg(`Verified solvable: 10 chapters, ${W.proof.puzzles} plot devices, ${W.proof.steps} steps.`);
      this.prewarm();
      UI.refreshInv(); UI.refreshHealth();
      UI.loadingReady();
      const go = e => { this.begin(); };
      UI.loading.addEventListener('pointerup', go);
      requestAnimationFrame(t => this.loop(t));
    }, 60);
  },
  prewarm() {
    const old = Sprites.timeBudget; Sprites.timeBudget = 1e9;
    Render.camInit = false; Render.updateCamera(0); Render.frame(0, G.t); Render.frame(0, G.t);
    Sprites.timeBudget = old;
  },
  begin() {
    if (this.started) return; this.started = true;
    Audio.init(); Audio.resume(); UI.hideLoading();
    if (this.isNew) UI.storyCard('intro', () => UI.say('Click or tap the ground to walk. Click things to use them.'));
    else UI.say('Welcome back.');
  },
  start(seed, intro) {
    UI.loadingMsg('Painting a new valley...'); UI.loading.classList.remove('hidden', 'out', 'ready'); $('.lgo', UI.loading).classList.add('hidden');
    setTimeout(() => {
      G.newGame(seed); UI.loadingMsg(`Verified solvable: 10 chapters, ${W.proof.puzzles} plot devices, ${W.proof.steps} steps.`);
      this.prewarm(); UI.refreshInv(); UI.refreshHealth(); G.save();
      setTimeout(() => { UI.hideLoading(); if (intro) UI.storyCard('intro'); }, 700);
    }, 50);
  },
  loadState(d) {
    G.restore(d); G.save(); this.prewarm(); UI.refreshInv(); UI.refreshHealth();
  },
  pause(on) {
    this.paused = on;
    if (on) { Audio.suspend(); Audio.stopVoice(); } else Audio.resume();
  },
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    const fps = this.paused ? 12 : Settings.v.gfx.fps, min = fps ? 1000 / fps : 0;
    if (now - this.lastRender < min - 1.5) return;
    const dt = Math.min(.05, (now - (this.lastRender || now)) / 1000); this.lastRender = now;
    Input.poll();
    if (G.player && this.started && !this.paused) {
      G.player.kbDir = Dialog.active ? 0 : (Input.kbDir || Input.padDir);
      G.update(dt); Audio.update(dt);
      this.saveT += dt; if (this.saveT > 4 || (G.dirty && this.saveT > .6)) { this.saveT = 0; G.save(); }
    }
    if (G.player) { Render.updateCamera(dt); Render.frame(dt, G.t); }
    UI.update(dt);
    if (G.held && Input.lastKind !== 'mouse' && G.player) { const p = Input.worldToClient(G.player.x + 26 * G.player.face, G.player.y - 120); UI.moveHeld(p[0], p[1]); }
  },
};
window.addEventListener('load', () => Game.boot());

</script>
