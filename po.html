<!DOCTYPE html>
<!--
================================================================================
 Personal Organiser  -  notes, tasks, calendar, tracker, flash cards,
                        calculator and decision wheel, all on this device
================================================================================
 SECTION INDEX (search for the tag, e.g. "§7")
  §1 CSS ........... tokens for six themes (Automatic, Light, Dark, Powerpuff,
                     Slate, Classic), frame (phones: bottom nav + More; wide and
                     short landscape: side rail), rows, sheets, toasts
  §2 HTML .......... top bar, nav, seven views, sheets, toasts
  §3 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), storage, dates
  §4 LAYERS/INPUT .. history-backed sheets, act on release, gamepad, reorder
  §5 STATE ......... sanitiser (unchanged contract), autosave, theme
  §6 NOTES ......... ranked search, Markdown preview with task toggles, editor
  §7 TASKS
  §8 CALENDAR
  §9 CARDS ......... practice (flip, shuffle) and manage
  §10 CALC ......... safe expression evaluator (no eval)
  §11 WHEEL
  §12 TRACKER ...... metrics, lazy day table, chart
  §13 SETTINGS/DATA/ABOUT sheets
  §14 BOOT
 STORAGE (unchanged)
  po-data-v1 ... {ui, notes, tasks, events, cards, shuffledCache, cardsPractice, wheel, tracker}
                 (ui.notesEditMode is now kept; older copies ignore it)
  po-theme ..... "system" | "light" | "dark" | "powerpuff" | "slate" | "classic"
================================================================================
-->
<html lang="en" data-theme="powerpuff">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="IdleGames">
  <script src="assets/js/pwa.js" defer></script>
  <title>Personal Organiser</title>
  <meta name="description" content="Notes, tasks, calendar, tracker, flash cards, calculator and decision wheel. Local-first: everything stays on this device.">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/fonts/dseg7.css">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script>
    try { const t = localStorage.getItem('po-theme'); if (['system', 'light', 'dark', 'powerpuff', 'slate', 'classic'].includes(t)) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  </script>
  <style>
/* ==========================================================================
   §1 CSS
   ========================================================================== */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #eceef2; --line: #d6dae1; --text: #14171c; --text-2: #4a5160; --text-3: #6b7383;
  --accent: #6d28d9; --accent-soft: #ede5fc; --on-accent: #ffffff; --primary-bg: var(--accent);
  --ok: #1d7a43; --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #9a4a00;
  --sel-bg: #d9c9fb; --sel-fg: #14171c; --bw: 1px; --shadow: 0 12px 40px rgba(0,0,0,.25);
  --fs: 17px; --tap: 48px; --r: 8px; --app-h: 100dvh;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
    --accent: #c0a8ff; --accent-soft: #2a2148; --on-accent: #160d33; --ok: #5fd08c; --bad: #ff7a70; --bad-soft: #3a1b19; --warn: #ffb35c;
    --sel-bg: #4b3a8f; --sel-fg: #ffffff; --shadow: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
  --accent: #c0a8ff; --accent-soft: #2a2148; --on-accent: #160d33; --ok: #5fd08c; --bad: #ff7a70; --bad-soft: #3a1b19; --warn: #ffb35c;
  --sel-bg: #4b3a8f; --sel-fg: #ffffff; --shadow: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark;
}
:root[data-theme="powerpuff"] {
  --bg: #fff6fa; --surface: #ffffff; --surface-2: #ffe9f2; --line: #f5c6da; --text: #1f2937; --text-2: #4b5563; --text-3: #6b6f7b;
  --accent: #c2185b; --accent-soft: #ffe0ee; --on-accent: #ffffff; --sel-bg: #ffc2dc; --sel-fg: #1f2937;
}
:root[data-theme="slate"] {
  --bg: #0f172a; --surface: #131d35; --surface-2: #1b2742; --line: #2b3a5a; --text: #e2e8f0; --text-2: #b8c4d6; --text-3: #8b9ab3;
  --accent: #38bdf8; --accent-soft: #10324a; --on-accent: #04121c; --ok: #5fd08c; --bad: #ff8a80; --bad-soft: #3a1b22; --warn: #fbbf24;
  --sel-bg: #1d5a80; --sel-fg: #ffffff; --shadow: 0 12px 40px rgba(0,0,0,.6); color-scheme: dark;
}
:root[data-theme="classic"] {   /* the paper organiser: warm paper, ink outlines, sunny buttons */
  --bg: #fff8ec; --surface: #fffdf8; --surface-2: #fff0d6; --line: #1f2937; --text: #1f2937; --text-2: #46505e; --text-3: #616a78;
  --accent: #9a4f00; --accent-soft: #ffe7a8; --on-accent: #1f2937; --primary-bg: #ffd86b; --sel-bg: #ffd86b; --sel-fg: #1f2937; --bw: 2px; --fs: 17.5px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::selection { background: var(--sel-bg); color: var(--sel-fg); }
:focus { outline: none; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
a { color: var(--accent); }
svg.i { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); min-width: var(--tap); padding: 0 1em;
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); } .btn[disabled] { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: var(--tap); }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--on-accent); font-weight: 650; }
:root[data-theme="classic"] .btn.primary { border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 650; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
:root[data-theme="classic"] .btn[aria-pressed="true"] { color: var(--text); border-color: var(--line); }
.inp, .ta, .sel { min-height: var(--tap); padding: 0 .75em; border: var(--bw) solid var(--line); border-radius: var(--r); background: var(--surface); width: 100%; }
.ta { padding: .6em .75em; resize: vertical; line-height: 1.5; }
.inp:focus, .ta:focus, .sel:focus { border-color: var(--accent); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .bar .grow { flex: 1; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.muted { color: var(--text-2); } .small { font-size: .9em; }
.tab-num { font-variant-numeric: tabular-nums; }

/* ---- frame: phones = top bar, view, bottom nav ---- */
#app { position: fixed; inset: 0; height: var(--app-h); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top" "main" "nav"; }
#top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: calc(4px + var(--safe-t)) calc(8px + var(--safe-r)) 4px calc(8px + var(--safe-l)); background: var(--surface); border-bottom: var(--bw) solid var(--line); min-height: 58px; }
#top > * { flex-shrink: 0; }
#top .spacer { flex: 1 1 0; min-width: 0; flex-shrink: 1; }
#top h1 { font-size: 1.08em; font-weight: 750; white-space: nowrap; }
#top.compact .lbl { display: none; } #top.compact .btn.lab { width: var(--tap); padding: 0; }
#top h1 .short { display: none; } #top.tiny h1 .full { display: none; } #top.tiny h1 .short { display: inline; } #top.micro h1 { display: none; }
:root[data-theme="classic"] #top { background: linear-gradient(90deg, #ffc9a9 0%, #ffd86b 50%, #b9f5c6 100%); }
#views { grid-area: main; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
#nav { grid-area: nav; display: flex; background: var(--surface); border-top: var(--bw) solid var(--line); padding: 0 var(--safe-r) var(--safe-b) var(--safe-l); }
.nb { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; padding: 4px 2px;
  background: transparent; border: 0; color: var(--text-2); font-size: .78em; cursor: pointer; touch-action: manipulation; }
.nb svg.i { width: 1.6em; height: 1.6em; }
.nb[aria-current="page"] { color: var(--accent); font-weight: 750; box-shadow: inset 0 3px 0 var(--accent); }   /* bar + weight + colour */
:root[data-theme="classic"] .nb[aria-current="page"] { color: var(--text); background: var(--accent-soft); }
.nb.extra { display: none; }
.nb span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* wide screens and short landscape phones: a side rail with every section */
@media (min-width: 900px), (max-height: 560px) and (orientation: landscape) {
  #app { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top" "nav main"; }
  #nav { flex-direction: column; border-top: 0; border-right: var(--bw) solid var(--line); width: calc(92px + var(--safe-l)); padding: 4px 0 var(--safe-b) var(--safe-l); overflow-y: auto; }
  .nb { flex: 0 0 auto; min-height: 64px; } .nb[aria-current="page"] { box-shadow: inset 3px 0 0 var(--accent); }
  .nb.extra { display: flex; } .nb.more { display: none; }
}
@media (max-height: 560px) and (orientation: landscape) { #nav { width: calc(76px + var(--safe-l)); } .nb { min-height: 54px; } }

.view { min-height: 0; display: none; flex-direction: column; } .view.on { display: flex; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.wrap { max-width: 980px; margin: 0 auto; padding: 12px calc(12px + var(--safe-r)) calc(24px + var(--safe-b)) 12px; display: flex; flex-direction: column; gap: 10px; }
.vhead { display: flex; flex-direction: column; gap: 8px; }
.count { color: var(--text-2); font-size: .9em; font-variant-numeric: tabular-nums; min-height: 1.4em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.count .btn { min-height: 36px; padding: 0 .8em; font-size: .95em; }
.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search svg.i { position: absolute; left: .8em; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .inp { padding-left: 2.6em; } .search .inp::-webkit-search-cancel-button { display: none; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 16px; text-align: center; color: var(--text-2); }
.empty > svg.i { width: 48px; height: 48px; color: var(--text-3); }
.empty b { color: var(--text); font-size: 1.05em; }

/* ---- rows (notes, tasks, cards, events) ---- */
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 2px; background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); min-height: 56px; padding-right: 4px; }
.row .handle { width: 40px; align-self: stretch; display: flex; align-items: center; justify-content: center; color: var(--text-3); cursor: grab; touch-action: none; flex: none; border-radius: var(--r) 0 0 var(--r); }
.row .handle:hover { color: var(--text); background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; min-height: 56px; padding: 6px 8px; text-align: left; background: none; border: 0; cursor: pointer; border-radius: var(--r); }
.row .main:hover { background: var(--surface-2); }
.row .main b, .row .main span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .main span { color: var(--text-2); font-size: .9em; }
.row .main.nohandle { padding-left: 12px; }
.row.dragging { box-shadow: 0 8px 24px rgba(0,0,0,.25); position: relative; z-index: 2; border-color: var(--accent); }
.row .inp { border-color: transparent; background: transparent; padding: 0 8px; }
.row .inp:hover { border-color: var(--line); } .row .inp:focus { border-color: var(--accent); background: var(--surface); }
.chk { display: flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); flex: none; cursor: pointer; }
.chk input { width: 24px; height: 24px; accent-color: var(--accent); cursor: pointer; }
.row.done .inp { text-decoration: line-through; color: var(--text-3); }

/* ---- notes editor ---- */
.md { line-height: 1.6; overflow-wrap: anywhere; }
.md > * + * { margin-top: .6em; }
.md h1 { font-size: 1.5em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.15em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { padding-left: 1.4em; } .md li + li { margin-top: .2em; }
.md li input[type=checkbox] { width: 20px; height: 20px; vertical-align: -4px; accent-color: var(--accent); margin-right: .3em; cursor: pointer; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.md pre { background: var(--surface-2); padding: .8em 1em; border-radius: var(--r); overflow-x: auto; } .md pre code { background: none; padding: 0; }
.md blockquote { border-left: 4px solid var(--accent); padding: .2em 0 .2em .9em; color: var(--text-2); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; } .md th, .md td { border: 1px solid var(--line); padding: .35em .6em; }
.md img { max-width: 100%; height: auto; border-radius: var(--r); } .md hr { border: 0; border-top: 1px solid var(--line); }
.tk-com { color: var(--text-3); font-style: italic; } .tk-str { color: var(--ok); } .tk-kw { color: var(--accent); font-weight: 650; } .tk-num, .tk-lit { color: var(--warn); }
.editor { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.editor .ta.body { flex: 1; min-height: 12em; resize: none; }
.editor .md { flex: 1; min-height: 12em; overflow-y: auto; padding: .6em .2em; }

/* ---- calendar ---- */
.cal-layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1150px) { .cal-layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.cal-nav { display: flex; align-items: center; gap: 6px; } .cal-nav h2 { flex: 1; text-align: center; font-size: 1.1em; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: .78em; color: var(--text-3); font-weight: 650; padding: 2px 0; }
.day { position: relative; aspect-ratio: 1 / .92; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; padding: 4px 2px;
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); cursor: pointer; font-variant-numeric: tabular-nums; }
.day:hover { background: var(--surface-2); }
.day .n { font-weight: 650; }
.day.today .n { background: var(--accent); color: var(--on-accent); border-radius: 999px; min-width: 1.9em; text-align: center; }
:root[data-theme="classic"] .day.today .n { background: var(--primary-bg); color: var(--text); }
.day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.day .dots { display: flex; gap: 3px; align-items: center; font-size: .7em; color: var(--text-2); }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
.daypanel { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.daypanel h3 { font-size: 1.05em; }

/* ---- cards ---- */
.flash { width: 100%; min-height: min(46vh, 360px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 18px; text-align: center;
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: 14px; cursor: pointer; font-size: 1.35em; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.flash.back { background: var(--accent-soft); }
.flash .side { font-size: .6em; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }

/* ---- calculator ---- */
.calc { flex: 1; min-height: 0; width: 100%; max-width: 520px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding: 12px calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) 12px; }
.calc-display { background: var(--surface-2); border: var(--bw) solid var(--line); border-radius: 10px; padding: 8px 14px; text-align: right; min-height: 96px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.calc-display .expr { color: var(--text-2); min-height: 1.4em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.calc-display .val { font-family: "DSEG7", ui-monospace, monospace; font-size: clamp(1.8em, 8vw, 2.8em); line-height: 1.2; overflow-wrap: anywhere; }
.calc-display .val.err { font-family: inherit; color: var(--bad); }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(52px, 1fr); gap: 8px; min-height: 0; }
.keys .btn { font-size: 1.35em; font-weight: 600; min-height: 0; height: 100%; padding: 0; }
.keys .btn.op { color: var(--accent); background: var(--accent-soft); }
:root[data-theme="classic"] .keys .btn.op { color: var(--text); }

/* ---- wheel ---- */
.wheel-stage { position: relative; flex: 1; min-height: 240px; display: flex; align-items: center; justify-content: center; }
.wheel-stage canvas { display: block; cursor: pointer; border-radius: 50%; }
.result { text-align: center; font-size: 1.2em; font-weight: 700; min-height: 1.6em; }

/* ---- tracker ---- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .5em; min-height: 44px; padding: 0 .9em; border: var(--bw) solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.chip .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid var(--sw); background: transparent; }
.chip[aria-pressed="true"] { border-color: var(--sw); font-weight: 650; } .chip[aria-pressed="true"] .sw { background: var(--sw); }
.range { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.range .pair { display: inline-flex; align-items: center; gap: 8px; } .range .inp { width: auto; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: var(--bw) solid var(--line); border-radius: 10px; background: var(--surface); }
table.track { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
table.track th, table.track td { border-bottom: 1px solid var(--line); padding: 2px 4px; text-align: left; }
table.track thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; padding: 8px; font-size: .9em; white-space: nowrap; }
table.track tbody th { position: sticky; left: 0; background: var(--surface); padding: 4px 10px; font-weight: 500; white-space: nowrap; z-index: 1; }
table.track tbody th small { display: block; color: var(--text-3); font-size: .78em; }
table.track tr.wkend th { color: var(--text-2); }
table.track td .inp { min-width: 5.5em; border-color: transparent; text-align: right; background: transparent; }
table.track td .inp:focus { border-color: var(--accent); background: var(--surface); }
.chartbox { position: relative; height: max(300px, min(60vh, 560px)); background: var(--surface); border: var(--bw) solid var(--line); border-radius: 10px; padding: 6px; }
.chartbox canvas { display: block; width: 100%; height: 100%; }
.sentinel { padding: 10px; text-align: center; color: var(--text-3); font-size: .9em; }

/* ---- sheets ---- */
#sheets { position: fixed; inset: 0; z-index: 1000; display: none; height: var(--app-h); }
#sheets.on { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.55); }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 16px)); max-height: calc(var(--app-h) - 16px);
  background: var(--surface); border: var(--bw) solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }

function stateToText(s) {
    const lines = [];
    lines.push('# Notes');
    if ((s.notes || []).length === 0) { lines.push('(none)'); } else {
        s.notes.forEach(n => { lines.push(`- ${n.title || '(untitled)'}`); if (n.content) { lines.push(n.content); } lines.push(''); });
    }
    lines.push('\n# Tasks');
    if ((s.tasks || []).length === 0) { lines.push('(none)'); } else {
        s.tasks.forEach(t => { const chk = t.done ? '[x]' : '[ ]'; lines.push(`${chk} ${t.text || ''}`); });
    }
    lines.push('\n# Calendar Events');
    const dates = Object.keys(s.events || {}).sort();
    if (dates.length === 0) { lines.push('(none)'); } else {
        dates.forEach(d => { lines.push(`- ${d}`); (s.events[d] || []).forEach(ev => lines.push(`  • ${ev}`)); });
    }
    lines.push('\n# Cards');
    if ((s.cards || []).length === 0) { lines.push('(none)'); } else {
        s.cards.forEach(c => { lines.push(`- Front:`); if (c.front) lines.push(c.front); lines.push('  Back:'); if (c.back) lines.push(c.back); lines.push(''); });
    }
    lines.push('\n# Wheel Items');
    if (s.wheel?.itemsText) { lines.push(s.wheel.itemsText.trim()); } else { lines.push('(none)'); }
    lines.push('\n# Tracker');
    if (!s.tracker || (s.tracker.metrics || []).length === 0) { lines.push('(no metrics)'); }
    else {
        lines.push('Metrics:'); (s.tracker.metrics || []).forEach(m => lines.push(`- ${m.name} (${m.id})`));
        // Settings summary
        const type = s.tracker.chartType || 'stacked';
        const selIds = (s.tracker.selectedMetrics && s.tracker.selectedMetrics.length) ? s.tracker.selectedMetrics.slice() : (s.tracker.metrics || []).map(m => m.id);
        const nameById = Object.fromEntries((s.tracker.metrics || []).map(m => [m.id, m.name]));
        const selNames = selIds.map(id => nameById[id] || id);
        const r = s.tracker.chartRange || { start: null, end: null };
        lines.push(`Chart type: ${type}`);
        lines.push(`Selected metrics: ${selNames.length ? selNames.join(', ') : '(none)'}`);
        lines.push(`Range preset: ${s.tracker.rangePreset || 'custom'}`);
        lines.push(`Range: ${r.start || '—'} to ${r.end || '—'}`);
        const tdates = Object.keys(s.tracker.data || {}).sort();
        tdates.forEach(d => { const row = s.tracker.data[d] || {}; const cells = Object.entries(row).map(([k, v]) => `${k}=${v ?? ''}`); lines.push(`${d}: ${cells.join(', ')}`); });

  $('#wheel-mode').append(...[['use', 'Spin'], ['manage', 'Manage']].map(([m, l]) => h('button', { class: 'btn', type: 'button', 'data-m': m, text: l, onclick: () => WHEEL.mode(m) })));
  $('#tracker-mode').append(...[['data', 'Data'], ['chart', 'Chart']].map(([m, l]) => h('button', { class: 'btn', type: 'button', 'data-m': m, text: l, onclick: () => { state.ui.trackerMode = m; scheduleSave(); TRACKER.render(); } })));
  $('#tracker-presets').append(...[['month', 'This month'], ['90d', 'Last 90 days'], ['year', 'This year'], ['all', 'All']].map(([id, l]) => h('button', { class: 'btn', type: 'button', 'data-p': id, text: l, onclick: () => TRACKER.setPreset(id) })));

  // notes
  let qT = 0; $('#notes-q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => NOTES.search(e.target.value), 150); });
  $('#notes-q').addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.value) { e.preventDefault(); e.stopPropagation(); e.target.value = ''; NOTES.search(''); } });
  $('#note-add').addEventListener('click', () => NOTES.add());
  reorderable($('#notes-list'), ids => { const m = new Map(state.notes.map(n => [n.id, n])); state.notes = ids.map(id => m.get(id)).concat(state.notes.filter(n => !ids.includes(n.id))); scheduleSave(); NOTES.render(); });
  // tasks
  $('#task-form').addEventListener('submit', e => { e.preventDefault(); if (TASKS.add($('#task-new').value)) $('#task-new').value = ''; $('#task-new').focus(); });
  reorderable($('#tasks-list'), ids => { const m = new Map(state.tasks.map(t => [t.id, t])); state.tasks = ids.map(id => m.get(id)); scheduleSave(); TASKS.render(); });
  // calendar
  $('#cal-prev').addEventListener('click', () => CAL.step(-1)); $('#cal-next').addEventListener('click', () => CAL.step(1)); $('#cal-today').addEventListener('click', () => CAL.today());
  // wheel
  $('#wheel-items').addEventListener('input', e => { state.wheel.itemsText = e.target.value; state.wheel.lastHit = null; scheduleSave(); WHEEL.render(); });
  $('#wheel-spin').addEventListener('click', () => WHEEL.spin()); $('#wheel-canvas').addEventListener('click', () => WHEEL.spin());
  $('#wheel-canvas').addEventListener('keyup', e => { if (e.key === ' ') WHEEL.spin(); });
  $('#wheel-remove').addEventListener('click', () => WHEEL.removeAndSpin());
  $('#wheel-sample').addEventListener('click', () => { const before = state.wheel.itemsText; state.wheel.itemsText = ['Pizza', 'Curry', 'Pasta', 'Salad', 'Stir-fry', 'Tacos', 'Burgers', 'Sushi', 'Soup', 'Sandwich', 'BBQ', 'Roast', 'Noodles', 'Rice Bowl', 'Wraps', 'Dumplings', 'Ramen', 'Kebab', 'Fish & Chips', 'Burrito'].join('\n'); state.wheel.lastHit = null; scheduleSave(); WHEEL.render();
    if (before.trim()) toast('Sample items loaded.', 'info', 8000, { label: 'Undo', fn: () => { state.wheel.itemsText = before; scheduleSave(); WHEEL.render(); } }); });
  $('#wheel-clear').addEventListener('click', () => { const before = state.wheel.itemsText; if (!before.trim()) return; state.wheel.itemsText = ''; state.wheel.lastHit = null; scheduleSave(); WHEEL.render();
    toast('Wheel cleared.', 'info', 8000, { label: 'Undo', fn: () => { state.wheel.itemsText = before; scheduleSave(); WHEEL.render(); } }); });
  new ResizeObserver(() => { if (VIEW.cur === 'wheel') WHEEL.fit(); }).observe($('#wheel-stage'));
  // tracker
  const range = () => { const cr = state.tracker.chartRange; cr.start = $('#tr-start').value || null; cr.end = $('#tr-end').value || null; state.tracker.rangePreset = 'custom'; scheduleSave(); TRACKER.render(); };
  $('#tr-start').addEventListener('change', range); $('#tr-end').addEventListener('change', range);
  $('#metric-add').addEventListener('click', () => TRACKER.addMetric());
  let rT = 0; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (VIEW.cur === 'tracker') TRACKER.drawChart(); }, 120); });
  // top bar
  $('#settings-btn').addEventListener('click', openSettings);
  const fs = $('#fs-btn'), syncFs = () => { const on = !!document.fullscreenElement; fs.innerHTML = on ? ICON.unfull : ICON.full; fs.setAttribute('aria-pressed', String(on)); fs.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); fs.title = fs.getAttribute('aria-label'); };
  if (!document.fullscreenEnabled) fs.hidden = true;
  fs.addEventListener('click', () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => toast('Full screen is not available here.', 'error')); });
  document.addEventListener('fullscreenchange', syncFs); syncFs();

  // keys: act on release in the same layer; calculator typing and card keys only in their views
  const KEYS = {}, typing = e => e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
  addEventListener('keydown', e => {
    if (!e.repeat) KEYS[e.key] = LAYERS.stack.length;
    if (LAYERS.stack.length || typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (VIEW.cur === 'calc') { const map = { '*': '×', '/': '÷', '-': '−', Enter: '=', '=': '=', Backspace: '⌫', Delete: 'C' };
      const k = /^[0-9.+()]$/.test(e.key) ? e.key : map[e.key]; if (k) { e.preventDefault(); if (!e.repeat || k === '⌫') CALC.press(k); } }
    if (VIEW.cur === 'cards' && state.ui.cardsMode === 'practice' && (e.key === ' ' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(e.target.closest && e.target.closest('button:not(#flash)'))) e.preventDefault();
    if (e.key === '/' && VIEW.cur === 'notes') e.preventDefault();
  });
  addEventListener('keyup', e => {
    const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (!same) return;
    if (e.key === 'Escape') { if (LAYERS.stack.length) LAYERS.back(); return; }
    if (LAYERS.stack.length || typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (VIEW.cur === 'cards' && state.ui.cardsMode === 'practice' && state.cards.length) {
      if (e.key === ' ' && !(e.target.closest && e.target.closest('button:not(#flash)'))) CARDS.flip();
      else if (e.key === 'ArrowLeft') CARDS.setIdx(state.cardsPractice.idx - 1); else if (e.key === 'ArrowRight') CARDS.setIdx(state.cardsPractice.idx + 1);
    }
    if (e.key === '/' && VIEW.cur === 'notes') $('#notes-q').focus();
  });
  addEventListener('storage', e => { if (e.key === STORAGE_KEY && !LAYERS.stack.length) { state = sanitizeState((() => { try { return JSON.parse(e.newValue); } catch (x) { return null; } })()); renderAll(); } });

  setViewportHeight();
  if (window.visualViewport) visualViewport.addEventListener('resize', setViewportHeight); else addEventListener('resize', setViewportHeight);
  new ResizeObserver(fitTop).observe($('#top')); fitTop();
  THEME.apply(); renderAll();
}
boot();
</script>
<script src="parental.js"></script>
</body>
</html>
