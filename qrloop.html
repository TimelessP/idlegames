<!DOCTYPE html>
<!--
================================================================================
 QR Loop  -  send any file between devices as a loop of QR codes
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (light/dark, follows html[data-theme] and the system),
                     layout (phones: Send/Receive tabs; wide: side by side)
  §2 HTML .......... top bar, Send view, Receive view, sheets, toasts
  §3 LIBRARIES ..... QRious (make codes) and jsQR (read codes), same vendor paths
  §4 UTILITIES ..... DOM builder, SVG icons, toasts, wake lock, formatting
  §5 LAYERS/INPUT .. history-backed sheets (Back closes the top one), presses
                     act on release, gamepad
  §6 SEND .......... file/text -> 256-byte chunks -> QR every 500 ms, brightness,
                     full-screen QR
  §7 RECEIVE ....... camera, jsQR scan, chunk map, missing ranges, save/copy,
                     kept on this device (localStorage, 5 MB cap)
  §8 VIEW/BOOT ..... tabs, ?receive=1 links, shortcuts
 WIRE FORMAT (unchanged, so old and new pages interoperate)
  chunk = UTF-8 JSON {uuid, filename, fileSize, chunkNumber, totalChunks} + "|" + bytes
  QR value = this page's URL + ?receive=1&data=<base64 chunk> (raw base64 if the URL > 2000 chars)
  QRious level L, cropped to the code, redrawn at 512 px with an 8% quiet zone
 STORAGE (unchanged): qrloop-received-filename, qrloop-received-data, qrloop-received-mtime
  new: qrloop-qr-brightness (percent, 100 = white #fff, 0 = #111)
================================================================================
-->
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1e40" />
  <meta name="application-name" content="IdleGames" />
  <script src="assets/js/pwa.js" defer></script>
  <title>QR Loop - File Transfer via QR Codes</title>
  <meta name="description" content="Transfer files of any size using chunked QR code transmission" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="favicon.ico" />
  <style>
/* ==========================================================================
   §1 CSS
   ========================================================================== */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #eceef2; --line: #d6dae1; --text: #14171c; --text-2: #4a5160; --text-3: #6b7383;
  --accent: #0b5cad; --accent-soft: #e2ecf8; --ok: #1d7a43; --ok-soft: #e1f3e8; --bad: #b3261e; --bad-soft: #fbe5e3; --dup: #0e7c93;
  --stage: #e6e9ee;
  --fs: 17px; --tap: 48px; --r: 8px; --app-h: 100dvh;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
    --accent: #6ea8ff; --accent-soft: #1c2a42; --ok: #5fd08c; --ok-soft: #15301f; --bad: #ff7a70; --bad-soft: #3a1b19; --dup: #4fd1e8; --stage: #0b0d10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
  --accent: #6ea8ff; --accent-soft: #1c2a42; --ok: #5fd08c; --ok-soft: #15301f; --bad: #ff7a70; --bad-soft: #3a1b19; --dup: #4fd1e8; --stage: #0b0d10; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
:focus { outline: none; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
svg.i { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); min-width: var(--tap); padding: 0 1em;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-decoration: none; }
.btn:hover { background: var(--surface-2); } .btn[disabled] { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: var(--tap); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; }
:root[data-theme="dark"] .btn.primary { color: #08121f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #08121f; } }
.btn.stop { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 650; }
.btn[aria-pressed="true"], .btn[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
.btn.danger { color: var(--bad); }

/* ---- frame ---- */
#app { position: fixed; inset: 0; height: var(--app-h); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
#top { display: flex; align-items: center; gap: 6px; padding: calc(4px + var(--safe-t)) calc(8px + var(--safe-r)) 4px calc(8px + var(--safe-l)); background: var(--surface); border-bottom: 1px solid var(--line); min-height: 58px; }
#top h1 { font-size: 1.1em; font-weight: 700; white-space: nowrap; }
#top .spacer { flex: 1; }
#top.compact h1, #top.compact #games .lbl { display: none; } #top.compact #games { width: var(--tap); padding: 0; }   /* set by fitTop() when it would not fit */
#top.tight #tabs .lbl { font-size: .92em; } #top.tight #tabs .btn { padding: 0 .7em; }
#tabs { display: flex; gap: 4px; margin-left: 4px; }
#views { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.view { min-height: 0; display: none; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; padding: 10px calc(10px + var(--safe-r)) calc(12px + var(--safe-b)) calc(10px + var(--safe-l)); gap: 10px; }
.view.on { display: flex; }
@media (min-width: 980px) and (min-aspect-ratio: 5/4) {
  #views { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .view { display: flex !important; }
  #v-send { border-right: 1px solid var(--line); }
  #tabs { display: none; }
}
/* short landscape phones: code or camera on the left at full height, controls beside it */
@media (max-height: 560px) and (orientation: landscape) and (max-width: 979px) {
  .view.on { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 42%); grid-auto-rows: min-content; align-content: start; column-gap: 10px; }
  .view.on > .stage { grid-column: 1; grid-row: 1 / span 12; height: calc(var(--app-h) - 82px - var(--safe-t) - var(--safe-b)); min-height: 0; position: sticky; top: 0; }
  .view.on > .stage.compact { height: auto; }
  .view.on > :not(.stage) { grid-column: 2; }
  .bright { flex-basis: 100%; }
}
.vtitle { display: none; font-size: 1em; color: var(--text-2); font-weight: 650; }
@media (min-width: 980px) and (min-aspect-ratio: 5/4) { .vtitle { display: flex; align-items: center; gap: .4em; } }

/* ---- stage (QR or camera): takes the room that is left ---- */
.stage { position: relative; flex: 1 1 auto; min-height: 260px; background: var(--stage); border-radius: var(--r); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.stage.compact { flex: 0 0 auto; min-height: 0; padding: 14px; }
.stage .pill { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.66); color: #fff; padding: .15em .65em; border-radius: 999px; font-variant-numeric: tabular-nums; font-size: .9em; pointer-events: none; }
.stage .pill.right { left: auto; right: 8px; }
#qr { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; cursor: zoom-in; border-radius: 4px; }
.qrwrap { position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--text-2); padding: 18px; }
.empty .big { width: 56px; height: 56px; color: var(--text-3); }
.drop { position: absolute; inset: 0; border: 3px dashed var(--accent); border-radius: var(--r); background: color-mix(in srgb, var(--accent-soft) 80%, transparent); display: none; align-items: center; justify-content: center; font-weight: 650; color: var(--accent); z-index: 5; }
.dragging .drop { display: flex; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--ok); transition: width .25s ease; }
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bar .grow { flex: 1; }
.info { color: var(--text-2); font-size: .92em; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.info b { color: var(--text); }

/* brightness control */
.bright { display: flex; align-items: center; gap: 8px; flex: 1 1 260px; min-width: 0; min-height: var(--tap); padding: 0 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.bright label { white-space: nowrap; font-size: .9em; color: var(--text-2); }
.bright .val { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; font-size: .9em; }
.bright .sw { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
input[type=range] { flex: 1; min-width: 80px; height: var(--tap); background: transparent; accent-color: var(--accent); cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #111, #fff); border: 1px solid var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #111, #fff); border: 1px solid var(--line); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); }
input[type=range] { -webkit-appearance: none; appearance: none; }

.textarea { width: 100%; min-height: 6.5em; resize: vertical; padding: .6em .75em; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; line-height: 1.45; }
.textarea:focus, .inp:focus { border-color: var(--accent); }
.inp { min-height: var(--tap); padding: 0 .75em; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; }

/* ---- receive ---- */
#video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#video.mirrored { transform: scaleX(-1); }
.guide { position: absolute; left: 50%; top: 50%; width: 58%; aspect-ratio: 1 / 1; max-height: 78%; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.75); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.18); pointer-events: none; transition: border-color .15s, box-shadow .15s; }
.guide.new { border-color: #3ddc84; box-shadow: 0 0 0 9999px rgba(0,0,0,.18), 0 0 28px rgba(61,220,132,.9); }
.guide.dup { border-color: #4fd1e8; box-shadow: 0 0 0 9999px rgba(0,0,0,.18), 0 0 28px rgba(79,209,232,.9); }
.camerr { color: var(--bad); text-align: center; }
.mapwrap { display: flex; flex-direction: column; gap: 6px; }
#map { width: 100%; display: block; border-radius: 4px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .82em; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font-size: 1.05em; display: flex; align-items: center; gap: .4em; color: var(--ok); }
.preview-img { max-width: 100%; max-height: 40vh; object-fit: contain; align-self: center; border-radius: 4px; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; } .field label { font-weight: 600; font-size: .92em; }
.help { color: var(--text-3); font-size: .85em; }

/* ---- sheets ---- */
#sheets { position: fixed; inset: 0; z-index: 1000; display: none; height: var(--app-h); }
#sheets.on { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.55); }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 16px)); max-height: calc(var(--app-h) - 16px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.35); overflow: hidden; }
@media (max-width: 760px) { .sheet { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; border-radius: 14px 14px 0 0; max-height: calc(var(--app-h) - 28px - var(--safe-t)); padding-bottom: var(--safe-b); } }
.s-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.s-head h2 { flex: 1; font-size: 1.1em; }
.s-body { overflow-y: auto; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.s-body ol { padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
/* full-screen QR */
.sheet.fs { inset: 0; left: 0; top: 0; right: 0; bottom: 0; transform: none; width: 100%; height: var(--app-h); max-height: none; border-radius: 0; background: #000; color: #fff; box-shadow: none; padding: 0;
  display: flex; flex-direction: column; }
.sheet.fs.side { flex-direction: row; }
.fs-stage { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; cursor: zoom-out; overflow: hidden; }
.fs-stage canvas { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.fs-stage canvas:focus, .fs-stage canvas:focus-visible { outline: none; }   /* nothing may touch the quiet zone */
.fs-bar { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px calc(10px + var(--safe-r)) calc(8px + var(--safe-b)) calc(10px + var(--safe-l)); background: #111; transition: opacity .25s; }
.sheet.fs.side .fs-bar { flex-direction: column; align-items: stretch; justify-content: center; width: var(--fs-panel, 270px); padding: calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) 10px; flex-wrap: nowrap; }
.sheet.fs.side .fs-bar .bright { flex: none; flex-wrap: wrap; padding: 6px 10px; } .sheet.fs.side .fs-bar .bright input { flex-basis: 100%; order: 5; }
.sheet.fs.overlay .fs-bar { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(17,17,17,.92); }
.sheet.fs.overlay.idle .fs-bar { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.fs-bar .btn { background: #1d1d1d; border-color: #3a3a3a; color: #fff; }
.fs-bar .btn:hover { background: #2a2a2a; }
.fs-bar .btn.stop { background: #3a1b19; border-color: #ff7a70; color: #ff9a92; }
.fs-bar .bright { background: #1d1d1d; border-color: #3a3a3a; color: #fff; max-width: 520px; } .fs-bar .bright label { color: #ccc; }
.fs-bar .count { font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: center; color: #ddd; }
.fs-bar .hint { color: #9aa; font-size: .8em; text-align: center; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(5px + var(--safe-t));   /* over the header: never covers the code, camera or controls */ z-index: 1100; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, 94vw); }
.toast { background: var(--text); color: var(--bg); padding: .55em 1em; border-radius: var(--r); box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; gap: .6em; align-items: center; }
.toast.error { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>

  <!-- ======================================================================
       §3 LIBRARIES  (same vendor paths and fallback as before)
       =================================================================== -->
  <script>
    const loadScript = (src) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src; script.onload = resolve; script.onerror = reject;
      document.head.appendChild(script);
    });
    // QRious makes the codes
    Promise.resolve().then(() => loadScript('./assets/vendor/qrious/qrious.min.js')).catch(() => {
      console.warn('QRious vendor bundle failed - using fallback rendering.');
      window.QRious = class {
        constructor(options = {}) { this.element = options.element; this.value = options.value || ''; this.size = options.size || 100; this._generateStub(); }
        set(options) { Object.assign(this, options); this._generateStub(); }
        _generateStub() {
          if (!this.element) return;
          this.element.width = this.size; this.element.height = this.size;
          const ctx = this.element.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, this.size, this.size);
          ctx.fillStyle = '#000'; ctx.font = '14px monospace'; ctx.textAlign = 'center';
          ctx.fillText('QR Generation', this.size / 2, this.size / 2 - 10); ctx.fillText('Not Available', this.size / 2, this.size / 2 + 10);
        }
      };
    });
    // jsQR reads them
    Promise.resolve().then(() => loadScript('./assets/vendor/jsqr/jsQR.js')).catch(() => { console.warn('jsQR vendor bundle failed to load. QR scanning unavailable.'); });
  </script>
</head>
<body>
<!-- ==========================================================================
     §2 HTML
     ======================================================================= -->
<div id="app">
  <header id="top">
    <a class="btn ghost" id="games" href="index.html" aria-label="Back to Games"></a>
    <h1>QR Loop</h1>
    <div id="tabs" role="tablist" aria-label="Mode">
      <button class="btn" type="button" role="tab" id="tab-send" data-view="send" aria-controls="v-send"></button>
      <button class="btn" type="button" role="tab" id="tab-receive" data-view="receive" aria-controls="v-receive"></button>
    </div>
    <span class="spacer"></span>
    <button class="btn icon ghost" type="button" id="help-btn" aria-label="How it works"></button>
  </header>

  <main id="views">
    <!-- SEND -->
    <section class="view" id="v-send" aria-label="Send">
      <h2 class="vtitle" id="send-title"></h2>
      <div class="stage" id="send-stage">
        <div class="empty" id="send-empty">
          <span id="send-empty-icon"></span>
          <div><b>Choose a file to send</b><br><span class="help">Any type, any size. Or drop it here.</span></div>
          <div class="bar" style="justify-content:center">
            <button class="btn primary" type="button" id="pick"></button>
            <button class="btn" type="button" id="type-text"></button>
          </div>
        </div>
        <div class="qrwrap" id="qrwrap" hidden>
          <canvas id="qr" width="512" height="512" role="button" tabindex="0" aria-label="QR code. Open full screen"></canvas>
        </div>
        <span class="pill" id="chunk-pill" hidden></span>
        <span class="pill right" id="pass-pill" hidden></span>
        <div class="drop" aria-hidden="true">Drop the file to send it</div>
        <input type="file" id="fileInput" hidden />
      </div>
      <div class="progress" id="send-progress" hidden><div></div></div>
      <div class="bar" id="send-bar">
        <button class="btn primary" type="button" id="loop-btn" disabled></button>
        <button class="btn" type="button" id="fs-btn" disabled></button>
        <div class="bright" id="bright-main"></div>
      </div>
      <div class="info" id="send-info" aria-live="polite"></div>
      <div id="text-area" hidden>
        <label class="sr" for="textInput">Text to send</label>
        <textarea id="textInput" class="textarea" placeholder="Type or paste text to send..." spellcheck="false"></textarea>
      </div>
      <div class="bar" id="send-src" hidden>
        <button class="btn" type="button" id="pick2"></button>
        <button class="btn" type="button" id="type-text2"></button>
        <span class="grow"></span>
        <button class="btn danger" type="button" id="clear-send"></button>
      </div>
    </section>

    <!-- RECEIVE -->
    <section class="view" id="v-receive" aria-label="Receive">
      <h2 class="vtitle" id="recv-title"></h2>
      <div class="stage" id="cam-stage">
        <video id="video" autoplay muted playsinline hidden></video>
        <div class="guide" id="guide" hidden></div>
        <div class="empty" id="cam-empty">
          <span id="cam-empty-icon"></span>
          <div><b>Point this camera at the looping QR code</b><br><span class="help">Chunks can arrive in any order. Missed ones are picked up on the next loop.</span></div>
          <button class="btn primary" type="button" id="cam-start"></button>
          <div class="camerr" id="cam-err" hidden></div>
        </div>
        <span class="pill" id="recv-pill" hidden></span>
        <span class="pill right" id="event-pill" hidden></span>
      </div>
      <div class="bar" id="cam-bar" hidden>
        <button class="btn stop" type="button" id="cam-stop"></button>
        <button class="btn" type="button" id="cam-switch"></button>
        <button class="btn" type="button" id="cam-mirror" aria-pressed="false"></button>
      </div>
      <div class="mapwrap" id="mapwrap" hidden>
        <canvas id="map" height="12" role="img" aria-label="Chunk map"></canvas>

  const vv = () => document.documentElement.style.setProperty('--app-h', (window.visualViewport ? visualViewport.height : innerHeight) + 'px');
  vv(); addEventListener('resize', vv); if (window.visualViewport) visualViewport.addEventListener('resize', vv);
  LAYERS.init(); GAMEPAD.init();
  new ResizeObserver(() => fitTop()).observe($('#top'));
  // labels and icons
  $('#games').innerHTML = btnHTML(ICON.back, 'Games');
  $('#tab-send').innerHTML = btnHTML(ICON.send, 'Send'); $('#tab-receive').innerHTML = btnHTML(ICON.receive, 'Receive');
  $('#send-title').innerHTML = ICON.send + 'Send'; $('#recv-title').innerHTML = ICON.receive + 'Receive';
  $('#help-btn').innerHTML = ICON.help;
  $('#send-empty-icon').innerHTML = S(p('M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z') + p('M14 3v5h5M12 11v6M9 14l3-3 3 3'), 'i big');
  $('#cam-empty-icon').innerHTML = S('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>' + p('M14 14h3v3M21 14v7h-4M14 21v-3'), 'i big');
  $('#pick').innerHTML = btnHTML(ICON.file, 'Choose file'); $('#type-text').innerHTML = btnHTML(ICON.text, 'Type text instead');
  $('#pick2').innerHTML = btnHTML(ICON.file, 'Other file'); $('#type-text2').innerHTML = btnHTML(ICON.text, 'Text');
  $('#fs-btn').innerHTML = btnHTML(ICON.full, 'Full screen'); $('#clear-send').innerHTML = btnHTML(ICON.trash, 'Clear');
  $('#cam-stop').innerHTML = btnHTML(ICON.stop, 'Stop camera'); $('#cam-mirror').innerHTML = btnHTML(ICON.mirror, 'Mirror');
  $('#saveFile').innerHTML = btnHTML(ICON.save, 'Save file'); $('#copyText').innerHTML = btnHTML(ICON.copy, 'Copy'); $('#clear-recv').innerHTML = btnHTML(ICON.trash, 'Clear');
  BRIGHT.build($('#bright-main'), 'bright-main-r');

  // send wiring
  const pick = () => $('#fileInput').click();
  $('#pick').addEventListener('click', pick); $('#pick2').addEventListener('click', pick);
  $('#fileInput').addEventListener('change', e => SEND.loadFile(e.target.files[0]));
  $('#type-text').addEventListener('click', () => SEND.openText()); $('#type-text2').addEventListener('click', () => SEND.openText());
  let tt = 0; $('#textInput').addEventListener('input', () => { clearTimeout(tt); tt = setTimeout(() => SEND.loadText(), 300); });
  $('#loop-btn').addEventListener('click', () => SEND.toggleLoop());
  $('#fs-btn').addEventListener('click', () => SEND.fullscreen());
  $('#qr').addEventListener('click', () => SEND.fullscreen());
  $('#qr').addEventListener('keydown', e => { if (e.key === ' ') e.preventDefault(); });
  $('#qr').addEventListener('keyup', e => { if (e.key === ' ') SEND.fullscreen(); });
  $('#clear-send').addEventListener('click', () => SEND.clear());
  // drag and drop anywhere on the Send side
  const sendView = $('#v-send'); let dragDepth = 0;
  sendView.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#send-stage').classList.add('dragging'); });
  sendView.addEventListener('dragover', e => e.preventDefault());
  sendView.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#send-stage').classList.remove('dragging'); } });
  sendView.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#send-stage').classList.remove('dragging'); if (e.dataTransfer.files.length) SEND.loadFile(e.dataTransfer.files[0]); });

  // receive wiring
  $('#cam-start').addEventListener('click', () => RECV.startCamera());
  $('#cam-stop').addEventListener('click', () => RECV.stopCamera());
  $('#cam-switch').addEventListener('click', () => RECV.switchCamera());
  $('#cam-mirror').addEventListener('click', () => RECV.toggleMirror());
  $('#saveFile').addEventListener('click', () => RECV.saveReceivedFile());
  $('#copyText').addEventListener('click', () => RECV.copy());
  $('#saveFilename').addEventListener('input', () => RECV.render());
  $('#clear-recv').addEventListener('click', () => {
    LAYERS.open('Clear the received file?', b => b.append(h('p', { text: 'The received file will be removed from this device. Save it first if you need it.' }),
      h('div', { class: 'bar' }, h('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => LAYERS.back() }), h('span', { class: 'grow' }),
        h('button', { class: 'btn primary', type: 'button', text: 'Clear', onclick: () => { LAYERS.back(); setTimeout(() => RECV.clearReceive(), 60); } }))));
  });
  new ResizeObserver(() => RECV.drawMap()).observe($('#v-receive'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => RECV.drawMap());
  new MutationObserver(() => RECV.drawMap()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  $('#tab-send').addEventListener('click', () => VIEW.show('send')); $('#tab-receive').addEventListener('click', () => VIEW.show('receive'));
  $('#help-btn').addEventListener('click', helpSheet);
  addEventListener('pagehide', () => { if (RECV.scanning) RECV.stopCamera(true); });

  SEND.render(); RECV.render(); fitTop();
  try { RECV.restoreReceivedFromStorage(); } catch (e) { console.warn('Restore on init failed', e); }

  // a ?receive=1 link (scanned with a phone camera): receive mode, tidy the address bar, start the camera, use the chunk in the link
  const params = new URLSearchParams(location.search);
  if (params.get('receive') === '1') {
    VIEW.show('receive');
    const clean = new URL(location.href); clean.search = ''; history.replaceState({}, document.title, clean.toString());
    toast('Opened from a QR code: starting the camera for the rest.', 'success');
    setTimeout(() => RECV.startCamera(), 1000);
    const data = params.get('data'); if (data) setTimeout(() => RECV.handleQRDetection(data), 2000);
  } else VIEW.show(RECV.receivedFileData ? 'receive' : 'send');
})();
</script>
</body>
<script src="parental.js"></script>
</html>
