<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="IdleGames">
  <script src="assets/js/pwa.js" defer></script>
  <meta name="theme-color" content="#667eea">
  <title>Kalimba Simulator</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    :root {
      --bg-color: #12100e;
      --wood-base: #2a1810;
      --wood-grain-1: #3d2318;
      --wood-grain-2: #1e100a;
      --wood-highlight: #543223;
      --wood-shadow: rgba(0, 0, 0, 0.7);
      --soundhole-inner: #0a0503;
      --metal-base: linear-gradient(180deg, #e8ecf1 0%, #a6b1bc 35%, #6a7582 70%, #d8e0e8 100%);
      --metal-highlight: rgba(255, 255, 255, 0.8);
      --metal-shadow: rgba(0, 0, 0, 0.55);
      --bridge-wood: #180d07;
      --bridge-metal: #7a848f;
      --theme-btn-bg: rgba(255, 255, 255, 0.1);
      --theme-btn-stroke: #e2e8f0;
    }

    [data-theme="light"] {
      --bg-color: #e5dfd5;
      --wood-base: #a05a2c;
      --wood-grain-1: #b86b36;
      --wood-grain-2: #84471f;
      --wood-highlight: #c97c44;
      --wood-shadow: rgba(60, 30, 10, 0.4);
      --soundhole-inner: #291205;
      --metal-base: linear-gradient(180deg, #ffffff 0%, #cbd5e1 35%, #94a3b8 70%, #f1f5f9 100%);
      --metal-shadow: rgba(0, 0, 0, 0.35);
      --bridge-wood: #4a240d;
      --theme-btn-bg: rgba(0, 0, 0, 0.08);
      --theme-btn-stroke: #1e293b;
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg-color: #e5dfd5;
        --wood-base: #a05a2c;
        --wood-grain-1: #b86b36;
        --wood-grain-2: #84471f;
        --wood-highlight: #c97c44;
        --wood-shadow: rgba(60, 30, 10, 0.4);
        --soundhole-inner: #291205;
        --metal-base: linear-gradient(180deg, #ffffff 0%, #cbd5e1 35%, #94a3b8 70%, #f1f5f9 100%);
        --metal-shadow: rgba(0, 0, 0, 0.35);
        --bridge-wood: #4a240d;
        --theme-btn-bg: rgba(0, 0, 0, 0.08);
        --theme-btn-stroke: #1e293b;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.3s ease;
    }

    #theme-toggle, #tune-toggle {
      position: absolute;
      top: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--theme-btn-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.1s ease, background 0.2s ease;
    }

    #theme-toggle { right: 12px; }
    #tune-toggle { left: 12px; }

    #theme-toggle svg, #tune-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--theme-btn-stroke);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Sheet Music Banner */
    .sheet-music-banner {
      position: absolute;
      top: 60px;
      left: 12px;
      right: 12px;
      height: 80px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      z-index: 50;
      overflow: hidden;
    }

    [data-theme="dark"] .sheet-music-banner {
      background: rgba(30, 30, 40, 0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .sheet-music-banner.visible { display: flex; }

    .staff-line {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 12px;
      position: relative;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .staff-line:last-child { border-bottom: none; }

    [data-theme="dark"] .staff-line { border-bottom: 1px solid rgba(255,255,255,0.1); }

    .staff-line::before {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: rgba(0,0,0,0.3);
      transform: translateY(-50%);
    }

    [data-theme="dark"] .staff-line::before { background: rgba(255,255,255,0.3); }

    .note-token {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 2px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #1a1a2e;
      background: transparent;
      transition: all 0.15s ease;
    }

    [data-theme="dark"] .note-token { color: #eee; }

    .note-token.current {
      background: #667eea;
      color: white;
      box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
      transform: scale(1.15);
    }

    .note-token.upcoming { opacity: 0.5; }

    .note-token.rest { visibility: hidden; }

    /* Tune Selector Modal */
    .tune-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }

    .tune-modal.visible { display: flex; }

    .tune-modal-content {
      background: var(--bg-color);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      max-width: 320px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    [data-theme="light"] .tune-modal-content {
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
    }

    .tune-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    [data-theme="light"] .tune-modal-header { border-bottom: 1px solid #e2e8f0; }

    .tune-modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); }

    .tune-modal-close {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }

    .tune-modal-close:hover { background: rgba(255,255,255,0.1); }

    .tune-list { padding: 8px; }

    .tune-item {
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .tune-item:hover { background: rgba(255,255,255,0.08); }

    [data-theme="light"] .tune-item:hover { background: #e2e8f0; }

    .tune-item.selected { background: rgba(102, 126, 234, 0.2); }

    .tune-item-name { font-size: 15px; font-weight: 600; color: var(--text-main); }

    .tune-item-check {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      color: transparent;
      transition: all 0.2s;
    }

    .tune-item.selected .tune-item-check {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    /* Tine guide dot */
    .tine-guide-dot {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #1a1a2e;
      box-shadow: 0 0 6px rgba(26, 26, 46, 0.8), 0 0 0 2px rgba(255,255,255,0.3);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }

    .tine-guide-dot.visible { opacity: 1; }

    [data-theme="light"] .tine-guide-dot {
      background: #1a1a2e;
      box-shadow: 0 0 6px rgba(26, 26, 46, 0.8), 0 0 0 2px rgba(0,0,0,0.2);
    }

    #theme-toggle:active {
      transform: scale(0.92);
    }

    #theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--theme-btn-stroke);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kalimba-stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .kalimba-body {
      position: relative;
      width: min(94vw, 440px);
      height: min(94vh, 720px);
      background: 
        radial-gradient(ellipse at 50% 40%, var(--wood-highlight) 0%, transparent 75%),
        repeating-linear-gradient(90deg, var(--wood-base) 0px, var(--wood-grain-1) 3px, var(--wood-base) 6px, var(--wood-grain-2) 11px);
      border-radius: 28px 28px 40px 40px;
      box-shadow: 
        inset 0 2px 6px rgba(255, 255, 255, 0.2),
        inset 0 -10px 20px var(--wood-shadow),
        0 20px 40px var(--wood-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      clip-path: polygon(4% 0%, 96% 0%, 100% 100%, 0% 100%);
    }

    .soundhole {
      position: absolute;
      bottom: 12%;
      width: min(32vw, 130px);
      height: min(32vw, 130px);
      border-radius: 50%;
      background: radial-gradient(circle, var(--soundhole-inner) 60%, #000 100%);
      box-shadow: 
        0 0 0 4px var(--wood-base),
        0 0 0 6px var(--wood-highlight),
        inset 0 6px 12px #000;
    }

    .bridge-assembly {
      position: absolute;
      top: 4%;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .zither-bar {
      width: 96%;
      height: 14px;
      background: linear-gradient(180deg, #2a2a2a, #666, #111);
      border-radius: 7px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }

    .pressure-bar {
      width: 92%;
      height: 10px;
      margin-top: 24px;
      background: linear-gradient(180deg, #e2e8f0, #64748b, #334155);
      border-radius: 4px;
      box-shadow: 0 6px 10px rgba(0,0,0,0.7);
      z-index: 10;
    }

    .wooden-bridge {
      width: 94%;
      height: 18px;
      margin-top: 18px;
      background: var(--bridge-wood);
      border-radius: 3px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
      position: relative;
    }

    .bridge-wire {
      position: absolute;
      top: 2px;
      left: 2%;
      width: 96%;
      height: 4px;
      background: linear-gradient(180deg, #fff, #94a3b8, #475569);
      border-radius: 2px;
    }

    .tines-container {
      position: absolute;
      top: 3%;
      width: 88%;
      height: 88%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 5;
    }

    .tine-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .tine {
      width: 82%;
      background: var(--metal-base);
      border-radius: 0 0 6px 6px;
      position: relative;
      cursor: pointer;
      transform-origin: top center;
      transition: transform 0.05s ease-out;
      box-shadow: 
        8px 16px 12px var(--metal-shadow),
        inset -1px 0 2px rgba(255,255,255,0.6),
        inset 1px 0 2px rgba(0,0,0,0.4);
    }

    .tine::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.8), rgba(0,0,0,0.2));
      border-radius: 0 0 6px 6px;
    }

    .tine-label {
      position: absolute;
      bottom: 18px;
      left: 5%;
      right: 5%;
      transform: none;
      font-size: 14px;
      font-weight: 800;
      color: rgba(0, 0, 0, 0.7);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      user-select: none;
      line-height: 1.1;
      text-align: center;
    }

    .tine-label .note-letter {
      display: block;
      font-size: 1.4em;
      font-weight: 900;
      line-height: 1;
    }

    .tine-label .note-octave {
      display: block;
      font-size: 1.4em;
      font-weight: 900;
      line-height: 1;
      margin-top: -2px;
    }

    [data-theme="light"] .tine-label {
      color: rgba(0, 0, 0, 0.55);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    @media (orientation: landscape) {
      .tine-label {
        font-size: 12px;
        bottom: 14px;
      }
    }

    @media (orientation: landscape) and (max-height: 400px) {
      .tine-label {
        font-size: 10px;
        bottom: 10px;
      }
    }

    .tine.active {
      transform: scaleY(0.992) translateY(2px);
      box-shadow: 
        3px 6px 6px var(--metal-shadow),
        inset -1px 0 2px rgba(255,255,255,0.6);
    }

    @keyframes tine-vibrate {
      0% { transform: translateY(0px) rotate(0deg); }
      20% { transform: translateY(3px) rotate(0.4deg); }
      40% { transform: translateY(-2px) rotate(-0.3deg); }
      60% { transform: translateY(1.5px) rotate(0.2deg); }
      80% { transform: translateY(-0.5px) rotate(-0.1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .tine.vibrating {
      animation: tine-vibrate 0.18s ease-in-out;
    }

    @media (orientation: landscape) {
      .kalimba-stage {
        padding: 0;
        align-items: center;
        overflow: hidden;
      }
      .kalimba-body {
        width: 100vw;
        height: auto;
        aspect-ratio: 440 / 720;
        max-height: 100vh;
        border-radius: 16px 16px 24px 24px;
      }
      .soundhole {
        display: none;
      }
      .bridge-assembly {
        top: 3%;
      }
      .pressure-bar {
        margin-top: 16px;
        height: 8px;
      }
      .wooden-bridge {
        margin-top: 12px;
        height: 14px;
      }
      .tines-container {
        top: 4%;
        height: 85%;
      }
    }

    @media (orientation: landscape) and (max-height: 400px) {
      .kalimba-body {
        border-radius: 12px 12px 18px 18px;
      }
      .bridge-assembly {
        top: 2%;
      }
      .tines-container {
        top: 5%;
        height: 82%;
      }
    }
  </style>
</head>
<body>

  <button id="tune-toggle" aria-label="Select Tune" title="Select Tune">
    <svg viewBox="0 0 24 24">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <button id="theme-toggle" aria-label="Toggle Theme">
    <svg id="theme-icon" viewBox="0 0 24 24">
      <!-- Icon populated via JS -->
    </svg>
  </button>

  <!-- Sheet Music Banner -->
  <div class="sheet-music-banner" id="sheetMusicBanner" role="region" aria-label="Sheet music">
    <div class="staff-line" id="staffLine1"></div>
    <div class="staff-line" id="staffLine2"></div>
  </div>

  <div class="kalimba-stage">
    <div class="kalimba-body">
      <div class="bridge-assembly">
        <div class="zither-bar"></div>
        <div class="pressure-bar"></div>
        <div class="wooden-bridge">
          <div class="bridge-wire"></div>
        </div>
      </div>
      <div class="soundhole"></div>
      <div class="tines-container" id="tines-container"></div>
    </div>
  </div>

  <script>
    // 17-Key Kalimba Standard C Major Tuning Layout
    // Staggered arrangement: Center is longest/lowest, alternating left and right going up
    const TINE_DATA = [
      { note: "D6", freq: 1174.66, key: 17 },
      { note: "B5", freq: 987.77,  key: 15 },
      { note: "G5", freq: 783.99,  key: 13 },
      { note: "E5", freq: 659.25,  key: 11 },
      { note: "C5", freq: 523.25,  key: 9  },
      { note: "A4", freq: 440.00,  key: 7  },
      { note: "F4", freq: 349.23,  key: 5  },
      { note: "D4", freq: 293.66,  key: 3  },
      { note: "C4", freq: 261.63,  key: 1  }, // Center lowest
      { note: "E4", freq: 329.63,  key: 2  },
      { note: "G4", freq: 392.00,  key: 4  },
      { note: "B4", freq: 493.88,  key: 6  },
      { note: "D5", freq: 587.33,  key: 8  },
      { note: "F5", freq: 698.46,  key: 10 },
      { note: "A5", freq: 880.00,  key: 12 },
      { note: "C6", freq: 1046.50, key: 14 },
      { note: "E6", freq: 1318.51, key: 16 }
    ];

    // --- Audio Synthesis Engine ---
    let audioCtx = null;
    let saturationCurve = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        saturationCurve = createDistortionCurve(2.5);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Soft saturation curve for non-linear power & physical resonance feel
    function createDistortionCurve(amount) {
      const samples = 44100;
      const curve = new Float32Array(samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < samples; ++i) {
        let x = (i * 2) / samples - 1;
        curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
      }
      return curve;
    }

    function playKalimbaSound(freq) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      // Master note gain container
      const noteGain = ctx.createGain();
      
      // Decay time scaled with pitch (lower frequencies resonate longer)
      const duration = Math.max(0.7, 3.2 - (freq / 600));

      // 1. Primary Fundamental Tine Oscillator
      const fundOsc = ctx.createOscillator();
      fundOsc.type = 'sine';
      fundOsc.frequency.setValueAtTime(freq, now);

      // Waveshaper for physical power under curve (biased extremes/warm saturation)
      const shaper = ctx.createWaveShaper();
      shaper.curve = saturationCurve;

      // 2. High Inharmonic Metallic Partials (Inherent to clamped steel prongs)
      const mode1Osc = ctx.createOscillator();
      mode1Osc.type = 'sine';
      mode1Osc.frequency.setValueAtTime(freq * 2.756, now); // First overtone mode

      const mode1Gain = ctx.createGain();
      mode1Gain.gain.setValueAtTime(0.4, now);
      mode1Gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.12);

      const mode2Osc = ctx.createOscillator();
      mode2Osc.type = 'triangle';
      mode2Osc.frequency.setValueAtTime(freq * 5.404, now); // Second overtone mode

      const mode2Gain = ctx.createGain();
      mode2Gain.gain.setValueAtTime(0.25, now);
      mode2Gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.05);

      // 3. Physical Thumb Attack Transient Noise (Thump/Pluck strike)
      const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.012, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseBuffer.length; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(2800, now);
      noiseFilter.Q.setValueAtTime(1.5, now);

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.3, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.00001, now + 0.012);

      // Envelope configuration for fundamental
      noteGain.gain.setValueAtTime(0.0, now);
      noteGain.gain.linearRampToValueAtTime(0.85, now + 0.003); // Instant, sharp strike attack
      noteGain.gain.exponentialRampToValueAtTime(0.35, now + 0.08); // Initial body drop
      noteGain.gain.exponentialRampToValueAtTime(0.00001, now + duration); // Natural decay

      // Connect nodes
      fundOsc.connect(shaper);
      shaper.connect(noteGain);

      mode1Osc.connect(mode1Gain);
      mode1Gain.connect(noteGain);

      mode2Osc.connect(mode2Gain);
      mode2Gain.connect(noteGain);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(noteGain);

      noteGain.connect(ctx.destination);

      // Start sound sources
      fundOsc.start(now);
      mode1Osc.start(now);
      mode2Osc.start(now);
      noise.start(now);

      // Stop sources
      fundOsc.stop(now + duration + 0.1);
      mode1Osc.stop(now + 0.15);
      mode2Osc.stop(now + 0.08);
    }

    // --- UI & Tine Layout Generation ---
    const tinesContainer = document.getElementById('tines-container');

    TINE_DATA.forEach((data, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'tine-wrapper';

      const tine = document.createElement('div');
      tine.className = 'tine';
      tine.dataset.index = index;
      tine.dataset.freq = data.freq;

      // Calculate length based on distance from center (C4 = longest)
      const distFromCenter = Math.abs(index - 8);
      const heightPercent = 78 - (distFromCenter * 2.75);
      tine.style.height = `${heightPercent}%`;

      // Add note label
      const label = document.createElement('span');
      label.className = 'tine-label';
      const note = data.note;
      const letter = note.slice(0, -1); // e.g., "C", "D", "F"
      const octave = note.slice(-1);    // e.g., "4", "5", "6"
      label.innerHTML = `<span class="note-letter">${letter}</span><span class="note-octave">${octave}</span>`;
      tine.appendChild(label);

      wrapper.appendChild(tine);
      tinesContainer.appendChild(wrapper);
    });

    // --- Direct Touch & Drag-Plucking Interaction ---
    let activeTineIndex = null;
    let isInteracting = false;

    function triggerPluck(tineEl) {
      if (!tineEl) return;
      const index = tineEl.dataset.index;
      const freq = parseFloat(tineEl.dataset.freq);

      playKalimbaSound(freq);

      tineEl.classList.remove('vibrating', 'active');
      void tineEl.offsetWidth; // Force reflow
      tineEl.classList.add('active');

      setTimeout(() => {
        tineEl.classList.remove('active');
        tineEl.classList.add('vibrating');
      }, 50);
    }

    function getTineFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest('.tine') : null;
    }

    function getNearestTine(x, y) {
      // First try direct hit
      const direct = getTineFromPoint(x, y);
      if (direct) return direct;

      // If in a gap, find nearest tine by horizontal distance to center
      const tines = document.querySelectorAll('.tine');
      let nearest = null;
      let minDist = Infinity;

      tines.forEach(tine => {
        const rect = tine.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const dist = Math.abs(x - centerX);
        if (dist < minDist) {
          minDist = dist;
          nearest = tine;
        }
      });

      return nearest;
    }

    function handlePointerStart(e) {
      isInteracting = true;
      const tine = getNearestTine(e.clientX, e.clientY);
      if (tine) {
        activeTineIndex = tine.dataset.index;
        triggerPluck(tine);
      }
    }

    function handlePointerMove(e) {
      if (!isInteracting) return;
      const tine = getNearestTine(e.clientX, e.clientY);
      if (tine && tine.dataset.index !== activeTineIndex) {
        activeTineIndex = tine.dataset.index;
        triggerPluck(tine);
      }
    }

    function handlePointerEnd() {
      isInteracting = false;
      activeTineIndex = null;
    }

    window.addEventListener('pointerdown', handlePointerStart);
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerEnd);
    window.addEventListener('pointercancel', handlePointerEnd);

    // --- Tri-State Theme Switcher (System / Light / Dark) ---
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themes = ['system', 'light', 'dark'];
    
    // Theme SVG Icons
    const icons = {
      system: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor"/>',
      light: '<circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>',
      dark: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    };

    let currentTheme = localStorage.getItem('kalimba-theme') || 'system';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeIcon.innerHTML = icons[theme];
      localStorage.setItem('kalimba-theme', theme);
    }

    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // Avoid triggering plucks behind button
      const nextIdx = (themes.indexOf(currentTheme) + 1) % themes.length;
      currentTheme = themes[nextIdx];
      applyTheme(currentTheme);
    });

    // Initialize Theme
    applyTheme(currentTheme);
  </script>

  <!-- Tune Selector Modal -->
  <div class="tune-modal" id="tuneModal" role="dialog" aria-modal="true" aria-label="Select Tune">
    <div class="tune-modal-content">
      <div class="tune-modal-header">
        <span class="tune-modal-title">Select Tune</span>
        <button class="tune-modal-close" id="tuneModalClose" aria-label="Close">×</button>
      </div>
      <div class="tune-list" id="tuneList"></div>
    </div>
  </div>

  <script>
    // ========================================
    // TUNES DATA
    // ========================================
    const TUNES = [
      { id: 'none', name: 'None (Free Play)', notes: [] },
      { id: 'twinkle', name: 'Twinkle Twinkle Little Star', notes: [
        'C4', 'C4', 'G4', 'G4', 'A4', 'A4', 'G4',
        'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4',
        'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4',
        'G4', 'G4', 'F4', 'F4', 'E4', 'E4', 'D4',
        'C4', 'C4', 'G4', 'G4', 'A4', 'A4', 'G4',
        'F4', 'F4', 'E4', 'E4', 'D4', 'D4', 'C4'
      ]},
      { id: 'mary', name: 'Mary Had a Little Lamb', notes: [
        'E4', 'D4', 'C4', 'D4', 'E4', 'E4', 'E4',
        'D4', 'D4', 'D4', 'E4', 'G4', 'G4',
        'E4', 'D4', 'C4', 'D4', 'E4', 'E4', 'E4',
        'E4', 'D4', 'D4', 'E4', 'D4', 'C4'
      ]},
      { id: 'ode', name: 'Ode to Joy', notes: [
        'E4', 'E4', 'F4', 'G4', 'G4', 'F4', 'E4', 'D4',
        'C4', 'C4', 'D4', 'E4', 'E4', 'D4', 'D4',
        'E4', 'E4', 'F4', 'G4', 'G4', 'F4', 'E4', 'D4',
        'C4', 'C4', 'D4', 'E4', 'D4', 'C4', 'C4'
      ]},
      { id: 'happy', name: 'Happy Birthday', notes: [
        'G4', 'G4', 'A4', 'G4', 'C5', 'B4',
        'G4', 'G4', 'A4', 'G4', 'D5', 'C5',
        'G4', 'G4', 'G5', 'E5', 'C5', 'B4', 'A4',
        'F5', 'F5', 'E5', 'C5', 'D5', 'C5'
      ]},
      { id: 'jingle', name: 'Jingle Bells', notes: [
        'E4', 'E4', 'E4', 'E4', 'E4', 'E4',
        'E4', 'G4', 'C4', 'D4', 'E4',
        'F4', 'F4', 'F4', 'F4', 'F4', 'E4', 'E4',
        'E4', 'E4', 'D4', 'D4', 'E4', 'D4', 'G4'
      ]},
      { id: 'amazing', name: 'Amazing Grace', notes: [
        'G4', 'E4', 'E4', 'F4', 'D4', 'D4', 'C4', 'D4', 'E4', 'F4',
        'G4', 'G4', 'G4', 'G4', 'E4', 'E4', 'F4', 'D4', 'D4',
        'C4', 'G4', 'E4', 'F4', 'D4', 'C4', 'C4'
      ]}
    ];

    // ========================================
    // TUNE STATE
    // ========================================
    let currentTuneId = 'none';
    let currentNoteIndex = 0;

    // ========================================
    // DOM ELEMENTS
    // ========================================
    const tuneToggle = document.getElementById('tune-toggle');
    const tuneModal = document.getElementById('tuneModal');
    const tuneModalClose = document.getElementById('tuneModalClose');
    const tuneList = document.getElementById('tuneList');
    const sheetMusicBanner = document.getElementById('sheetMusicBanner');
    const staffLine1 = document.getElementById('staffLine1');
    const staffLine2 = document.getElementById('staffLine2');

    // ========================================
    // NOTE TO TINE INDEX MAPPING
    // ========================================
    const NOTE_TO_INDEX = {};
    TINE_DATA.forEach((data, index) => {
      NOTE_TO_INDEX[data.note] = index;
    });

    // ========================================
    // TUNE MODAL
    // ========================================
    function openTuneModal() {
      renderTuneList();
      tuneModal.classList.add('visible');
    }

    function closeTuneModal() {
      tuneModal.classList.remove('visible');
    }

    function renderTuneList() {
      tuneList.innerHTML = '';
      TUNES.forEach(tune => {
        const item = document.createElement('div');
        item.className = 'tune-item' + (tune.id === currentTuneId ? ' selected' : '');
        item.innerHTML = `
          <span class="tune-item-name">${tune.name}</span>
          <span class="tune-item-check">✓</span>
        `;
        item.addEventListener('click', () => selectTune(tune.id));
        tuneList.appendChild(item);
      });
    }

    function selectTune(tuneId) {
      currentTuneId = tuneId;
      currentNoteIndex = 0;
      closeTuneModal();
      renderTuneList();
      updateSheetMusic();
      updateGuideDot();
    }

    tuneToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      openTuneModal();
    });

    tuneModalClose.addEventListener('click', closeTuneModal);
    tuneModal.addEventListener('click', (e) => {
      if (e.target === tuneModal) closeTuneModal();
    });

    // ========================================
    // SHEET MUSIC
    // ========================================
    function updateSheetMusic() {
      if (currentTuneId === 'none' || TUNES.find(t => t.id === currentTuneId)?.notes.length === 0) {
        sheetMusicBanner.classList.remove('visible');
        staffLine1.innerHTML = '';
        staffLine2.innerHTML = '';
        return;
      }

      const tune = TUNES.find(t => t.id === currentTuneId);
      const notes = tune.notes;

      // Show banner
      sheetMusicBanner.classList.add('visible');

      // Calculate visible range - show current line (8 notes) and next line (8 notes)
      const notesPerLine = 8;
      const currentLineStart = Math.floor(currentNoteIndex / notesPerLine) * notesPerLine;
      const line1Notes = notes.slice(currentLineStart, currentLineStart + notesPerLine);
      const line2Notes = notes.slice(currentLineStart + notesPerLine, currentLineStart + notesPerLine * 2);

      renderStaffLine(staffLine1, line1Notes, currentLineStart);
      renderStaffLine(staffLine2, line2Notes, currentLineStart + notesPerLine);
    }

    function renderStaffLine(container, notes, startIndex) {
      container.innerHTML = '';
      notes.forEach((note, i) => {
        const globalIndex = startIndex + i;
        const token = document.createElement('span');
        token.className = 'note-token';
        if (globalIndex === currentNoteIndex) {
          token.classList.add('current');
        } else if (globalIndex > currentNoteIndex) {
          token.classList.add('upcoming');
        }
        token.textContent = note;
        container.appendChild(token);
      });
      // Fill remaining space with empty tokens if needed
      const remaining = 8 - notes.length;
      for (let i = 0; i < remaining; i++) {
        const token = document.createElement('span');
        token.className = 'note-token rest';
        container.appendChild(token);
      }
    }

    // ========================================
    // GUIDE DOT
    // ========================================
    function updateGuideDot() {
      // Remove all existing guide dots
      document.querySelectorAll('.tine-guide-dot').forEach(dot => dot.remove());

      if (currentTuneId === 'none') return;

      const tune = TUNES.find(t => t.id === currentTuneId);
      if (!tune || currentNoteIndex >= tune.notes.length) return;

      const nextNote = tune.notes[currentNoteIndex];
      const tineIndex = NOTE_TO_INDEX[nextNote];
      if (tineIndex === undefined) return;

      const tine = document.querySelector(`.tine[data-index="${tineIndex}"]`);
      if (!tine) return;

      const dot = document.createElement('div');
      dot.className = 'tine-guide-dot visible';
      tine.appendChild(dot);
    }

    // ========================================
    // INTEGRATE WITH EXISTING PLUCK
    // ========================================
    const originalTriggerPluck = triggerPluck;
    triggerPluck = function(tineEl) {
      originalTriggerPluck(tineEl);

      // If playing a tune, check if this matches the next note
      if (currentTuneId !== 'none') {
        const tune = TUNES.find(t => t.id === currentTuneId);
        if (tune && currentNoteIndex < tune.notes.length) {
          const expectedNote = tune.notes[currentNoteIndex];
          const playedIndex = parseInt(tineEl.dataset.index);
          const playedNote = TINE_DATA[playedIndex]?.note;

          if (playedNote === expectedNote) {
            currentNoteIndex++;
            updateSheetMusic();
            updateGuideDot();

            // If tune completed, loop back to start
            if (currentNoteIndex >= tune.notes.length) {
              currentNoteIndex = 0;
              updateSheetMusic();
              updateGuideDot();
            }
          }
        }
      }
    };

    // Initialize
    updateSheetMusic();
    updateGuideDot();
  </script>
