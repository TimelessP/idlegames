<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe3ef"/><stop offset="1" stop-color="#ffd2c2"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d81b60"/><stop offset="1" stop-color="#ad1457"/></linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fb3c9"/><stop offset="1" stop-color="#3f8fa6"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7a2040" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <!-- desk grain -->
  <g stroke="#f7bfae" stroke-width="2" opacity=".55" fill="none"><path d="M0 250 C160 238 300 262 640 244"/><path d="M0 286 C200 272 380 298 640 280"/></g>

  <!-- coffee mug, top left -->
  <g filter="url(#sh)">
    <path d="M58 72 h66 v62 a16 16 0 0 1 -16 16 h-34 a16 16 0 0 1 -16 -16 z" fill="url(#mug)"/>
    <path d="M124 86 h8 a14 14 0 0 1 0 28 h-8" fill="none" stroke="#3f8fa6" stroke-width="7"/>
    <ellipse cx="91" cy="72" rx="33" ry="7" fill="#7a4a2e"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M80 56 c-8 -10 8 -16 0 -28"/><path d="M100 56 c-8 -10 8 -16 0 -28"/>
  </g>

  <!-- open organiser -->
  <g filter="url(#sh)">
    <rect x="150" y="38" width="352" height="246" rx="16" fill="url(#cover)"/>
    <rect x="162" y="48" width="162" height="226" rx="8" fill="#fffaf5"/>
    <rect x="328" y="48" width="162" height="226" rx="8" fill="#fffdf9"/>
  </g>
  <!-- left page: month grid with one day ringed -->
  <rect x="180" y="66" width="70" height="10" rx="5" fill="#f48fb1"/>
  <g fill="#fbe3ec">
    <rect x="180" y="92" width="18" height="18" rx="4"/><rect x="202" y="92" width="18" height="18" rx="4"/><rect x="224" y="92" width="18" height="18" rx="4"/><rect x="246" y="92" width="18" height="18" rx="4"/><rect x="268" y="92" width="18" height="18" rx="4"/><rect x="290" y="92" width="18" height="18" rx="4"/>
    <rect x="180" y="114" width="18" height="18" rx="4"/><rect x="202" y="114" width="18" height="18" rx="4"/><rect x="224" y="114" width="18" height="18" rx="4"/><rect x="246" y="114" width="18" height="18" rx="4"/><rect x="290" y="114" width="18" height="18" rx="4"/>
    <rect x="180" y="136" width="18" height="18" rx="4"/><rect x="202" y="136" width="18" height="18" rx="4"/><rect x="224" y="136" width="18" height="18" rx="4"/><rect x="246" y="136" width="18" height="18" rx="4"/><rect x="268" y="136" width="18" height="18" rx="4"/><rect x="290" y="136" width="18" height="18" rx="4"/>
    <rect x="180" y="158" width="18" height="18" rx="4"/><rect x="202" y="158" width="18" height="18" rx="4"/><rect x="246" y="158" width="18" height="18" rx="4"/><rect x="268" y="158" width="18" height="18" rx="4"/><rect x="290" y="158" width="18" height="18" rx="4"/>
  </g>
  <rect x="268" y="114" width="18" height="18" rx="4" fill="#d81b60"/>
  <circle cx="232" cy="167" r="13" fill="none" stroke="#26a69a" stroke-width="3.5"/>
  <rect x="224" y="158" width="18" height="18" rx="4" fill="#b2dfdb"/>
  <!-- little rising chart -->
  <polyline points="182,248 210,230 236,238 264,212 302,200" fill="none" stroke="#7e57c2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7e57c2"><circle cx="210" cy="230" r="4"/><circle cx="264" cy="212" r="4"/><circle cx="302" cy="200" r="4"/></g>

  <!-- right page: checklist -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="348" y="72" width="20" height="20" rx="5" fill="#fff" stroke="#d81b60" stroke-width="3"/><path d="M352 82 l5 5 l9 -11" fill="none" stroke="#d81b60" stroke-width="3.5"/>
    <rect x="380" y="78" width="86" height="8" rx="4" fill="#e7d8de"/>
    <rect x="348" y="110" width="20" height="20" rx="5" fill="#fff" stroke="#d81b60" stroke-width="3"/><path d="M352 120 l5 5 l9 -11" fill="none" stroke="#d81b60" stroke-width="3.5"/>
    <rect x="380" y="116" width="66" height="8" rx="4" fill="#e7d8de"/>
    <rect x="348" y="148" width="20" height="20" rx="5" fill="#fff" stroke="#c9b6be" stroke-width="3"/>
    <rect x="380" y="154" width="92" height="8" rx="4" fill="#d9c6ce"/>
    <rect x="348" y="186" width="20" height="20" rx="5" fill="#fff" stroke="#c9b6be" stroke-width="3"/>
    <rect x="380" y="192" width="58" height="8" rx="4" fill="#d9c6ce"/>
    <rect x="348" y="226" width="124" height="6" rx="3" fill="#eee2e7"/><rect x="348" y="242" width="98" height="6" rx="3" fill="#eee2e7"/>
  </g>
  <!-- binder rings -->
  <g fill="none" stroke="#c0c4cc" stroke-width="6" stroke-linecap="round">
    <path d="M314 86 h28"/><path d="M314 136 h28"/><path d="M314 186 h28"/><path d="M314 236 h28"/>
  </g>
  <g fill="#9aa0aa"><circle cx="314" cy="86" r="3"/><circle cx="314" cy="136" r="3"/><circle cx="314" cy="186" r="3"/><circle cx="314" cy="236" r="3"/></g>

  <!-- sticky note, flash card stack -->
  <g filter="url(#sh)">
    <rect x="512" y="54" width="86" height="86" rx="4" fill="#ffe082" transform="rotate(7 555 97)"/>
    <rect x="510" y="178" width="96" height="62" rx="8" fill="#ffffff" transform="rotate(-8 558 209)"/>
    <rect x="518" y="170" width="96" height="62" rx="8" fill="#e1f5fe" transform="rotate(-2 566 201)"/>
  </g>
  <g transform="rotate(7 555 97)" fill="#e6b84a"><rect x="526" y="78" width="54" height="6" rx="3"/><rect x="526" y="94" width="40" height="6" rx="3"/><rect x="526" y="110" width="48" height="6" rx="3"/></g>
  <g transform="rotate(-2 566 201)"><circle cx="566" cy="201" r="13" fill="none" stroke="#4fc3f7" stroke-width="3.5"/><path d="M561 197 a5 5 0 1 1 7 5 v4" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round"/></g>

  <!-- pen across the page -->
  <g transform="rotate(-32 430 270)" filter="url(#sh)">
    <rect x="360" y="262" width="140" height="14" rx="7" fill="#37474f"/>
    <rect x="470" y="262" width="22" height="14" fill="#ffca28"/>
    <path d="M360 262 l-22 7 l22 7 z" fill="#cfd8dc"/><path d="M344 267 l-6 2 l6 2 z" fill="#263238"/>
    <rect x="412" y="258" width="44" height="4" rx="2" fill="#b0bec5"/>
  </g>
</svg>
