<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f0fb"/><stop offset="1" stop-color="#cfe0f4"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4250"/><stop offset=".5" stop-color="#4b5464"/><stop offset="1" stop-color="#2c333e"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2a44"/><stop offset="1" stop-color="#0b1e33"/></linearGradient>
    <filter id="sh" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17324f" flood-opacity=".25"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <g stroke="#bcd2ea" stroke-width="2" fill="none" opacity=".7"><path d="M0 258 C180 244 360 272 640 252"/><path d="M0 292 C220 280 420 302 640 288"/></g>

  <!-- sound waves leaving the recorder -->
  <g fill="none" stroke="#0b5cad" stroke-linecap="round" opacity=".85">
    <path d="M232 92 a40 40 0 0 0 0 56" stroke-width="6"/><path d="M208 74 a66 66 0 0 0 0 92" stroke-width="6" opacity=".7"/><path d="M184 56 a92 92 0 0 0 0 128" stroke-width="6" opacity=".45"/>
  </g>

  <!-- handheld recorder -->
  <g filter="url(#sh)">
    <rect x="252" y="28" width="132" height="262" rx="26" fill="url(#body)"/>
  </g>
  <!-- mic grille -->
  <rect x="270" y="44" width="96" height="62" rx="14" fill="#2a303a"/>
  <g fill="#7b8696">
    <circle cx="286" cy="58" r="3"/><circle cx="300" cy="58" r="3"/><circle cx="314" cy="58" r="3"/><circle cx="328" cy="58" r="3"/><circle cx="342" cy="58" r="3"/>
    <circle cx="293" cy="70" r="3"/><circle cx="307" cy="70" r="3"/><circle cx="321" cy="70" r="3"/><circle cx="335" cy="70" r="3"/><circle cx="349" cy="70" r="3"/>
    <circle cx="286" cy="82" r="3"/><circle cx="300" cy="82" r="3"/><circle cx="314" cy="82" r="3"/><circle cx="328" cy="82" r="3"/><circle cx="342" cy="82" r="3"/>
    <circle cx="293" cy="94" r="3"/><circle cx="307" cy="94" r="3"/><circle cx="321" cy="94" r="3"/><circle cx="335" cy="94" r="3"/><circle cx="349" cy="94" r="3"/>
  </g>
  <!-- record light -->
  <circle cx="358" cy="120" r="7" fill="#ff5252"/><circle cx="358" cy="120" r="12" fill="none" stroke="#ff5252" stroke-width="2" opacity=".5"/>
  <!-- screen with waveform -->
  <rect x="270" y="134" width="96" height="56" rx="8" fill="url(#scr)"/>
  <g fill="#6ea8ff">
    <rect x="278" y="158" width="4" height="8" rx="2"/><rect x="285" y="152" width="4" height="20" rx="2"/><rect x="292" y="146" width="4" height="32" rx="2"/><rect x="299" y="154" width="4" height="16" rx="2"/>
    <rect x="306" y="142" width="4" height="40" rx="2"/><rect x="313" y="150" width="4" height="24" rx="2"/><rect x="320" y="156" width="4" height="12" rx="2"/>
  </g>
  <g fill="#3d5576"><rect x="327" y="152" width="4" height="20" rx="2"/><rect x="334" y="148" width="4" height="28" rx="2"/><rect x="341" y="155" width="4" height="14" rx="2"/><rect x="348" y="158" width="4" height="8" rx="2"/><rect x="355" y="156" width="4" height="12" rx="2"/></g>
  <rect x="324" y="138" width="2" height="48" fill="#ffffff"/>
  <!-- buttons -->
  <circle cx="318" cy="236" r="26" fill="#2a303a"/>
  <circle cx="318" cy="236" r="14" fill="#e53935"/>
  <rect x="268" y="226" width="22" height="20" rx="6" fill="#596273"/><path d="M282 230 l-8 6 l8 6 z" fill="#c7ced9"/>
  <rect x="346" y="226" width="22" height="20" rx="6" fill="#596273"/><path d="M354 230 l8 6 l-8 6 z" fill="#c7ced9"/>
  <rect x="292" y="270" width="52" height="6" rx="3" fill="#596273"/>

  <!-- microcassette -->
  <g transform="rotate(-10 120 236)" filter="url(#sh)">
    <rect x="62" y="200" width="116" height="74" rx="8" fill="#eceff3"/>
    <rect x="76" y="212" width="88" height="34" rx="6" fill="#263238"/>
    <circle cx="98" cy="229" r="11" fill="#eceff3"/><circle cx="142" cy="229" r="11" fill="#eceff3"/>
    <g fill="#263238"><circle cx="98" cy="229" r="4"/><circle cx="142" cy="229" r="4"/></g>
    <rect x="110" y="224" width="20" height="10" rx="2" fill="#8d6e63"/>
    <rect x="86" y="254" width="68" height="8" rx="4" fill="#90a4ae"/>
  </g>

  <!-- notepad: speech turned into lines -->
  <g transform="rotate(5 520 170)" filter="url(#sh)">
    <rect x="446" y="64" width="150" height="196" rx="8" fill="#fffdf7"/>
    <rect x="446" y="64" width="150" height="22" rx="8" fill="#0b5cad"/>
    <g fill="#ffffff"><circle cx="470" cy="75" r="4"/><circle cx="498" cy="75" r="4"/><circle cx="526" cy="75" r="4"/><circle cx="554" cy="75" r="4"/><circle cx="582" cy="75" r="4"/></g>
    <g fill="#c9d3df"><rect x="462" y="104" width="116" height="7" rx="3.5"/><rect x="462" y="122" width="96" height="7" rx="3.5"/><rect x="462" y="140" width="110" height="7" rx="3.5"/><rect x="462" y="158" width="70" height="7" rx="3.5"/>
      <rect x="462" y="184" width="104" height="7" rx="3.5"/><rect x="462" y="202" width="86" height="7" rx="3.5"/><rect x="462" y="220" width="58" height="7" rx="3.5"/></g>
    <rect x="462" y="104" width="38" height="7" rx="3.5" fill="#6ea8ff"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(-38 540 270)" filter="url(#sh)">
    <rect x="478" y="262" width="118" height="13" rx="3" fill="#ffca28"/><rect x="584" y="262" width="14" height="13" fill="#ef9a9a"/>
    <path d="M478 262 l-20 6.5 l20 6.5 z" fill="#ffe0b2"/><path d="M464 266.5 l-6 2 l6 2 z" fill="#37474f"/>
  </g>
</svg>
