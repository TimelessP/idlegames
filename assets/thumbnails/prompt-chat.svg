<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e7fb"/><stop offset="1" stop-color="#cfd3f7"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c6bf0"/><stop offset="1" stop-color="#3b45c4"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="#ff8a65"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1c2163" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <!-- laptop -->
  <g filter="url(#sh)">
    <rect x="150" y="34" width="340" height="216" rx="14" fill="#2b2f3a"/>
    <rect x="164" y="48" width="312" height="188" rx="6" fill="#f7f8fe"/>
    <path d="M110 250 H530 L506 280 H134 Z" fill="#c5c9d6"/><rect x="290" y="252" width="60" height="6" rx="3" fill="#9aa0b4"/>
  </g>
  <!-- chat on screen: user right, model left, model typing -->
  <g filter="url(#sh)">
    <path d="M300 62 h158 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-150 l-12 10 v-10 a10 10 0 0 1 -6 -9 v-27 a10 10 0 0 1 10 -10z" fill="#3b45c4"/>
    <path d="M182 118 h172 a10 10 0 0 1 10 10 v44 a10 10 0 0 1 -10 10 h-164 a10 10 0 0 1 -10 -10 v-44 a10 10 0 0 1 10 -10z" fill="#ffffff" stroke="#d6dae1"/>
    <path d="M182 192 h70 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-70 a10 10 0 0 1 -10 -10 v-14 a10 10 0 0 1 10 -10z" fill="#ffffff" stroke="#d6dae1"/>
  </g>
  <g fill="#ffffff" opacity=".9"><rect x="316" y="76" width="130" height="7" rx="3.5"/><rect x="316" y="89" width="84" height="7" rx="3.5"/></g>
  <g fill="#c9cdd8"><rect x="194" y="132" width="150" height="7" rx="3.5"/><rect x="194" y="146" width="124" height="7" rx="3.5"/><rect x="194" y="160" width="138" height="7" rx="3.5"/></g>
  <g fill="#3b45c4"><circle cx="198" cy="209" r="5"/><circle cx="216" cy="209" r="5" opacity=".7"/><circle cx="234" cy="209" r="5" opacity=".4"/></g>
  <!-- on-device chip with sparkles -->
  <g filter="url(#sh)" transform="translate(504 104)">
    <g stroke="#3b45c4" stroke-width="5" stroke-linecap="round"><line x1="22" y1="0" x2="22" y2="12"/><line x1="44" y1="0" x2="44" y2="12"/><line x1="66" y1="0" x2="66" y2="12"/><line x1="22" y1="76" x2="22" y2="88"/><line x1="44" y1="76" x2="44" y2="88"/><line x1="66" y1="76" x2="66" y2="88"/><line x1="0" y1="22" x2="12" y2="22"/><line x1="0" y1="44" x2="12" y2="44"/><line x1="0" y1="66" x2="12" y2="66"/><line x1="76" y1="22" x2="88" y2="22"/><line x1="76" y1="44" x2="88" y2="44"/><line x1="76" y1="66" x2="88" y2="66"/></g>
    <rect x="10" y="10" width="68" height="68" rx="12" fill="url(#chip)"/>
    <path d="M44 24 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="url(#spark)"/>
  </g>
  <g fill="url(#spark)"><path d="M590 64 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/><path d="M486 222 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/></g>
  <!-- privacy lock: nothing leaves the device -->
  <g filter="url(#sh)" transform="translate(70 120)">
    <rect x="0" y="30" width="56" height="46" rx="10" fill="#1d7a43"/>
    <path d="M12 30 v-10 a16 16 0 0 1 32 0 v10" fill="none" stroke="#1d7a43" stroke-width="7"/>
    <circle cx="28" cy="50" r="6" fill="#e1f3e8"/><rect x="25" y="52" width="6" height="12" rx="3" fill="#e1f3e8"/>
  </g>
</svg>
