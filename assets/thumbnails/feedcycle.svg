<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1e0"/><stop offset="1" stop-color="#ffe0c7"/></linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f3640"/><stop offset="1" stop-color="#1f242b"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb74d"/><stop offset="1" stop-color="#f57c00"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#80cbc4"/><stop offset="1" stop-color="#00897b"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b39ddb"/><stop offset="1" stop-color="#5e35b1"/></linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#8a4a12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <g stroke="#f6cfae" stroke-width="2" fill="none" opacity=".6"><path d="M0 262 C180 248 360 276 640 256"/><path d="M0 294 C220 282 420 304 640 290"/></g>

  <!-- the cycle: a looping arrow around the reader -->
  <g fill="none" stroke="#f57c00" stroke-width="7" stroke-linecap="round" opacity=".9">
    <path d="M196 70 A150 118 0 0 1 444 70"/>
    <path d="M444 250 A150 118 0 0 1 196 250"/>
  </g>
  <path d="M452 58 l-2 26 l-22 -12 z" fill="#f57c00"/>
  <path d="M188 262 l2 -26 l22 12 z" fill="#f57c00"/>

  <!-- tablet with a feed -->
  <g filter="url(#sh)">
    <rect x="232" y="40" width="176" height="244" rx="20" fill="url(#dev)"/>
    <rect x="244" y="56" width="152" height="212" rx="8" fill="#fffdf9"/>
  </g>
  <!-- feed cards: picture + headline bars -->
  <rect x="254" y="66" width="44" height="40" rx="6" fill="url(#p1)"/>
  <circle cx="267" cy="80" r="5" fill="#fff3e0"/><path d="M254 100 l14 -12 l10 8 l8 -6 l12 10 v6 h-44 z" fill="#e65100" opacity=".6"/>
  <rect x="306" y="70" width="80" height="8" rx="4" fill="#3b4048"/><rect x="306" y="84" width="64" height="6" rx="3" fill="#c9cdd3"/><rect x="306" y="96" width="48" height="6" rx="3" fill="#c9cdd3"/>
  <rect x="254" y="118" width="132" height="1.5" fill="#eee"/>
  <rect x="254" y="130" width="44" height="40" rx="6" fill="url(#p2)"/>
  <path d="M268 140 v20 l16 -10 z" fill="#ffffff"/>
  <rect x="306" y="134" width="74" height="8" rx="4" fill="#3b4048"/><rect x="306" y="148" width="68" height="6" rx="3" fill="#c9cdd3"/><rect x="306" y="160" width="40" height="6" rx="3" fill="#c9cdd3"/>
  <rect x="254" y="182" width="132" height="1.5" fill="#eee"/>
  <rect x="254" y="194" width="44" height="40" rx="6" fill="url(#p3)"/>
  <circle cx="276" cy="214" r="10" fill="none" stroke="#fff" stroke-width="3"/><circle cx="276" cy="214" r="3" fill="#fff"/>
  <rect x="306" y="198" width="80" height="8" rx="4" fill="#3b4048"/><rect x="306" y="212" width="56" height="6" rx="3" fill="#c9cdd3"/><rect x="306" y="224" width="62" height="6" rx="3" fill="#c9cdd3"/>
  <!-- tag chips -->
  <rect x="254" y="244" width="34" height="14" rx="7" fill="#ffe0b2"/><rect x="294" y="244" width="28" height="14" rx="7" fill="#b2dfdb"/><rect x="328" y="244" width="38" height="14" rx="7" fill="#d1c4e9"/>

  <!-- RSS broadcast symbol tile -->
  <g filter="url(#sh)" transform="translate(84 56)">
    <rect width="92" height="92" rx="20" fill="url(#p1)"/>
    <circle cx="26" cy="66" r="8" fill="#fff"/>
    <path d="M18 42 a32 32 0 0 1 32 32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 20 a54 54 0 0 1 54 54" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- headphones (podcasts) -->
  <g transform="translate(470 54)" filter="url(#sh)" fill="none" stroke-linecap="round">
    <path d="M14 70 v-14 a40 40 0 0 1 80 0 v14" stroke="#37474f" stroke-width="9"/>
    <rect x="2" y="62" width="24" height="40" rx="10" fill="#00897b" stroke="none"/>
    <rect x="82" y="62" width="24" height="40" rx="10" fill="#00897b" stroke="none"/>
  </g>

  <!-- folded newspaper -->
  <g transform="rotate(-8 520 230)" filter="url(#sh)">
    <rect x="462" y="190" width="116" height="78" rx="4" fill="#fafafa"/>
    <rect x="474" y="200" width="92" height="10" rx="2" fill="#455a64"/>
    <rect x="474" y="218" width="40" height="38" rx="2" fill="#cfd8dc"/>
    <g fill="#b0bec5"><rect x="522" y="218" width="44" height="5" rx="2"/><rect x="522" y="229" width="38" height="5" rx="2"/><rect x="522" y="240" width="44" height="5" rx="2"/><rect x="522" y="251" width="30" height="5" rx="2"/></g>
  </g>

  <!-- tea cup -->
  <g filter="url(#sh)">
    <path d="M70 204 h76 l-8 44 a14 14 0 0 1 -14 12 h-32 a14 14 0 0 1 -14 -12 z" fill="#ffffff"/>
    <path d="M146 212 h6 a12 12 0 0 1 0 24 h-10" fill="none" stroke="#ffffff" stroke-width="7"/>
    <ellipse cx="108" cy="204" rx="38" ry="7" fill="#c77d3a"/>
    <ellipse cx="108" cy="266" rx="54" ry="7" fill="#f1d3b8"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M98 190 c-8 -9 8 -15 0 -26"/><path d="M118 190 c-8 -9 8 -15 0 -26"/></g>
</svg>
