<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#16294a"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e7d32"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fffde7" stop-opacity=".35"/><stop offset="1" stop-color="#fffde7" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset=".5" stop-color="#ffc107"/><stop offset="1" stop-color="#ff8f00"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="640" height="320" fill="url(#sky)"/>
  <!-- floodlights -->
  <g fill="#fffde7"><rect x="40" y="18" width="40" height="12" rx="3"/><rect x="560" y="18" width="40" height="12" rx="3"/></g>
  <g stroke="#3d4f6e" stroke-width="4"><line x1="60" y1="30" x2="60" y2="90"/><line x1="580" y1="30" x2="580" y2="90"/></g>
  <!-- pitch in perspective -->
  <path d="M110 92 H530 L620 312 H20 Z" fill="url(#grass)"/>
  <g fill="#ffffff" opacity=".06"><path d="M152 92 H194 L170 312 H96 Z"/><path d="M236 92 H278 L268 312 H218 Z"/><path d="M320 92 H362 L366 312 H318 Z"/><path d="M404 92 H446 L464 312 H414 Z"/><path d="M488 92 H530 L562 312 H512 Z"/></g>
  <path d="M110 92 H530 L620 312 H20 Z" fill="url(#glow)"/>
  <g fill="none" stroke="#e8f5e9" stroke-width="3" opacity=".85">
    <path d="M110 92 H530 L620 312 H20 Z"/><line x1="320" y1="92" x2="320" y2="312"/>
    <ellipse cx="320" cy="190" rx="58" ry="26"/>
    <path d="M136 152 H210 L196 252 H96"/><path d="M504 152 H430 L444 252 H544"/>
  </g>
  <!-- players: two kits -->
  <g filter="url(#sh)">
    <g fill="#e53935" stroke="#fff" stroke-width="2"><circle cx="220" cy="140" r="9"/><circle cx="262" cy="214" r="10"/><circle cx="180" cy="250" r="11"/><circle cx="290" cy="128" r="8"/><circle cx="140" cy="196" r="10"/></g>
    <g fill="#1e88e5" stroke="#fff" stroke-width="2"><circle cx="380" cy="156" r="9"/><circle cx="356" cy="232" r="10"/><circle cx="452" cy="206" r="10"/><circle cx="420" cy="126" r="8"/><circle cx="500" cy="264" r="11"/></g>
  </g>
  <!-- ball with a motion trail -->
  <path d="M262 214 Q300 176 334 184" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity=".7"/>
  <g filter="url(#sh)"><circle cx="340" cy="186" r="11" fill="#fff"/><path d="M340 179 l6 4 -2 7 h-8 l-2 -7z" fill="#263238"/></g>
  <!-- scoreboard (no digits: two kit colours and blocks) -->
  <g filter="url(#sh)" transform="translate(250 14)">
    <rect width="140" height="44" rx="8" fill="#0a1222" stroke="#2d3d5c" stroke-width="2"/>
    <rect x="12" y="12" width="20" height="20" rx="4" fill="#e53935"/><rect x="108" y="12" width="20" height="20" rx="4" fill="#1e88e5"/>
    <g fill="#ffd54f"><rect x="44" y="14" width="14" height="16" rx="2"/><rect x="82" y="14" width="14" height="16" rx="2"/></g><rect x="66" y="20" width="8" height="4" rx="2" fill="#90a4ae"/>
  </g>
  <!-- trophy -->
  <g filter="url(#sh)" transform="translate(556 112)">
    <path d="M10 0 h44 v16 a22 22 0 0 1 -44 0z" fill="url(#gold)"/>
    <path d="M10 6 h-8 a8 8 0 0 0 10 16 M54 6 h8 a8 8 0 0 1 -10 16" fill="none" stroke="#ffc107" stroke-width="4"/>
    <rect x="28" y="38" width="8" height="14" fill="#ffb300"/><rect x="16" y="52" width="32" height="10" rx="3" fill="#6d4c41"/>
  </g>
</svg>
