<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" role="img" aria-label="A painted city street at dusk with lit windows, a street lamp, a car and a kite">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2f5e"/>
      <stop offset="0.55" stop-color="#8a4f6e"/>
      <stop offset="1" stop-color="#f0a35e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f4150"/>
      <stop offset="1" stop-color="#2a2b36"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb35c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff1c8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff1c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="t"><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="in" result="tx"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tx"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="320" fill="url(#sky)"/>
  <circle cx="420" cy="70" r="16" fill="#fbe7c6" opacity="0.9"/>
  <g filter="url(#paint)" stroke="#1c1a1f" stroke-width="3" stroke-linejoin="round">
    <!-- far skyline -->
    <path d="M0 170 V120 h40 v-30 h34 v40 h30 v-55 h46 v65 h28 v-20 h40 v-50 h50 v70 h36 v-30 h44 v40 h40 v-60 h52 v80 h52 V170 z" fill="#4a3f63" stroke-width="2"/>
    <!-- three painted buildings, roof and front visible -->
    <path d="M30 228 V112 h120 v116 z" fill="#b5563f"/>
    <path d="M30 112 l14 -20 h120 l-14 20 z" fill="#7e3f33"/>
    <path d="M150 228 V112 l14 -20 v116 z" fill="#8a4434"/>
    <path d="M178 228 V82 h118 v146 z" fill="#d8c8a6"/>
    <path d="M178 82 l12 -16 h118 l-12 16 z" fill="#a89a7e"/>
    <path d="M296 228 V82 l12 -16 v146 z" fill="#b5a687"/>
    <path d="M324 228 V128 h124 v100 z" fill="#5d7a8f"/>
    <path d="M324 128 l12 -16 h124 l-12 16 z" fill="#3f5a70"/>
    <path d="M448 228 V128 l12 -16 v100 z" fill="#4a657b"/>
    <!-- rooftop tank and aircon -->
    <rect x="212" y="52" width="20" height="18" fill="#8a6a4a"/>
    <path d="M208 52 l14 -10 l14 10 z" fill="#5a4030"/>
    <rect x="370" y="102" width="26" height="12" fill="#cfcbc2"/>
  </g>
  <!-- windows: lit and dark, with people inside -->
  <g stroke="#1c1a1f" stroke-width="2">
    <g fill="#ffd08a"><rect x="44" y="126" width="22" height="26"/><rect x="112" y="126" width="22" height="26"/><rect x="78" y="168" width="22" height="26"/><rect x="194" y="98" width="20" height="24"/><rect x="262" y="98" width="20" height="24"/><rect x="228" y="140" width="20" height="24"/><rect x="194" y="182" width="20" height="24"/><rect x="340" y="144" width="18" height="22"/><rect x="404" y="144" width="18" height="22"/><rect x="372" y="184" width="18" height="22"/></g>
    <g fill="#3a4560"><rect x="78" y="126" width="22" height="26"/><rect x="44" y="168" width="22" height="26"/><rect x="112" y="168" width="22" height="26"/><rect x="228" y="98" width="20" height="24"/><rect x="194" y="140" width="20" height="24"/><rect x="262" y="140" width="20" height="24"/><rect x="262" y="182" width="20" height="24"/><rect x="372" y="144" width="18" height="22"/><rect x="340" y="184" width="18" height="22"/><rect x="404" y="184" width="18" height="22"/></g>
  </g>
  <g fill="#5a3a2c" opacity="0.7"><circle cx="122" cy="136" r="4"/><rect x="117" y="140" width="10" height="12"/><circle cx="236" cy="150" r="4"/><rect x="231" y="154" width="10" height="10"/><circle cx="412" cy="154" r="3.5"/><rect x="408" y="157" width="8" height="9"/></g>
  <!-- fire escape on the brick block -->
  <g stroke="#1f2326" stroke-width="2" fill="none"><path d="M40 160 h36 M40 202 h36 M44 202 L72 160"/></g>
  <!-- awning -->
  <path d="M182 214 h110 l6 10 h-122 z" fill="#2a9d8f" stroke="#1c1a1f" stroke-width="2"/>
  <path d="M190 214 v10 M206 214 v10 M222 214 v10 M238 214 v10 M254 214 v10 M270 214 v10 M286 214 v10" stroke="#f3ede1" stroke-width="5"/>
  <!-- footpath and road -->
  <rect y="228" width="512" height="16" fill="#cfc6b4"/>
  <path d="M0 244 h512" stroke="#1c1a1f" stroke-width="3"/>
  <rect y="244" width="512" height="76" fill="url(#road)"/>
  <path d="M0 284 h512" stroke="#eeeadc" stroke-width="3" stroke-dasharray="22 18"/>
  <!-- lamp and its pool of light -->
  <ellipse cx="300" cy="250" rx="90" ry="34" fill="url(#lamp)"/>
  <path d="M300 240 V150 h-22" fill="none" stroke="#2e3238" stroke-width="4"/>
  <rect x="266" y="146" width="18" height="7" fill="#ffe2a8" stroke="#1c1a1f" stroke-width="2"/>
  <circle cx="275" cy="152" r="16" fill="url(#lamp)"/>
  <!-- a little car with headlights -->
  <path d="M120 300 L250 290 L250 320 L120 312 z" fill="url(#head)"/>
  <g stroke="#1c1a1f" stroke-width="3" stroke-linejoin="round">
    <rect x="52" y="286" width="74" height="22" rx="6" fill="#b8322c"/>
    <path d="M66 286 l8 -12 h30 l10 12 z" fill="#3a4a5c"/>
  </g>
  <circle cx="68" cy="310" r="6" fill="#1c1a1f"/><circle cx="110" cy="310" r="6" fill="#1c1a1f"/>
  <rect x="122" y="292" width="5" height="6" fill="#fff1c8"/>
  <!-- the wanderer in an orange beret, flying a kite -->
  <g stroke="#1c1a1f" stroke-width="2" stroke-linecap="round">
    <path d="M398 240 l-4 -18 M404 240 l4 -18" stroke="#3a3550" stroke-width="4"/>
    <rect x="392" y="198" width="18" height="26" rx="5" fill="#2f8f8a"/>
    <path d="M394 206 l4 4 4 -4 4 4 4 -4" fill="none" stroke="#efe4c8" stroke-width="2"/>
    <circle cx="401" cy="190" r="7" fill="#e2b48f"/>
    <ellipse cx="400" cy="183" rx="10" ry="4" fill="#e07b28"/>
    <path d="M410 204 l12 -14" fill="none"/>
  </g>
  <path d="M422 190 Q450 140 470 96" fill="none" stroke="#2a2a30" stroke-width="1.2"/>
  <g stroke="#1c1a1f" stroke-width="2" stroke-linejoin="round">
    <path d="M470 80 l12 16 -12 22 -12 -22 z" fill="#c8342a"/>
    <path d="M470 80 l12 16 h-12 z" fill="#f2c14e"/>
  </g>
  <path d="M470 118 q-6 10 2 18 q-8 8 0 16" fill="none" stroke="#c8342a" stroke-width="2"/>
</svg>
