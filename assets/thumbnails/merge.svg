<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  
  <!-- Grid cells -->
  <g transform="translate(48, 48)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="52" height="52" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="26" y="34" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="white">🍎</text>
    
    <rect x="56" y="0" width="52" height="52" rx="8" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <text x="82" y="34" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="white">🍎</text>
    
    <rect x="112" y="0" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="138" y="34" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍌</text>
    
    <rect x="168" y="0" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="194" y="34" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍇</text>
    
    <!-- Row 2 -->
    <rect x="0" y="56" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="26" y="90" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍓</text>
    
    <rect x="56" y="56" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="82" y="90" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍑</text>
    
    <rect x="112" y="56" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="138" y="90" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍒</text>
    
    <rect x="168" y="56" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="194" y="90" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍍</text>
    
    <!-- Row 3 -->
    <rect x="0" y="112" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="26" y="146" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🥝</text>
    
    <rect x="56" y="112" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="82" y="146" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🥭</text>
    
    <rect x="112" y="112" width="52" height="52" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="138" y="146" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="rgba(255,255,255,0.3)">🍉</text>
    
    <!-- Merged result (highlighted) -->
    <rect x="168" y="112" width="52" height="52" rx="8" fill="rgba(255,255,255,0.3)" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
    <text x="194" y="146" text-anchor="middle" dominant-baseline="middle" font-size="28" fill="white">🍌</text>
    <text x="194" y="162" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#ffd700" font-weight="bold">Lv.2</text>
  </g>
  
  <!-- Merge arrow indicator -->
  <g transform="translate(128, 100)">
    <path d="M-20 0 L20 0" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M10 -8 L20 0 L10 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    <path d="M-10 -8 L-20 0 L-10 8" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Title text -->
  <text x="128" y="220" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" opacity="0.9">MERGE</text>
</svg>