<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="50%" stop-color="#3d2318"/>
      <stop offset="100%" stop-color="#1e100a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ecf1"/>
      <stop offset="35%" stop-color="#a6b1bc"/>
      <stop offset="70%" stop-color="#6a7582"/>
      <stop offset="100%" stop-color="#d8e0e8"/>
    </linearGradient>
    <radialGradient id="holeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0a0503"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#12100e"/>
  
  <!-- Kalimba body -->
  <path d="M64 40 L448 40 Q480 40 480 72 L480 440 Q480 472 448 472 L64 472 Q32 472 32 440 L32 72 Q32 40 64 40 Z" fill="url(#woodGrad)"/>
  
