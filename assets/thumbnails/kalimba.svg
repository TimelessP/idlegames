  <rect x="72" y="90" width="368" height="8" rx="4" fill="url(#metalGrad)"/>
  <rect x="80" y="115" width="352" height="14" rx="3" fill="#180d07"/>
  <rect x="92" y="117" width="328" height="4" rx="2" fill="#7a848f"/>
  
