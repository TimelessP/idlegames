<!DOCTYPE html>
<!--
================================================================================
 Feed Cycle 3  -  local-first feed and podcast reader (single file)
================================================================================
 SECTION INDEX
  §1 CSS ............ tokens (html[data-theme] = system | light | dark), layout:
                      top bar, list (+ reader pane on wide screens), mini player
  §2 HTML ........... top bar, list, reader pane, mini player, sheets, toasts
  §ENGINE ........... feeds, proxies, cache, parsing, media, OPML, sanitiser:
                      carried over from Feed Cycle 2 (feedcycle.js) with small
                      marked patches ([FC3]); storage is unchanged:
                      localStorage "feedcycle-v2", Cache API "feedcycle-cache-v2"
  §UI-1..9 .......... helpers, layers & input, list, filters, reader, player,
                      refresh, sheets, keys & boot
 NEW OPTIONAL STATE KEYS (older versions keep and ignore them):
  positions {mediaUrl: {t, d, at}}, nowPlaying {postId, url},
  settings.view, settings.readerScale, settings.playbackRate
================================================================================
-->
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1e40" />
  <meta name="application-name" content="IdleGames" />
  <script src="assets/js/pwa.js" defer></script>
  <title>Feed Cycle</title>
  <meta name="description" content="Feed Cycle — local-first, accessible feed & podcast reader" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="favicon.ico" />
  <style>
/* ==========================================================================
   §1 CSS  -  flat, high contrast; tokens follow html[data-theme] (system/light/dark)
   ========================================================================== */
:root {
  --bg: #f5f7fa; --surface: #ffffff; --surface-2: #eef2f6; --line: #c9d1db; --line-strong: #9aa6b4;
  --text: #1d2734; --text-2: #4c5866; --text-3: #5f6b78; --accent: #1a66d2; --accent-soft: #e3edfb; --on-accent: #ffffff;
  --ok: #047857; --ok-soft: #dcf3ea; --bad: #c62828; --bad-soft: #fde7e7; --gold: #a86a00; --gold-soft: #fbf0d9; --media: #6d28d9; --media-soft: #efe7fd;
  --fs: 17px; --tap: 48px; --r: 10px; --app-h: 100dvh; --reader-scale: 1;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181c23; --surface-2: #1f242d; --line: #303845; --line-strong: #4a5563;
  --text: #e6e9ef; --text-2: #b3bbc7; --text-3: #9aa3b0; --accent: #53aaff; --accent-soft: #1b2a40; --on-accent: #06121f;
  --ok: #34d399; --ok-soft: #12281f; --bad: #f87171; --bad-soft: #3a1b1b; --gold: #f9b938; --gold-soft: #34290f; --media: #b794f6; --media-soft: #2a2140; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    --bg: #101317; --surface: #181c23; --surface-2: #1f242d; --line: #303845; --line-strong: #4a5563;
    --text: #e6e9ef; --text-2: #b3bbc7; --text-3: #9aa3b0; --accent: #53aaff; --accent-soft: #1b2a40; --on-accent: #06121f;
    --ok: #34d399; --ok-soft: #12281f; --bad: #f87171; --bad-soft: #3a1b1b; --gold: #f9b938; --gold-soft: #34290f; --media: #b794f6; --media-soft: #2a2140; color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: var(--fs)/1.5 "Roboto", system-ui, -apple-system, "Segoe UI", Ubuntu, "Noto Sans", Helvetica, Arial, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
/* selected text follows the theme (the browser default ignores it) */
::selection { background: var(--accent); color: var(--on-accent); }
.toast ::selection, .toast::selection { background: var(--bg); color: var(--text); }
:focus { outline: none; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
svg.i { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); min-width: var(--tap); padding: 0 1em;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; white-space: nowrap; font-weight: 600; font-size: .95em;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); } .btn[disabled] { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: var(--tap); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[aria-pressed="true"], .btn[aria-selected="true"], .btn[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.star[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 1.35em; height: 1.35em; padding: 0 .35em; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: .72em; font-weight: 700; }

/* ---- frame ---- */
#app { position: fixed; inset: 0; height: var(--app-h); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
#top { position: relative; display: flex; align-items: center; gap: 6px; padding: calc(4px + var(--safe-t)) calc(8px + var(--safe-r)) 4px calc(8px + var(--safe-l)); background: var(--surface); border-bottom: 1px solid var(--line-strong); min-height: 58px; }
#home { font-weight: 700; font-size: 1.05em; padding: 0 .6em; flex: none; }
#home .logo { color: var(--accent); }
#top.compact #home .lbl { display: none; } #top.compact #home { width: var(--tap); padding: 0; }
.searchbox { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 .6em; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }
.searchbox:focus-within { border-color: var(--accent); background: var(--surface); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; min-height: calc(var(--tap) - 2px); }
.searchbox .clear { border: 0; background: none; cursor: pointer; color: var(--text-3); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
#filter-btn { position: relative; } #filter-btn .badge { position: absolute; top: 2px; right: 2px; }
#refresh-btn.spin svg { animation: spin 1s linear infinite; }
#refresh-btn { position: relative; } #refresh-btn.warn::after { content: ""; position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
@keyframes spin { to { transform: rotate(360deg); } }
#refresh-bar { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--accent); width: 0; transition: width .3s; }
#main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
#list-pane { min-height: 0; display: flex; flex-direction: column; }
#reader-pane { display: none; min-height: 0; }
@media (min-width: 1100px) and (min-aspect-ratio: 1/1) {
  #main { grid-template-columns: minmax(380px, 470px) minmax(0, 1fr); }
  #reader-pane { display: flex; flex-direction: column; border-left: 1px solid var(--line-strong); background: var(--surface); }
}

/* ---- list ---- */
#scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.lhead { padding: 8px 10px 4px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: .3em; min-height: 36px; padding: 0 .3em 0 .75em; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--text); font-size: .85em; font-weight: 600; cursor: pointer; }
.chip.plain { padding: 0 .75em; }
.chip .x { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; }
.chip:hover .x { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.countline { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; min-height: 44px; color: var(--text-2); font-size: .9em; }
.countline .grow { flex: 1; }
.countline .btn { min-height: 40px; font-size: .88em; }
#newpill { position: sticky; top: 6px; z-index: 3; display: flex; justify-content: center; pointer-events: none; height: 0; overflow: visible; }
#newpill .btn { pointer-events: auto; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#list { padding: 2px 10px 18px; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.row .open { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 2px; background: none; border: 0; text-align: left; cursor: pointer; min-width: 0; border-radius: 6px; }
.row.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.thumb { width: 96px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--ph, var(--surface-2)); position: relative; display: block; }
/* generated art underneath, the real picture fades in on top once it has loaded */
.thumb img, #player .art img, .np .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.thumb img.real, #player .art img.real, .np .art img.real { opacity: 0; transition: opacity .35s ease; }
.thumb img.real.on, #player .art img.real.on, .np .art img.real.on { opacity: 1; }
.thumb img.real.now, #player .art img.real.now, .np .art img.real.now { transition: none; }
.thumb .dur { z-index: 2; position: absolute; right: 3px; bottom: 3px; background: rgba(0,0,0,.75); color: #fff; font-size: .68em; padding: 0 .35em; border-radius: 3px; font-variant-numeric: tabular-nums; }
.thumb .prog { z-index: 2; position: absolute; left: 0; bottom: 0; height: 3px; background: var(--bad); }
.ttl { font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.unread .ttl { font-weight: 750; }
.unread .ttl::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--accent); margin-right: .4em; vertical-align: .1em; }
.meta { color: var(--text-2); font-size: .8em; display: flex; flex-wrap: wrap; gap: 0 .5em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.meta .feed { font-weight: 600; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: .25em; font-size: .78em; padding: 0 .5em; border-radius: 4px; background: var(--surface-2); color: var(--text-2); font-weight: 600; line-height: 1.7; }
.tag.media { background: var(--media-soft); color: var(--media); }
.tag.done { background: var(--ok-soft); color: var(--ok); }
.ra { display: flex; gap: 2px; align-items: center; }
.ra .btn { min-width: 44px; width: 44px; min-height: 44px; padding: 0; border-color: transparent; background: transparent; }
.ra .btn.star[aria-pressed="true"] { background: transparent; border-color: transparent; }
.ra .btn.playing { color: var(--accent); }
/* cards view */
#list.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding-top: 6px; }
#list.cards .row { display: flex; flex-direction: column; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
#list.cards .row .open { grid-template-columns: 1fr; padding: 0 0 6px; gap: 6px; }
#list.cards .thumb { width: 100%; border-radius: 0; }
#list.cards .row .txt { padding: 0 10px; }
#list.cards .ra { position: absolute; top: 4px; right: 4px; background: color-mix(in srgb, var(--surface) 88%, transparent); border-radius: var(--r); }
.sentinel { height: 1px; }
.empty { color: var(--text-2); text-align: center; padding: 2.5em 1em; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.empty svg.big { width: 56px; height: 56px; color: var(--accent); }

/* ---- reader ---- */
.rbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: nowrap; }
.rbar .grow { flex: 1; min-width: 0; }
.rbar .ttlbar { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.article { max-width: 46em; margin: 0 auto; padding: 18px 18px 60px; display: flex; flex-direction: column; gap: 16px; font-size: calc(1.06em * var(--reader-scale)); }
.article h1 { font-size: 1.65em; line-height: 1.2; overflow-wrap: anywhere; }
.article .ameta { color: var(--text-2); font-size: .85em; display: flex; flex-wrap: wrap; gap: .2em .8em; }
.hero { border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.hero img { display: block; width: 100%; max-height: min(52vh, 520px); object-fit: contain; }
.content { line-height: 1.68; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: .9em; }
.content img { max-width: 100%; height: auto; border-radius: 6px; }
.content blockquote { padding: .6em 1em; border-left: 4px solid var(--accent); background: var(--surface-2); border-radius: 0 6px 6px 0; }
.content pre { overflow: auto; padding: .8em; background: var(--surface-2); border-radius: 6px; font-size: .88em; }
.content ul, .content ol { padding-left: 1.4em; }
.content h2, .content h3, .content h4 { line-height: 1.3; margin-top: .4em; }
.content table { border-collapse: collapse; display: block; overflow-x: auto; } .content td, .content th { border: 1px solid var(--line); padding: .3em .5em; }
.media-list { display: flex; flex-direction: column; gap: 8px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.mrow .info { flex: 1 1 0; min-width: 0; } .mrow .info small { display: block; overflow-wrap: anywhere; } .mrow .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mrow .info small { color: var(--text-2); }
.vbox { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--r); overflow: hidden; }
.vbox video, .vbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.vbox.portrait { aspect-ratio: 9 / 16; max-height: 70vh; width: auto; align-self: center; }
.vposter { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 0; background: #000 center / cover no-repeat; color: #fff; }
.vposter .big { width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; }
.vposter .big svg { width: 38px; height: 38px; }
.tags-edit { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.pill button { border: 0; background: none; cursor: pointer; min-height: 36px; padding: 0 .7em; font-size: .88em; font-weight: 600; }
.pill button + button { border-left: 1px solid var(--line); padding: 0 .5em; color: var(--bad); }
.addtag { display: flex; gap: 6px; } .addtag input { flex: 1; min-width: 0; }
.reader-empty { margin: auto; color: var(--text-3); text-align: center; padding: 2em; max-width: 26em; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.reader-empty svg.big { width: 56px; height: 56px; }
kbd { font: .85em ui-monospace, Menlo, Consolas, monospace; padding: 0 .35em; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface-2); }

/* ---- mini player ---- */
#player { position: relative; display: flex; align-items: center; gap: 6px; padding: 8px calc(8px + var(--safe-r)) calc(6px + var(--safe-b)) calc(8px + var(--safe-l)); background: var(--surface); border-top: 1px solid var(--line-strong); }
#player .art { position: relative; width: 46px; height: 46px; border-radius: 6px; overflow: hidden; background: var(--ph, var(--surface-2)); flex: none; }
#player .titles { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: none; border: 0; cursor: pointer; padding: 0 4px; min-height: var(--tap); justify-content: center; }
#player .titles b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95em; }
#player .titles small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-size: .8em; font-variant-numeric: tabular-nums; }
#player .btn { border-color: transparent; background: transparent; }
#player .btn.play { background: var(--accent); color: var(--on-accent); border-radius: 50%; }
#player.compact .skip { display: none; }
.seek { position: absolute; left: 0; right: 0; top: -9px; height: 18px; margin: 0; cursor: pointer; background: transparent; -webkit-appearance: none; appearance: none; }
.seek::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); border-radius: 2px; }
.seek::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.seek::-moz-range-track { height: 4px; background: var(--line); border-radius: 2px; } .seek::-moz-range-progress { height: 4px; background: var(--accent); }
.seek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.seek.big { position: static; height: 34px; width: 100%; }
.seek.big::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; } .seek.big::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -9px; }
/* now playing */
.np { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.np .art { position: relative; width: min(100%, 280px, 26vh); aspect-ratio: 1 / 1; align-self: center; border-radius: 12px; overflow: hidden; background: var(--ph, var(--surface-2)); }
.np h3 { font-size: 1.1em; text-align: center; overflow-wrap: anywhere; } .np .feedname { text-align: center; color: var(--text-2); font-size: .9em; margin-top: -10px; }
.np .times { display: flex; justify-content: space-between; color: var(--text-2); font-variant-numeric: tabular-nums; font-size: .9em; margin-top: -8px; }
.transport { display: flex; justify-content: center; align-items: center; gap: 14px; }
.transport .btn { min-width: 60px; min-height: 60px; border-radius: 50%; flex-direction: column; gap: 0; font-size: .8em; }
.transport .btn.play { min-width: 76px; min-height: 76px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.transport .btn.play svg { width: 34px; height: 34px; }
.cue { display: flex; flex-direction: column; gap: 6px; }
.cue-track { position: relative; height: 58px; border-radius: 29px; background: var(--surface-2); border: 1px solid var(--line); touch-action: none; }
.cue-track::before { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 2px; background: var(--line-strong); }
.cue-track .lbl { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: .8em; pointer-events: none; }
.cue-track .lbl.l { left: 16px; } .cue-track .lbl.r { right: 16px; }
.cue-btn { position: absolute; left: 50%; top: 50%; transform: translate(calc(-50% + var(--dx, 0px)), -50%); width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--accent); background: var(--surface);
  display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-weight: 700; font-size: .8em; font-variant-numeric: tabular-nums; color: var(--text); }
.cue-btn.dragging { background: var(--accent); color: var(--on-accent); cursor: grabbing; }
.speeds { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.speeds .btn { min-width: 56px; padding: 0 .6em; }
.np .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* ---- sheets (history-backed layers) ---- */
#sheets { position: fixed; inset: 0; z-index: 1000; display: none; height: var(--app-h); }
#sheets.on { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.55); }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 16px)); max-height: calc(var(--app-h) - 16px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,.35); overflow: hidden; }
@media (max-width: 760px) { .sheet { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; border-radius: 16px 16px 0 0; max-height: calc(var(--app-h) - 24px - var(--safe-t)); padding-bottom: var(--safe-b); } }
.sheet.full { inset: 0; left: 0; top: 0; right: 0; bottom: 0; transform: none; width: 100%; height: var(--app-h); max-height: none; border-radius: 0; padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
.s-head { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.s-head h2 { flex: 1; min-width: 0; font-size: 1.1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-body { overflow-y: auto; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet.full .s-body { flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; } .field > label, .field > .lab { font-weight: 650; font-size: .92em; }
.help { color: var(--text-2); font-size: .85em; }
.inp, select.inp { min-height: var(--tap); padding: 0 .75em; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); width: 100%; }
.inp:focus { border-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg .btn { flex: 1; border: 0; border-radius: 0; border-right: 1px solid var(--line); min-width: 0; padding: 0 .5em; }
.seg .btn:last-child { border-right: 0; }
.check { display: flex; align-items: center; gap: .7em; min-height: var(--tap); cursor: pointer; } .check input { width: 1.3em; height: 1.3em; accent-color: var(--accent); }
.navlist { display: flex; flex-direction: column; gap: 6px; } .navlist .btn { justify-content: space-between; } .navlist .btn .sub { color: var(--text-2); font-weight: 500; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .bar .grow { flex: 1; }
.togglelist { display: flex; flex-wrap: wrap; gap: 6px; } .togglelist .btn { min-height: 40px; border-radius: 999px; padding: 0 .9em; font-size: .88em; }
.subrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.subrow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .subrow small { color: var(--text-2); display: block; overflow-wrap: anywhere; }
.subrow small.err { color: var(--bad); } .subrow .acts { display: flex; gap: 4px; }
.subrow.off b { color: var(--text-3); text-decoration: line-through; }
.grp { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); font-weight: 700; margin-top: 6px; }
.prose { display: flex; flex-direction: column; gap: 10px; line-height: 1.55; } .prose h3 { font-size: 1em; margin-top: 6px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: .92em; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + var(--safe-b)); z-index: 1100; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, 94vw); }
.toast { background: var(--text); color: var(--bg); padding: .55em 1em; border-radius: var(--r); box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; gap: .6em; align-items: center; pointer-events: auto; }
.toast.error { background: var(--bad); color: #fff; }
.toast .btn { min-height: 36px; background: transparent; color: inherit; border-color: currentColor; }
/* full screen (from feedcycle-fullscreen.css): use the whole display */
:fullscreen body, :-webkit-full-screen body, ::backdrop { padding: 0 !important; margin: 0 !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (forced-colors: active) { .btn, .row, .sheet, #player, #top { border: 1px solid ButtonText; } :focus-visible { outline: 2px solid Highlight; } }

<body>
<div id="app">
  <header id="top">
    <button class="btn ghost" id="home" type="button" aria-label="Feed Cycle: show all articles" title="All articles"></button>
    <label class="searchbox"><span id="q-icon" aria-hidden="true"></span><span class="sr">Search articles</span>
      <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
      <button class="clear" id="q-clear" type="button" aria-label="Clear search" hidden></button></label>
    <button class="btn icon ghost" id="filter-btn" type="button" aria-label="Filter and sort" title="Filter and sort"><span class="badge" hidden></span></button>
    <button class="btn icon ghost" id="refresh-btn" type="button" aria-label="Refresh all feeds" title="Refresh"></button>
    <button class="btn icon ghost" id="settings-btn" type="button" aria-label="Settings" title="Settings"></button>
    <div id="refresh-bar" aria-hidden="true"></div>
    <span class="sr" id="refresh-live" aria-live="polite"></span>
  </header>
  <main id="main">
    <section id="list-pane" aria-label="Articles">
      <div id="scroller" style="position:relative">
        <div id="newpill" hidden><button class="btn primary" type="button"></button></div>
        <div class="lhead" id="lhead"></div>
        <div id="list" role="feed" aria-label="Articles"></div>
      </div>
    </section>
    <section id="reader-pane" aria-label="Article"></section>
  </main>
  <footer id="player" hidden aria-label="Player">
    <input class="seek" id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Position" />
    <span class="art" id="pl-art" aria-hidden="true"></span>
    <button class="titles" id="pl-titles" type="button" aria-label="Open Now playing"><b id="pl-title"></b><small id="pl-sub"></small></button>
    <button class="btn icon skip" id="pl-rew" type="button" aria-label="Back 15 seconds" title="Back 15 s"></button>
    <button class="btn icon play" id="pl-play" type="button" aria-label="Play"></button>
    <button class="btn icon skip" id="pl-fwd" type="button" aria-label="Forward 30 seconds" title="Forward 30 s"></button>
    <button class="btn icon" id="pl-more" type="button" aria-label="Open Now playing" title="Now playing"></button>
  </footer>
</div>
<div id="sheets"><div class="backdrop"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<input id="opmlFile" type="file" accept=".opml,.xml,text/xml,application/xml" hidden />
<script>
(function(){
'use strict';
// =============================================================================
// §ENGINE  (from Feed Cycle 2, feedcycle.js; patches marked [FC3])
// =============================================================================

// ---- settings, proxies, cache fetch, rate limits, state ----
  const VERSION = '3.0.0';  // [FC3]
  const LS_KEY = 'feedcycle-v2';
  const DEBUG = false; // Set true for verbose console output
  const DEFAULTS = { theme:'system', feeds:[], categories:[], lastFetch:{}, lastFetchUrl:{}, settings:{ refreshMinutes:30, cacheMaxAgeMinutes:60, corsProxy:'' }, read:{}, favorites:{}, tags:{}, autoTags:{}, proxyScores:{}, proxyScoresResetAt:0, feedRateLimits:{}, lastFetchAttempt:{}, feed404Counts:{} }; // posts ephemeral + tags mapping postId -> [tag]
  // Quiet logging - only shows in console when DEBUG is true
  const dbg = (...args) => { if(DEBUG) console.log('[FeedCycle]', ...args); };
  // state will be loaded after proxy scoring utilities are defined
  let state; // defer assignment
  let posts = {}; // id -> post (ephemeral)
  let lastFilteredPosts = [];
  let lastRenderedCount = 0;
  let pendingListRefresh = false;
  let isInitialLoading = true; // true until first hydration/refresh completes
  const INITIAL_RENDER_COUNT = 120;
  const CACHE_MAX_AGE_DAYS = 30; // prune cache entries older than this
  const CHUNK_SIZE = 120;

  // ---------- Proxy & Caching (ported/minimal from v1) ----------
  const PROXIES = [
    // AllOrigins: use JSON endpoint (better CORS reliability) and unwrap via maybeExtractXmlFromJson
    { name: 'AllOrigins', kind: 'param-enc', base: 'https://api.allorigins.win/get?url=' },
    { name: 'corsproxy.io', kind: 'param-enc', base: 'https://corsproxy.io/?url=' },
    { name: 'CodeTabs', kind: 'param-enc', base: 'https://api.codetabs.com/v1/proxy?quest=' }
  ];
  const proxyStats = new Map(); // name -> {success, fail, lastSuccess, lastFail, score}
  const proxyTempDisabledUntil = new Map(); // name -> ts
  const PROXY_DISABLE_MS = 10*60*1000;
  const FETCH_TIMEOUT_MS = 12000;
  const CACHE_NAME = 'feedcycle-cache-v2';
  let forceNetwork = false;  // [FC3] a refresh you ask for goes to the network instead of reusing the cached copy
  const RATE_LIMIT_BACKOFF_BASE_MS = 60*1000;
  const RATE_LIMIT_BACKOFF_MAX_MS = 30*60*1000;
  const feedRateLimit = new Map(); // feedId -> { attempt, until, delay }

  function hydrateFeedRateLimitsFromState(){
    if(!state?.feedRateLimits) return;
    Object.entries(state.feedRateLimits).forEach(([fid, rec])=>{
      if(!fid || !rec || typeof rec !== 'object') return;
      if(feedRateLimit.has(fid)) return;
      feedRateLimit.set(fid, { attempt: rec.attempt||0, until: rec.until||0, delay: rec.delay||0 });
    });
  }

  // Enhanced proxy scoring with decay and weighted penalties
  const PROXY_FAIL_WEIGHT = 3;
  const PROXY_SUCCESS_WEIGHT = 1;
  const PROXY_DECAY_MS = 30*60*1000; // 30 minutes
  const PROXY_MIN_SAMPLE = 2; // dampen volatility for very small sample sizes
  function recalcProxyScore(name){
    const now = Date.now();
    const s = proxyStats.get(name) || {success:0, fail:0, lastSuccess:0, lastFail:0, score:0};
    const decay = (t)=> t? Math.exp(- (now - t) / PROXY_DECAY_MS) : 1;
    const successW = s.success * decay(s.lastSuccess);
    const failW = s.fail * decay(s.lastFail);
    const raw = (successW * PROXY_SUCCESS_WEIGHT) - (failW * PROXY_FAIL_WEIGHT);
    const attempts = s.success + s.fail;
    const confidence = attempts < PROXY_MIN_SAMPLE ? 0.25 : 1;
    s.score = raw * confidence;
    proxyStats.set(name, s);
    return s.score;
  }
  function recordProxyResult(name, ok){
    if(!name) return;
    const s = proxyStats.get(name) || {success:0, fail:0, lastSuccess:0, lastFail:0, score:0};
    if(ok){ s.success += 1; s.lastSuccess = Date.now(); }
    else { s.fail += 1; s.lastFail = Date.now(); }
    proxyStats.set(name, s);
    recalcProxyScore(name);
  }
  function proxyScore(p){ const s = proxyStats.get(p.name); return s? s.score||0 : 0; }

  // Now that proxy machinery exists, load state (hydrating proxy stats) and maybe rebase
  state = loadState();
  function maybeRebaseProxyScores(){
    try{
      const NOW = Date.now();
      const ONE_MONTH_MS = 30*24*60*60*1000; // approximate month
      const last = state.proxyScoresResetAt || 0;
      if(NOW - last < ONE_MONTH_MS) return; // not yet time
      const names = PROXIES.map(p=>p.name);
      names.forEach(n=>{ if(!proxyStats.has(n)) proxyStats.set(n,{success:0,fail:0,lastSuccess:0,lastFail:0,score:0}); recalcProxyScore(n); });
      const ordered = names.map(n=>({name:n, s: proxyStats.get(n)||{}})).sort((a,b)=> (b.s.score||0) - (a.s.score||0));
      const m = ordered.length || 1;
      const now = Date.now();
      ordered.forEach((entry, idx)=>{
        const syntheticSuccess = (m - idx) + 1; // ensures descending, >=2 successes for top
        const stats = { success: syntheticSuccess, fail:0, lastSuccess: now, lastFail:0, score:0 };
        proxyStats.set(entry.name, stats);
        recalcProxyScore(entry.name);
      });
      state.proxyScoresResetAt = NOW;
      saveState();
      dbg('Proxy scores rebased (monthly normalization)');
    }catch(e){ dbg('Proxy score rebase skipped', e); }
  }
  maybeRebaseProxyScores();
  function buildProxiedUrl(targetUrl, proxySpec){
    if(typeof proxySpec === 'string'){
      const p = proxySpec.trim();
      if(!p) return targetUrl;
      if(p.includes('%s')) return p.replace('%s', encodeURIComponent(targetUrl));
      if(/[=]$/.test(p) || /[?&]url=$/i.test(p)) return p + encodeURIComponent(targetUrl);
      return p + targetUrl;
    }
    const { kind, base, name } = proxySpec;
    if(kind==='param-enc'){
      let u = base + encodeURIComponent(targetUrl);
      if(name==='AllOrigins') u += `&cache=${Date.now()}`; // bust any stale caching quirks
      return u;
    }
    if(kind==='prefix'){
      let clean = targetUrl;
      if(!/^https?:/i.test(clean)){
        try{ clean = new URL(clean, location.href).href; }catch{}
      }
      return base + clean.replace(/^https?:\/\//i, (match)=> match.toLowerCase() );
    }
    return targetUrl;
  }
  function getProxyCandidates(){
    const manual = state.settings.corsProxy?.trim();
    if(manual){
      // When a manual proxy is configured, only use that (plus the direct fallback later)
      return [manual];
    }
    const now = Date.now();
    let active = PROXIES.filter(p=> !(proxyTempDisabledUntil.get(p.name)>now));
    // If all public proxies are temporarily disabled, fall back to the full set instead of going direct.
    if(!active.length) active = [...PROXIES];
    // Ensure each has an initialized score object (prevents NaN sorting jitter)
    for(const p of active){ if(!proxyStats.has(p.name)) proxyStats.set(p.name, {success:0,fail:0,lastSuccess:0,lastFail:0,score:0}); }
    // Order by score (descending)
    active.sort((a,b)=> proxyScore(b)-proxyScore(a));
    return active;
  }
  async function fetchWithCache(url){
    const maxAge = clamp((state.settings.cacheMaxAgeMinutes||60)*60*1000, 5*60*1000, 24*60*60*1000);
    try{
      if(typeof caches !== 'undefined'){
        const cache = await caches.open(CACHE_NAME);
        const req = new Request(url);
        const hit = await cache.match(req);
        if(hit && !forceNetwork){
          const date = new Date(hit.headers.get('date')||0).getTime();
          if(Date.now()-date < maxAge){ return hit.text(); }
        }
        const controller = new AbortController();
        const to = setTimeout(()=> controller.abort(), FETCH_TIMEOUT_MS);
        let res;
        try{ res = await fetch(req, { signal: controller.signal }); }
        finally{ clearTimeout(to); }
        let text = '';
        try{ text = await res.text(); }catch{}
        if(res.ok){
          const stored = new Response(text, { headers:{ 'content-type': res.headers.get('content-type')||'text/xml; charset=utf-8', 'date': new Date().toUTCString() }});
          try{ await cache.put(req, stored); }catch{}
          return text;
        }
        if(hit) return hit.text();
        const snippet = (text||'').slice(0,240).replace(/\s+/g,' ').trim();
        const detail = snippet ? ` (${snippet})` : '';
        const httpErr = new Error(`HTTP ${res.status} ${res.statusText||''}${detail} @ ${url}`.trim()); httpErr.http = true; throw httpErr;  // [FC3] an HTTP error is an answer: do not ask the server again
      }
    }catch(e){ if(e && e.http) throw e; /* Cache API trouble: fall through to a plain fetch below */ }
    const controller = new AbortController();
    const to = setTimeout(()=> controller.abort(), FETCH_TIMEOUT_MS);
    let res; let text='';
    try{ res = await fetch(url, { signal: controller.signal }); }
    finally { clearTimeout(to); }
    try{ text = await res.text(); }catch{}
    if(!res.ok){
      const snippet = (text||'').slice(0,240).replace(/\s+/g,' ').trim();
      const detail = snippet ? ` (${snippet})` : '';
      throw new Error(`HTTP ${res.status} ${res.statusText||''}${detail} @ ${url}`.trim());
    }
    return text;
  }
  function xmlHasParserError(xml){
    try{ const doc = new DOMParser().parseFromString(xml,'text/xml'); return !!doc.querySelector('parsererror'); }catch{ return true; }
  }
  function maybeExtractXmlFromJson(text){
    try{ const o = JSON.parse(text); if(o && typeof o.contents==='string') return o.contents; }catch{}
    return null;
  }
  function addCacheBuster(u){ try{ return u + (u.includes('?')?'&':'?') + 't=' + Date.now(); }catch{ return u; } }

  function getFeedRateLimit(feedId){
    if(!feedId) return null;
    const entry = feedRateLimit.get(feedId);
    if(!entry) return null;
    if(entry.until <= Date.now()){
      feedRateLimit.delete(feedId);
      if(state.feedRateLimits) delete state.feedRateLimits[feedId];
      saveState();
      return null;
    }
    return { ...entry, retryIn: Math.max(0, entry.until - Date.now()) };
  }
  function applyFeedRateLimit(feed){
    const feedId = typeof feed === 'string' ? feed : feed?.id;
    if(!feedId) return null;
    const now = Date.now();
    const existing = feedRateLimit.get(feedId);
    let attempt = existing? existing.attempt : 0;
    if(existing && existing.until <= now){ attempt = 0; }
    attempt += 1;
    const delay = Math.min(RATE_LIMIT_BACKOFF_BASE_MS * (2 ** (attempt - 1)), RATE_LIMIT_BACKOFF_MAX_MS);
    const entry = { attempt, until: now + delay, delay };
    feedRateLimit.set(feedId, entry);
    state.feedRateLimits = state.feedRateLimits || {};
    state.feedRateLimits[feedId] = entry;
    state.lastFetchAttempt = state.lastFetchAttempt || {};
    state.lastFetchAttempt[feedId] = now;
    state.lastFetch[feedId] = now;
    if(feed && typeof feed === 'object'){
      const current = feed.refreshMinutes || state.settings.refreshMinutes || 30;
      const nextMinutes = clamp(current + 5, 5, 24*60);
      feed.refreshMinutes = nextMinutes;
    }
    saveState();
    return { ...entry, retryIn: delay };
  }
  function clearFeedRateLimit(feedId){
    if(!feedId) return;
    let changed = false;
    if(feedRateLimit.delete(feedId)) changed = true;
    if(state.feedRateLimits && feedId in state.feedRateLimits){
      delete state.feedRateLimits[feedId];
      changed = true;
    }
    if(changed) saveState();
  }

  function isFeedEnabled(feed){ return feed?.enabled !== false; }
  function resetFeed404(feedId){
    if(!feedId) return;
    if(state.feed404Counts && state.feed404Counts[feedId]){
      delete state.feed404Counts[feedId];
      saveState();
    }
  }
  function incrementFeed404(feed){
    const feedId = typeof feed==='string'? feed : feed?.id;
    if(!feedId) return 0;
    state.feed404Counts = state.feed404Counts || {};
    const next = (state.feed404Counts[feedId]||0)+1;
    state.feed404Counts[feedId] = next;
    if(next >= 3){
      const f = state.feeds.find(x=> x.id===feedId);
      if(f){ f.enabled = false; }
    }
    saveState();
    return next;
  }

  // ---------- Utilities ----------
  const $ = sel=> document.querySelector(sel);
  const byId = id=> document.getElementById(id);
  const el = (tag, props={}, ...kids)=>{ const n=document.createElement(tag); for(const [k,v] of Object.entries(props)){ if(k==='class') n.className=v; else if(k==='html') n.innerHTML=v; else if(k.startsWith('on')&&typeof v==='function') n.addEventListener(k.substring(2),v); else if(v===true) n.setAttribute(k,''); else if(v!==false && v!=null) n.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; if(Array.isArray(k)) n.append(...k); else if(k.nodeType) n.append(k); else n.append(String(k)); } return n; };
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgIcon(useHref){
    const svg = document.createElementNS(SVG_NS,'svg');
    svg.setAttribute('class','icon');
    svg.setAttribute('aria-hidden','true');
    const use = document.createElementNS(SVG_NS,'use');
    use.setAttribute('href', useHref);
    svg.appendChild(use);
    return svg;
  }
  const hashId = s=>{ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(36); };
  const clamp = (n,a,b)=> Math.max(a, Math.min(b,n));

  function saveState(){
    try{
      // Serialize proxyStats lightweight: only keep scalar fields
      if(proxyStats && typeof proxyStats.forEach==='function'){
        const out = {};
        proxyStats.forEach((v,k)=>{ out[k] = { success:v.success||0, fail:v.fail||0, lastSuccess:v.lastSuccess||0, lastFail:v.lastFail||0, score:v.score||0 }; });
        state.proxyScores = out;
      }
      if(feedRateLimit && typeof feedRateLimit.forEach==='function'){
        const out = {};
        feedRateLimit.forEach((v,k)=>{ out[k] = { attempt:v.attempt||0, until:v.until||0, delay:v.delay||0 }; });
        state.feedRateLimits = out;
      }
      state.lastFetchAttempt = state.lastFetchAttempt || {};
      state.feed404Counts = state.feed404Counts || {};
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }catch(e){ console.warn('Save failed', e);} }
  function loadState(){
    try{
      const raw = JSON.parse(localStorage.getItem(LS_KEY)||'{}');
      const merged = Object.assign({}, DEFAULTS, raw);
      // hydrate proxyStats
      if(merged.proxyScores){
        Object.entries(merged.proxyScores).forEach(([name, s])=>{
          if(!s || typeof s !== 'object') return;
          proxyStats.set(name, { success:s.success||0, fail:s.fail||0, lastSuccess:s.lastSuccess||0, lastFail:s.lastFail||0, score:s.score||0 });
        });
      }
      if(merged.feedRateLimits){
        Object.entries(merged.feedRateLimits).forEach(([fid, rec])=>{
          if(!rec || typeof rec !== 'object') return;
          feedRateLimit.set(fid, { attempt: rec.attempt||0, until: rec.until||0, delay: rec.delay||0 });
        });
      }
      merged.lastFetchAttempt = merged.lastFetchAttempt || {};
      merged.feed404Counts = merged.feed404Counts && typeof merged.feed404Counts==='object' ? merged.feed404Counts : {};
      merged.feeds = (merged.feeds||[]).map(f=> ({ ...f, enabled: f?.enabled !== false }));
      return merged;
    }catch{ return {...DEFAULTS}; }
  }

// ---- filters ----
  const SORT_DEFAULT = 'published-desc';
  const SORT_OPTIONS = new Set(['published-desc','published-asc','title-asc','title-desc','feed-asc','feed-desc','host-asc','host-desc','favorite','unread']);
  const MEDIA_AUTO_TAGS = ['audio','video'];
  const FILTER_DEFAULTS = Object.freeze({ q:'', subscription:'', category:'', tag:'', tagList:[], unread:false, fav:false, readState:'', dateFrom:'', dateTo:'', sort: SORT_DEFAULT });
  const currentFilters = { ...FILTER_DEFAULTS, tagList: [] }; // mutable runtime copy

// ---- filtered and sorted posts ----
  function getFilteredPosts(){
    const feedMap = new Map(state.feeds.map(f=> [f.id,f]));
    const hostCache = new Map();
    const getHost = (post)=>{
      if(hostCache.has(post.id)) return hostCache.get(post.id);
      const host = safeHost(post.link||'') || '';
      hostCache.set(post.id, host);
      return host;
    };
    const getFeedTitle = (feedId)=>{
      const feed = feedMap.get(feedId);
      return (feed?.title || feed?.url || '').trim();
    };
    const getPublishedTime = (post)=>{
      const ts = new Date(post.published||post.updated||0).getTime();
      return isNaN(ts)? 0 : ts;
    };
    const fallbackCompare = (a,b)=>{
      const diff = getPublishedTime(b) - getPublishedTime(a);
      if(diff) return diff;
      const titleDiff = (a.title||'').localeCompare(b.title||'', undefined, { sensitivity:'base', numeric:true });
      if(titleDiff) return titleDiff;
      return (a.id||'').localeCompare(b.id||'');
    };
    let arr = Object.values(posts);
    if(currentFilters.subscription){
      arr = arr.filter(p=> p.feedId === currentFilters.subscription);
    }
    if(currentFilters.category){
      arr = arr.filter(p=> (feedMap.get(p.feedId)?.category||'') === currentFilters.category);
    }
    if(currentFilters.unread){

      arr = arr.filter(p=> !!state.favorites[p.id]);  // [FC3]
    }
    if(currentFilters.readState === 'read'){
      arr = arr.filter(p=> !!state.read[p.id]);  // [FC3]
    }
    if(currentFilters.readState === 'unread'){
      arr = arr.filter(p=> !state.read[p.id]);
    }
    const tagList = (currentFilters.tagList&&currentFilters.tagList.length)? currentFilters.tagList : [];
    if(tagList.length){
      arr = arr.filter(p=>{
        const tags = state.tags[p.id]||[];
        return tagList.some(t=> tags.includes(t));
      });
    } else if(currentFilters.tag){
      arr = arr.filter(p=> (state.tags[p.id]||[]).includes(currentFilters.tag));
    }
    const fromTime = currentFilters.dateFrom ? new Date(currentFilters.dateFrom).getTime() : NaN;
    const toTime = currentFilters.dateTo ? new Date(currentFilters.dateTo).getTime() : NaN;
    if(!isNaN(fromTime)){
      arr = arr.filter(p=>{
        const tp = new Date(p.published||p.updated||0).getTime();

          if(diff) return diff;
          break;
        }
        case 'title-asc':
        case 'title-desc':{
          const dir = sortKey==='title-asc'? 1 : -1;

        case 'feed-desc':{
          const dir = sortKey==='feed-asc'? 1 : -1;
          const diff = getFeedTitle(a.feedId).localeCompare(getFeedTitle(b.feedId), undefined, { sensitivity:'base', numeric:true });
          if(diff) return dir * diff;
          break;
        }
        case 'host-asc':
        case 'host-desc':{
          const dir = sortKey==='host-asc'? 1 : -1;
          const diff = getHost(a).localeCompare(getHost(b), undefined, { sensitivity:'base', numeric:true });

          break;
        }
        case 'favorite':{
          const diff = Number(b.favorite) - Number(a.favorite);
          if(diff) return diff;
          break;
        }
        case 'unread':{
          if(a.read !== b.read) return a.read ? 1 : -1;
          break;
        }
        case 'published-desc':
        default:

    const isHttp = /^http:\/\//i.test(original);
    const isHttps = /^https:\/\//i.test(original);
    const manual = state?.settings?.corsProxy?.trim();
    if(manual){
      try{ add(buildProxiedUrl(original, manual)); }
      catch{ /* ignore malformed manual proxy */ }
      add(original); // allow direct as last resort
      return candidates;
    }
    if(isHttp){ add('https://'+original.slice(7)); }
    add(original);

        mediaProxyBuilders.push(u=>`https://cors.isomorphic-git.org/${u}`);

        try{ add(buildProxiedUrl(original, spec)); }
        catch{ /* ignore */ }

  function formatBytes(bytes){
    if(!(bytes>0)) return '';
    const units = ['B','KB','MB','GB','TB'];
    let value = bytes;
    let unitIdx = 0;
    while(value>=1024 && unitIdx < units.length-1){ value/=1024; unitIdx++; }
    let str;
    if(unitIdx===0){ str = Math.round(value).toString(); }
    else if(value>=100){ str = value.toFixed(0); }
    else if(value>=10){ str = value.toFixed(1); }

    const m = Math.floor((total%3600)/60);
    const s = total%60;
    if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  function applyMediaAutoTags(post){
    if(!post || !post.id) return false;
    if(!state.autoTags) state.autoTags = {};
    const existing = Array.isArray(state.tags[post.id]) ? [...state.tags[post.id]] : [];
    const tagsSet = new Set(existing);
    const prevAuto = new Set(Array.isArray(state.autoTags[post.id]) ? state.autoTags[post.id] : []);

  const mediaList = Array.isArray(post.media) ? post.media : [];
  const hasAudio = mediaList.some(m=> m?.kind==='audio');
  const hasVideo = mediaList.some(m=> m?.kind==='video' || m?.kind==='youtube');  // [FC3]
  if(hasAudio && MEDIA_AUTO_TAGS.includes('audio')) desired.add('audio');
  if(hasVideo && MEDIA_AUTO_TAGS.includes('video')) desired.add('video');

    let changed = false;
    desired.forEach(tag=>{
      if(!tagsSet.has(tag)){
        tagsSet.add(tag);
        changed = true;
      }
    });
    prevAuto.forEach(tag=>{
      if(!desired.has(tag) && tagsSet.has(tag)){
        tagsSet.delete(tag);
        changed = true;
      }
    });

    const finalTags = [...tagsSet].filter(Boolean);
    if(finalTags.length){ state.tags[post.id] = finalTags; }
    else { delete state.tags[post.id]; }

    if(desired.size){ state.autoTags[post.id] = [...desired]; }
    else { delete state.autoTags[post.id]; }

    return changed;
  }

    let deleted = 0;
    // Normalize the feed URL for matching

  function pickImage(post){
    // Priority 1: iTunes image (for podcasts, usually high quality)
    if(post.images?.length) {

      if(itunesImg) return itunesImg.url;
    }

    // Priority 2: Media content/thumbnail with size preference (larger is better)
    if(post.images?.length) {
      const mediaImages = post.images.filter(img => 
        img.source === 'media:content' || img.source === 'media:thumbnail'
      );

      if(m){ 
        const s=safeImageUrl(m.url);

    if(post.images?.length) {

      if(channelItunesImg) return channelItunesImg.url;
    }

    if(post.images?.length) {

        img.source !== 'itunes:image' && 
        img.source !== 'media:content' && 
        img.source !== 'media:thumbnail' &&
        !img.source.startsWith('channel:')

      if(otherItemImages.length) return otherItemImages[0].url;
    }

    if(post.images?.length) {
      const channelImg = post.images.find(img => img.source === 'channel:image');
      if(channelImg) return channelImg.url;
    }

    if(post.ogImage) {

      if(s) return s;
    }

    return null;

      else if(type==='squares') defs=`<pattern id="ph${seed}" width="${size}" height="${size}" patternUnits="userSpaceOnUse"><rect width="100%" height="100%" fill="${bg}"/><rect x="10" y="10" width="${size/2}" height="${size/2}" fill="${fg}" opacity=".8"/></pattern>`;
      else if(type==='tri') defs=`<pattern id="ph${seed}" width="${size}" height="${size}" patternUnits="userSpaceOnUse"><rect width="100%" height="100%" fill="${bg}"/><polygon points="0,${size} ${size/2},0 ${size},${size}" fill="${fg}" opacity=".8"/></pattern>`;
      else { const angle=(seed%60)-30; defs=`<pattern id="ph${seed}" width="${size}" height="${size}" patternUnits="userSpaceOnUse" patternTransform="rotate(${angle})"><rect width="100%" height="100%" fill="${bg}"/><rect y="0" width="${size/3}" height="${size}" fill="${fg}"/></pattern>`; }
      return `<svg class="ph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="placeholder image"><defs>${defs}</defs><rect width="100%" height="100%" fill="url(#ph${seed})"/></svg>`;
    }catch{return ''}
  }

// ---- media extraction ----
  // ---------- Media extraction helpers ----------
  function safeMediaUrl(src){
    try{
      if(!src) return null;
      const u = new URL(src, location.href);
      const prot = (u.protocol||'').toLowerCase();
      if(prot!=='http:' && prot!=='https:' && prot!=='data:' && prot!=='blob:') return null;
      if((prot==='http:'||prot==='https:') && isPrivateHost(u.hostname)) return null;
      return u.href;
    }catch{ return null; }
  }
  const AUDIO_EXTS = ['mp3','m4a','aac','ogg','oga','opus','wav','flac','mka','mpga'];
  const VIDEO_EXTS = ['mp4','m4v','mov','webm','mkv','avi','wmv','ogv'];
  const IMAGE_EXTS = ['jpg','jpeg','png','gif','webp','avif','svg'];
  function classifyMediaKind(type, url, medium){
    const t = (type||'').split(';')[0].trim().toLowerCase();
    let kind = '';
    if(t.startsWith('audio/')) kind='audio';
    else if(t.startsWith('video/')) kind='video';
    else if(t.startsWith('image/')) kind='image';
    else if(medium){
      const m = medium.toLowerCase();
      if(m.includes('audio')) kind='audio';
      else if(m.includes('video')) kind='video';
      else if(m.includes('image')) kind='image';
    }
    if(!kind && url){
      const cleanUrl = url.split('#')[0].split('?')[0];
      const extMatch = /\.([a-z0-9]+)$/i.exec(cleanUrl);
      const ext = extMatch? extMatch[1].toLowerCase() : '';
      if(AUDIO_EXTS.includes(ext)) kind='audio';
      else if(VIDEO_EXTS.includes(ext)) kind='video';
      else if(IMAGE_EXTS.includes(ext)) kind='image';
    }
    if(!kind) kind='file';
    const resolvedType = t || (kind==='audio'? 'audio/mpeg' : kind==='video'? 'video/mp4' : kind==='image'? 'image/jpeg' : '');
    return { kind, type: resolvedType };
  }
  function normalizeMediaEntry(raw){
    const url = safeMediaUrl(raw.url);
    if(!url) return null;
    const { kind, type } = classifyMediaKind(raw.type, url, raw.medium);
    const length = raw.length && /^[0-9]+$/.test(raw.length) ? parseInt(raw.length,10) : null;
    const duration = raw.duration && /^[0-9]+$/.test(raw.duration) ? parseInt(raw.duration,10) : null;
    return {
      url,
      type: (raw.type||'').split(';')[0].trim().toLowerCase() || type,
      kind,
      length,
      duration,
      title: raw.title||raw.label||'',
      medium: raw.medium||''
    };
  }
  function extractImageUrls(item){
    const images = [];
    const seen = new Set();
    const addImage = (url, source, width, height) => {
      if(!url || seen.has(url)) return;
      const safeUrl = safeImageUrl(url);
      if(!safeUrl) return;
      seen.add(url);
      images.push({ url: safeUrl, source, width: width ? parseInt(width) : null, height: height ? parseInt(height) : null });
    };

    // Try multiple approaches for namespace handling since different browsers/parsers handle it differently
    
    // iTunes namespace images (podcasts) - try both approaches
    let itunesImage = item.querySelector('itunes\\:image') || item.getElementsByTagName('itunes:image')[0];
    if(itunesImage) {
      const href = itunesImage.getAttribute('href');
      if(href) addImage(href, 'itunes:image');
    }

    // Media namespace thumbnails (BBC, Yahoo, etc.) - try both approaches
    let mediaThumbs = item.querySelectorAll('media\\:thumbnail');
    if(mediaThumbs.length === 0) {
      mediaThumbs = item.getElementsByTagName('media:thumbnail');
    }
    Array.from(mediaThumbs).forEach(thumb => {
      const url = thumb.getAttribute('url');
      const width = thumb.getAttribute('width');
      const height = thumb.getAttribute('height');
      if(url) addImage(url, 'media:thumbnail', width, height);
    });

    // Media namespace content with image types - try both approaches
    let mediaContent = item.querySelectorAll('media\\:content');
    if(mediaContent.length === 0) {
      mediaContent = item.getElementsByTagName('media:content');
    }
    Array.from(mediaContent).forEach(content => {
      const url = content.getAttribute('url');
      const type = content.getAttribute('type');
      const medium = content.getAttribute('medium');
      const width = content.getAttribute('width');
      const height = content.getAttribute('height');
      if(url && (type?.startsWith('image/') || medium === 'image')) {
        addImage(url, 'media:content', width, height);
      }
    });

    // Standard enclosure images
    item.querySelectorAll('enclosure').forEach(enc => {
      const url = enc.getAttribute('url');
      const type = enc.getAttribute('type');
      if(url && type?.startsWith('image/')) {
        addImage(url, 'enclosure');
      }
    });

    // Standard image elements  
    const imageEl = item.querySelector('image url');
    if(imageEl) {
      addImage(imageEl.textContent?.trim(), 'image');
    }

    return images;
  }

  function extractMediaEntries(item){
    const entries = [];
    const seen = new Set();
    const push = raw=>{
      const normal = normalizeMediaEntry(raw);
      if(!normal) return;
      if(seen.has(normal.url)) return;
      seen.add(normal.url);
      entries.push(normal);
    };
    item.querySelectorAll('enclosure').forEach(en=>{
      push({
        url: en.getAttribute('url'),
        type: en.getAttribute('type'),
        length: en.getAttribute('length'),
        title: en.getAttribute('title')||en.getAttribute('label'),
        medium: en.getAttribute('medium')
      });
    });
    item.querySelectorAll('link[rel="enclosure"]').forEach(link=>{
      push({
        url: link.getAttribute('href'),
        type: link.getAttribute('type'),
        length: link.getAttribute('length'),
        title: link.getAttribute('title')||link.getAttribute('label'),
        medium: link.getAttribute('medium')
      });
    });
    item.querySelectorAll('media\\:content, media\\:group > media\\:content, content').forEach(node=>{
      const url = node.getAttribute('url') || node.getAttribute('href') || node.getAttribute('src');
      if(!url) return;
      push({
        url,
        type: node.getAttribute('type'),
        length: node.getAttribute('fileSize')||node.getAttribute('length'),
        duration: node.getAttribute('duration'),
        title: node.getAttribute('label')||node.getAttribute('title'),
        medium: node.getAttribute('medium')
      });
    });
    item.querySelectorAll('audio, video').forEach(node=>{
      const url = node.getAttribute('src');
      if(!url) return;
      push({ url, type: node.getAttribute('type'), medium: node.tagName.toLowerCase(), title: node.getAttribute('title') });
    });
    return entries;
  }

// ---- feed parsing ----
  function parseFeedDocument(doc, feed){
    const isAtom = !!doc.querySelector('feed > entry');
    const items = isAtom? [...doc.querySelectorAll('feed > entry')] : [...doc.querySelectorAll('rss channel item')];
    
    // Extract channel-level images that can be used as fallbacks for individual items
    const channelImages = extractChannelImages(doc);
    
    return items.map(it=>{
      const title = (it.querySelector('title')?.textContent||'').trim();
      // canonical link from RSS/Atom
      let link = isAtom ? (it.querySelector('link[rel="alternate"]')?.getAttribute('href') || it.querySelector('link')?.getAttribute('href') || '') : (it.querySelector('link')?.textContent||'');
      const content = (isAtom ? (it.querySelector('content')?.textContent || it.querySelector('summary')?.textContent || '') : (it.querySelector('description')?.textContent||'')) || mediaDescriptionHtml(it);  // [FC3] YouTube text
      // If link is missing or looks like it merely points to the feed/site, try to find an <a href="..."> inside the content/description
      try{
        const contentHtml = content || '';
        if(!link || (feed && feed.url && safeHost(link) === safeHost(feed.url))){
          // Create a DOMParser to look for the first anchor in the HTML fragment
          const dp = new DOMParser();
          const doc = dp.parseFromString(contentHtml, 'text/html');
          const a = doc.querySelector('a[href]');
          if(a){
            const href = a.getAttribute('href') || '';
            if(href && href.trim()) link = href.trim();
          }
        }
      }catch(e){ /* ignore parse failures and keep existing link */ }
      const guidSrc = isAtom ? (it.querySelector('id')?.textContent || link || title) : (it.querySelector('guid')?.textContent || link || title);
      const id = hashId((feed.id||'')+'|'+guidSrc);
      const published = it.querySelector('pubDate, updated, published')?.textContent||'';
      let media = extractMediaEntries(it);
      // [FC3] YouTube entries become playable (embed) instead of an old Flash link; iTunes durations reach audio
      const ytId = (it.getElementsByTagName('yt:videoId')[0]?.textContent || (/youtube\.com\/watch\?(?:.*&)?v=([\w-]{11})/.exec(link||'')||[])[1] || '').trim();
      if(ytId){ link = 'https://www.youtube.com/watch?v='+ytId; media = media.filter(m=> !/youtube\.com\/v\//.test(m.url)); media.unshift({ url:'https://www.youtube.com/watch?v='+ytId, kind:'youtube', type:'video/youtube', youtubeId: ytId, title:'', length:null, duration:null, medium:'video' }); }
      const itDur = parseItunesDuration(it.getElementsByTagName('itunes:duration')[0]?.textContent);
      if(itDur) media.forEach(m=>{ if(m.kind==='audio' && !m.duration) m.duration = itDur; });
      const images = extractImageUrls(it);
      
      // Combine item-specific images with channel images as fallbacks
      const allImages = [...images, ...channelImages];
      
      return {
        id,
        feedId: feed.id,
        title,
        link,
        content,
        summary: stripHtml(content).slice(0,400),
        published,
        media,
        images: allImages
      };
    });
  }

// ---- Open Graph images, channel images, feed titles ----
  async function extractOpenGraphImage(articleUrl) {
    if (!articleUrl) return null;

    const manualOnlyProxy = !!(state.settings.corsProxy && state.settings.corsProxy.trim());
    const maxAttempts = manualOnlyProxy ? ogFetchLimits.manualMax : ogFetchLimits.defaultMax;
    if (ogFetchState.attempts >= maxAttempts) return null;

    let normalized = articleUrl.split('#')[0];
    try { normalized = new URL(articleUrl, location.href).href.split('#')[0]; }catch{}

    if (ogFetchState.cache.has(normalized)) return ogFetchState.cache.get(normalized);

    const host = safeHost(normalized) || '';
    const until = ogFetchState.hostBackoff.get(host) || 0;
    if (until && Date.now() < until) return null;

    if (ogFetchState.inFlight.has(normalized)) return ogFetchState.inFlight.get(normalized);

    const task = (async ()=>{
      ogFetchState.attempts += 1;
      let html = '';
      let lastErr = null;
      try {
        const candidates = getProxyCandidates();
        const slice = manualOnlyProxy ? 1 : 2; // keep it cheap; manual proxy already chosen
        for (const c of candidates.slice(0, slice)) {
          const proxied = buildProxiedUrl(articleUrl, c);
          try {
            html = await fetchWithCache(proxied);
            if (html) break;
          } catch (e) {
            lastErr = e;
            if (typeof c !== 'string') {
              recordProxyResult(c.name, false);
            }
            const msg = e?.message||'';
            if (!/403|CORS/i.test(msg)) {
              dbg('Open Graph proxy attempt failed:', msg);
            }
          }
        }

        if (!html && !manualOnlyProxy) {
          try {
            html = await fetchWithCache(articleUrl);
          } catch (e) {
            lastErr = e;
          }
        }

        if (!html) {
          if (lastErr && /HTTP 429/.test(lastErr.message||'')) {
            const cooldown = manualOnlyProxy ? ogFetchLimits.manualHostCooldownMs : ogFetchLimits.hostCooldownMs;
            ogFetchState.hostBackoff.set(host, Date.now() + cooldown);
          }
          return null;
        }

        const ogImageMatch = /<meta\s+property\s*=\s*["']og:image["']\s+content\s*=\s*["']([^"']+)["']/i.exec(html);
        if (ogImageMatch) {
          const ogImageUrl = ogImageMatch[1];
          return safeImageUrl(ogImageUrl);
        }
        return null;
      } catch (e) {
        const msg = e?.message||'';
        if (/HTTP 429/.test(msg)) {
          const cooldown = manualOnlyProxy ? ogFetchLimits.manualHostCooldownMs : ogFetchLimits.hostCooldownMs;
          ogFetchState.hostBackoff.set(host, Date.now() + cooldown);
        }
        dbg('Failed to extract Open Graph image from', articleUrl, e);
        return null;
      }
    })();

    ogFetchState.inFlight.set(normalized, task);
    const result = await task.catch(()=>null);
    ogFetchState.cache.set(normalized, result);
    ogFetchState.inFlight.delete(normalized);
    return result;
  }

  function extractChannelImages(doc){
    const images = [];
    const seen = new Set();
    const addImage = (url, source) => {
      if(!url || seen.has(url)) return;
      const safeUrl = safeImageUrl(url);
      if(!safeUrl) return;
      seen.add(url);
      images.push({ url: safeUrl, source });
    };

    const isAtom = !!doc.querySelector('feed > entry');
    const channelSelector = isAtom ? 'feed' : 'channel';

    // Standard RSS/Atom channel image
    const channelImageUrl = doc.querySelector(`${channelSelector} > image > url`);
    if(channelImageUrl) {
      addImage(channelImageUrl.textContent?.trim(), 'channel:image');
    }

    // iTunes channel image - try both selector approaches
    let itunesChannelImage = doc.querySelector(`${channelSelector} > itunes\\:image`) || 
                           doc.querySelector(`${channelSelector}`).getElementsByTagName('itunes:image')[0];
    if(itunesChannelImage) {
      const href = itunesChannelImage.getAttribute('href');
      if(href) addImage(href, 'channel:itunes:image');
    }

    return images;
  }

  function extractFeedTitle(doc){
    const node = doc.querySelector('feed > title') || doc.querySelector('channel > title');
    if(!node) return '';
    const text = node.textContent||'';
    return text.replace(/\s+/g,' ').trim();
  }

// ---- refresh one feed ----
  async function refreshFeed(feed, { force=false, usedProxies=new Set() }={}){
    if(!isFeedEnabled(feed)){
      const err = new Error('Feed disabled');
      err.code = 'DISABLED';
      throw err;
    }
    state.lastFetchAttempt = state.lastFetchAttempt || {};
    state.lastFetchAttempt[feed.id] = Date.now();
    const manualOnlyProxy = !!(state.settings.corsProxy && state.settings.corsProxy.trim());
    const activeRateLimit = getFeedRateLimit(feed.id);
    if(activeRateLimit){
      const err = new Error('Rate limit active');
      err.code = 'RATE_LIMIT';
      err.retryIn = activeRateLimit.retryIn;
      throw err;
    }
    const candidates = getProxyCandidates();
    let xml=''; let lastErr=null; let used=null; let usedUrl=null;
    for(const c of candidates){
      if(typeof c !== 'string'){
        const until = proxyTempDisabledUntil.get(c.name)||0; if(until && Date.now()<until) continue;
      }
      const maxAttempts = manualOnlyProxy ? 1 : 2;
      for(let attempt=0; attempt<maxAttempts; attempt++){
        const target = attempt ? addCacheBuster(feed.url) : feed.url;
        const url = buildProxiedUrl(target, c);
        try{
          let text = await fetchWithCache(url);
          if(xmlHasParserError(text)){
            const extracted = maybeExtractXmlFromJson(text); if(extracted) text = extracted;
          }
          if(xmlHasParserError(text)) throw new Error('XML parse error');
          xml = text; used = (typeof c==='string')?'Manual':c.name; usedUrl=url; break;
        }catch(e){
          lastErr = e;
          if(typeof c !== 'string'){
            recordProxyResult(c.name, false);
            const msg = String(e && e.message || e || '');
            // If the proxy returns 400, our request format/target is rejected; cooldown this proxy to stop repeats.
            if(/HTTP 400/.test(msg)){
              proxyTempDisabledUntil.set(c.name, Date.now()+PROXY_DISABLE_MS);
              break; // try next proxy without retrying this one
            }
            // Aggressively back off noisy/blocked proxies (other 4xx/5xx/429) to avoid repeated hammering
            if(/HTTP 4\d\d/.test(msg) && !/HTTP 429/.test(msg)){
              proxyTempDisabledUntil.set(c.name, Date.now()+PROXY_DISABLE_MS);
            } else if(/HTTP 429|HTTP 5\d\d/.test(msg) || /Failed to fetch|TypeError|NetworkError|ERR_/i.test(msg)){
              proxyTempDisabledUntil.set(c.name, Date.now()+PROXY_DISABLE_MS/2); // shorter initial cooldown
            }
          }
        }
      }
      if(used) break;
    }
    if(!used){
      const msg = lastErr && lastErr.message || '';
      if(/HTTP 404/.test(msg)){
        const hits = incrementFeed404(feed);
        const disabled = !isFeedEnabled(feed);
        renderSubscriptionsList();
        renderArticles();
        const err = new Error(disabled ? 'HTTP 404 (auto-disabled after 3 failures)' : `HTTP 404 (${hits}/3)`);
        err.code = 'NOT_FOUND';
        throw err;
      }
      if(/HTTP 429/.test(msg)){
        const penalty = applyFeedRateLimit(feed);
        const err = new Error(`HTTP 429 (retry in ${penalty? Math.ceil(penalty.delay/1000)+'s' : 'later'})`);
        err.code = 'RATE_LIMIT';
        err.retryIn = penalty?.delay || RATE_LIMIT_BACKOFF_BASE_MS;
        throw err;
      }
      throw lastErr || new Error('Failed to fetch feed');
    }
  if(used && used!=='Manual' && used!=='Direct'){ recordProxyResult(used, true); }
    if(used) usedProxies.add(used);
    state.lastFetchUrl[feed.id] = usedUrl;
  clearFeedRateLimit(feed.id);
  resetFeed404(feed.id);
    // Parse & merge posts
    const doc = new DOMParser().parseFromString(xml,'text/xml');
    const updatedTitle = extractFeedTitle(doc);
    let feedTitleChanged = false;
    if(updatedTitle && updatedTitle !== feed.title){
      feed.title = updatedTitle;
      feedTitleChanged = true;
    }
    const parsedPosts = parseFeedDocument(doc, feed);
    for(const post of parsedPosts){
      const id = post.id;
      const merged = posts[id] = Object.assign(posts[id]||{}, post, { read: !!state.read[id], favorite: !!state.favorites[id] });
      if(applyMediaAutoTags(merged)){
        updateCardTags(id);
      }
    }
    if(feedTitleChanged){
      renderSubscriptionsList();
    }
  }

// ---- cache pruning and start-up hydration ----
  // Prune cache entries older than CACHE_MAX_AGE_DAYS, but preserve entries for manually-tagged posts
  async function pruneCacheEntries(){
    if(typeof caches === 'undefined') return;
    const cache = await caches.open(CACHE_NAME);
    const keys = await cache.keys();
    const now = Date.now();
    const maxAgeMs = CACHE_MAX_AGE_DAYS * 24 * 60 * 60 * 1000;
    
    // Build set of URLs we must keep (posts with manual tags)
    const keepUrls = new Set();
    if(state.tags && state.autoTags){
      for(const postId of Object.keys(state.tags)){
        const manualTags = (state.tags[postId] || []).filter(tag => {
          const autoTags = state.autoTags[postId] || [];
          return !autoTags.includes(tag);
        });
        if(manualTags.length > 0){
          // This post has manual tags - find its cached URL
          const post = posts[postId];
          if(post && post.link) keepUrls.add(post.link);
          // Also keep feed URL for this post's feed
          const feed = state.feeds.find(f => f.id === post?.feedId);
          if(feed){
            keepUrls.add(feed.url);
            if(state.lastFetchUrl[feed.id]) keepUrls.add(state.lastFetchUrl[feed.id]);
          }
        }
      }
    }
    
    let pruned = 0;
    for(const req of keys){
      // Skip if this URL must be kept
      if(keepUrls.has(req.url)) continue;
      
      const res = await cache.match(req);
      if(!res) continue;
      const dateHeader = res.headers.get('date');
      if(!dateHeader) continue;
      const cacheTime = new Date(dateHeader).getTime();
      if(isNaN(cacheTime)) continue;
      if(now - cacheTime > maxAgeMs){
        await cache.delete(req);
        pruned++;
      }
    }
    if(pruned > 0) dbg(`Pruned ${pruned} old cache entries`);
  }

  async function hydrateFromCache(){
    if(typeof caches === 'undefined') return;
    try{
      const cache = await caches.open('feedcycle-cache-v2');
      let updatedAnyTitle = false;
      for(const f of state.feeds){
        const url = state.lastFetchUrl?.[f.id] || f.url;
        if(!url) continue;
        const res = await cache.match(new Request(url));
        if(!res) continue;
        let text = await res.text();
        if(xmlHasParserError(text)){ const extracted = maybeExtractXmlFromJson(text); if(extracted) text = extracted; }
        if(xmlHasParserError(text)) continue;
        const doc = new DOMParser().parseFromString(text,'text/xml');
        const title = extractFeedTitle(doc);
        if(title && title !== f.title){
          f.title = title;
          updatedAnyTitle = true;
        }
        const parsedPosts = parseFeedDocument(doc, f);
        for(const post of parsedPosts){
          const id = post.id;
          const merged = posts[id] = Object.assign(posts[id]||{}, post, { read: !!state.read[id], favorite: !!state.favorites[id] });
          if(applyMediaAutoTags(merged)){
            updateCardTags(id);
          }
        }
      }
      if(updatedAnyTitle){
        renderSubscriptionsList();
      }
    }catch(e){ dbg('Hydrate from cache failed', e); }
  }

// ---- OPML ----
  // ---------- OPML ----------
  function importOPMLText(xml){
    const doc = new DOMParser().parseFromString(xml,'text/xml');
    const outlines = [...doc.querySelectorAll('outline[xmlUrl]')];
    const list = outlines.map(o=>({ id: hashId(o.getAttribute('xmlUrl')), url:o.getAttribute('xmlUrl'), title:o.getAttribute('text')||o.getAttribute('title')||o.getAttribute('xmlUrl'), category:o.getAttribute('category')||'', enabled:true }));
    const map = new Map(state.feeds.map(f=> [f.url,f]));
    for(const f of list){ map.set(f.url, {...map.get(f.url), ...f}); }
    state.feeds = [...map.values()].sort((a,b)=> (a.category||'').localeCompare(b.category||'') || (a.title||'').localeCompare(b.title||''));
    saveState();
  }
  function exportOPML(){
    const body = state.feeds.map(f=>`    <outline type="rss" text="${escXml(f.title||f.url)}" xmlUrl="${escXml(f.url)}" ${f.category?`category="${escXml(f.category)}"`:''} />`).join('\n');
    const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head><title>Feed Cycle Subscriptions</title></head>\n  <body>\n${body}\n  </body>\n</opml>`;
    download('feedcycle-subscriptions.opml', xml, 'text/xml');
  }
  function escXml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function download(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1200); }

// ---- sanitiser ----
  // ---------- Sanitizer (minimal) ----------
  function sanitizeHtml(html){
    const t=document.createElement('div');
    t.innerHTML=html||'';

    // Drop obviously unsafe/irrelevant nodes entirely
    const BLOCK = 'script,style,iframe,object,embed,link,meta,noscript,template,base,title,head';
    t.querySelectorAll(BLOCK).forEach(n=>n.remove());

    const shouldDropUrl = (val)=>{
      if(!val) return false;
