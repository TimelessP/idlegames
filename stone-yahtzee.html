<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="application-name" content="IdleGames">
    <script src="assets/js/pwa.js" defer></script>
    <meta name="theme-color" content="#1c1916">
    <meta name="color-scheme" content="dark light">
    <title>Stone Yahtzee</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script>
        /* Resolve the theme before first paint so there is no flash. */
        (function () {
            var root = document.documentElement, mode = 'system', theme = 'dark';
            try {
                mode = localStorage.getItem('stone-yahtzee-theme') || 'system';
                if (['system', 'light', 'dark'].indexOf(mode) < 0) mode = 'system';
                theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
            } catch (e) {}
            root.setAttribute('data-mode', mode);
            root.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* =========================================================
           Tokens. Dark world = basalt surfaces with limestone controls.
           Light world = limestone surfaces with basalt controls.
           Textures arrive as --t-* custom properties (generated at load).
           ========================================================= */
        :root {
            --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Hoefler Text", "Noto Serif", Georgia, serif;
            --pad: clamp(6px, 1.7vmin, 14px);
            --gap: clamp(5px, 1.3vmin, 12px);
            --card-w: min(54vw, 42rem);

            --sz-basalt: 480px; --sz-limestone: 480px; --sz-slate: 340px; --sz-pol: 240px;
            --tx: 0px; --ty: 0px; --bgx: 0px; --bgy: 0px;

            --tex-bg: var(--t-basalt-r, none);
            --tex-panel: var(--t-slate-r, none);
            --tex-face: var(--t-limestone-p, none);
            --tex-honey: var(--t-honey-p, none);
            --sz-bg: var(--sz-basalt);
            --sz-panel: var(--sz-slate);

            --bg-base: #1c1916;
            --panel-base: #25272a;
            --face-base: #d9c3a0;
            --honey-base: #d9ab6c;

            --ink-surface: #f2e8d6;
            --ink-surface-2: #d6c8af;
            --ink-face: #20160d;
            --ink-face-2: #32251a;
            --ink-honey: #2a1a09;
            --pip: #20160d;
            --pip-rim: rgba(255, 255, 255, .62);
            --focus: #ffd98a;

            --vignette: radial-gradient(125% 95% at 50% 35%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, .55) 100%);
            --panel-tint: rgba(8, 7, 6, .4);
            --sum-tint: rgba(0, 0, 0, .3);
            --shade: rgba(0, 0, 0, .7);
            --lip: rgba(255, 255, 255, .09);
            --drop: rgba(0, 0, 0, .6);

            --hl-a: .3; --lo-a: .2; --edge-hl: .55; --edge-lo: .38;
            --emboss-face: 0 1px 0 rgba(255, 255, 255, .5);
            --emboss-surface: 0 -1px 0 rgba(0, 0, 0, .85), 0 0 .55em rgba(0, 0, 0, .55);
        }
        :root[data-theme="light"] {
            --tex-bg: var(--t-limestone-r, none);
            --tex-panel: var(--t-limestone-r, none);
            --tex-face: var(--t-basalt-p, none);
            --sz-bg: var(--sz-limestone);
            --sz-panel: var(--sz-limestone);

            --bg-base: #d6bf9d;
            --panel-base: #c2a579;
            --face-base: #2d2824;

            --ink-surface: #261a10;
            --ink-surface-2: #34261a;
            --ink-face: #f4eada;
            --ink-face-2: #d9ccb6;
            --pip: #f4eada;
            --pip-rim: rgba(255, 255, 255, .2);
            --focus: #3a210a;

            --vignette: radial-gradient(125% 95% at 50% 35%, rgba(255, 240, 215, .12) 30%, rgba(92, 60, 28, .34) 100%);
            --panel-tint: rgba(238, 218, 186, .34);
            --sum-tint: rgba(246, 230, 204, .5);
            --shade: rgba(60, 34, 10, .78);
            --lip: rgba(255, 255, 255, .55);
            --drop: rgba(50, 28, 8, .5);

            --hl-a: .13; --lo-a: .34; --edge-hl: .24; --edge-lo: .55;
            --emboss-face: 0 -1px 0 rgba(0, 0, 0, .75);
            --emboss-surface: 0 1px 0 rgba(255, 255, 255, .6);
        }
        :root[data-theme="dark"] { color-scheme: dark; }
        :root[data-theme="light"] { color-scheme: light; }
        @media (prefers-contrast: more) {
            :root { --panel-tint: rgba(8, 7, 6, .62); --sum-tint: rgba(0, 0, 0, .5); }
            :root[data-theme="light"] { --panel-tint: rgba(255, 244, 224, .6); --sum-tint: rgba(255, 244, 224, .65); }
        }

        /* =========================================================
           Base. Nothing in the app is allowed to scroll.
           ========================================================= */
        *, *::before, *::after { box-sizing: border-box; }
        html { height: 100%; overflow: hidden; background: var(--bg-base); -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
            font-family: var(--serif); color: var(--ink-surface);
            background:
                var(--vignette),
                var(--tex-bg) var(--bgx) var(--bgy) / var(--sz-bg) repeat,
                var(--bg-base);
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; color: inherit; margin: 0; padding: 0; border: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
        .pressable { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
        svg { display: block; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
        .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
        .ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

        /* =========================================================
           Layout. Portrait: stage on top, scorecard fills the rest.
           Landscape: stage left, scorecard right. All sized to fit.
           ========================================================= */
        .app {
            height: 100vh; height: 100dvh; display: grid; gap: var(--gap);
            padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)) max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto minmax(0, 1fr);
            --die: max(34px, min(calc((100vw - 2 * var(--pad)) / 5.9), 13dvh, 96px));
            opacity: 0; transition: opacity .7s ease;
        }
        .ready .app { opacity: 1; }
        .stage { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }
        .stage-main {
            display: flex; flex-direction: column; justify-content: center; gap: var(--gap);
            flex: 1 1 auto; min-height: 0; width: min(100%, calc(var(--die) * 5.9)); margin-inline: auto;
        }
        .card { container-type: size; min-width: 0; min-height: 0; justify-self: center; width: min(100%, 46rem); }
        .card-box {
            height: 100%; display: grid; align-content: center;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
            gap: var(--gap);
            font-size: clamp(11px, 3.6vmin, 18px);                       /* fallback without container units */
            font-size: clamp(11px, min(4.15cqw, 4.7cqh), 21px);          /* scales with the scorecard itself */
        }
        .card-box { --row-max: 4.4em; }
        .col { min-height: 0; display: grid; align-content: center; gap: .3em; }
        .col.upper { grid-template-rows: repeat(6, minmax(0, var(--row-max))) repeat(2, minmax(0, 2.5em)); }
        .col.lower { grid-template-rows: repeat(7, minmax(0, var(--row-max))) minmax(0, 2.5em); }

        @media (orientation: landscape) and (min-aspect-ratio: 5/4) {
            .app {
                grid-template-columns: minmax(0, 1fr) var(--card-w);
                grid-template-rows: minmax(0, 1fr);
                --die: max(34px, min(calc((100vw - var(--card-w) - 3 * var(--pad)) / 5.9), 24dvh, 120px));
            }
            .card { width: 100%; }
            .card-box { --row-max: 3.6em; }
        }

        /* =========================================================
           Interactive stone: smooth, honed, lit from the upper left.
           ========================================================= */
        .face,
        .score-row:not(.filled),
        .die,
        .roll:not(:disabled),
        .chip,
        .seg button[aria-checked="true"],
        .pebble:not(.used) {
            color: var(--ink-face);
            text-shadow: var(--emboss-face);
            background:
                linear-gradient(158deg, rgba(255, 255, 255, var(--hl-a)) 0%, rgba(255, 255, 255, 0) 44%, rgba(0, 0, 0, var(--lo-a)) 100%),
                var(--tex-face) var(--tx) var(--ty) / var(--sz-pol) repeat,
                var(--face-base);
            box-shadow:
                inset 0 1.5px 1px rgba(255, 255, 255, var(--edge-hl)),
                inset 0 -3px 5px rgba(0, 0, 0, var(--edge-lo)),
                inset 0 0 0 .5px rgba(0, 0, 0, .28),
                0 1.5px 0 rgba(0, 0, 0, .4),
                0 .35em .65em -.2em var(--drop);
        }
        /* Faces are dark basalt in the light theme, so their ink is light. */
        .score-row, .roll, .chip { transition: transform .12s ease, box-shadow .15s ease; }
        .pressable:active { transform: translateY(1px) scale(.992); }

        /* Sealed / inactive stone: rough, recessed, no longer clickable. */
        .score-row.filled,
        .roll:disabled,
        .pebble.used,
        .seg {
            color: var(--ink-surface);
            text-shadow: var(--emboss-surface);
            background:
                linear-gradient(var(--panel-tint), var(--panel-tint)),
                var(--tex-panel) var(--tx) var(--ty) / var(--sz-panel) repeat,
                var(--panel-base);
            box-shadow:
                inset 0 3px 7px var(--shade),
                inset 0 -1px 0 var(--lip),
                0 1px 0 var(--lip);
        }
        .score-row.filled, .roll:disabled { cursor: default; }
        .roll:disabled:active, .score-row.filled:active, .score-row[aria-disabled="true"]:active { transform: none; }

        @media (hover: hover) {
            .score-row[data-state="open"]:hover, .roll:not(:disabled):hover, .chip:hover, .die:not([aria-disabled="true"]):hover { filter: brightness(1.07); }
        }

        /* =========================================================
           Toolbar
           ========================================================= */
        .bar { display: flex; align-items: center; justify-content: space-between; gap: .5em; font-size: clamp(13px, 1.9vmin + 6px, 17px); }
        .bar-end { display: flex; align-items: center; gap: .5em; }
        .chip { display: inline-flex; align-items: center; justify-content: center; gap: .45em; height: 2.35em; padding: 0 .95em; border-radius: 999px; font-weight: 600; font-size: 1em; white-space: nowrap; }
        .chip.round { width: 2.35em; padding: 0; }
        .chip.armed { --face-base: var(--honey-base); }
        .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; }
        .seg button { display: flex; align-items: center; justify-content: center; width: 2.1em; height: 2.1em; border-radius: 50%; color: var(--ink-surface); }
        .seg button[aria-checked="true"] { color: var(--ink-face); }

        /* =========================================================
           Tray: a carved recess the dice sit in.
           ========================================================= */
        .tray, .dialog { position: relative; isolation: isolate; color: var(--ink-surface); text-shadow: var(--emboss-surface); }
        .tray::before, .dialog::before {
            content: ""; position: absolute; inset: 0; z-index: -1; border-radius: calc(var(--die) * .3);
            background:
                linear-gradient(var(--panel-tint), var(--panel-tint)),
                var(--tex-panel) var(--tx) var(--ty) / var(--sz-panel) repeat,
                var(--panel-base);
            box-shadow: inset 0 5px 14px var(--shade), inset 0 -1px 0 var(--lip), 0 1px 0 var(--lip), 0 0 0 1px rgba(0, 0, 0, .12);
            filter: url(#roughen);
        }
        .tray {
            display: flex; flex-direction: column; gap: calc(var(--die) * .14);
            padding: calc(var(--die) * .17) calc(var(--die) * .18) calc(var(--die) * .2);
            font-size: clamp(12px, calc(var(--die) * .27), 22px);
        }
        .status { display: flex; align-items: center; justify-content: space-between; gap: .6em; font-variant-numeric: lining-nums tabular-nums; line-height: 1; }
        .stat { display: flex; align-items: baseline; gap: .35em; white-space: nowrap; }
        .stat b { font-size: 1.28em; font-weight: 700; }
        .stat .score-value { min-width: 0; }
        .stat .of { font-size: .9em; }
        .pebbles { display: flex; gap: .4em; align-items: center; }
        .pebble { width: .95em; height: .95em; border-radius: 50%; }
        .dice { display: flex; justify-content: center; gap: calc(var(--die) * .1); }
        .slot {
            position: relative; width: calc(var(--die) * 1.08); height: calc(var(--die) * 1.08); border-radius: calc(var(--die) * .27);
            background: rgba(0, 0, 0, .22);
            box-shadow: inset 0 calc(var(--die) * .05) calc(var(--die) * .1) var(--shade), 0 1px 0 var(--lip);
        }
        :root[data-theme="light"] .slot { background: rgba(70, 42, 16, .16); }
        .die {
            position: absolute; inset: 4%; border-radius: 22%;
            transition: transform .2s cubic-bezier(.3, 1.5, .5, 1), box-shadow .2s ease, filter .15s ease;
            box-shadow:
                inset calc(var(--die) * .03) calc(var(--die) * .03) calc(var(--die) * .05) rgba(255, 255, 255, var(--edge-hl)),
                inset calc(var(--die) * -.04) calc(var(--die) * -.05) calc(var(--die) * .08) rgba(0, 0, 0, var(--edge-lo)),
                inset 0 0 0 .5px rgba(0, 0, 0, .3),
                0 calc(var(--die) * .04) calc(var(--die) * .08) var(--drop);
        }
        .die[aria-pressed="true"] {
            transform: translateY(-15%);
            --face-base: var(--honey-base); --pip: var(--ink-honey); --pip-rim: rgba(255, 255, 255, .5);
            color: var(--ink-honey);
            background:
                linear-gradient(158deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, 0) 44%, rgba(0, 0, 0, .2) 100%),
                var(--tex-honey) var(--tx) var(--ty) / var(--sz-pol) repeat,
                var(--honey-base);
            box-shadow:
                inset calc(var(--die) * .03) calc(var(--die) * .03) calc(var(--die) * .05) rgba(255, 255, 255, .55),
                inset calc(var(--die) * -.04) calc(var(--die) * -.05) calc(var(--die) * .08) rgba(60, 30, 0, .4),
                0 calc(var(--die) * .11) calc(var(--die) * .12) -.05em var(--drop);
        }
        .die svg { width: 100%; height: 100%; pointer-events: none; }
        .die .pip { fill: var(--pip); }
        .die .pip-rim { fill: var(--pip-rim); }
        .tray.unrolled .die svg { opacity: .5; }
        .die[aria-disabled="true"] { cursor: default; }
        .die.tumbling { animation: tumble .42s ease-in-out; }
        @keyframes tumble {
            0% { transform: translateY(0) rotate(0); }
            22% { transform: translateY(-16%) rotate(calc(var(--dir, 1) * -16deg)); }
            48% { transform: translateY(2%) rotate(calc(var(--dir, 1) * 11deg)); }
            72% { transform: translateY(-7%) rotate(calc(var(--dir, 1) * -5deg)); }
            100% { transform: translateY(0) rotate(0); }
        }

        .roll {
            display: flex; justify-content: center; gap: .55em; width: 100%;
            height: clamp(42px, 9dvh, 66px); border-radius: clamp(12px, 2.4dvh, 20px);
            font-size: clamp(16px, 3.1dvh, 23px); font-weight: 700; line-height: 1; align-items: center;
        }
        .roll-sub { font-size: .72em; font-weight: 500; opacity: .92; font-variant-numeric: lining-nums; }
        .roll:not(:disabled) .roll-sub { color: var(--ink-face-2); opacity: 1; }
        .roll:disabled .roll-sub { color: var(--ink-surface-2); }

        /* =========================================================
           Scorecard rows
           ========================================================= */
        .score-row {
            display: flex; align-items: center; gap: .55em; width: 100%; height: 100%; min-height: 0;
            padding: 0 .75em 0 .6em; text-align: left; font-weight: 600; line-height: 1;
            border-radius: .6em;
        }
        .col > :nth-child(3n + 1) { border-radius: .62em .5em .66em .52em / .55em .62em .5em .6em; }
        .col > :nth-child(3n + 2) { border-radius: .5em .64em .52em .66em / .62em .5em .6em .54em; }
        .score-row[data-state="idle"]:not(.filled) { box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, var(--edge-hl)), inset 0 -2px 3px rgba(0, 0, 0, var(--edge-lo)), 0 1px 0 rgba(0, 0, 0, .35), 0 .12em .25em -.1em var(--drop); cursor: default; }
        .score-row[data-state="idle"]:active { transform: none; }
        .ico { width: 1.4em; height: 1.4em; flex: none; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .28)); }
        :root[data-theme="light"] .ico { filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, .6)); }
        .score-row.filled .ico { filter: none; opacity: .85; }
        .score-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-value { font-variant-numeric: lining-nums tabular-nums; font-weight: 700; min-width: 1.5em; text-align: right; }
        .score-row[data-state="open"] .score-value[data-zero="true"] { font-weight: 500; }
        .score-row.filled .score-value { font-size: 1.1em; }
        .app.rolling .score-row[data-state="open"] .score-value { visibility: hidden; }

        .sum {
            display: flex; align-items: center; justify-content: space-between; gap: .5em; min-height: 0; height: 100%;
            padding: 0 .75em 0 .6em; border-radius: .5em; background: var(--sum-tint); color: var(--ink-surface);
            text-shadow: var(--emboss-surface); font-style: italic; line-height: 1;
        }
        .sum .sv { display: flex; align-items: baseline; gap: .15em; font-style: normal; font-variant-numeric: lining-nums tabular-nums; }
        .sum .score-value { font-size: 1.1em; }
        .sum small { font-size: .78em; color: var(--ink-surface-2); }
        .sum .score-label small { font-style: normal; }

        /* =========================================================
           Dialog
           ========================================================= */
        .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: var(--pad); background: rgba(10, 7, 4, .66); z-index: 50; }
        .modal.open { display: flex; }
        .dialog { --die: 84px; width: min(26rem, 100%); padding: 1.3rem 1.2rem 1.15rem; display: flex; flex-direction: column; gap: .9rem; font-size: 1rem; }
        .dialog::before { border-radius: 1.1rem; }
        .dialog h2 { margin: 0; font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
        .summary { font-size: 1.15rem; font-variant-numeric: lining-nums tabular-nums; color: var(--ink-surface); }
        .modal-footer { display: flex; flex-wrap: wrap; gap: .55rem; justify-content: flex-end; font-size: 1rem; }
        .share-status { min-height: 1.2em; font-size: .95rem; color: var(--ink-surface-2); }

        @media (prefers-reduced-motion: reduce) {
            .app, .score-row, .roll, .chip, .die { transition: none; }
            .die.tumbling { animation: none; }
        }
    </style>
</head>
<body>
    <!-- Shared SVG defs (kept 0x0 rather than display:none so gradients and filters resolve everywhere) -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <radialGradient id="pipShade" cx=".62" cy=".68" r=".72">
                <stop offset=".5" stop-color="#000" stop-opacity="0"/>
                <stop offset="1" stop-color="#000" stop-opacity=".5"/>
            </radialGradient>
            <filter id="roughen" x="-6%" y="-12%" width="112%" height="124%" color-interpolation-filters="sRGB">
                <feTurbulence id="roughNoise" type="fractalNoise" baseFrequency="0.03 0.045" numOctaves="3" seed="7" result="n"/>
                <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></symbol>
            <symbol id="i-fs-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
            <symbol id="i-fs-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
            <symbol id="i-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
            <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
            <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
            <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
        </defs>
    </svg>

    <div class="app" id="app">
        <section class="stage" aria-label="Dice">
            <header class="bar">
                <button class="chip pressable" id="newGameButton" type="button" aria-label="New game">
                    <svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg><span class="chip-label">New game</span>
                </button>
                <div class="bar-end">
                    <div class="seg" id="themeSwitch" role="radiogroup" aria-label="Colour theme">

    <script id="stone-worker" type="text/plain">'use strict';
/*
  Stone texture worker.
  Builds seamlessly tileable RGBA stone textures from scratch on every page load:
  periodic Perlin fBm -> height field -> vesicles / pits / strata / flecks -> baked directional lighting.
  spec = { id, kind: 'basalt'|'limestone'|'slate', polished: bool, palette?: 'honey', size, seed }
*/
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makePerlin(rand) {
  const p = new Uint8Array(256), perm = new Uint8Array(512);
  const gx = new Float32Array(256), gy = new Float32Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  for (let i = 0; i < 256; i++) { const a = rand() * 6.283185307; gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
  // Lattice wraps at (px, py) so every field tiles seamlessly.
  return function (x, y, px, py) {
    const xf = Math.floor(x), yf = Math.floor(y);
    const fx = x - xf, fy = y - yf;
    let x0 = xf % px; if (x0 < 0) x0 += px;
    let y0 = yf % py; if (y0 < 0) y0 += py;
    let x1 = x0 + 1; if (x1 >= px) x1 -= px;
    let y1 = y0 + 1; if (y1 >= py) y1 -= py;
    x0 &= 255; x1 &= 255; y0 &= 255; y1 &= 255;
    const h00 = perm[perm[x0] + y0], h10 = perm[perm[x1] + y0];
    const h01 = perm[perm[x0] + y1], h11 = perm[perm[x1] + y1];
    const d00 = gx[h00] * fx + gy[h00] * fy;
    const d10 = gx[h10] * (fx - 1) + gy[h10] * fy;
    const d01 = gx[h01] * fx + gy[h01] * (fy - 1);
    const d11 = gx[h11] * (fx - 1) + gy[h11] * (fy - 1);
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
    const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const a = d00 + (d10 - d00) * u, b = d01 + (d11 - d01) * u;
    return (a + (b - a) * v) * 1.41;
  };
}

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// fBm on a periodic lattice. ds>1 computes at lower resolution then upsamples (bilinear, wrapped) - big speed-up for smooth fields.
function field(N, P, fx, fy, oct, gain, rand, ds) {
  ds = ds || 1;
  const M = Math.round(N / ds), ox = rand() * 64, oy = rand() * 64;
  const src = new Float32Array(M * M);
  let norm = 0, amp = 1;
  for (let o = 0; o < oct; o++) { norm += amp; amp *= gain; }
  for (let y = 0; y < M; y++) {
    const v = y / M;
    for (let x = 0; x < M; x++) {
      const u = x / M;
      let s = 0, a = 1, f1 = fx, f2 = fy;
      for (let o = 0; o < oct; o++) { s += a * P(u * f1 + ox, v * f2 + oy, f1, f2); a *= gain; f1 *= 2; f2 *= 2; }
      src[y * M + x] = s / norm;
    }
  }
  if (M === N) return src;
  const out = new Float32Array(N * N), k = M / N;
  for (let y = 0; y < N; y++) {
    const sy = y * k, y0 = Math.floor(sy), fy_ = sy - y0, y1 = (y0 + 1) % M;
    for (let x = 0; x < N; x++) {
      const sx = x * k, x0 = Math.floor(sx), fx_ = sx - x0, x1 = (x0 + 1) % M;
      const a = src[y0 * M + x0], b = src[y0 * M + x1], c = src[y1 * M + x0], d = src[y1 * M + x1];
      out[y * N + x] = (a + (b - a) * fx_) * (1 - fy_) + (c + (d - c) * fx_) * fy_;
    }
  }
  return out;
}

// Vesicles / pits: irregular, optionally elongated bowls with a slightly raised rim.
function pores(N, H, P, Rm, rand, o) {
  let placed = 0, tries = 0;
  const maxTries = o.count * 10;
  while (placed < o.count && tries < maxTries) {
    tries++;
    const cx = (rand() * N) | 0, cy = (rand() * N) | 0;
    if (o.cluster) {
      const c = o.cluster[cy * N + cx];
      if (rand() > clamp((c + o.bias) * o.k, 0, 1)) continue;
    }
    const r = o.rMin + (o.rMax - o.rMin) * Math.pow(rand(), o.pow);
    const e = 1 + rand() * o.elong, th = o.angle + (rand() - 0.5) * o.angJit;
    const ct = Math.cos(th), st = Math.sin(th);
    const k1 = (rand() - 0.5) * 0.34, k2 = (rand() - 0.5) * 0.28, k3 = (rand() - 0.5) * 0.2;
    const p1 = rand() * 6.28, p2 = rand() * 6.28, p3 = rand() * 6.28;
    const dep = o.depth * r * (0.65 + rand() * 0.7);
    const R = Math.ceil(r * e * 1.5) + 1;
    for (let dy = -R; dy <= R; dy++) {
      const yy = ((cy + dy) % N + N) % N;
      for (let dx = -R; dx <= R; dx++) {
        const a = (dx * ct + dy * st) / e, b = -dx * st + dy * ct;
        const d = Math.sqrt(a * a + b * b);
        if (d > r * 1.6) continue;
        const ang = Math.atan2(b, a);
        const rr = r * (1 + k1 * Math.sin(2 * ang + p1) + k2 * Math.sin(3 * ang + p2) + k3 * Math.sin(5 * ang + p3));
        const t = d / rr;
        if (t > 1.45) continue;
        const i = yy * N + (((cx + dx) % N + N) % N);
        if (t < 1) {
          const prof = Math.pow(1 - t * t, 0.6);
          H[i] -= dep * prof;
          if (prof > P[i]) P[i] = prof;
        } else {
          const rw = o.rimW || 0.17, w = Math.exp(-((t - 1) / rw) * ((t - 1) / rw));
          H[i] += o.rim * r * 0.2 * w;
          if (w > Rm[i]) Rm[i] = w;
        }
      }
    }
    placed++;
  }
}

function flecks(N, A, rand, count, rMin, rMax, pow, alpha, cluster, bias, k) {
  let placed = 0, tries = 0;
  while (placed < count && tries < count * 6) {
    tries++;
    const cx = (rand() * N) | 0, cy = (rand() * N) | 0;
    if (cluster && rand() > clamp((cluster[cy * N + cx] + bias) * k, 0, 1)) continue;
    const r = rMin + (rMax - rMin) * Math.pow(rand(), pow);
    const R = Math.ceil(r) + 1, al = alpha * (0.6 + rand() * 0.4);
    for (let dy = -R; dy <= R; dy++) {
      const yy = ((cy + dy) % N + N) % N;
      for (let dx = -R; dx <= R; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy);
        const a = clamp(1.2 - d / r, 0, 1) * al;
        if (a <= 0) continue;
        const i = yy * N + (((cx + dx) % N + N) % N);
        if (a > A[i]) A[i] = a;
      }
    }
    placed++;
  }
}

function blurWrap(src, N, r, passes) {
  let a = src, w = 2 * r + 1;
  for (let p = 0; p < passes; p++) {
    const tmp = new Float32Array(N * N), out = new Float32Array(N * N);
    for (let y = 0; y < N; y++) {
      const row = y * N; let s = 0;
      for (let k = -r; k <= r; k++) s += a[row + ((k + N) % N)];
      for (let x = 0; x < N; x++) {
        tmp[row + x] = s / w;
        s += a[row + ((x + r + 1) % N)] - a[row + ((x - r + N) % N)];
      }
    }
    for (let x = 0; x < N; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += tmp[((k + N) % N) * N + x];
      for (let y = 0; y < N; y++) {
        out[y * N + x] = s / w;
        s += tmp[((y + r + 1) % N) * N + x] - tmp[((y - r + N) % N) * N + x];
      }
    }
    a = out;
  }
  return a;
}

function ramp(s, t, out) {
  let a, b, f;
  if (t < 0.5) { a = s[0]; b = s[1]; f = t * 2; } else { a = s[1]; b = s[2]; f = (t - 0.5) * 2; }
  out[0] = a[0] + (b[0] - a[0]) * f; out[1] = a[1] + (b[1] - a[1]) * f; out[2] = a[2] + (b[2] - a[2]) * f;
}

function generate(spec) {
  const N = spec.size, rand = rng(spec.seed), kind = spec.kind, pol = !!spec.polished;
  const n = N * N, sc = (N / 512) * (N / 512);
  const mk = () => makePerlin(rand);
  const H = new Float32Array(n), P = new Float32Array(n), Rm = new Float32Array(n);
  const F1 = new Float32Array(n), F2 = new Float32Array(n), WARM = new Float32Array(n);
  const cfg = {};
  let low, mid, tone;

  if (kind === 'basalt' && !pol) {
    low = field(N, mk(), 2, 2, 4, 0.5, rand, 4); mid = field(N, mk(), 9, 9, 3, 0.55, rand, 2);
    const lumps = field(N, mk(), 3, 3, 5, 0.5, rand, 2), grain = field(N, mk(), 20, 20, 3, 0.6, rand), fine = field(N, mk(), 110, 110, 2, 0.55, rand);
    for (let i = 0; i < n; i++) H[i] = 15 * lumps[i] + 5.2 * grain[i] + 1.8 * fine[i];
    const cl = field(N, mk(), 2, 2, 2, 0.5, rand, 4);
    pores(N, H, P, Rm, rand, { count: Math.round(520 * sc), rMin: 1.4, rMax: 7.5, pow: 2.2, depth: 0.42, rim: 0.5, rimW: 0.45, elong: 0.5, angle: 0.4, angJit: 6.28, cluster: cl, bias: 0.3, k: 2.4 });
    pores(N, H, P, Rm, rand, { count: Math.round(2400 * sc), rMin: 0.7, rMax: 2.6, pow: 1.3, depth: 0.5, rim: 0.4, rimW: 0.5, elong: 0.3, angle: 0, angJit: 6.28, cluster: cl, bias: 0.5, k: 1.6 });
    flecks(N, F1, rand, Math.round(900 * sc), 0.6, 1.6, 1.4, 0.7, cl, 0.4, 1.5);
    flecks(N, F2, rand, Math.round(700 * sc), 0.5, 1.1, 1, 0.8, null);
    tone = (i) => 0.5 + 0.8 * low[i] + 0.55 * mid[i];
    Object.assign(cfg, {
      stops: [[24, 22, 21], [52, 48, 45], [92, 84, 77]], pitCol: [12, 10, 9], pitA: 0.4,
      rimCol: [138, 98, 62], rimA: 0.32, f1Col: [126, 90, 58], f1A: 0.5, f2Col: [196, 182, 162], f2A: 0.7,
      bump: 1.15, ao: 0.5, aoR: 4, convex: 0.3, grainJ: 0.07
    });
  } else if (kind === 'basalt') { // polished
    low = field(N, mk(), 2, 2, 4, 0.55, rand, 4); mid = field(N, mk(), 7, 7, 3, 0.55, rand, 2);
    const grain = field(N, mk(), 30, 30, 3, 0.55, rand);
    for (let i = 0; i < n; i++) H[i] = 2.4 * grain[i] + 1.6 * low[i];
    pores(N, H, P, Rm, rand, { count: Math.round(170 * sc), rMin: 0.8, rMax: 3.2, pow: 2, depth: 0.5, rim: 0.3, rimW: 0.4, elong: 0.5, angle: 0, angJit: 6.28 });
    flecks(N, F2, rand, Math.round(700 * sc), 0.45, 1.0, 1, 0.8, null);
    flecks(N, F1, rand, Math.round(420 * sc), 0.5, 1.4, 1.2, 0.6, null);
    tone = (i) => 0.5 + 0.55 * low[i] + 0.4 * mid[i];
    Object.assign(cfg, {
      stops: [[38, 35, 32], [56, 51, 46], [80, 73, 66]], pitCol: [16, 14, 12], pitA: 0.55,
      rimCol: [124, 90, 60], rimA: 0.2, f1Col: [128, 90, 58], f1A: 0.55, f2Col: [200, 184, 160], f2A: 0.65,
      bump: 0.7, ao: 0.35, aoR: 3, convex: 0.12, grainJ: 0.05, spec: 0.14, specP: 26
    });
  } else if (kind === 'limestone' && !pol) {
    low = field(N, mk(), 2, 2, 4, 0.5, rand, 4); mid = field(N, mk(), 10, 10, 3, 0.55, rand, 2);
    const lumps = field(N, mk(), 3, 3, 4, 0.5, rand, 2), grain = field(N, mk(), 24, 24, 3, 0.6, rand), fine = field(N, mk(), 120, 120, 2, 0.55, rand);
    for (let i = 0; i < n; i++) H[i] = 11 * lumps[i] + 3.6 * grain[i] + 1.4 * fine[i];
    const cl = field(N, mk(), 3, 3, 2, 0.5, rand, 4);
    pores(N, H, P, Rm, rand, { count: Math.round(520 * sc), rMin: 1.2, rMax: 7.5, pow: 2.4, depth: 0.4, rim: 0.4, rimW: 0.3, elong: 1.4, angle: 0.15, angJit: 0.7, cluster: cl, bias: 0.35, k: 2.0 });
    pores(N, H, P, Rm, rand, { count: Math.round(2200 * sc), rMin: 0.7, rMax: 2.2, pow: 1.2, depth: 0.45, rim: 0.2, elong: 0.4, angle: 0, angJit: 6.28 });
    flecks(N, F1, rand, Math.round(1300 * sc), 0.5, 1.5, 1.4, 0.75, null);
    flecks(N, F2, rand, Math.round(500 * sc), 0.5, 1.1, 1, 0.5, null);
    tone = (i) => 0.55 + 0.9 * low[i] + 0.6 * mid[i];
    Object.assign(cfg, {
      stops: [[188, 152, 120], [220, 188, 154], [240, 218, 190]], pitCol: [150, 110, 76], pitA: 0.42,
      rimCol: [244, 226, 200], rimA: 0.0, f1Col: [104, 72, 44], f1A: 0.75, f2Col: [160, 122, 88], f2A: 0.5,
      bump: 1.0, ao: 0.42, aoR: 4, convex: 0.2, grainJ: 0.05
    });
  } else if (kind === 'limestone') { // polished (also honey)
    low = field(N, mk(), 2, 2, 4, 0.55, rand, 4); mid = field(N, mk(), 6, 6, 3, 0.55, rand, 2);
    const grain = field(N, mk(), 26, 26, 3, 0.5, rand);
    for (let i = 0; i < n; i++) H[i] = 1.7 * grain[i] + 1.8 * low[i];
    pores(N, H, P, Rm, rand, { count: Math.round(130 * sc), rMin: 0.9, rMax: 3.6, pow: 1.8, depth: 0.4, rim: 0.2, rimW: 0.3, elong: 1.6, angle: 0.1, angJit: 0.8 });
    flecks(N, F1, rand, Math.round(760 * sc), 0.45, 1.2, 1.3, 0.7, null);
    flecks(N, F2, rand, Math.round(520 * sc), 0.5, 1.2, 1, 0.45, null);
    tone = (i) => 0.5 + 0.75 * low[i] + 0.7 * mid[i];
    const honey = spec.palette === 'honey';
    Object.assign(cfg, honey ? {
      stops: [[186, 138, 80], [216, 170, 108], [236, 200, 144]], pitCol: [138, 96, 52], pitA: 0.5,
      f1Col: [100, 66, 34], f1A: 0.6, f2Col: [148, 104, 60], f2A: 0.4
    } : {
      stops: [[196, 160, 126], [224, 194, 160], [241, 221, 194]], pitCol: [150, 112, 78], pitA: 0.5,
      f1Col: [112, 76, 46], f1A: 0.62, f2Col: [160, 122, 88], f2A: 0.4
    }, { rimCol: [255, 240, 215], rimA: 0.0, bump: 0.55, ao: 0.3, aoR: 3, convex: 0.1, grainJ: 0.03, spec: 0.2, specP: 30 });
  } else { // slate (rough): overlapping shingle-like plates
    low = field(N, mk(), 2, 2, 4, 0.5, rand, 4); mid = field(N, mk(), 8, 8, 3, 0.55, rand, 2);
    const grain = field(N, mk(), 22, 22, 3, 0.6, rand), TP = new Float32Array(n);
    const plates = Math.round(2300 * sc);
    for (let p = 0; p < plates; p++) {
      const cx = (rand() * N) | 0, cy = (rand() * N) | 0;
      const len = 14 + rand() * 46, thick = 3 + rand() * 6.5;
      const th = -0.3 + (rand() - 0.5) * 0.5, ct = Math.cos(th), st = Math.sin(th);
      const hb = rand() * 10, sx = (rand() - 0.5) * 0.22, sy = (rand() - 0.5) * 0.22, tn = (rand() - 0.5) * 0.4;
      const R = Math.ceil(len) + 3, il = 1 / (len * len), it = 1 / (thick * thick);

          const qa = a * a * il, qb = b * b * it;
          const q = qa * qa + qb * qb;           // squarish plate
          if (q >= 1) continue;
          const i = yy * N + (((cx + dx) % N + N) % N);
          H[i] = hb + sx * a + sy * b - (1 - smooth(0, 0.12, 1 - q)) * 1.6;
          TP[i] = tn;
        }
      }
    }
    for (let i = 0; i < n; i++) H[i] += 2.4 * grain[i];
    pores(N, H, P, Rm, rand, { count: Math.round(160 * sc), rMin: 1.0, rMax: 4.5, pow: 2.2, depth: 0.4, rim: 0.3, rimW: 0.3, elong: 2.0, angle: -0.35, angJit: 0.6 });
    flecks(N, F2, rand, Math.round(520 * sc), 0.5, 1.2, 1, 0.7, null);
    tone = (i) => 0.5 + 0.8 * low[i] + 0.5 * mid[i] + TP[i];
    Object.assign(cfg, {
      stops: [[27, 29, 32], [50, 52, 56], [88, 90, 94]], pitCol: [10, 10, 11], pitA: 0.45,
      rimCol: [138, 108, 72], rimA: 0.25, f2Col: [168, 150, 124], f2A: 0.5, warm: [150, 118, 78],
      bump: 0.85, ao: 0.45, aoR: 4, convex: 0.25, grainJ: 0.05
    });
  }

  // ---- baked lighting ----
  const blurH = blurWrap(H, N, cfg.aoR, 2);
  const lx = -0.56, ly = -0.62, lz = 0.55, ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
  const Lx = lx / ll, Ly = ly / ll, Lz = lz / ll;
  const hx = Lx, hy = Ly, hz = Lz + 1, hl = Math.sqrt(hx * hx + hy * hy + hz * hz);
  const out = new Uint8ClampedArray(n * 4), col = [0, 0, 0];
  const jr = rng(spec.seed ^ 0x9e3779b9);
  const stops = cfg.stops, bump = cfg.bump;
  for (let y = 0; y < N; y++) {

            return new Promise((resolve) => {
                const c = document.createElement('canvas'); c.width = w; c.height = h;
                c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), w, h), 0, 0);
                const done = (href) => {
                    root.style.setProperty(TEX[id].v, `url("${href}")`);
                    root.style.setProperty(TEX[id].sz, `${Math.round(w / dprK)}px`);
                    resolve();
                };
                if (c.toBlob) c.toBlob((blob) => { if (blob) { const u = URL.createObjectURL(blob); urls.push(u); done(u); } else done(c.toDataURL('image/jpeg', .92)); }, 'image/jpeg', .92);
                else done(c.toDataURL('image/jpeg', .92));
            });
        }
        function startTextures(order, firstWave, onFirstWave) {
            const code = $('#stone-worker').textContent;
            const pending = new Map();
            const randSeed = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; };
            const specs = order.map((id) => Object.assign({ id, seed: randSeed() }, TEX[id]));
            const handle = (m) => {
                const p = pending.get(m.id);
                if (!p) return;
                if (m.error) { console.warn('Stone texture failed:', m.id, m.error); p(); return; }
                applyTexture(m.id, m.w, m.h, m.buf).then(p);
            };
            const promises = specs.map((s) => new Promise((res) => pending.set(s.id, res)));
            let worker = null;
            try {
                worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
                worker.onmessage = (e) => handle(e.data);
                worker.onerror = () => { worker = null; runOnMainThread(); };
                specs.forEach((s) => worker.postMessage(s));
            } catch (e) { worker = null; runOnMainThread(); }
            function runOnMainThread() {
                // Fallback: same generator, run in slices on the main thread.
                const fake = { postMessage: (m) => handle(m) };
                try { new Function('self', code)(fake); } catch (err) { console.warn(err); return; }
                let i = 0;
                (function next() { if (i >= specs.length) return; const s = specs[i++]; if (pending.has(s.id)) fake.onmessage({ data: s }); setTimeout(next, 16); })();
            }
            const gate = Promise.all(order.map((id, i) => (firstWave.includes(id) ? promises[i] : null)).filter(Boolean));
            Promise.race([gate, new Promise((r) => setTimeout(r, 3500))]).then(onFirstWave);
        }
        function initTextures() {
            const dark = resolved() === 'dark';
            const first = dark ? ['basalt_r', 'slate_r', 'limestone_p', 'honey_p'] : ['limestone_r', 'basalt_p', 'honey_p'];
            const rest = dark ? ['limestone_r', 'basalt_p'] : ['basalt_r', 'slate_r', 'limestone_p'];
            const gateIds = dark ? ['basalt_r', 'slate_r', 'limestone_p'] : ['limestone_r', 'basalt_p'];
            startTextures(first.concat(rest), gateIds, () => root.classList.add('ready'));
            // Fresh roughness seed for the carved-edge filter, too.
            const n = $('#roughNoise'); if (n) n.setAttribute('seed', String(1 + Math.floor(Math.random() * 9999)));
        }
        // Each stone piece shows a different patch of the tile, so repeats never line up.
        function scatterTextureOffsets() {
            const R = (m) => `${-Math.floor(Math.random() * m)}px`;
            $$('.score-row, .die, .roll, .chip, .seg, .seg button, .pebble, .tray, .dialog').forEach((n) => {
                n.style.setProperty('--tx', R(700)); n.style.setProperty('--ty', R(700));
            });
            root.style.setProperty('--bgx', R(900)); root.style.setProperty('--bgy', R(900));
        }

        // ===== EVENTS =====
        function initEvents() {
            el.roll.addEventListener('click', rollDice);
            el.newGame.addEventListener('click', onNewGame);
            $('#viewScoreBtn').addEventListener('click', () => { setModal(false); $('#rollButton').focus(); });
            $('#playAgainBtn').addEventListener('click', () => { setModal(false); newGame(); });
            $('#shareScoreBtn').addEventListener('click', shareScore);
            $$('.pressable').forEach((n) => n.addEventListener('contextmenu', (e) => e.preventDefault()));

            document.addEventListener('keydown', (e) => {
                if (e.metaKey || e.ctrlKey || e.altKey) return;
                if (el.modal.classList.contains('open')) {
                    if (e.key === 'Escape') { setModal(false); return; }
                    if (e.key === 'Tab') {
                        const f = $$('button', el.modal); const first = f[0], last = f[f.length - 1];
                        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                    }
                    return;
                }
                const onControl = e.target.closest && e.target.closest('button, a, input, select, textarea, [role="radio"]');
                if ((e.key === ' ' || e.key === 'Enter') && !onControl) { e.preventDefault(); if (!el.roll.disabled) rollDice(); return; }
                if (e.key >= '1' && e.key <= '5') toggleHold(parseInt(e.key, 10) - 1);
            });
        }

        // ===== BOOT =====
        function boot() {
            buildDice(); buildScorecard();
            loadState();
            initTheme(); initFullscreen(); initEvents();
            scatterTextureOffsets();
            render();
            if (gameOver) setModal(true);
            persist();
            initTextures();
            // Never leave the app invisible if texture work stalls.
            setTimeout(() => root.classList.add('ready'), 4200);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
    <script src="parental.js"></script>
</body>
</html>
