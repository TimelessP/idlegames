<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid War</title>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="IdleGames">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grid War">
  <link rel="apple-touch-icon" href="assets/appicons/idle-games-512x512px.png">
  <script src="assets/js/pwa.js" defer></script>
  <meta name="theme-color" content="#8B6914">
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden; /* Prevents scrollbars */
    }

    .container {
      background: #1e293b;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 100%;
      max-height: 100%;
    }

    h1 {
      font-size: clamp(1rem, 2.5vh, 1.35rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #f1f5f9;
      text-align: center;
    }

    /* Scoreboard styles */
    .scoreboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
      position: relative;
    }

    .score-card {
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.7rem, 1.6vh, 0.85rem);
      font-weight: 600;
      border: 1px solid #334155;
      position: relative;
      will-change: transform;
    }

    /* Glow animation triggered when position swaps */
    .score-card.glow {
      animation: chipGlow 0.8s ease-out;
    }

    @keyframes chipGlow {
      0% {
        box-shadow: 0 0 0px rgba(255, 255, 255, 0);
      }
      30% {
        box-shadow: 0 0 16px var(--chip-color, #3b82f6), 0 0 25px #ffffff;
        border-color: #ffffff;
        z-index: 5;
      }
      100% {
        box-shadow: 0 0 0px rgba(255, 255, 255, 0);
      }
    }

    /* Particle sparkles */
    .sparkle {
      position: absolute;
      pointer-events: none;
      background: var(--color, #fff);
      clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
      box-shadow: 0 0 6px var(--color, #fff), 0 0 10px #ffffff;
      animation: sparkleFly 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      z-index: 10;
    }

    @keyframes sparkleFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(180deg);
      }
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Responsive canvas container constrained by available width/height */
    .canvas-wrapper {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      background: #334155;
      width: min(80vw, 58vh);
      height: min(80vw, 58vh);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: clamp(0.75rem, 1.8vh, 0.875rem);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      transform: scale(0.98);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.75rem, 1.8vh, 0.875rem);
      color: #94a3b8;
    }

    input[type="range"] {
      accent-color: #3b82f6;
      cursor: pointer;
      width: clamp(60px, 12vw, 100px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Grid War</h1>

    <!-- Dynamic Scoreboard -->
    <div class="scoreboard" id="scoreboard"></div>

    <!-- Simulation Canvas -->
    <div class="canvas-wrapper">
      <canvas id="simCanvas" width="570" height="570"></canvas>
    </div>

    <!-- Interactive Controls -->
    <div class="controls">
      <button id="btnPlayPause">Pause</button>
      <button id="btnReset">Reset</button>
      <div class="speed-control">
        <label for="speedSlider">Speed:</label>
        <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.1" value="1">
      </div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 15;
    const CANVAS_SIZE = 570; // Internal coordinate grid
    const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
    const NUM_BALLS = 5;
    const DEFAULT_GREY = "#475569";
    const GRID_LINE_COLOR = "#1e293b";

    const BALL_COLORS = [
      "#ef4444", // Red
      "#3b82f6", // Blue
      "#22c55e", // Green
      "#eab308", // Yellow
      "#a855f7"  // Purple
    ];

    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");
    const scoreboardEl = document.getElementById("scoreboard");
    const btnPlayPause = document.getElementById("btnPlayPause");
    const btnReset = document.getElementById("btnReset");
    const speedSlider = document.getElementById("speedSlider");

    let grid = [];
    let balls = [];
    let isRunning = true;
    let speedMultiplier = 1;
    let lastTime = 0;

    // Scoreboard persistent tracking
    let cardElements = {};
    let previousRanks = {};

    class Ball {
      constructor(id, x, y, angle, speed, color) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.radius = CELL_SIZE * 0.32;
        this.speed = speed;
        this.color = color;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
      }

      update(dt) {
        const totalDistance = this.speed * speedMultiplier * dt;
        const maxStep = 2.0;
        const steps = Math.max(1, Math.ceil(totalDistance / maxStep));
        const subDt = (dt * speedMultiplier) / steps;

        for (let s = 0; s < steps; s++) {
          let nextX = this.x + this.vx * subDt;
          let nextY = this.y + this.vy * subDt;

          let curCx = Math.floor(this.x / CELL_SIZE);
          let curCy = Math.floor(this.y / CELL_SIZE);

          curCx = Math.max(0, Math.min(GRID_SIZE - 1, curCx));
          curCy = Math.max(0, Math.min(GRID_SIZE - 1, curCy));

          let nextCx = Math.floor(nextX / CELL_SIZE);
          let nextCy = Math.floor(nextY / CELL_SIZE);

          let hitWall = false;

          if (nextCx < 0 || nextCx >= GRID_SIZE) {
            this.vx = -this.vx;
            hitWall = true;
          }
          if (nextCy < 0 || nextCy >= GRID_SIZE) {
            this.vy = -this.vy;
            hitWall = true;
          }

          if (hitWall) continue;

          if (nextCx !== curCx || nextCy !== curCy) {
            const targetSquareColor = grid[nextCy][nextCx];

            if (targetSquareColor !== this.id) {
              grid[nextCy][nextCx] = this.id;

              const cellCenterX = (curCx + 0.5) * CELL_SIZE;
              const cellCenterY = (curCy + 0.5) * CELL_SIZE;
              const DEFLECTION_STRENGTH = 0.75; // Intensity of angle deflection

              if (nextCx !== curCx) {
                this.vx = -this.vx;
                // Offset normalized from -1 (top edge) to +1 (bottom edge)
                const offsetY = Math.max(-1, Math.min(1, (this.y - cellCenterY) / (CELL_SIZE / 2)));
                this.vy += offsetY * DEFLECTION_STRENGTH * Math.abs(this.vx);
              }

              if (nextCy !== curCy) {
                this.vy = -this.vy;
                // Offset normalized from -1 (left edge) to +1 (right edge)
                const offsetX = Math.max(-1, Math.min(1, (this.x - cellCenterX) / (CELL_SIZE / 2)));
                this.vx += offsetX * DEFLECTION_STRENGTH * Math.abs(this.vy);
              }

              // Re-normalize velocity to maintain constant overall ball speed
              const currentSpeed = Math.hypot(this.vx, this.vy) || 1;
              this.vx = (this.vx / currentSpeed) * this.speed;
              this.vy = (this.vy / currentSpeed) * this.speed;
            } else {
              this.x = nextX;
              this.y = nextY;
            }
          } else {
            this.x = nextX;
            this.y = nextY;
          }
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        ctx.fillStyle = this.color;
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowBlur = 6;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }
    }

    function initScoreboardDOM() {
      scoreboardEl.innerHTML = '';
      cardElements = {};
      previousRanks = {};

      for (let i = 0; i < NUM_BALLS; i++) {
        const card = document.createElement('div');
        card.className = 'score-card';
        card.style.setProperty('--chip-color', BALL_COLORS[i]);
        card.innerHTML = `
          <div class="color-dot" style="background: ${BALL_COLORS[i]}"></div>
          <span class="label">0</span>
        `;
        scoreboardEl.appendChild(card);
        cardElements[i] = card;
      }

      // Grey count card stays at the rightmost end
      const greyCard = document.createElement('div');
      greyCard.className = 'score-card';
      greyCard.style.opacity = '0.75';
      greyCard.style.order = NUM_BALLS + 1;
      greyCard.innerHTML = `
        <div class="color-dot" style="background: ${DEFAULT_GREY}"></div>
        <span class="label">0</span>
      `;
      scoreboardEl.appendChild(greyCard);
      cardElements['grey'] = greyCard;
    }

    function spawnSparkles(element, color) {
      const numSparkles = 12;
      for (let i = 0; i < numSparkles; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';

        const angle = Math.random() * Math.PI * 2;
        const distance = 25 + Math.random() * 35;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 10;
        const size = 8 + Math.random() * 8;

        sparkle.style.setProperty('--dx', `${dx}px`);
        sparkle.style.setProperty('--dy', `${dy}px`);
        sparkle.style.setProperty('--color', color);
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        sparkle.style.left = `calc(50% - ${size / 2}px)`;
        sparkle.style.top = `calc(50% - ${size / 2}px)`;

        element.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 700);
      }
    }

    function renderScoreboard() {
      const counts = Array(NUM_BALLS).fill(0);
      let greyCount = 0;

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const val = grid[r][c];
          if (val === -1) greyCount++;
          else counts[val]++;
        }
      }

      // Record visual bounding rects before updating DOM order (FLIP technique)
      const oldPositions = {};
      for (let i = 0; i < NUM_BALLS; i++) {
        oldPositions[i] = cardElements[i].getBoundingClientRect();
      }

      // Build items array for sorting
      const items = balls.map((ball, i) => ({
        id: i,
        count: counts[i],
        color: ball.color
      }));

      // Sort descending by count; secondary sort by ID for tie-breaker stability
      items.sort((a, b) => b.count - a.count || a.id - b.id);

      // Update text and target flex layout positions
      items.forEach((item, newRank) => {
        const card = cardElements[item.id];
        const label = card.querySelector('.label');
        label.textContent = `${item.count}`;
        card.style.order = newRank;
      });

      // Calculate instantaneous visual delta and continuously ease to new positions
      items.forEach((item, newRank) => {
        const card = cardElements[item.id];
        const oldRect = oldPositions[item.id];
        const newRect = card.getBoundingClientRect();

        const deltaX = oldRect.left - newRect.left;
        const deltaY = oldRect.top - newRect.top;

        const rankChanged = (previousRanks[item.id] !== undefined && previousRanks[item.id] !== newRank);

        // Immediate start of continuous position easing from current mid-flight coordinates
        if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
          card.animate([
            { transform: `translate(${deltaX}px, ${deltaY}px)` },
            { transform: 'translate(0, 0)' }
          ], {
            duration: 500,
            easing: 'cubic-bezier(0.16, 1, 0.3, 1)' // Continuous fluid deceleration
          });
        }

        if (rankChanged) {
          card.classList.remove('glow');
          void card.offsetWidth; // Force CSS reflow
          card.classList.add('glow');
          spawnSparkles(card, item.color);
        }

        previousRanks[item.id] = newRank;
      });

      // Update Grey score card
      const greyLabel = cardElements['grey'].querySelector('.label');
      greyLabel.textContent = `${greyCount}`;
    }

    function initGame() {
      grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(-1));

      const centerGrid = (GRID_SIZE - 1) / 2;
      const centerX = (centerGrid + 0.5) * CELL_SIZE;
      const centerY = (centerGrid + 0.5) * CELL_SIZE;
      const circleRadius = 4.2 * CELL_SIZE;

      balls = [];

      for (let i = 0; i < NUM_BALLS; i++) {
        const placementAngle = (i * 2 * Math.PI / NUM_BALLS) - Math.PI / 2;
        const bx = centerX + circleRadius * Math.cos(placementAngle);
        const by = centerY + circleRadius * Math.sin(placementAngle);

        const gx = Math.floor(bx / CELL_SIZE);
        const gy = Math.floor(by / CELL_SIZE);
        grid[gy][gx] = i;

        const moveAngle = placementAngle + (Math.random() - 0.5) * 0.8;
        const speed = 220;

        balls.push(new Ball(i, bx, by, moveAngle, speed, BALL_COLORS[i]));
      }

      initScoreboardDOM();
      renderScoreboard();
    }

    function drawGrid() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const ownerIndex = grid[r][c];
          ctx.fillStyle = ownerIndex === -1 ? DEFAULT_GREY : BALL_COLORS[ownerIndex];
          ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);

          ctx.strokeStyle = GRID_LINE_COLOR;
          ctx.lineWidth = 1;
          ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }
    }

    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (dt > 0.05) dt = 0.05;

      if (isRunning) {
        balls.forEach(ball => ball.update(dt));
        renderScoreboard();
      }

      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      drawGrid();
      balls.forEach(ball => ball.draw(ctx));

      requestAnimationFrame(loop);
    }

    btnPlayPause.addEventListener("click", () => {
      isRunning = !isRunning;
      btnPlayPause.textContent = isRunning ? "Pause" : "Play";
    });

    btnReset.addEventListener("click", () => {
      initGame();
      if (!isRunning) {
        isRunning = true;
        btnPlayPause.textContent = "Pause";
      }
    });

    speedSlider.addEventListener("input", (e) => {
      speedMultiplier = parseFloat(e.target.value);
    });

    initGame();
    requestAnimationFrame(loop);
  </script>
  <script src="parental.js" defer></script>
</body>
</html>
