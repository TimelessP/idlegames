<!DOCTYPE html>
<!--
================================================================================
 Dictaphone  -  record, play back, append, import/export WAV, and transcribe
                (experimental, on-device Whisper) without anything leaving the device
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (Automatic / Light / Dark), frame, waveform, meter,
                     transport, keycaps, sheets, toasts
  §2 HTML .......... top bar, deck (time, waveform, meter), controls, output
  §3 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), storage
  §4 LAYERS/INPUT .. history-backed sheets, act on release, gamepad
  §5 AUDIO ......... microphone, MediaRecorder, append, playback, seek, WAV
  §6 PERSIST ....... Cache Storage (unchanged key), volume, theme
  §7 WAVEFORM ...... peaks, playhead, drag to seek, live level meter
  §8 TRANSCRIBE .... Transformers.js loaded only when first used, Whisper tiny.en,
                     30 s segments streamed into the output panel
  §9 UI ............ render, help sheet with keycaps, settings, keyboard, boot
 STORAGE (unchanged)
  Cache Storage "dictaphone-cache" / "dictaphone-audio" ... the recording as WAV
  localStorage dictaphone-volume ... "0".."100"
  localStorage dictaphone-theme .... "light" | "dark" (absent = follow the system)
================================================================================
-->
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="IdleGames">
  <meta name="color-scheme" content="light dark">
  <script src="assets/js/pwa.js" defer></script>
  <title>Dictaphone</title>
  <meta name="description" content="Record, play back and add to voice notes, export WAV, and transcribe on your device. Nothing is uploaded.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try { const t = localStorage.getItem('dictaphone-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  </script>
  <style>
/* ==========================================================================
   §1 CSS
   ========================================================================== */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #eceef2; --line: #d6dae1; --text: #14171c; --text-2: #4a5160; --text-3: #6b7383;
  --accent: #0b5cad; --accent-soft: #e2ecf8; --on-accent: #ffffff; --rec: #c62828; --rec-soft: #fde4e4; --ok: #1d7a43; --warn: #9a4a00; --bad: #b3261e;
  --wave: #8fa9c8; --wave-played: #0b5cad; --deck: #ffffff;
  --sel-bg: #c4d8f2; --sel-fg: #14171c; --key-bg: #ffffff; --key-edge: #b9bec8;
  --fs: 17px; --tap: 48px; --r: 8px; --app-h: 100dvh;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
    --accent: #6ea8ff; --accent-soft: #1c2a42; --on-accent: #08121f; --rec: #ff6b6b; --rec-soft: #3a1b1b; --ok: #5fd08c; --warn: #ffb35c; --bad: #ff7a70;
    --wave: #3d5576; --wave-played: #6ea8ff; --deck: #12151b; --sel-bg: #2b4a78; --sel-fg: #ffffff; --key-bg: #262a33; --key-edge: #111318; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #20242c; --line: #2e333d; --text: #eef0f4; --text-2: #b8bfcc; --text-3: #8d95a5;
  --accent: #6ea8ff; --accent-soft: #1c2a42; --on-accent: #08121f; --rec: #ff6b6b; --rec-soft: #3a1b1b; --ok: #5fd08c; --warn: #ffb35c; --bad: #ff7a70;
  --wave: #3d5576; --wave-played: #6ea8ff; --deck: #12151b; --sel-bg: #2b4a78; --sel-fg: #ffffff; --key-bg: #262a33; --key-edge: #111318; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::selection { background: var(--sel-bg); color: var(--sel-fg); }
:focus { outline: none; } :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
a { color: var(--accent); }
svg.i { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); min-width: var(--tap); padding: 0 1em;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); } .btn[disabled] { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: var(--tap); }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 650; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .bar .grow { flex: 1; }
.muted { color: var(--text-2); } .small { font-size: .9em; }

/* ---- frame ---- */
#app { position: fixed; inset: 0; height: var(--app-h); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
#top { display: flex; align-items: center; gap: 6px; padding: calc(4px + var(--safe-t)) calc(8px + var(--safe-r)) 4px calc(8px + var(--safe-l)); background: var(--surface); border-bottom: 1px solid var(--line); min-height: 58px; }
#top > * { flex-shrink: 0; }
#top .spacer { flex: 1 1 0; min-width: 0; flex-shrink: 1; }
#top h1 { font-size: 1.08em; font-weight: 750; white-space: nowrap; }
#top.compact .lbl { display: none; } #top.compact .btn.lab { width: var(--tap); padding: 0; }
#top.tiny h1 { display: none; }
#main { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.wrap { max-width: 760px; margin: 0 auto; padding: 12px calc(12px + var(--safe-r)) calc(24px + var(--safe-b)) calc(12px + var(--safe-l)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 1000px) and (min-aspect-ratio: 5/4) {   /* wide: deck and controls side by side */
  .wrap { max-width: 1180px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 1fr); align-items: start; }
  .deck { position: sticky; top: 12px; } #side { grid-column: 2; grid-row: 1 / span 3; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > h2 { font-size: .8em; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }

/* ---- deck: status, time, waveform, meter ---- */
.deck { background: var(--deck); }
.statusline { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); flex: none; }
.statusline[data-s="rec"] .dot { background: var(--rec); box-shadow: 0 0 0 4px var(--rec-soft); animation: pulse 1.1s ease-in-out infinite; }
.statusline[data-s="play"] .dot { background: var(--ok); }
.statusline[data-s="busy"] .dot { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.statusline b { font-weight: 650; } .statusline[data-s="rec"] b { color: var(--rec); }
.time { font-variant-numeric: tabular-nums; font-size: clamp(2.2em, 9vw, 3.2em); font-weight: 650; letter-spacing: .01em; line-height: 1.05; display: flex; align-items: baseline; gap: .3em; flex-wrap: wrap; }
.time small { font-size: .42em; color: var(--text-2); font-weight: 500; }
.wave { position: relative; height: clamp(96px, 22vh, 170px); border-radius: var(--r); background: var(--surface-2); overflow: hidden; touch-action: none; cursor: pointer; }
.wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wave:focus-visible { outline-offset: 2px; }
.wave .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: var(--text-2); pointer-events: none; }
.wave[aria-disabled="true"] { cursor: default; }
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.meter .lab { font-size: .85em; color: var(--text-2); }
.meter .track { height: 14px; border-radius: 7px; background: var(--surface-2); overflow: hidden; position: relative; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 7px; background: linear-gradient(90deg, #2e9e5b 0%, #2e9e5b 60%, #e0a100 80%, #d33 100%); background-size: var(--meter-w, 400px) 100%; }

/* ---- controls ---- */
.transport { display: grid; grid-template-columns: 1fr 1.3fr 1fr 1fr; gap: 8px; }
.transport .btn { min-height: 60px; flex-direction: column; gap: 2px; font-size: .85em; padding: 0 4px; }
.transport .btn svg.i { width: 1.7em; height: 1.7em; }
.transport .btn.primary { font-size: .95em; }
.recrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.recbtn { min-height: 64px; font-size: 1.05em; font-weight: 650; }
.recbtn .rd { width: 18px; height: 18px; border-radius: 50%; background: var(--rec); flex: none; }
.recbtn[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: #fff; }
.recbtn[aria-pressed="true"] .rd { background: #fff; border-radius: 4px; }
.ptt { min-height: 64px; font-size: 1.05em; font-weight: 650; touch-action: none; -webkit-touch-callout: none; }
.ptt.on { background: var(--rec-soft); border-color: var(--rec); color: var(--rec); }
.vol { display: grid; grid-template-columns: auto minmax(0, 1fr) 3.4em; gap: 10px; align-items: center; }
.vol input { width: 100%; height: var(--tap); accent-color: var(--accent); cursor: pointer; }
.vol .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.actions .btn { justify-content: flex-start; }
.out pre, .out .txt { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 42vh; overflow-y: auto; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); line-height: 1.55; }
.out pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; } .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: .9em; color: var(--text-2); } .note svg.i { color: var(--text-3); margin-top: .1em; }

/* ---- keycaps ---- */
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 2.1em; height: 2.1em; padding: 0 .55em; font: 600 .85em/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text);
  background: linear-gradient(var(--key-bg), var(--surface-2)); border: 1px solid var(--line); border-bottom-width: 3px; border-bottom-color: var(--key-edge); border-radius: 7px; box-shadow: 0 1px 0 rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.35); white-space: nowrap; }
kbd.wide { min-width: 5.5em; }
.keys { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.keys .k { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.keys .k:last-child { border-bottom: 0; }
.keys .k .combo { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: .85em; flex: none; }
@media (min-width: 620px) { .keys { grid-template-columns: 1fr 1fr; column-gap: 28px; } .keys .k:nth-last-child(2):nth-child(odd) { border-bottom: 0; } }

/* ---- sheets ---- */
#sheets { position: fixed; inset: 0; z-index: 1000; display: none; height: var(--app-h); }
#sheets.on { display: block; }
.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.55); }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100vw - 16px)); max-height: calc(var(--app-h) - 16px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden; }
@media (max-width: 760px) { .sheet { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; border-radius: 14px 14px 0 0; max-height: calc(var(--app-h) - 24px - var(--safe-t)); padding-bottom: var(--safe-b); } }
.s-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.s-head h2 { flex: 1; font-size: 1.1em; }
.s-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.s-body h3 { font-size: .8em; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.s-body p, .s-body li { color: var(--text-2); } .s-body b { color: var(--text); }
.s-body ul { padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.sec { display: flex; flex-direction: column; gap: 8px; } .sec + .sec { padding-top: 14px; border-top: 1px solid var(--line); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; } .seg .btn { flex: 1 1 0; }

#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(6px + var(--safe-t)); z-index: 1100; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, 94vw); }
.toast { background: var(--text); color: var(--bg); padding: .45em .55em .45em 1em; min-height: 44px; border-radius: var(--r); box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; gap: .6em; align-items: center; }
.toast.error { background: var(--bad); color: #fff; }
.toast .act { pointer-events: auto; background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px; min-height: 36px; padding: 0 .8em; cursor: pointer; font-weight: 650; }
.toast::selection, .toast *::selection { background: var(--accent); color: var(--on-accent); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  
/* ---- themed hover states (filled colours move toward the text colour; disabled never reacts) ---- */
@media (hover: hover) {
  .btn.primary:hover:not([disabled]), .btn-send:hover:not([disabled]) { background: color-mix(in srgb, var(--primary-bg, var(--accent)) 82%, var(--text)); border-color: color-mix(in srgb, var(--primary-bg, var(--accent)) 82%, var(--text)); }
  .btn[aria-pressed="true"]:hover:not([disabled]), .btn[aria-selected="true"]:hover:not([disabled]) { background: color-mix(in srgb, var(--accent-soft) 72%, var(--accent)); }
  .btn.danger.solid:hover:not([disabled]) { background: color-mix(in srgb, var(--bad) 82%, var(--text)); border-color: color-mix(in srgb, var(--bad) 82%, var(--text)); }
  .btn.danger:not(.solid):hover:not([disabled]) { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
  .btn:not(.primary):not(.ghost)[disabled]:hover { background: var(--surface); }
  .btn.ghost[disabled]:hover { background: transparent; }
  .toast .act:hover { background: color-mix(in srgb, currentColor 18%, transparent); }
  .recbtn[aria-pressed="true"]:hover:not([disabled]) { background: color-mix(in srgb, var(--rec) 82%, var(--text)); border-color: color-mix(in srgb, var(--rec) 82%, var(--text)); }
  .ptt.on:hover:not([disabled]) { background: color-mix(in srgb, var(--rec-soft) 70%, var(--rec)); }
}
</style>
</head>
<body>
<!-- ==========================================================================
     §2 HTML
     ========================================================================== -->
<div id="app">
  <header id="top">
    <a class="btn ghost lab" id="games" href="index.html" aria-label="Back to Games"></a>
    <h1>Dictaphone</h1>
    <span class="spacer"></span>
    <button class="btn ghost lab" type="button" id="help-btn" aria-label="Help and keyboard shortcuts"></button>
    <button class="btn icon ghost" type="button" id="settings-btn" aria-label="Settings"></button>
  </header>
  <main id="main">
    <div class="wrap">
      <section class="panel deck" aria-label="Recording">
        <div class="statusline" id="statusline" data-s="idle" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><b id="status">Ready</b><span class="muted small" id="substatus"></span></div>
        <div class="time"><span id="t-cur">0:00</span><small>of <span id="t-tot">0:00</span></small></div>
        <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
          <canvas id="wave-c"></canvas>
          <div class="empty" id="wave-empty">No recording yet. Press Record, or hold Hold to talk.</div>
        </div>
        <div class="meter"><span class="lab">Level</span><div class="track" aria-hidden="true"><div class="fill" id="meter"></div></div></div>
      </section>

      <div id="side" style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <section class="panel" aria-label="Record">
          <div class="recrow">
            <button class="btn recbtn" type="button" id="rec-btn" aria-pressed="false"><span class="rd" aria-hidden="true"></span><span id="rec-lbl">Record</span></button>
            <button class="btn ptt" type="button" id="ptt-btn" aria-label="Hold to talk: records while held"></button>
          </div>
          <p class="muted small">New recordings are added to the end of what is already there.</p>
        </section>
        <section class="panel" aria-label="Playback">
          <div class="transport">
            <button class="btn" type="button" id="back-btn" aria-label="Back 10 seconds"></button>
            <button class="btn primary" type="button" id="play-btn"></button>
            <button class="btn" type="button" id="stop-btn" aria-label="Stop and return to the start"></button>
            <button class="btn" type="button" id="fwd-btn" aria-label="Forward 10 seconds"></button>
          </div>
          <div class="vol"><label for="vol" class="muted small" id="vol-ic"></label><input type="range" id="vol" min="0" max="100" step="1" value="75" aria-label="Playback volume"><span class="val" id="vol-val">75%</span></div>
        </section>
        <section class="panel" aria-label="File and transcription">
          <h2>File</h2>
          <div class="actions">
            <button class="btn" type="button" id="import-btn"></button>
            <button class="btn" type="button" id="export-btn"></button>
            <button class="btn" type="button" id="transcribe-btn"></button>
            <button class="btn danger" type="button" id="erase-btn"></button>
          </div>
          <input type="file" id="import-file" accept="audio/*" hidden>
          <div class="note"><span id="privacy-ic"></span><span>Your audio stays in this browser and is never uploaded. It is kept between visits; use Export to save a copy.</span></div>
        </section>
        <section class="panel out" id="out" aria-label="Transcription" hidden>
          <h2 id="out-h">Transcription</h2>
          <div class="progress" id="out-prog" hidden><div></div></div>
          <div class="muted small" id="out-status" aria-live="polite"></div>
          <div class="txt" id="out-text" hidden></div>
          <pre id="out-json" hidden></pre>
          <div class="bar" id="out-acts" hidden>
            <button class="btn" type="button" id="out-copy"></button>
            <button class="btn" type="button" id="out-dl"></button>
            <span class="grow"></span>
            <button class="btn ghost" type="button" id="out-close" aria-label="Close transcription"></button>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<div id="sheets"><div class="backdrop"></div></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
// =============================================================================
// §3 UTILITIES
// =============================================================================

}
const S = (d, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>`;
const p = d => `<path d="${d}"/>`;
const ICON = {

      const lo = this.peaks[x * 2], hi = this.peaks[x * 2 + 1], top = mid - Math.max(hi, 0.012) * mid * .92, bot = mid - Math.min(lo, -0.012) * mid * .92;
      g.fillStyle = (x + .5) / bars <= played ? colP : col; g.fillRect(x * bw + bw * .18, top, Math.max(1, bw * .64), bot - top);
    }
    const px = Math.round(played * W); g.fillStyle = css('--text'); g.fillRect(Math.min(W - 2 * d, px), 0, 2 * d, H);
  },
  /** while recording: a scrolling trace of the live input */
  live: [],
  drawLive(g, W, H) {
    const d = devicePixelRatio || 1, n = Math.floor(W / (3 * d)), mid = H / 2, bw = W / n, a = this.live.slice(-n);
    g.fillStyle = css('--rec');
    a.forEach((v, i) => { const hgt = Math.max(2 * d, v * H * .9); g.fillRect((n - a.length + i) * bw + bw * .18, mid - hgt / 2, Math.max(1, bw * .64), hgt); });
  },
  level() {
    if (!DP.analyser) return 0;
    DP.analyser.getFloatTimeDomainData(DP.data); let s = 0; for (const v of DP.data) s += v * v;
    const rms = Math.sqrt(s / DP.data.length), db = 20 * Math.log10(rms || 1e-8);
    return Math.max(0, Math.min(1, (db + 60) / 60));   // -60 dB .. 0 dB
  },
};

// =============================================================================
// §8 TRANSCRIBE  -  experimental, on device; the library loads only when first used
// =============================================================================
const TX = {
  pipe: null, loading: null, running: false, result: null, mode: 'text',
  async ensure(onMsg) {
    if (this.pipe) return this.pipe;
    if (!this.loading) this.loading = (async () => {
      onMsg('Loading the speech model (first time only; about 150 MB)…', 0);
      let mod; try { mod = await import('./assets/vendor/transformers/transformers.min.js'); } catch (e) { mod = await import('./node_modules/@huggingface/transformers/dist/transformers.min.js'); }
      mod.env.allowLocalModels = false; try { mod.env.backends.onnx.logLevel = 'error'; } catch (e) { /* older builds */ }
      this.pipe = await mod.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', { quantized: false,
        progress_callback: pr => { if (pr.status === 'progress') onMsg(`Downloading ${pr.file ? pr.file.split('/').pop() : 'model'} (${Math.min(100, Math.round(pr.progress))}%)`, null); } });
      return this.pipe;
    })().catch(e => { this.loading = null; throw e; });
    return this.loading;
  },
  /** 16 kHz mono, boosted to a sensible peak (unchanged from before) */
  prepare() {
    const b = DP.buffer, rate = b.sampleRate, target = 16000; let mono;
    if (b.numberOfChannels === 2) { const L = b.getChannelData(0), R = b.getChannelData(1), k = Math.SQRT2; mono = new Float32Array(L.length); for (let i = 0; i < L.length; i++) mono[i] = k * (L[i] + R[i]) / 2; }
    else mono = new Float32Array(b.getChannelData(0));
    let a = mono;
    if (rate !== target) { const r = rate / target, len = Math.round(mono.length / r); a = new Float32Array(len); for (let i = 0; i < len; i++) { const o = i * r, i0 = Math.floor(o), i1 = Math.min(i0 + 1, mono.length - 1), t = o - i0; a[i] = mono[i0] * (1 - t) + mono[i1] * t; } }
    let peak = 0; for (const v of a) peak = Math.max(peak, Math.abs(v));
    if (peak > 0 && peak < .8 * .98) { const k = .8 / peak; for (let i = 0; i < a.length; i++) a[i] *= k; }
    return a;
  },
  async run(mode) {
    if (!DP.buffer || this.running) return;
    this.running = true; this.mode = mode; this.result = null; UI.render();
    const out = $('#out'), prog = $('#out-prog'), bar = prog.firstElementChild, st = $('#out-status'), txt = $('#out-text'), pre = $('#out-json');
    out.hidden = false; $('#out-h').textContent = mode === 'json' ? 'Transcription (JSON with timings)' : 'Transcription'; prog.hidden = false; bar.style.width = '0%';
    txt.hidden = mode !== 'text'; pre.hidden = mode !== 'json'; txt.textContent = ''; pre.textContent = ''; $('#out-acts').hidden = true;
    out.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const msg = (m, f) => { st.textContent = m; if (f != null) bar.style.width = `${Math.round(f * 100)}%`; };
    const t0 = performance.now();
    try {
      const pipe = await this.ensure(msg);
      msg('Preparing the audio…', 0); await new Promise(r => setTimeout(r, 20));
      const audio = this.prepare(), SR = 16000, SEG = 30 * SR, total = Math.ceil(audio.length / SEG), base = { top_k: 0, do_sample: false, language: 'english', task: 'transcribe', temperature: 0 };
      let text = ''; const chunks = [];
      for (let i = 0; i < total; i++) {
        const s = i * SEG, e = Math.min(s + SEG, audio.length), seg = audio.subarray(s, e), from = s / SR, to = e / SR;
        msg(`Transcribing ${fmt(from)} to ${fmt(to)} (part ${i + 1} of ${total})…`, i / total);
        let r = null;
        try { r = await pipe(seg, { ...base, return_timestamps: mode === 'json' ? 'word' : true }); if (!r || !r.text || !r.text.trim()) r = await pipe(seg); }
        catch (err) { console.warn(err); r = await pipe(seg); }
        const t = (r && r.text) || '';
        if (t) { if (text && !/\s$/.test(text)) text += ' '; text += t; }
        if (mode === 'json') { if (r && Array.isArray(r.chunks) && r.chunks.length) for (const ch of r.chunks) { const ts = ch.timestamp || [0, 0]; chunks.push({ text: ch.text || '', timestamp: [(ts[0] || 0) + from, (ts[1] == null ? to - from : ts[1]) + from] }); }
          else if (t) chunks.push({ text: t, timestamp: [from, to] });
          pre.textContent = JSON.stringify({ text, chunks: chunks.slice(-10), total_chunks: chunks.length }, null, 2); }
        else txt.textContent = text.trim();
      }
      this.result = mode === 'json' ? JSON.stringify({ text, chunks, duration: DP.duration(), generated_at: new Date().toISOString() }, null, 2) : text.trim();
      if (mode === 'json') pre.textContent = this.result; else txt.textContent = this.result || '(No speech recognised.)';
      msg(`Done in ${((performance.now() - t0) / 1000).toFixed(1)} s. Experimental: check it before relying on it.`, 1);
      prog.hidden = true; $('#out-acts').hidden = false; toast('Transcription finished.', 'success');
    } catch (e) {
      console.error(e); prog.hidden = true; st.textContent = '';
      txt.hidden = false; pre.hidden = true; txt.textContent = `Transcription failed: ${e.message || e}. The model needs a one-off download, so check your connection and try again.`;
      $('#out-acts').hidden = false; toast('Transcription failed.', 'error');
    }
    this.running = false; UI.render();
  },
  ask() {
    if (!DP.buffer) return;
    LAYERS.open('Transcribe (experimental)', b => b.append(
      h('p', { text: 'Speech is turned into text entirely in this browser: nothing is uploaded. The first time, the English speech model (Whisper tiny) is downloaded once, then cached.' }),
      h('p', { text: 'It can be slow on older devices and uses noticeable battery while it runs. Accuracy varies; check the result.' }),
      h('div', { class: 'bar' },
        h('button', { class: 'btn primary', type: 'button', 'data-autofocus': true, html: btnHTML(ICON.text, 'Plain text'), onclick: () => { LAYERS.back(); setTimeout(() => this.run('text'), 60); } }),
        h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.text, 'JSON with timings'), onclick: () => { LAYERS.back(); setTimeout(() => this.run('json'), 60); } }))));
  },
};

// =============================================================================
// §9 UI
// =============================================================================
const UI = {
  sub(t) { $('#substatus').textContent = t; },
  render() {
    const has = !!DP.buffer, rec = DP.recording, busy = !!DP.busy;
    const rb = $('#rec-btn'); rb.setAttribute('aria-pressed', String(rec && !DP.ptt)); $('#rec-lbl').textContent = rec && !DP.ptt ? 'Stop recording' : 'Record';
    rb.disabled = busy || (rec && !!DP.ptt) || !!DP.ptt;
    const pt = $('#ptt-btn'); pt.classList.toggle('on', !!DP.ptt); pt.disabled = busy || (rec && !DP.ptt);
    pt.innerHTML = btnHTML(ICON.mic, DP.ptt && rec ? 'Recording… release to stop' : 'Hold to talk');
    const pb = $('#play-btn'); pb.innerHTML = DP.playing ? ICON.pause + '<span>Pause</span>' : ICON.play + '<span>Play</span>'; pb.disabled = !has || rec || busy;
    pb.setAttribute('aria-label', DP.playing ? 'Pause' : 'Play');
    for (const id of ['back-btn', 'fwd-btn']) $('#' + id).disabled = !has || rec || busy;
    $('#stop-btn').disabled = !(DP.playing || rec || DP.position() > 0);
    $('#export-btn').disabled = !has || rec || busy; $('#erase-btn').disabled = !has || rec || busy;
    $('#transcribe-btn').disabled = !has || rec || busy || TX.running; $('#import-btn').disabled = rec || busy;
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = DP.playing ? 'playing' : has ? 'paused' : 'none';
    this.time();
  },
  time() {
    const tot = DP.recording ? DP.recStartPos + (DP.ctx.currentTime - DP.recStartCtx) : DP.duration(), cur = DP.recording ? tot : DP.position();
    $('#t-cur').textContent = fmt(cur); $('#t-tot').textContent = fmt(tot);
    const w = $('#wave'); w.setAttribute('aria-valuemax', String(Math.round(tot))); w.setAttribute('aria-valuenow', String(Math.round(cur))); w.setAttribute('aria-valuetext', `${spoken(cur)} of ${spoken(tot)}`);
    WAVE.draw();
  },
  /** one loop while recording or playing: time, waveform, meter */
  ticking: false,
  tick() {
    if (this.ticking) return; this.ticking = true;
    const loop = () => {
      const active = DP.recording || DP.playing, lv = active ? WAVE.level() : 0;
      $('#meter').style.width = `${Math.round(lv * 100)}%`;
      if (DP.recording) { WAVE.live.push(lv); if (WAVE.live.length > 2000) WAVE.live.splice(0, 1000); } else WAVE.live = [];
      if (!DP.dragging) this.time();
      if (active) requestAnimationFrame(loop); else { this.ticking = false; $('#meter').style.width = '0%'; this.time(); }
    };
    requestAnimationFrame(loop);
  },
};

const KEYMAP = [
  [['R'], 'Record, or stop recording'], [['Hold', 'T'], 'Hold to talk'], [['Space'], 'Stop (back to the start)'], [['P'], 'Play or pause'],
  [['←'], 'Back 10 seconds'], [['→'], 'Forward 10 seconds'], [['I'], 'Import an audio file'], [['E'], 'Export as WAV'],
  [['X'], 'Transcribe to text'], [['J'], 'Transcribe to JSON'], [['Delete'], 'Erase the recording'], [['M'], 'Change theme'], [['?'], 'This help'], [['Esc'], 'Close a panel'],
];
function openHelp() {
  LAYERS.open('Help and shortcuts', b => {
    const keys = h('div', { class: 'keys' }, KEYMAP.map(([ks, what]) => h('div', { class: 'k' }, h('span', { text: what }),
      h('span', { class: 'combo' }, ks.map(k => k === 'Hold' ? h('span', { text: 'hold' }) : h('kbd', { class: k.length > 2 ? 'wide' : null, text: k }))))));
    b.append(
      h('div', { class: 'sec' }, h('h3', { text: 'How it works' }), h('ul', {},
        h('li', { html: '<b>Record</b> starts and stops a take. <b>Hold to talk</b> records only while you hold it (or hold <kbd>T</kbd>).' }),
        h('li', { html: 'Each new take is <b>added to the end</b>. Tap or drag the waveform to jump anywhere.' }),
        h('li', { html: 'Your recording is <b>kept in this browser</b> between visits and never uploaded. <b>Export</b> saves a WAV file.' }),
        h('li', { html: '<b>Transcribe</b> (experimental) turns speech into text on this device.' }))),
      h('div', { class: 'sec' }, h('h3', { text: 'Keyboard' }), keys,
        h('p', { class: 'small', html: 'On the waveform, <kbd>←</kbd> <kbd>→</kbd> move 5 seconds and <kbd>Home</kbd> <kbd>End</kbd> jump to the start or end.' })),
      h('div', { class: 'sec' }, h('h3', { text: 'Controller' }), h('p', { class: 'small', text: 'D-pad moves between buttons, A presses, B goes back, X plays or pauses, LB and RB skip 10 seconds.' })));
  });
}
function openSettings() {
  LAYERS.open('Settings', b => {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Theme' }), paint = () => $$('button', seg).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.t === THEME.get())));
    for (const [t, ic, l] of [['system', ICON.auto, 'Automatic'], ['light', ICON.sun, 'Light'], ['dark', ICON.moon, 'Dark']]) seg.append(h('button', { class: 'btn', type: 'button', 'data-t': t, html: btnHTML(ic, l), onclick: () => { THEME.set(t); paint(); } }));
    paint(); b.append(h('div', { class: 'sec' }, h('h3', { text: 'Theme' }), seg));
  });
}
function confirmErase() {
  if (!DP.buffer) return;
  LAYERS.open('Erase the recording?', b => b.append(h('p', { text: `The whole recording (${fmt(DP.duration())}) will be removed from this browser. You can Undo straight afterwards; export first if you want a copy.` }),
    h('div', { class: 'bar' }, h('button', { class: 'btn', type: 'button', text: 'Cancel', 'data-autofocus': true, onclick: () => LAYERS.back() }), h('span', { class: 'grow' }),
      h('button', { class: 'btn danger solid', type: 'button', text: 'Erase', onclick: () => { LAYERS.back(); setTimeout(() => DP.erase(), 60); } }))));
}

function fitTop() { const t = $('#top'), sp = $('.spacer', t), over = () => t.scrollWidth > t.clientWidth || sp.getBoundingClientRect().width < 8; t.classList.remove('compact', 'tiny'); for (const c of ['compact', 'tiny']) if (over()) t.classList.add(c); }
function setViewportHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty('--app-h', `${Math.round(vv ? vv.height : innerHeight)}px`); }

async function boot() {
  LAYERS.init(); GAMEPAD.init(); DP.init();
  $('#games').innerHTML = btnHTML(ICON.back, 'Games'); $('#help-btn').innerHTML = btnHTML(ICON.help, 'Help'); $('#settings-btn').innerHTML = ICON.settings;
  $('#back-btn').innerHTML = ICON.rew + '<span>−10 s</span>'; $('#fwd-btn').innerHTML = ICON.ffw + '<span>+10 s</span>'; $('#stop-btn').innerHTML = ICON.stop + '<span>Stop</span>';
  $('#vol-ic').innerHTML = ICON.vol + '<span class="sr">Volume</span>'; $('#privacy-ic').outerHTML = ICON.lock;
  $('#import-btn').innerHTML = btnHTML(ICON.open, 'Import…'); $('#export-btn').innerHTML = btnHTML(ICON.save, 'Export WAV');
  $('#transcribe-btn').innerHTML = btnHTML(ICON.text, 'Transcribe…'); $('#erase-btn').innerHTML = btnHTML(ICON.trash, 'Erase…');
  $('#out-copy').innerHTML = btnHTML(ICON.copy, 'Copy'); $('#out-dl').innerHTML = btnHTML(ICON.save, 'Download'); $('#out-close').innerHTML = ICON.x;

  $('#rec-btn').addEventListener('click', () => DP.toggleRecord());
  // hold to talk: a held action, so it starts on press and stops on release (or if the pointer is lost)
  const ptt = $('#ptt-btn');
  ptt.addEventListener('pointerdown', e => { if (e.button > 0) return; e.preventDefault(); ptt.setPointerCapture(e.pointerId); DP.pttDown(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) ptt.addEventListener(ev, () => DP.pttUp());
  ptt.addEventListener('contextmenu', e => e.preventDefault());
  ptt.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); e.stopPropagation(); DP.pttDown(); } });
  ptt.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); DP.pttUp(); } });
  ptt.addEventListener('click', e => e.preventDefault());
  $('#play-btn').addEventListener('click', () => DP.togglePlay());
  $('#stop-btn').addEventListener('click', () => DP.stop());
  $('#back-btn').addEventListener('click', () => DP.skip(-10)); $('#fwd-btn').addEventListener('click', () => DP.skip(10));
  $('#vol').addEventListener('input', e => DP.setVolume(+e.target.value));
  $('#import-btn').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; DP.importFile(f); });
  $('#export-btn').addEventListener('click', () => DP.exportWav());
  $('#transcribe-btn').addEventListener('click', () => TX.ask());
  $('#erase-btn').addEventListener('click', confirmErase);
  $('#help-btn').addEventListener('click', openHelp); $('#settings-btn').addEventListener('click', openSettings);
  $('#out-copy').addEventListener('click', () => navigator.clipboard.writeText(TX.result || $('#out-text').textContent).then(() => toast('Copied.', 'success'), () => toast('Copy failed.', 'error')));
  $('#out-dl').addEventListener('click', () => { if (!TX.result) return; const json = TX.mode === 'json'; const name = `transcript_${stamp()}.${json ? 'json' : 'txt'}`; download(new Blob([TX.result], { type: json ? 'application/json' : 'text/plain' }), name); toast(`Saved ${name}`, 'success'); });
  $('#out-close').addEventListener('click', () => { $('#out').hidden = true; });

  // waveform: tap or drag to seek (direct: the playhead follows the finger), keys to step
  const wave = $('#wave'), at = e => { const r = wave.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * DP.duration(); };
  wave.addEventListener('pointerdown', e => { if (!DP.buffer || DP.recording) return; wave.setPointerCapture(e.pointerId); DP.dragging = true; DP.wasPlaying = DP.playing; if (DP.playing) DP.pause(); DP.pos = at(e); UI.time(); });
  wave.addEventListener('pointermove', e => { if (DP.dragging) { DP.pos = at(e); UI.time(); } });
  const endDrag = () => { if (!DP.dragging) return; DP.dragging = false; if (DP.wasPlaying) DP.play(); else UI.render(); };
  wave.addEventListener('pointerup', endDrag); wave.addEventListener('pointercancel', endDrag);
  wave.addEventListener('keydown', e => {
    if (!DP.buffer || DP.recording) return;
    const k = { ArrowLeft: -5, ArrowRight: 5, ArrowDown: -5, ArrowUp: 5, PageDown: -30, PageUp: 30 }[e.key];
    if (k) { e.preventDefault(); e.stopPropagation(); DP.seek(DP.position() + k); } else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); DP.seek(e.key === 'Home' ? 0 : DP.duration()); }
  });
  new ResizeObserver(() => WAVE.draw()).observe(wave);

  // keyboard: discrete keys act on release in the same layer; T is held, so it acts on press and release
  const KEYS = {}, typing = e => e.target.closest && e.target.closest('input, textarea, select');
  const ownsKey = e => e.target.closest && (e.target.closest('button, a, [role="slider"]') && (e.key === ' ' || e.key === 'Enter' || e.key.startsWith('Arrow')));
  addEventListener('keydown', e => {
    if (!e.repeat) KEYS[e.key] = LAYERS.stack.length;
    if (LAYERS.stack.length || typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key === 't' || e.key === 'T') && !e.repeat) { e.preventDefault(); DP.pttDown(); return; }
    if ((e.key === ' ' || e.key.startsWith('Arrow')) && !ownsKey(e)) e.preventDefault();
  });
  addEventListener('keyup', e => {
    if (e.key === 't' || e.key === 'T') { if (DP.ptt) DP.pttUp(); delete KEYS[e.key]; return; }
    const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (!same) return;
    if (e.key === 'Escape') { if (LAYERS.stack.length) LAYERS.back(); return; }
    if (LAYERS.stack.length || typing(e) || e.ctrlKey || e.metaKey || e.altKey || ownsKey(e)) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const act = { r: () => DP.toggleRecord(), ' ': () => DP.stop(), p: () => DP.togglePlay(), ArrowLeft: () => DP.skip(-10), ArrowRight: () => DP.skip(10),
      i: () => !$('#import-btn').disabled && $('#import-file').click(), e: () => DP.exportWav(), x: () => !$('#transcribe-btn').disabled && TX.run('text'), j: () => !$('#transcribe-btn').disabled && TX.run('json'),
      Delete: confirmErase, m: () => THEME.cycle(), '?': openHelp }[k];
    if (act) act();
  });
  addEventListener('blur', () => { if (DP.ptt) DP.pttUp(); });   // never leave the microphone on if the window loses focus mid-hold
  if ('mediaSession' in navigator) { try { navigator.mediaSession.setActionHandler('play', () => DP.play()); navigator.mediaSession.setActionHandler('pause', () => DP.pause()); navigator.mediaSession.setActionHandler('stop', () => DP.stop()); } catch (e) { /* unsupported action */ } }
  addEventListener('beforeunload', e => { if (DP.recording) { e.preventDefault(); e.returnValue = ''; } });

  setViewportHeight();
  if (window.visualViewport) visualViewport.addEventListener('resize', setViewportHeight); else addEventListener('resize', setViewportHeight);
  new ResizeObserver(fitTop).observe($('#top')); fitTop();
  const v = parseInt(store.get('dictaphone-volume'), 10); DP.setVolume(Number.isFinite(v) ? v : 75);
  THEME.apply(); UI.render();
  await PERSIST.load(); UI.render();
}
boot();
