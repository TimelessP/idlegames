const FESTIVE = {
  /** saves get the festive fields (called before the world is entered) */
  ensure(S) {
    S.letters = S.letters || {}; S.mail = S.mail || []; S.jokes = S.jokes || []; S.fest = S.fest || {}; S.nextLetter = S.nextLetter || 0;
    if (!('hat' in S.equip)) S.equip.hat = null;
  },
  /** in-game days: one full day and night each */
  dayNum() { return Math.floor(SAVE.S.clock / (CFG.DAY_LEN + CFG.NIGHT_LEN)); },
  find(pred) { for (const e of GAME.ents.values()) if (pred(e)) return e; return null; },
  // ---- letters to Santa ----
  santaAddr: to => /santa|north\s*pole|father\s*christmas|st\.?\s*nick|saint\s*nicholas|kris\s*kringle|p[eè]re\s*no[eë]l|sinterklaas/i.test(to || ''),
  newLetter() { const S = SAVE.S, uid = 'L' + (S.nextLetter = (S.nextLetter || 0) + 1); S.letters[uid] = { to: 'Santa, The North Pole', text: '', state: 'draft', seen: false }; return { t: 'letter', n: 1, uid }; },
  written(i) { const L = i.t === 'letter' && SAVE.S.letters[i.uid]; return !!(L && L.text.trim()); },
  postedCount() { return Object.values(SAVE.S.letters).filter(l => l.state !== 'draft').length; },
  stamped() { return SAVE.S.inv.find(i => { const L = i.t === 'letter' && SAVE.S.letters[i.uid]; return L && L.seen && L.state !== 'given' && this.santaAddr(L.to); }); },
  post(inst) {
    const S = SAVE.S, L = S.letters[inst.uid];
    if (!L || !L.text.trim()) { HUD.toast('That page is blank. Write your letter first.'); return; }
    if (!this.santaAddr(L.to)) { HUD.toast('This postbox only takes letters for the North Pole. Address it to Santa, The North Pole.', 4500); return; }
    const i = S.inv.indexOf(inst); if (i < 0) return;
    S.inv.splice(i, 1); L.state = 'posted'; if (!S.mail.includes(inst.uid)) S.mail.push(inst.uid);

    HUD.toast('Posted! A robin hops onto the box and gives a nod. Your letter will reach the North Pole before you do.', 4500);
  },

  // ---- advent calendars: one door a day, and every house keeps its own ----
  adventReady(e) { return (e.d.opened | 0) < 24 && (e.d.day == null || e.d.day < this.dayNum()); },
  adventTreat(e, n) {

    const pool = ['candy_cane', 'choc_coin', 'gingerbread', 'mince_pie', 'cracker', 'orn_robin', 'orn_bell', 'orn_flake', 'candy_cane', 'cracker', 'letter', 'choc_coin'];
    const t = pool[ihash(hashStr(e.id), n, 77) % pool.length]; return { t, n: t === 'choc_coin' ? 3 : 1 };

  openDoor(e, num) {

      orn.push(k === 'bauble' ? { k, c: rng.pick(BAUBLES), x: Math.round(x), y: Math.round(y) } : { k, x: Math.round(x), y: Math.round(y) });

    if (!santa.d.met) return { text: 'Go north through the melted gateway and say hello to Santa', target: at(santa) };
    if (si === 0) {
      if (this.stamped()) return { text: 'Give Santa your letter, stamped SEEN', target: at(santa) };
      if (S.inv.some(i => this.written(i) && this.santaAddr(S.letters[i.uid].to))) return { text: 'Show your letter to a grown-up who loves you, and ask them to stamp it SEEN (open the letter from your bag)', target: null };
      if (S.mail.some(u => S.letters[u] && S.letters[u].state === 'posted')) return { text: 'Find your letter in the post pile by the sleigh', target: at(this.find(e => e.kind === 'mailpile')) };
      return { text: 'Write a letter to Santa, then post it in the North Pole postbox', target: at(this.find(e => e.kind === 'postbox' && e.z > CFG.L - 14)) };
    }
    const q = SANTA_Q[si]; if (!q) return null;
    const ready = q.need ? q.need.every(([t, n]) => INV.has(t, n)) : q.check();
    return { text: `Santa asks you to ${q.short}`, target: ready ? at(santa) : null };
  },
  // ---- world generation (called from POP.run and INTERIOR) ----
  populate(plan) {
    const R = CFG.REGION, rng = POP.rng;
    const put = (kind, z0, z1, dmin, dmax, r, d = {}, o = {}) => { const p = POP.spot(z0, z1, dmin, dmax, r, o); if (!p) return null; POP.add(kind, p[0], p[1], d); POP.occupy(p[0], p[1], o.occ ?? r); return p; };
    const near = (x, z, kind, d, r = 0.8) => {
      for (const rr of [2.4, 3.2, 4.2]) for (let k = 0; k < 12; k++) {
        const a = k / 12 * Math.PI * 2 + rr, cx = Math.floor(x + Math.cos(a) * rr) + 0.5, cz = Math.floor(z + Math.sin(a) * rr) + 0.5;
        if (cx < CFG.EDGE + 1.5 || cx > CFG.W - CFG.EDGE - 1.5 || !POP.free(cx, cz, r)) continue;
        POP.add(kind, cx, cz, d); POP.occupy(cx, cz, r); return [cx, cz];
      }
      return null;
    };
    // a red postbox beside the path in every village region
    for (let r = 0; r < 7; r++) put('postbox', r * R + 8, (r + 1) * R - 8, 2.3, 3.8, 0.6);
    // vegetable patches in the warm seasons; chestnuts lying under autumn trees
    const vegs = ['potato', 'carrot', 'sprout'];
    for (let r = 0; r < 6; r++) for (let k = 0; k < 2; k++) put('vegpatch', r * R + 6, (r + 1) * R - 6, 3, 12, 0.9, { v: r >= 4 && k === 1 ? 'pumpkin' : vegs[(r + k) % 3] });
    for (let k = 0; k < 4; k++) put('pickup', 4 * R + 4, 6 * R - 4, 3, 18, 0.4, { t: 'chestnut', n: 2 });
    // golden wheat patches (regrow at dawn) and spare seed, so bread, stuffing and turkeys never stall
    for (const r of [0, 1, 2, 3]) put('vegpatch', r * R + 6, (r + 1) * R - 6, 3, 10, 0.9, { v: 'wheat' });
    for (const r of [0, 2, 3]) put('pickup', r * R + 6, (r + 1) * R - 6, 3, 14, 0.4, { t: 'wheatseed', n: 3 });
    // festive folk with quests

const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}) => { const el = document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
/** run fn(dt) every frame while the stage is on screen; pauses while another modal covers it */
function gameLoop(stage, m, fn) {

  const tick = now => { if (!stage.isConnected) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!m.el.hidden) fn(dt); requestAnimationFrame(tick); };

const stagePt = (stage, e) => { const svg = stage.querySelector('svg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };

    stage.addEventListener('pointerdown', () => pull());
    place(); aimControls();
    gameLoop(stage, m, dt => { if (phase !== 'aim') return; t += dt; pos = (Math.sin(t * 2.6 - Math.PI / 2) + 1) / 2; mark.setAttribute('x', 37 + pos * 220); });
  });
};

// =============================================================================
// §26 BOOT
// =============================================================================
(function boot() {
  SETTINGS.load(); PAINTER.init();
  // extra SVG filter for glowing parts of icons
  $('svg defs').insertAdjacentHTML('beforeend', '<filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>');
  const setVh = () => {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    const vv = window.visualViewport; const vh = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', vh + 'px');
    const mr = $('#modal-root'); if (mr) mr.style.top = (vv ? vv.offsetTop : 0) + 'px';
  };
  setVh(); window.addEventListener('resize', setVh); if (window.visualViewport) { visualViewport.addEventListener('resize', setVh); visualViewport.addEventListener('scroll', setVh); }
  MODAL.init(); R.init($('#game')); HUD.init(); INPUT.init();
  BUS.on('settings', ({ section }) => { if (section === 'graphics') R.resize(); if (section === 'controls') GAME.objT = 0; });
  BUS.on('inv', () => { GAME.proxDirty = true; });
  PLAYER.move = { x: 0, z: 0 };
  requestAnimationFrame(t => { GAME.lastRender = t; GAME.frame(t); });
  if (SAVE.exists()) GAME.resume(); else APP.go('title');
  window.__turkeyQuest = { FESTIVE,  APP, ITEM_FSM, GAME, SAVE, WORLD, PLAYER, PROVER, POP, R, FOES, INV, UI, MODAL, PATH, COMBAT, KINDS, ITEMS, TERRAIN, ATLAS }; // handy for debugging
})();

</script>
