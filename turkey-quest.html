<!doctype html>
<!--
================================================================================
 TURKEY QUEST  -  a festive papercraft ink & watercolour RPG
 Authors: Timeless Prototype and Opus 5.5
 Built on the Inkwash Seasons engine (§1-§27 are that engine, lightly
 touched); everything festive lives in §28 and extends the engine by
 wrapping its functions, so the engine sections stay readable on their own.
================================================================================

 SECTION INDEX  (search for the tag, e.g. "§12", to jump to a section)
 ------------------------------------------------------------------------------
 §1  CSS THEME ............ colour tokens, layout (landscape/portrait), modals,
                            scrollbars, selection colours, focus rings
 §2  HTML SKELETON ........ #app, #game, #tools, #hud, #modal-root, #loading,
                            shared <svg> filter defs (#f-wc, #f-ink)
 §3  CONFIG & CONSTANTS ... CFG (world size, timings), SAVE_KEY, DEFAULTS
 §4  UTILITIES ............ hashing, seeded RNG, value noise, math helpers
 §5  FSM .................. generic finite state machine (FSM class, FSM.hooks)
 §6  SETTINGS & SAVE ...... SETTINGS (persisted prefs), SAVE (always-saved
                            game state, debounced writes, flush on pagehide)
 §7  ART: PATH HELPERS .... PathKit: wobbly hand-drawn SVG path builders
 §8  ART: DEFINITIONS ..... ART_DEF.<name>(P, params) -> {w,h,parts[]}
 §9  ART: PAINTERS ........ watercolour canvas painter, SVG icon builder,
                            ATLAS (texture pages for in-world paper sprites)
 §10 ITEMS DATABASE ....... ITEMS.<id> definitions, item helpers (INV)
 §11 WORLD LAYOUT ......... path/stream/lake/pond functions, cell grid
 §12 TERRAIN TEXTURES ..... repeatable variant tiles + blending, baked paths
                            and water, chunk jobs (TERRAIN)
 §13 POPULATION ........... placing trees, props, NPCs, barriers, progression
 §14 PROVER ............... solvability simulation incl. walkability (PROVER)
 §15 RENDERER ............. three.js setup, paper shader, terrain chunks,
                            instanced deco, shadows, particles, lights (R)
 §16 ENTITY KINDS ......... KINDS.<kind>: fsm, sprite, blocking, actions
 §17 PLAYER/COMBAT/FOES ... PLAYER, COMBAT, FOES (imps, frost blots, boss)
 §18 PATHFINDING .......... A* on the cell grid (PATH)
 §19 AUDIO ................ procedural WebAudio sfx + ambience (AUDIO)
 §20 UI: MODAL MANAGER .... MODAL stack + browser-history Back technique
 §21 UI: COMPONENTS ....... buttons, sliders, carousel viewer (CAROUSEL)
 §22 UI: SCREENS .......... menu, settings, inventory, worn, book, forge,
                            dialog, journal, export/import, about
 §23 HUD .................. health bar, toolbar, guidance dot, toasts, loading
 §24 INPUT ................ pointer/touch press detection, keyboard, gamepad
 §25 GAME FLOW ............ new game, rehydrate, day/night, main loop (GAME)
 §26 BOOT
 §27 INTERIORS ........... enterable houses and caves (pockets on the grid
                            beyond the overworld), cave types, FOE_TYPES,
                            interior floor painter, mainland mask (INTERIOR)
 §28 FESTIVE ............. festive art, food and recipes (kitchen), letters
                            to Santa, postboxes and the post pile, advent
                            calendars (one per house), Christmas trees to cut
                            and decorate, hats, runaway turkeys, snowmen,
                            holly, the North Pole (Santa, reindeer, sleigh),
                            festive quests and the mini-games: snowball fight,
                            carol bells and cracker pulling (FESTIVE, FUN)

 NAMING CONVENTIONS
 ------------------------------------------------------------------------------
 UPPER_SNAKE      constants (CFG, SAVE_KEY, CELL_*)
 UPPER objects    singletons/modules: SETTINGS SAVE ATLAS ITEMS WORLD TERRAIN
                  PROVER R KINDS PLAYER COMBAT FOES PATH AUDIO MODAL UI HUD
                  INPUT GAME
 ART_DEF.x        art generator for sprite/icon "x"
 KINDS.x          behaviour of world entity kind "x"
 FOE_TYPES.x      stats/resistances of foe "x" (§27); CAVE_TYPES.x cave flavours
 ITEMS.x          item definition with id "x"
 e / ent          an Entity instance {id, kind, x, z, fsm, d (data), mesh}
 S                the live save-state object (always persisted by SAVE)
 css .ui-*        UI classes; ids #ui-* for UI elements
 Events/FSM msgs  UPPER words, e.g. fsm.send('CHOP')

 HOW TO CREATE NEW ASSETS IN THE SAME AESTHETIC
 ------------------------------------------------------------------------------
 Everything visible is a "paper": black ink outline + watercolour wash on a
 cream cut-out. Never use bitmaps or emoji. To add art:
 1. Add ART_DEF.myThing = (P, p) => ({ w, h, parts:[...] }) in §8.
    - Build shapes with PathKit helpers (P.ell, P.poly, P.rect, P.line,
      P.blob). They add seeded wobble so lines look hand drawn.
    - Each part: { d:'svg path', fill:'#hex' | null, ink:true|false,
      inkW: width multiplier, glow:true (glows at night / pulses),
      alpha: wash strength }. Order = paint order (back to front).
    - Prefer muted watercolour pigments (see PIGMENT in §8) and keep ink
      weight ~2.2 units in a 100-unit box. Leave detail strokes ink-only.
    - Accept params (colour, season, variant, frame) so one definition
      serves many items. Seasons: 0 spring, 1 summer, 2 autumn, 3 winter.
 2. In-world: register a sprite in §15 R.sprite(name, params, worldW, worldH)
    (it paints into an ATLAS page). Animations should be painted frames or
    shader paint effects (uFlow wet-paint shimmer, glow pulse, dissolve),
    not paper puppetry.
 3. UI: UI.icon('myThing', params) renders the same definition as inline
    SVG using the shared ink/watercolour filters.
 4. Terrain ground looks are procedural tiles in §12 (TILE_TYPES) - add a
    painter function there; tiles must be periodic (wrap) to stay repeatable.

 Persistence: any state change must go through SAVE.touch() (FSM changes do
 this automatically) so the game is always saved. Save key embeds version.
================================================================================
-->

<style>
/* ============================================================================
   §1 CSS THEME
   ========================================================================== */
:root{
  --paper:#f3ead6; --paper-2:#ebdfc4; --paper-3:#e2d2b0;
  --ink:#1c1814; --ink-soft:#4a4038;
  --wash-blue:#3f6f9c; --wash-red:#b3433a; --wash-green:#5b8a4a; --wash-gold:#c99a3a;
  --focus:#1f5fbf;
  --text-scale:1;
  --fs:calc(20px * var(--text-scale));
  --tap:calc(64px * var(--text-scale));
  --vvh:100dvh; --sb:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
  --wobble:255px 18px 225px 16px / 16px 225px 18px 255px;
  --wobble-2:18px 225px 16px 255px / 255px 16px 225px 18px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Kalam Ink","Comic Neue","Segoe Print","Chalkboard SE",Georgia,serif;font-weight:700;font-synthesis:none;
  font-size:var(--fs);line-height:1.4;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
body{overflow:hidden}
::selection{background:#9cc3e8;color:#10161c}
::-moz-selection{background:#9cc3e8;color:#10161c}
/* themed scrollbars (vertical + horizontal) */
*{scrollbar-width:auto;scrollbar-color:#6b5a48 var(--paper-2)}
::-webkit-scrollbar{width:16px;height:16px}
#tools{scrollbar-width:auto}
::-webkit-scrollbar-track{background:var(--paper-2);border-radius:10px;box-shadow:inset 0 0 0 2px #d9c8a5}
::-webkit-scrollbar-thumb{background:#7a6852;border:3px solid var(--paper-2);border-radius:10px 4px 10px 4px}
::-webkit-scrollbar-thumb:hover{background:#5b4c3c}
::-webkit-scrollbar-corner{background:var(--paper-2)}

#app{position:fixed;inset:0;height:var(--app-h,100dvh);display:grid;
  grid-template-areas:"game tools";grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);}
@media (orientation:portrait){
  #app{grid-template-areas:"game" "tools";grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;}
}
#game{grid-area:game;position:relative;overflow:hidden;background:#e9dfc8;touch-action:none}
#game canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
/* paper grain overlay over the 3D view */
#grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.ui-hudbar{position:absolute;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));right:10px;
  display:flex;gap:12px;align-items:center;pointer-events:none}
.ui-hudbar > *{pointer-events:auto}
#ui-health{flex:0 1 340px;min-width:150px;height:calc(var(--tap) * .62);position:relative}
#ui-health svg{position:absolute;inset:0;width:100%;height:100%}
#ui-health .ui-hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:.9em;color:var(--ink);text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 6px var(--paper)}
#ui-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));max-width:min(92%,720px);
  background:rgba(243,234,214,.92);border:2.5px solid var(--ink);border-radius:var(--wobble);
  padding:6px 16px;font-size:.9em;text-align:center;pointer-events:none}
#ui-hint:empty{display:none}
#ui-dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;transition:opacity .3s;z-index:3}
#ui-dot svg{width:100%;height:100%}
#ui-toasts{position:absolute;left:0;right:0;top:calc(var(--tap) * .62 + 24px + var(--safe-t));display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none}
.ui-toast{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--wobble-2);padding:6px 16px;
  font-size:.95em;box-shadow:3px 4px 0 rgba(28,24,20,.18);animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#ui-night{position:absolute;inset:0;pointer-events:none}

/* ---------- buttons ---------- */
.ui-btn{font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:var(--wobble);
  min-height:var(--tap);min-width:var(--tap);padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:10px;position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.55),transparent 60%),
  radial-gradient(ellipse at 75% 80%,rgba(160,130,90,.18),transparent 65%);box-shadow:2px 3px 0 rgba(28,24,20,.25)}
.ui-btn:hover{background-color:#f8f1e2}
.ui-btn:active,.ui-btn.is-pressed{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(28,24,20,.25)}
.ui-btn[disabled],.ui-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.ui-btn svg{width:calc(var(--tap)*.56);height:calc(var(--tap)*.56);flex:none}
.ui-btn.ui-wide{width:100%;justify-content:flex-start}
.ui-btn.ui-primary{background-color:#dbe8f2}
.ui-btn.ui-danger{background-color:#f2d9d3}
:focus{outline:none}
:focus-visible{outline:4px dashed var(--focus);outline-offset:3px}
.ui-iconbtn{padding:6px;width:var(--tap);height:var(--tap)}
#ui-burger{position:relative;flex:none}

/* ---------- toolbar ---------- */
#tools{grid-area:tools;background:var(--paper-2);border-left:3px solid var(--ink);display:flex;flex-direction:column;
  gap:10px;padding:calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) 10px;
  overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;
  /* width = button + both paddings + a dedicated scrollbar lane (--sb), so the bar never overlaps buttons */
  width:calc(var(--tap) * 1.55 + 20px + var(--sb) + var(--safe-r));
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.05) 0 2px,transparent 2px 6px)}
@media (orientation:portrait){
  #tools{border-left:none;border-top:3px solid var(--ink);flex-direction:row;overflow-x:auto;overflow-y:hidden;width:auto;
    padding:8px calc(10px + var(--safe-r)) calc(8px + var(--sb) + var(--safe-b)) calc(10px + var(--safe-l));
    /* fixed height: new buttons, labels or a scrollbar must never resize the game view (that caused a flicker) */
    height:calc(var(--tap) * 1.35 + 16px + 3px + var(--sb) + var(--safe-b));align-items:flex-start;}
}
.ui-tool{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;
  width:calc(var(--tap) * 1.55);height:calc(var(--tap) * 1.35);min-height:0;padding:6px 4px;font-size:.8em;line-height:1.1;text-align:center}
.ui-tool svg{width:calc(var(--tap)*.62);height:calc(var(--tap)*.62)}
.ui-tool .ui-tool-label{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%;overflow:hidden;flex:none}
.ui-tool .ui-tool-label.ui-muted{-webkit-line-clamp:1}
.ui-tool svg{flex:none}
.ui-tool.is-prox{background-color:#e3eedb}
.ui-tool.is-primary{box-shadow:0 0 0 4px #e9c46a,2px 3px 0 rgba(28,24,20,.25)}
.ui-tool .ui-badge{position:absolute;top:2px;right:6px;font-size:.85em;font-weight:bold}
.ui-tools-sep{flex:none;border:none;border-top:2.5px dashed #8a765c;margin:2px 6px;width:auto}
@media (orientation:portrait){.ui-tools-sep{border-top:none;border-left:2.5px dashed #8a765c;margin:6px 2px;height:auto}}

/* ---------- modals ---------- */
#modal-root{position:fixed;inset:0;display:none;z-index:50;height:var(--vvh)}
#modal-root.is-open{display:block}
.ui-backdrop{position:absolute;inset:0;background:rgba(40,32,24,.45)}
.ui-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px - var(--safe-l) - var(--safe-r)));
  max-height:calc(var(--vvh) - 20px - var(--safe-t) - var(--safe-b));display:flex;flex-direction:column;background:var(--paper);
  border:3.5px solid var(--ink);border-radius:var(--wobble-2);box-shadow:6px 8px 0 rgba(28,24,20,.3);overflow:hidden;
  background-image:radial-gradient(ellipse at 10% 0%,rgba(255,255,255,.6),transparent 50%),radial-gradient(ellipse at 100% 100%,rgba(190,160,110,.2),transparent 60%)}
.ui-modal[hidden]{display:none}
.ui-modal-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:3px solid var(--ink);flex:none}
.ui-modal-head h2{margin:0;font-size:1.35em;font-weight:bold;line-height:1.15;flex:1;min-width:0;overflow-wrap:anywhere}
.ui-modal-body{padding:14px 18px 20px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain;touch-action:pan-y}
.ui-modal-body p{margin:.4em 0 .8em}
.ui-stack{display:flex;flex-direction:column;gap:12px}
.ui-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ui-field{display:flex;flex-direction:column;gap:6px}
.ui-field label{font-weight:bold}
.ui-input,.ui-textarea{font:inherit;color:var(--ink);background:#fffaf0;border:3px solid var(--ink);border-radius:10px 4px 12px 6px;
  padding:10px 12px;min-height:var(--tap);width:100%;touch-action:auto;user-select:text;-webkit-user-select:text}
.ui-textarea{resize:none;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto;
  background-image:repeating-linear-gradient(transparent 0 calc(1.5em - 1px),rgba(63,111,156,.18) calc(1.5em - 1px) 1.5em);
  background-attachment:local;background-position:0 10px}
.ui-range{width:100%;height:var(--tap);-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y}
.ui-range::-webkit-slider-runnable-track{height:14px;background:var(--paper-3);border:2.5px solid var(--ink);border-radius:8px 3px 9px 4px}
.ui-range::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-14px;border-radius:50% 45% 52% 48%;
  background:var(--wash-blue);border:3px solid var(--ink)}
.ui-range::-moz-range-track{height:14px;background:var(--paper-3);border:2.5px solid var(--ink);border-radius:8px}
.ui-range::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--wash-blue);border:3px solid var(--ink)}
.ui-check{display:flex;align-items:center;gap:14px;min-height:var(--tap);cursor:pointer}
.ui-check input{width:34px;height:34px;accent-color:var(--wash-blue);flex:none}
.ui-kbd{display:inline-block;border:2px solid var(--ink);border-radius:6px 3px 7px 4px;padding:0 8px;background:#fffaf0;
  font-family:inherit;font-size:.9em;min-width:1.6em;text-align:center}
.ui-table{width:100%;border-collapse:collapse}
.ui-table td,.ui-table th{border-bottom:2px dashed #b9a582;padding:8px 6px;text-align:left;vertical-align:top}
.ui-muted{color:var(--ink-soft)}
.ui-h3{font-size:1.1em;margin:.6em 0 .2em}

/* carousel */
.ui-carousel{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.ui-tabs{display:flex;gap:10px;flex-wrap:wrap}
.ui-tab[aria-selected="true"]{background-color:#dbe8f2;font-weight:bold}
.ui-car-stage{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;touch-action:pan-y}
.ui-car-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:calc(var(--tap)*3.4);
  justify-content:center;padding:8px;border:3px dashed #b9a582;border-radius:var(--wobble)}
.ui-car-card svg{width:min(42vmin,170px);height:min(42vmin,170px)}
.ui-car-name{font-size:1.2em;font-weight:bold;overflow-wrap:anywhere}
.ui-car-count{font-weight:bold}
.ui-car-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ui-swatch{display:inline-block;width:1.2em;height:1.2em;border:2px solid var(--ink);border-radius:40% 55% 45% 50%;vertical-align:-.2em}

/* worn / equipment */
.ui-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--tap)*2.4),1fr));gap:12px}
.ui-slot{flex-direction:column;min-height:calc(var(--tap)*2.4);text-align:center;gap:4px;font-size:.9em}
.ui-slot svg{width:calc(var(--tap)*.9);height:calc(var(--tap)*.9)}

/* book editor */
.ui-modal.ui-book{height:calc(var(--vvh) - 20px - var(--safe-t) - var(--safe-b))}
.ui-book .ui-modal-body{display:flex;flex-direction:column;gap:8px}
.ui-book textarea{flex:1;min-height:5em}

/* dialog */
.ui-dialog-portrait{float:left;width:calc(var(--tap)*1.6);height:calc(var(--tap)*2.1);margin:0 14px 6px 0}
.ui-dialog-portrait svg{width:100%;height:100%}
.ui-say{font-size:1.05em}

/* loading */
#loading{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--paper);background-image:radial-gradient(ellipse at 50% 40%,#fbf6ea,transparent 70%);padding:20px;text-align:center}
#loading.is-open{display:flex}
#loading{overflow-y:auto;justify-content:safe center;gap:clamp(6px,2vh,16px)}
#loading svg.ui-load-art{width:min(60vw,260px,calc(38vh * 1.73));height:auto}
#loading .ui-load-bar{width:min(80vw,520px);height:clamp(40px,11vh,64px)}
#loading .ui-load-text{font-size:1.1em;min-height:1.5em}

/* title overlay: sizes follow the viewport height so it fits short landscape phones;
   safe centring keeps the top reachable, and overflow-y lets the rest scroll if needed */
.ui-title{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:clamp(6px,2.2vh,18px);padding:max(10px,var(--safe-t)) max(16px,var(--safe-r)) max(10px,var(--safe-b)) max(16px,var(--safe-l));
  text-align:center;background:radial-gradient(ellipse at 50% 40%,#fbf6ea,#efe3c8 70%);pointer-events:auto}
.ui-title-leaf{width:clamp(44px,15vh,110px);height:clamp(44px,15vh,110px);flex:none}
.ui-title h1{margin:0;font-size:clamp(26px,7.5vh,44px);line-height:1.15}
.ui-title-tagline{margin:0;max-width:30em;font-size:clamp(15px,3.8vh,20px)}
.ui-title .ui-btn{min-height:clamp(42px,11vh,var(--tap));font-size:clamp(15px,3.8vh,20px)}
.ui-title .ui-btn svg{width:clamp(24px,7vh,calc(var(--tap)*.56));height:clamp(24px,7vh,calc(var(--tap)*.56))}
.ui-title .ui-muted{margin:0;font-size:clamp(12px,3vh,16px)}
.ui-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ui-boat-bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 80%}

<script type="module">
// =============================================================================
// §3 CONFIG & CONSTANTS
// =============================================================================
let THREE = null;
try { THREE = await import('three'); }
catch (err) {
  document.body.innerHTML = '<div style="padding:24px;font-size:22px;font-family:Georgia,serif">' +
    '<h1>Turkey Quest</h1><p>The drawing tools (three.js) could not be loaded. Please reload the page.</p></div>';
  throw err;
}
THREE.ColorManagement.enabled = false; // we work in raw sRGB end-to-end (paint looks exactly as painted)

const VERSION = 2; // 2: festive wheat patches and the festive prover changed world generation
const GAME_ID = 'timelessprototype.turkey-quest';
const SAVE_KEY = `${GAME_ID}.v${VERSION}.save`;
const SETTINGS_KEY = `${GAME_ID}.v${VERSION}.settings`;
const AUTHORS = 'Timeless Prototype and Opus 5.5';

const CFG = {
  W: 64, L: 448,            // world size in units (cells are 1x1 unit)
  REGION: 56, REGIONS: 8,   // 8 regions, 2 per season
  SEASON_LEN: 112,          // spring 0-112, summer -224, autumn -336, winter -448
  CHUNK: 16, TEX_PX: 16,    // terrain chunk size (units) and texture pixels per unit
  DAY_LEN: 210, NIGHT_LEN: 90, // nights are shorter than days (seconds)
  REACH: 2.3,               // proximity distance for actions
  CAMPFIRE_R: 7.5,          // campfires repel baddies within this radius, forever
  SPEED: 4.2, BOAT_SPEED: 3.8,
  BASE_HP: 100,
  EDGE: 2,                  // impassable woodland band at the world sides
};
const SEASON_NAMES = ['Spring', 'Summer', 'Autumn', 'Winter'];

const DEFAULTS = {
  audio: { master: 0.8, effects: 0.8, ambient: 0.55 },
  graphics: { fps: 30, renderScale: 1, textScale: 1, paintMotion: true, particles: true, grain: true },
  controls: { deadzone: 0.22, zoomSpeed: 1, showHint: true, autoAttack: true, swapSticks: false },
};

// =============================================================================
// §4 UTILITIES
// =============================================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return Math.sqrt(dx * dx + dz * dz); };
const clone = o => JSON.parse(JSON.stringify(o));
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

/** string -> uint32 (cyrb53 folded) */
function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 ^ h2) >>> 0;
}
/** integer hash of 3 ints -> uint32 */
function ihash(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
const hash01 = (x, y, s) => ihash(x, y, s) / 4294967296;
/** seeded RNG (mulberry32) with helpers */
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.range = (a, b) => a + (b - a) * f();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return f;
}
/** value noise (smooth), optional period for repeatable (tileable) textures */
function vnoise(x, y, s, period = 0) {
  let xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  let x1 = xi + 1, y1 = yi + 1;
  if (period) { xi = ((xi % period) + period) % period; yi = ((yi % period) + period) % period; x1 = (xi + 1) % period; y1 = (yi + 1) % period; }
  const a = hash01(xi, yi, s), b = hash01(x1, yi, s), c = hash01(xi, y1, s), d = hash01(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, oct = 3, period = 0) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 101, period ? period * f : 0); norm += amp; amp *= 0.5; f *= 2; }
  return sum / norm;
}
/** tiny event bus */
const BUS = {
  m: new Map(),
  on(n, f) { if (!this.m.has(n)) this.m.set(n, new Set()); this.m.get(n).add(f); return () => this.m.get(n).delete(f); },
  emit(n, d) { const s = this.m.get(n); if (s) for (const f of [...s]) f(d); },
};
/** colour helpers (hex <-> rgb, mix, darken) */
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
const darken = (h, t) => mixHex(h, '#1c1814', t);
const lighten = (h, t) => mixHex(h, '#fffaf0', t);
function hslHex(h, s, l) { // h 0-360, s/l 0-1
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgbHex(f(0) * 255, f(8) * 255, f(4) * 255);
}
const seasonAt = z => clamp(Math.floor(z / CFG.SEASON_LEN), 0, 3);
const regionAt = z => clamp(Math.floor(z / CFG.REGION), 0, CFG.REGIONS - 1);

// =============================================================================
// §5 FSM  -  generic finite state machine.
//   def = { initial, states:{ name:{ enter(owner,fsm,data,prev), exit(), update(owner,fsm,dt),
//           on:{ EVENT:'target' | (owner,data,fsm)=>'target'|null } } }, any:{EVENT:...} }
//   FSM.hooks receive every transition (used for saving, sounds, animation).
// =============================================================================
class FSM {
  constructor(def, owner, initial) {
    this.def = def; this.owner = owner; this.state = initial || def.initial; this.t = 0; this.listeners = [];
  }
  is(...names) { return names.includes(this.state); }
  can(ev) { const st = this.def.states[this.state]; return !!((st.on && st.on[ev]) || (this.def.any && this.def.any[ev])); }
  send(ev, data) {
    const st = this.def.states[this.state];
    const tr = (st && st.on && st.on[ev]) || (this.def.any && this.def.any[ev]);
    if (!tr) return false;
    const target = typeof tr === 'function' ? tr(this.owner, data, this) : tr;
    if (target) this.go(target, data, ev);
    return !!target;
  }
  go(target, data, ev = 'GO') {
    if (!this.def.states[target]) { console.warn('FSM: no state', target); return; }
    const prev = this.state, ps = this.def.states[prev];
    if (ps && ps.exit) ps.exit(this.owner, this, data);
    this.state = target; this.t = 0;
    const ns = this.def.states[target];
    if (ns.enter) ns.enter(this.owner, this, data || {}, prev);
    for (const l of this.listeners) l(target, prev, ev, this);
    for (const h of FSM.hooks) h(this, target, prev, ev);
  }
  /** restore from save without counting as a transition */
  restore(state, t = 0) {
    if (!this.def.states[state]) return;
    this.state = state; this.t = t;
    const ns = this.def.states[state];
    if (ns.enter) ns.enter(this.owner, this, { restore: true }, null);
  }
  update(dt) { this.t += dt; const st = this.def.states[this.state]; if (st && st.update) st.update(this.owner, this, dt); }
  on(fn) { this.listeners.push(fn); return this; }
}
FSM.hooks = [];

// =============================================================================
// §6 SETTINGS & SAVE  (always-saved state)
// =============================================================================
const SETTINGS = {
  v: clone(DEFAULTS),
  load() {
    try { const j = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); if (j) for (const k in DEFAULTS) Object.assign(this.v[k], j[k] || {}); } catch (e) { /* ignore */ }
    this.apply();
  },
  save() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.v)); } catch (e) { /* ignore */ } this.apply(); },
  set(section, key, val) { this.v[section][key] = val; this.save(); BUS.emit('settings', { section, key }); },
  reset(section) { this.v[section] = clone(DEFAULTS[section]); this.save(); BUS.emit('settings', { section }); },
  apply() { document.documentElement.style.setProperty('--text-scale', this.v.graphics.textScale); const g = $('#grain'); if (g) g.style.display = this.v.graphics.grain ? '' : 'none'; },
};

const SAVE = {
  S: null, dirty: false, timer: 0,
  exists() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } },
  read() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } },
  /** mark state as changed; written within 250ms (and immediately on pagehide) */
  touch() { if (!this.S) return; this.dirty = true; if (!this.timer) this.timer = setTimeout(() => this.flush(), 250); },
  flush() {
    clearTimeout(this.timer); this.timer = 0;
    if (!this.S) return;
    if (typeof GAME !== 'undefined' && GAME.syncToSave) GAME.syncToSave();
    if (!this.dirty) return;
    this.dirty = false;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.S)); }
    catch (e) { if (typeof HUD !== 'undefined') HUD.toast('Could not save - browser storage may be full.'); }
  },
  write(obj) { this.S = obj; this.dirty = true; this.flush(); },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } this.S = null; },
};
window.addEventListener('pagehide', () => SAVE.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) SAVE.flush(); });
window.addEventListener('beforeunload', () => SAVE.flush());

// =============================================================================
// §7 ART: PATH HELPERS  -  PathKit(seed) builds wobbly, hand-drawn SVG path strings.
//   Same strings feed both canvas (Path2D) and inline SVG, so world and UI match.
// =============================================================================
function PathKit(seed) {
  const rng = RNG(seed);
  const j = a => (rng() - 0.5) * 2 * a;
  const f = n => Math.round(n * 10) / 10;
  /** smooth curve through points (Catmull-Rom -> cubic bezier) */
  function curve(pts, closed = true, wob = 1) {
    const p = pts.map(([x, y]) => [x + j(wob), y + j(wob)]);
    const n = p.length; if (n < 2) return '';
    const get = i => closed ? p[(i + n) % n] : p[clamp(i, 0, n - 1)];
    let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2), t = 1 / 6;
      d += `C${f(p1[0] + (p2[0] - p0[0]) * t)} ${f(p1[1] + (p2[1] - p0[1]) * t)} ${f(p2[0] - (p3[0] - p1[0]) * t)} ${f(p2[1] - (p3[1] - p1[1]) * t)} ${f(p2[0])} ${f(p2[1])}`;
    }
    return closed ? d + 'Z' : d;
  }
  /** sharp-cornered polygon whose edges bow slightly like a pen line */
  function poly(pts, wob = 1, closed = true) {
    const p = pts.map(([x, y]) => [x + j(wob), y + j(wob)]);
    const n = p.length; let d = `M${f(p[0][0])} ${f(p[0][1])}`;
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const a = p[i], b = p[(i + 1) % n];
      d += `Q${f((a[0] + b[0]) / 2 + j(wob * 0.7))} ${f((a[1] + b[1]) / 2 + j(wob * 0.7))} ${f(b[0])} ${f(b[1])}`;
    }
    return closed ? d + 'Z' : d;
  }
  const P = {
    rng, j, curve, poly,
    ell(cx, cy, rx, ry, wob = 0.05, n = 10) {
      const pts = []; const r0 = rng() * Math.PI * 2;
      for (let i = 0; i < n; i++) { const a = r0 + i / n * Math.PI * 2, k = 1 + j(wob); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
      return curve(pts, true, 0);
    },
    blob(cx, cy, r, lumps = 7, wob = 0.16, ry = r) {
      const pts = []; const n = lumps * 2, r0 = rng() * 6.28;
      for (let i = 0; i < n; i++) { const a = r0 + i / n * Math.PI * 2, k = (i % 2 ? 1 + wob : 1 - wob * 0.3) + j(wob * 0.4); pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * ry * k]); }
      return curve(pts, true, 0);
    },
    rect(x, y, w, h, wob = 1) { return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], wob); },
    line(x1, y1, x2, y2, wob = 1) { return curve([[x1, y1], [(x1 + x2) / 2, (y1 + y2) / 2], [x2, y2]], false, wob); },
    path(pts, wob = 1) { return curve(pts, false, wob); },
    /** thick bar between two points (sticks, handles, branches) */
    band(x1, y1, x2, y2, w1, w2 = w1, wob = 0.6) {
      const a = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2, c = Math.cos(a), s = Math.sin(a);
      return poly([[x1 + c * w1 / 2, y1 + s * w1 / 2], [x2 + c * w2 / 2, y2 + s * w2 / 2], [x2 - c * w2 / 2, y2 - s * w2 / 2], [x1 - c * w1 / 2, y1 - s * w1 / 2]], wob);
    },
    star(cx, cy, r1, r2, n = 4, rot = 0) {
      const pts = []; for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? r2 : r1; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
      return poly(pts, 0.5);
    },
  };
  return P;
}

// =============================================================================
// §8 ART: DEFINITIONS  -  ART_DEF.<name>(P, params) => { w, h, parts:[...] }
//   part = { d, fill, ink, inkW, glow, alpha }.  Helpers: A() washed+inked,
//   W() wash only, K() ink only.  Seasons s: 0 spring 1 summer 2 autumn 3 winter.

// ---------- characters ----------
function figure(P, o) {
  // o: {fr (0 idle,1-4 walk,5 act,6 seated), robe, hood, hat, beard, skin, scale}
  const fr = o.fr | 0, sw = [0, 1, 0, -1, 0, 0, 0][fr] || 0, bob = (fr === 1 || fr === 3) ? -2 : 0, parts = [];
  const y = v => v + bob;
  if (fr !== 6) {
    parts.push(K(P.path([[45, y(100)], [44 + sw * 5, 118], [42 + sw * 10, 132]], 0.5), 1.6));
    parts.push(K(P.path([[55, y(100)], [56 - sw * 5, 118], [58 - sw * 10, 132]], 0.5), 1.6));
    parts.push(A(P.ell(40 + sw * 10, 133, 7, 4, 0.05, 6), '#4a3a2c')); parts.push(A(P.ell(60 - sw * 10, 133, 7, 4, 0.05, 6), '#4a3a2c'));
  }
  const bottom = fr === 6 ? 112 : 106;
  parts.push(A(P.curve([[40, y(46)], [60, y(46)], [72, y(bottom)], [50, y(bottom + 3)], [28, y(bottom)]], true, 0.8), o.robe));
  parts.push(W(P.curve([[44, y(52)], [52, y(52)], [48, y(bottom - 4)], [38, y(bottom - 4)]], true, 0.6), lighten(o.robe, 0.35), 0.5));
  if (o.trim) parts.push(A(P.curve([[29, y(bottom - 8)], [50, y(bottom - 5)], [71, y(bottom - 8)], [72, y(bottom)], [50, y(bottom + 3)], [28, y(bottom)]], true, 0.6), o.trim, { inkW: 0.7 }));
  if (o.belt) parts.push(A(P.rect(36, y(76), 30, 5, 0.4), o.belt, { inkW: 0.7 }));
  if (o.belt && o.buckle) parts.push(A(P.rect(46, y(74), 9, 9, 0.3), o.buckle, { inkW: 0.6 }));
  // arms
  if (fr === 5) { parts.push(A(P.band(62, y(54), 82, y(28), 8, 7), o.robe)); parts.push(A(P.ell(83, y(25), 5, 5, 0.05, 6), o.skin)); }
  else { const a = sw * 4; parts.push(A(P.band(62, y(54), 70 - a, y(84), 8, 7), o.robe)); parts.push(A(P.ell(70 - a, y(87), 5, 5, 0.05, 6), o.skin)); }
  parts.push(A(P.band(38, y(54), 31 + sw * 4, y(84), 8, 7), o.robe)); parts.push(A(P.ell(31 + sw * 4, y(87), 5, 5, 0.05, 6), o.skin));
  // head
  parts.push(A(P.ell(50, y(34), 14, 15, 0.04), o.skin));
  if (o.beard) parts.push(A(P.curve([[38, y(36)], [62, y(36)], [58, y(58)], [50, y(64)], [42, y(58)]], true, 0.8), o.beard));
  parts.push(K(P.ell(45, y(33), 1.2, 1.6, 0, 5), 1.6)); parts.push(K(P.ell(55, y(33), 1.2, 1.6, 0, 5), 1.6));
  if (o.hood) parts.push(A(P.curve([[34, y(40)], [38, y(18)], [50, y(10)], [62, y(18)], [66, y(40)], [62, y(28)], [50, y(22)], [38, y(28)]], true, 0.6), o.hood));
  if (o.hat === 'wide') { parts.push(A(P.ell(50, y(22), 30, 6, 0.05), o.hatCol || '#6a5a3a')); parts.push(A(P.curve([[38, y(22)], [42, y(6)], [58, y(6)], [62, y(22)]], true, 0.6), o.hatCol || '#6a5a3a')); }
  if (o.hat === 'point') { parts.push(A(P.ell(50, y(22), 24, 5, 0.05), o.hatCol || PIG.purple)); parts.push(A(P.poly([[38, y(22)], [50, y(-8)], [62, y(22)]], 0.8), o.hatCol || PIG.purple)); }
  if (o.hat === 'cap') parts.push(A(P.curve([[36, y(28)], [40, y(16)], [60, y(16)], [66, y(28)]], true, 0.6), o.hatCol || PIG.red));
  // festive hats (§28): Santa's, an elf's, a woolly bobble hat, a cracker crown, a feathered cap

    parts.push(A(P.ell(50, y(24), 18, 5, 0.05), '#fbf8f0')); parts.push(A(P.ell(80, y(32), 5.5, 5.5, 0.05, 6), '#fbf8f0')); }
  if (o.hat === 'elf') { parts.push(A(P.poly([[36, y(24)], [52, y(-8)], [64, y(24)]], 0.8), o.hatCol || '#3f8a4a')); parts.push(A(P.ell(50, y(24), 16, 4, 0.05), '#c8283a')); parts.push(A(P.ell(53, y(-9), 3.5, 3.5, 0.05, 6), '#e2b23a', { inkW: 0.6 })); }
  if (o.hat === 'woolly') { parts.push(A(P.curve([[34, y(26)], [36, y(12)], [50, y(6)], [64, y(12)], [66, y(26)]], true, 0.6), o.hatCol || '#c8283a'));
    parts.push(W(P.rect(37, y(14), 26, 4, 0.4), '#fbf8f0', 0.9)); parts.push(A(P.rect(34, y(22), 32, 6, 0.4), '#fbf8f0', { inkW: 0.6 })); parts.push(A(P.blob(50, y(4), 6, 5, 0.2), '#fbf8f0', { inkW: 0.6 })); }

// =============================================================================
// §9 ART: PAINTERS  -  canvas watercolour painter, ATLAS pages, SVG icon builder
//   Atlas pages hold two canvases: PAINT (opaque colour, paper + washes) and
//   MASK (R = ink, G = paper cut-out, B = glow). The paper shader composes them.
// =============================================================================
const PAINTER = {
  grain: null,
  init() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), id = g.createImageData(128, 128);
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      const v = 0.7 * fbm(x / 10, y / 10, 7, 3, 12.8) + 0.3 * hash01(x, y, 9), o = (y * 128 + x) * 4, k = 205 + v * 50;
      id.data[o] = k; id.data[o + 1] = k - 3; id.data[o + 2] = k - 10; id.data[o + 3] = 255;
    }
    g.putImageData(id, 0, 0); this.grain = c;
  },
  bbox(d) {
    const n = (d.match(/-?\d+(\.\d+)?/g) || []).map(Number); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i + 1 < n.length; i += 2) { x0 = Math.min(x0, n[i]); x1 = Math.max(x1, n[i]); y0 = Math.min(y0, n[i + 1]); y1 = Math.max(y1, n[i + 1]); }
    return [x0, y0, x1, y1];
  },
  wash(ctx, path, part, rng, bb, inkW) {
    const col = part.fill, a = part.alpha;
    ctx.save();
    ctx.translate((rng() - 0.5) * inkW * 0.9, (rng() - 0.5) * inkW * 0.9); // paint bleeds past the ink line
    ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fill(path);
    ctx.lineJoin = 'round'; ctx.strokeStyle = darken(col, 0.35);
    ctx.globalAlpha = a * 0.16; ctx.lineWidth = inkW * 1.7; ctx.stroke(path); // pigment pools at the edge
    ctx.globalAlpha = a * 0.24; ctx.lineWidth = inkW * 0.6; ctx.stroke(path);
    ctx.clip(path);
    const [x0, y0, x1, y1] = bb, w = x1 - x0, h = y1 - y0, r = Math.max(w, h);
    for (let k = 0; k < 3; k++) { // blooms
      const cx = x0 + rng() * w, cy = y0 + rng() * h, rr = Math.max(2, r * (0.2 + rng() * 0.35));
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr), light = k !== 1;
      g.addColorStop(0, light ? 'rgba(255,250,240,0.2)' : 'rgba(40,28,18,0.13)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(x0 - 2, y0 - 2, w + 4, h + 4);
    }
    ctx.restore();
  },
  /** paint one art frame into atlas canvases at pixel rect */
  frame(xP, xM, art, px, py, pw, ph, pad, seed, inkW) {
    const iw = pw - pad * 2, ih = ph - pad * 2, s = Math.min(iw / art.w, ih / art.h);
    const ox = px + pad + (iw - art.w * s) / 2, oy = py + pad + (ih - art.h * s);
    const rng = RNG(seed), paths = art.parts.map(p => new Path2D(p.d));
    // paint layer
    xP.save(); xP.beginPath(); xP.rect(px, py, pw, ph); xP.clip();
    xP.fillStyle = PIG.paper; xP.fillRect(px, py, pw, ph);
    xP.setTransform(s, 0, 0, s, ox, oy);
    art.parts.forEach((p, i) => { if (p.fill) this.wash(xP, paths[i], p, rng, this.bbox(p.d), inkW); });
    xP.setTransform(1, 0, 0, 1, 0, 0);
    xP.globalCompositeOperation = 'multiply'; xP.globalAlpha = 0.45;
    xP.fillStyle = xP.createPattern(this.grain, 'repeat'); xP.fillRect(px, py, pw, ph);
    xP.restore();
    // mask layer (additive channels)
    xM.save(); xM.beginPath(); xM.rect(px, py, pw, ph); xM.clip();
    xM.fillStyle = '#000'; xM.fillRect(px, py, pw, ph);
    xM.setTransform(s, 0, 0, s, ox, oy); xM.globalCompositeOperation = 'lighter';
    xM.lineJoin = 'round'; xM.lineCap = 'round';
    const margin = inkW * 1.6 + 2.2 / s;
    xM.fillStyle = xM.strokeStyle = 'rgb(0,255,0)';
    art.parts.forEach((p, i) => { if (p.fill && (p.ink || p.alpha > 0.5)) xM.fill(paths[i]); xM.lineWidth = (p.ink ? inkW * p.inkW : 0) + margin * 2; if (p.ink || p.alpha > 0.5) xM.stroke(paths[i]); });
    xM.fillStyle = 'rgb(0,0,255)';
    art.parts.forEach((p, i) => { if (p.glow && p.fill) xM.fill(paths[i]); });
    xM.strokeStyle = 'rgb(255,0,0)';
    art.parts.forEach((p, i) => {
      if (!p.ink) return;
      xM.globalAlpha = 0.95; xM.lineWidth = inkW * p.inkW; xM.stroke(paths[i]);
      xM.save(); xM.translate((rng() - 0.5) * inkW * 0.5, (rng() - 0.5) * inkW * 0.5); xM.globalAlpha = 0.5; xM.lineWidth = inkW * p.inkW * 0.55; xM.stroke(paths[i]); xM.restore();
    });
    xM.restore();
  },
};

const ATLAS = {
  SIZE: 2048, pages: [], sprites: new Map(), cur: null,
  newPage() {
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = this.SIZE; return c; };
    const cP = mk(), cM = mk(), xP = cP.getContext('2d'), xM = cM.getContext('2d');
    xP.fillStyle = PIG.paper; xP.fillRect(0, 0, this.SIZE, this.SIZE); xM.fillStyle = '#000'; xM.fillRect(0, 0, this.SIZE, this.SIZE);
    const page = { cP, cM, xP, xM, x: 0, y: 0, rowH: 0, texP: null, texM: null, dirty: false, index: this.pages.length };
    this.pages.push(page); this.cur = page; return page;
  },
  fitsAll(w, h, n) {
    const p = this.cur; if (!p) return false; let x = p.x, y = p.y, rowH = p.rowH;
    for (let i = 0; i < n; i++) { if (x + w > this.SIZE) { x = 0; y += rowH; rowH = 0; } if (y + h > this.SIZE) return false; x += w; rowH = Math.max(rowH, h); }
    return true;
  },
  alloc(w, h) {
    let p = this.cur || this.newPage();
    if (p.x + w > this.SIZE) { p.x = 0; p.y += p.rowH; p.rowH = 0; }
    if (p.y + h > this.SIZE) { p = this.newPage(); }
    const r = { page: p, x: p.x, y: p.y }; p.x += w; p.rowH = Math.max(p.rowH, h); return r;
  },
  /**
   * Register a sprite. opt: { worldH, ppu (pixels per world unit), frames: [paramOverrides...] }
   * returns sprite {frames:[[u,v,w,h]], inner:[[u,v,w,h]], quadW, quadH, foot}
   */
  add(key, artName, params = {}, opt = {}) {
    if (this.sprites.has(key)) return this.sprites.get(key);
    const frameParams = opt.frames || [{}];
    const art0 = ART_DEF[artName](PathKit(hashStr(key)), { ...params, ...frameParams[0] });
    const worldH = opt.worldH || 1, ppu = opt.ppu || 90;
    const ih = Math.max(16, Math.round(worldH * ppu)), iw = Math.max(16, Math.round(ih * art0.w / art0.h));
    const pad = Math.round(Math.max(5, 0.05 * Math.max(iw, ih)));
    const pw = iw + pad * 2, ph = ih + pad * 2, s = ih / art0.h, worldPerArt = worldH / art0.h;
    const inkW = clamp(0.028 / worldPerArt, 1.8, 4.6);
    // tap box: the bounds of what is actually painted (a stump is small even though its frame is tree-sized)
    let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
    for (const pt of art0.parts) { if (!pt.ink && pt.alpha <= 0.5) continue; const [x0, y0, x1, y1] = PAINTER.bbox(pt.d); bx0 = Math.min(bx0, x0); by0 = Math.min(by0, y0); bx1 = Math.max(bx1, x1); by1 = Math.max(by1, y1); }
    const box = bx1 > bx0 ? { hw: Math.max(Math.abs(bx0 - art0.w / 2), Math.abs(bx1 - art0.w / 2)) * worldPerArt, b: Math.max(0, (art0.h - by1) * worldPerArt), t: (art0.h - by0) * worldPerArt } : null;
    const spr = { key, artName, params, frames: [], inner: [], pageIndex: 0, quadW: pw / s * worldPerArt, quadH: ph / s * worldPerArt,
      foot: pad / s * worldPerArt, worldH, worldW: worldH * art0.w / art0.h, rects: [], inkW, frameParams, opt, box };
    if (!this.fitsAll(pw, ph, frameParams.length)) this.newPage(); // keep every frame on one texture page
    frameParams.forEach((fp, i) => {
      const r = this.alloc(pw, ph); spr.pageIndex = r.page.index; spr.page = r.page; r.page.dirty = true;
      const art = i === 0 ? art0 : ART_DEF[artName](PathKit(hashStr(key)), { ...params, ...fp });
      PAINTER.frame(r.page.xP, r.page.xM, art, r.x, r.y, pw, ph, pad, hashStr(key) + i, inkW);
      const S = this.SIZE;
      spr.rects.push({ x: r.x, y: r.y, pw, ph, pad });
      spr.frames.push([r.x / S, 1 - (r.y + ph) / S, pw / S, ph / S]);
      spr.inner.push([(r.x + pad) / S, 1 - (r.y + ph - pad) / S, iw / S, ih / S]);
    });
    this.sprites.set(key, spr); return spr;
  },
  /** repaint a sprite frame in place with new params (e.g. bookshelf contents) */
  repaint(spr, params, fi = 0) {
    const r = spr.rects[fi], page = spr.page;
    const art = ART_DEF[spr.artName](PathKit(hashStr(spr.key)), { ...spr.params, ...params, ...(spr.frameParams[fi] || {}) });
    PAINTER.frame(page.xP, page.xM, art, r.x, r.y, r.pw, r.ph, r.pad, hashStr(spr.key) + fi + 7, spr.inkW);
    page.dirty = true;
  },
  finalize(renderer) {
    const aniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    for (const p of this.pages) {
      if (p.texP) continue;
      for (const k of ['P', 'M']) {
        const t = new THREE.CanvasTexture(k === 'P' ? p.cP : p.cM);
        t.colorSpace = THREE.NoColorSpace; t.anisotropy = aniso; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
        p['tex' + k] = t;
      }
    }
  },
  flush() { for (const p of this.pages) if (p.dirty && p.texP) { p.texP.needsUpdate = true; p.texM.needsUpdate = true; p.dirty = false; } },
};

/** inline SVG icon from the same art definitions (UI never uses emoji or bitmaps) */
const ICONS = new Map();
function svgIcon(name, params = {}, label = '') {
  const key = name + JSON.stringify(params);
  let inner = ICONS.get(key);
  if (!inner) {
    const def = ART_DEF[name] || ART_DEF.info;
    const art = def(PathKit(hashStr(key)), params);
    const backs = art.parts.filter(p => p.ink || p.alpha > 0.5).map(p => `<path d="${p.d}"/>`).join('');
    const glows = art.parts.filter(p => p.glow && p.fill).map(p => `<path d="${p.d}" fill="${p.fill}"/>`).join('');
    const fills = art.parts.filter(p => p.fill).map(p => `<path d="${p.d}" fill="${p.fill}" fill-opacity="${Math.min(1, p.alpha + 0.08)}"/>`).join('');
    const inks = art.parts.filter(p => p.ink).map(p => `<path d="${p.d}" stroke-width="${(3.2 * p.inkW).toFixed(2)}"/>`).join('');
    const pad = 6, vb = `${-pad} ${-pad} ${art.w + pad * 2} ${art.h + pad * 2}`;
    inner = { vb, body:
      `<g fill="${PIG.paper}" stroke="${PIG.paper}" stroke-width="9" stroke-linejoin="round">${backs}</g>` +
      (glows ? `<g filter="url(#f-glow)" opacity=".7">${glows}</g>` : '') +
      `<g filter="url(#f-wc)">${fills}</g>` +
      `<g fill="none" stroke="${PIG.ink}" stroke-linecap="round" stroke-linejoin="round" filter="url(#f-ink)">${inks}</g>` };
    ICONS.set(key, inner);
  }
  return `<svg viewBox="${inner.vb}" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'} focusable="false">${inner.body}</svg>`;
}

const INV = {
  get list() { return SAVE.S.inv; },
  def: inst => ITEMS[inst.t],
  unique: t => t === 'book' || t === 'crate',
  count(t) { let n = 0; for (const i of SAVE.S.inv) if (i.t === t) n += i.n; return n; },
  has(t, n = 1) { return this.count(t) >= n; },
  add(t, n = 1, extra = null, quiet = false) {
    const inv = SAVE.S.inv;
    if (extra || this.unique(t)) { for (let k = 0; k < n; k++) inv.push({ t, n: 1, ...(t === 'crate' ? { uid: 'c' + Date.now().toString(36) + k, items: [] } : {}), ...(extra || {}) }); }
    else { const st = inv.find(i => i.t === t && !i.ench && !i.uid); if (st) st.n += n; else inv.push({ t, n }); }
    if (!quiet) HUD.toast(`Got ${n > 1 ? n + ' x ' : ''}${this.name({ t, n, ...(extra || {}) })}`);
    AUDIO.sfx('pickup'); SAVE.touch(); BUS.emit('inv');
  },
  addInst(inst, quiet = false) { if (this.unique(inst.t) || inst.ench) SAVE.S.inv.push(inst); else this.add(inst.t, inst.n, null, true); if (!quiet) HUD.toast('Got ' + this.name(inst)); SAVE.touch(); BUS.emit('inv'); },
  remove(t, n = 1) {
    if (!this.has(t, n)) return false;
    const inv = SAVE.S.inv;
    for (let i = inv.length - 1; i >= 0 && n > 0; i--) if (inv[i].t === t && !inv[i].ench) { const k = Math.min(n, inv[i].n); inv[i].n -= k; n -= k; if (inv[i].n <= 0) inv.splice(i, 1); }
    SAVE.touch(); BUS.emit('inv'); return true;
  },
  removeInst(inst, n = 1) { const inv = SAVE.S.inv, i = inv.indexOf(inst); if (i < 0) return false; inst.n -= n; if (inst.n <= 0) inv.splice(i, 1); SAVE.touch(); BUS.emit('inv'); return true; },
  bookTitle(uid) { const b = SAVE.S.books[uid]; if (!b) return ''; return (b.text.split('\n')[0] || '').trim(); },
  name(inst) {
    if (inst.t === 'book') { const b = SAVE.S.books[inst.uid]; const tt = this.bookTitle(inst.uid); return tt || `Blank ${b ? b.cname : ''} Book`.replace('  ', ' '); }
    if (inst.t === 'sword' && inst.ench) return `Sword of ${ENCH_NAMES[inst.ench]}`;
    if (inst.t === 'crate' && inst.items && inst.items.length) return `Wooden Crate (${inst.items.length} inside)`;

  },
  art(inst) {

    if (inst.t === 'sword' && inst.ench) return { fire: 'Wreathed in flame. Burns foes - devastating against frost creatures.', ice: 'Rimed with frost. Slows foes and bites deep.', poison: 'Drips with venom. Foes keep taking damage.' }[inst.ench];
    if (inst.t === 'stone') return SAVE.S.returnPos ? 'Glowing: it remembers a place. Use it to return there.' : ITEMS.stone.desc;
    if (inst.t === 'crate') { const its = inst.items || []; if (!its.length) return 'An empty crate. ' + ITEMS.crate.desc; const names = its.slice(0, 5).map(i => (i.n > 1 ? i.n + ' x ' : '') + this.name(i)); return `Packed with ${its.length} thing${its.length > 1 ? 's' : ''}: ${names.join(', ')}${its.length > 5 ? ', and more' : ''}.`; }
    return (ITEMS[inst.t] || {}).desc || '';
  },
  newBook(rngOrIndex) {
    const S = SAVE.S; const id = 'b' + (S.nextBook = (S.nextBook || 0) + 1);
    const hue = ((S.nextBook * 137.508) + (S.seedNum % 360)) % 360, light = [0.42, 0.52, 0.34][S.nextBook % 3];
    const c = hslHex(hue, 0.5, light), hn = HUE_NAMES.find(h => hue <= h[0])[1];

    return { t: 'book', n: 1, uid: id };
  },

// =============================================================================
// §11 WORLD LAYOUT  -  pure functions of the seed: path, streams, lake, ponds,
//   plus the 1x1 cell grid (flags) shared by gameplay, pathfinding and PROVER.
// =============================================================================
const F_WATER = 1, F_EDGE = 2, F_PATH = 4, F_BRIDGE = 8, F_BLOCK = 16, F_FENCE = 32, F_GATE = 64, F_NOPLANT = 128;
const PATH_W = 1.25;
const WORLD = {
  W: CFG.W, L: CFG.L, flags: null, body: null, dyn: null, open: null,
  P: null, barriers: [], lake: null, ponds: [], seedNum: 0,
  idx: (x, z) => (z | 0) * CFG.W + (x | 0),
  inBounds: (x, z) => x >= 0 && z >= 0 && x < CFG.W && z < CFG.L_ALL,
  pathX(z) { const p = this.P; return clamp(32 + p.a1 * Math.sin(z * p.f1 + p.p1) + p.a2 * Math.sin(z * p.f2 + p.p2), 12, 52); },
  pathSlope(z) { return (this.pathX(z + 0.1) - this.pathX(z - 0.1)) / 0.2; },
  pathDist(x, z) { const s = this.pathSlope(z); return Math.abs(x - this.pathX(z)) / Math.sqrt(1 + s * s) - PATH_W; },

};

// §27 INTERIORS  -  enterable houses and caves.
//   Interiors live on the same cell grid as the overworld, far beyond its end
//   (z >= CFG.INT_Z0), each in its own "pocket" surrounded by impassable dark.
//   Doors teleport between the overworld and pockets, so pathfinding, combat,
//   crates, campfires, saving (player x/z) and the Return Stone all just work.
//   Only the pocket you stand in is drawn, against a black backdrop.

//   overworld, so existing seeds (and saves) keep exactly the same overworld.
// =============================================================================

WORLD.computeMainland = function (start) {

  const ok = i => { const f = this.flags[i]; if (f & (F_EDGE | F_FENCE | F_BLOCK)) return false; if (f & F_WATER) return !!(f & F_BRIDGE); return true; };
  const s = this.idx(start[0], start[1]); m[s] = 1; q[t++] = s;
  while (h < t) {

  for (let i = W * CFG.INT_Z0; i < m.length; i++) if (this.floor[i]) m[i] = 1; // interiors are solid ground too
  this.mainland = m;

const INTERIOR = {
  generate(seedNum, attempt, plan, withCaves) {

    for (let x = Math.floor(L1.ex - 1.5); x <= Math.floor(L1.ex + 1.5); x++) WORLD.flags[WORLD.idx(x, L1.z0)] |= F_NOPLANT;

// ---------- terrain painter for interior floors (called from TERRAIN.chunkGen) ----------
TERRAIN.interiorGen = function* (cx0, cz0) {
  const W = CFG.W, fl = (x, z) => (x < 0 || x >= W || z < 0 || z >= CFG.L_ALL) ? 0 : WORLD.floor[(z | 0) * W + (x | 0)];
  let any = false;
  for (let z = cz0 - 1; z < cz0 + 17 && !any; z++) for (let x = cx0 - 1; x < cx0 + 17; x++) if (fl(x, z)) { any = true; break; }
  if (!any) return null; // all dark: no texture needed
  const N = CFG.CHUNK * CFG.TEX_PX, px = CFG.TEX_PX, data = new Uint8Array(N * N * 4), S = WORLD.seedNum;
  const col = [0, 0, 0];
  const rugs = WORLD.rugs.filter(r => r.x + r.rx > cx0 && r.x - r.rx < cx0 + 16 && r.z + r.rz > cz0 && r.z - r.rz < cz0 + 16);
  for (let r = 0; r < N; r++) {
    const wz = cz0 + (r + 0.5) / px;
    for (let c = 0; c < N; c++) {
      const wx = cx0 + (c + 0.5) / px, o = (r * N + c) * 4;
      const jx = (vnoise(wx * 1.6, wz * 1.6, S + 71) - 0.5) * 0.34, jz = (vnoise(wx * 1.6, wz * 1.6, S + 72) - 0.5) * 0.34;
      const t = fl(Math.floor(wx + jx), Math.floor(wz + jz));
      let wm = 0;
      if (!t) { col[0] = 13; col[1] = 11; col[2] = 10; }
      else {
        if (t === FLOOR.house) {
          const bz = Math.floor(wz * 2.2), off = hash01(bz, 7, S) * 3, bx = Math.floor((wx + off) / 2.6), hsh = hash01(bx, bz, S + 3);
          const g = vnoise(wx * 0.7, wz * 14, S + 5) * 0.16;
          const a = hexRgb('#b07a48'), b = hexRgb('#8e5e34'); for (let k = 0; k < 3; k++) col[k] = lerp(a[k], b[k], hsh) * (0.92 + g);
          if ((wz * 2.2) % 1 < 0.07 || ((wx + off) / 2.6) % 1 < 0.025) { col[0] *= 0.45; col[1] *= 0.42; col[2] *= 0.4; }
          for (const rg of rugs) {
            const e = ((wx - rg.x) / rg.rx) ** 2 + ((wz - rg.z) / rg.rz) ** 2;
            if (e < 1) { const rc = hexRgb(rg.c), band = e > 0.72 && e < 0.84; for (let k = 0; k < 3; k++) col[k] = band ? 230 - k * 20 : rc[k] * (0.9 + 0.1 * Math.sin(wx * 6) * Math.sin(wz * 6)); if (e > 0.95) col[0] = col[1] = col[2] = 40; }
          }
        } else {
          const base = { [FLOOR.fire]: ['#4e2e24', '#6a3a2a'], [FLOOR.swamp]: ['#3a4630', '#4e5a3a'], [FLOOR.ice]: ['#bcd2e0', '#dce9f2'] }[t];
          const n = fbm(wx * 0.45, wz * 0.45, S + 80, 3), a = hexRgb(base[0]), b = hexRgb(base[1]);
          for (let k = 0; k < 3; k++) col[k] = lerp(a[k], b[k], n);
          // cracks (voronoi edges)
          const cs = 1.15, gx = Math.floor(wx / cs), gz = Math.floor(wz / cs); let f1 = 9, f2 = 9, id = 0;
          for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const qx = gx + i, qz = gz + j, fx = (qx + 0.5 + 0.8 * (hash01(qx, qz, S + 91) - 0.5)) * cs, fz = (qz + 0.5 + 0.8 * (hash01(qx, qz, S + 92) - 0.5)) * cs, d = Math.hypot(wx - fx, wz - fz); if (d < f1) { f2 = f1; f1 = d; id = ihash(qx, qz, S + 93); } else if (d < f2) f2 = d; }
          const edge = f2 - f1 < 0.05;
          if (t === FLOOR.fire) { if (edge && (id & 3) === 0) { col[0] = 255; col[1] = 140; col[2] = 50; } else if (edge) { col[0] *= 0.5; col[1] *= 0.45; col[2] *= 0.4; } }
          if (t === FLOOR.swamp) { const pud = fbm(wx * 0.3, wz * 0.3, S + 95, 2); if (pud > 0.6) { const w2 = clamp((pud - 0.6) * 8, 0, 1); col[0] = lerp(col[0], 78, w2); col[1] = lerp(col[1], 104, w2); col[2] = lerp(col[2], 90, w2); wm = w2 * 0.8; } else if (edge) { col[0] *= 0.6; col[1] *= 0.62; col[2] *= 0.6; } }
          if (t === FLOOR.ice) { if (edge) { col[0] = 110; col[1] = 150; col[2] = 180; } else if (hash01(Math.floor(wx * 8), Math.floor(wz * 8), S + 96) < 0.012) { col[0] = col[1] = col[2] = 255; } }
        }
        // ink line where floor meets the dark
        const e = 0.1;
        if (!fl(Math.floor(wx + jx + e), Math.floor(wz + jz)) || !fl(Math.floor(wx + jx - e), Math.floor(wz + jz)) || !fl(Math.floor(wx + jx), Math.floor(wz + jz + e)) || !fl(Math.floor(wx + jx), Math.floor(wz + jz - e))) { col[0] = 28; col[1] = 24; col[2] = 21; }
      }
      const g = 0.94 + 0.06 * hash01(Math.floor(wx * 16), Math.floor(wz * 16), S + 51);
      data[o] = clamp(col[0] * g, 0, 255); data[o + 1] = clamp(col[1] * g, 0, 255); data[o + 2] = clamp(col[2] * g, 0, 255); data[o + 3] = wm * 255;
    }
    if ((r & 15) === 15) yield r / N;
  }
  return data;
};

// =============================================================================
// §17 PLAYER / COMBAT / FOES
// =============================================================================
const PLAYER = {
  x: 0, z: 0, mesh: null, held: null, path: [], pending: null, target: null, facing: 0, boat: null,
  move: { x: 0, z: 0 }, walkT: 0, stepT: 0, attackCd: 0, actDone: null, actDur: 0, fishT: 0, saveT: 0,
  fsm: null,
  fsmDef: { initial: 'idle', states: {
    idle: {}, walk: {},
    act: { update(p, f) { if (f.t >= p.actDur) { const cb = p.actDone; p.actDone = null; f.go('idle'); if (cb) cb(); } } },
    fish: { update(p, f) { if (f.t >= p.fishT) { f.go('idle'); if (Math.random() < 0.85) { INV.add('fish_raw', 1); AUDIO.sfx('splash'); } else { HUD.toast('It got away.'); AUDIO.sfx('splash'); } } } },
    rest: { update(p, f, dt) { p.heal(dt * 40, true); if (f.t > 2.2) { f.go('idle'); if (GAME.isNight()) { GAME.skipToDawn(); HUD.toast('You rest until dawn.'); } else HUD.toast('Rested. If you fall, you will wake here.'); } } },
    dead: { update(p, f) { if (p.mesh) p.mesh.material.uniforms.uDissolve.value = Math.min(0.95, f.t / 1.2); if (f.t > 1.3 && !p.deadShown) { p.deadShown = true; UI.dead(); } } },
  } },
  init() {
    this.fsm = new FSM(this.fsmDef, this);
    const P = SAVE.S.player; this.x = P.x; this.z = P.z; this.path = []; this.pending = null; this.boat = null; this.deadShown = false;
    if (this.mesh) { R.scene.remove(this.mesh); } if (this.held) R.scene.remove(this.held);
    this.mesh = R.paper(ATLAS.sprites.get('wanderer'), { flow: 0.4 });
    this.held = null;
    if (P.boatId) { const b = GAME.ents.get(P.boatId); if (b) { this.boat = b; } }
    if (P.hp <= 0) P.hp = this.maxHp;
  },
  get maxHp() { let m = CFG.BASE_HP; for (const k in SAVE.S.equip) { const it = SAVE.S.equip[k]; if (it && ITEMS[it.t].maxhp) m += ITEMS[it.t].maxhp; } return m; },
  get hp() { return SAVE.S.player.hp; },
  heal(n, quiet) { const P = SAVE.S.player; const before = P.hp; P.hp = Math.min(this.maxHp, P.hp + n); if (!quiet && P.hp > before) HUD.toast(`+${Math.round(P.hp - before)} health`); SAVE.touch(); HUD.health(); },
  buff(name) { const b = SAVE.S.player.buffs; return b[name] && b[name] > SAVE.S.time; },
  damage(n, type = 'blunt') {
    if (this.fsm.is('dead')) return;
    const eq = SAVE.S.equip; let m = 1;
    for (const k in eq) { const it = eq[k]; if (!it) continue; const d = ITEMS[it.t]; // worn protection
      if (d.ward) m *= 1 - d.ward; if (d.resist && d.resist[type]) m *= 1 - d.resist[type]; if (type === 'frost' && d.frost) m *= 1 - d.frost; }
    if (type === 'frost' && this.buff('frostward')) m *= 0.5;
    const P = SAVE.S.player; P.hp = Math.max(0, P.hp - n * m); SAVE.touch(); HUD.health(); AUDIO.sfx('hurt');
    this.flash = 0.25;
    if (this.fsm.is('fish', 'rest')) this.fsm.go('idle');
    if (P.hp <= 0) { this.fsm.go('dead'); this.path = []; }
  },
  respawn() {
    const P = SAVE.S.player; const r = P.respawn || [SAVE.S.start[0], SAVE.S.start[1]];
    this.leaveBoat(true); this.x = r[0]; this.z = r[1]; P.hp = this.maxHp; this.deadShown = false; this.fsm.go('idle');
    if (this.mesh) this.mesh.material.uniforms.uDissolve.value = 0;
    FOES.clearNear(this.x, this.z, 14); HUD.health(); SAVE.touch(); R.updateCamera(0, true);
  },
  busy() { return this.fsm.is('act', 'fish', 'rest', 'dead'); },
  gesture(cb, dur = 0.45, held) { this.actDur = dur; this.actDone = cb || null; this.showHeld(held); this.fsm.go('act'); },
  showHeld(inst) {
    if (this.held) { R.scene.remove(this.held); this.held.material.dispose(); this.held = null; }
    if (!inst) return; this.held = R.paper(SPRITES.item(inst), { flow: 0.6 });
  },
  /** three tool swings at a target (axe on trees, pickaxe on rocks), then done() */
  startSwing(target, tool, done) {
    if (!has(tool)) { HUD.toast(`You need a ${ITEMS[tool].name.toLowerCase()}.`); return; }
    let swings = 0; this.faceTo(target.x);
    const swing = () => { AUDIO.sfx(tool === 'pickaxe' ? 'crack' : 'chop'); if (target.mesh) { target.mesh.material.uniforms.uTint.value = 0.35; setTimeout(() => target.mesh && (target.mesh.material.uniforms.uTint.value = 0), 120); }
      if (++swings < 3) this.gesture(swing, 0.42, { t: tool }); else { this.showHeld(null); done(); } };
    this.gesture(swing, 0.42, { t: tool });
  },
  startChop(tree) { this.startSwing(tree, 'axe', () => tree.fsm.send('CHOP')); },
  startFish() { if (!has('rod')) { HUD.toast('You need a fishing rod.'); return; } this.fishT = 2.2 + Math.random() * 2.4; this.showHeld({ t: 'rod' }); this.fsm.go('fish'); AUDIO.sfx('splash'); HUD.toast('Fishing... (move to stop)', 1600); },
  rest(fire) { this.faceTo(fire.x); SAVE.S.player.respawn = [fire.x - 1.2, fire.z - 0.8]; if (!WORLD.walkableAt(fire.x - 1.2, fire.z - 0.8)) SAVE.S.player.respawn = [this.x, this.z]; this.fsm.go('rest'); AUDIO.sfx('fire'); SAVE.touch(); },
  faceTo(x) { this.facing = x > this.x ? 1 : 0; },
  board(b) { this.boat = b; this.path = []; this.x = b.x; this.z = b.z; SAVE.S.player.boatId = b.id; SAVE.touch(); HUD.toast('You hop into the boat.'); AUDIO.sfx('splash'); GAME.proxDirty = true; },
  leaveBoat(teleport = false) {
    if (!this.boat) return true;
    const b = this.boat;
    if (!teleport) {
      let best = null, bd = 9;
      for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) { const cx = Math.floor(this.x) + dx, cz = Math.floor(this.z) + dz; if (!WORLD.walkableAt(cx, cz)) continue; const d = dist2(this.x, this.z, cx + 0.5, cz + 0.5); if (d < bd) { bd = d; best = [cx + 0.5, cz + 0.5]; } }
      if (!best || bd > CFG.REACH + 0.6) { HUD.toast('Too far from land.'); return false; }
      b.x = this.x; b.z = this.z; this.x = best[0]; this.z = best[1];
    }
    b.persist(); this.boat = null; SAVE.S.player.boatId = null; SAVE.touch(); GAME.proxDirty = true; return true;
  },
  canStand(x, z) {
    if (this.boat) { if (!WORLD.inBounds(x, z)) return false; const i = WORLD.idx(x, z); return WORLD.body[i] === this.boat.d.body && !(WORLD.flags[i] & F_EDGE); }
    for (const [ox, oz] of [[-0.18, -0.12], [0.18, -0.12], [-0.18, 0.12], [0.18, 0.12]]) if (!WORLD.walkableAt(x + ox, z + oz)) return false;
    return true;
  },
  stepMove(dx, dz) {
    const nx = this.x + dx, nz = this.z + dz; let moved = false;
    if (this.canStand(nx, this.z)) { this.x = nx; moved = true; }
    if (this.canStand(this.x, nz)) { this.z = nz; moved = true; }
    if (Math.abs(dx) > 0.001) this.facing = dx < 0 ? 1 : 0;
    return moved;
  },
  walkTo(x, z, then = null) {
    if (this.fsm.is('dead')) return;
    let path = PATH.toPoint(this.x, this.z, x, z, this.boat ? this.boat.d.body : 0);
    if (path && path.partial) { // unreachable: go as close as possible, but only if that actually gets nearer without a long detour
      const end = path[path.length - 1], now = dist2(this.x, this.z, x, z), after = end ? dist2(end[0], end[1], x, z) : now;
      if (!end || after > now - 1 || PATH.length(this.x, this.z, path) > now * 1.6 + 4) path = null;
      else HUD.toast(this.boat ? 'The boat can only get this close.' : 'You cannot get across there - going as close as you can.', 2200);
    }
    if (!path) { this.path = []; this.pending = null; this.target = null; HUD.toast(this.boat ? 'The boat cannot go there.' : 'You cannot get there from here.', 1800); return false; }
    if (!path.partial && PATH.length(this.x, this.z, path) > dist2(this.x, this.z, x, z) * 2 + 8) HUD.toast('Taking the long way round.', 1800);

const COMBAT = {
  weapon() {
    const w = SAVE.S.equip.weapon || SAVE.S.inv.find(i => i.t === 'sword');
    return w ? { dmg: ITEMS.sword.dmg, ench: w.ench || '', inst: w } : { dmg: 4, ench: '', inst: null };
  },
  nearestFoe(r) { let best = null, bd = r; for (const f of FOES.list) { if (f.hp <= 0) continue; const d = dist2(f.x, f.z, PLAYER.x, PLAYER.z); if (d < bd) { bd = d; best = f; } } return best; },
  playerAttack(target) {
    if (PLAYER.attackCd > 0 || PLAYER.fsm.is('dead', 'rest')) return;
    if (target instanceof Ent) target = FOES.boss;
    if (!target || target.hp <= 0) return;
    PLAYER.attackCd = 0.6; PLAYER.faceTo(target.x); PLAYER.target = target;
    const w = this.weapon();
    PLAYER.gesture(null, 0.3, w.inst || null);
    if (dist2(target.x, target.z, PLAYER.x, PLAYER.z) > 2.3 + (target.boss ? 2 : 0)) { HUD.toast('Too far away.', 900); return; }
    FOES.hurt(target, w.dmg, w.ench); AUDIO.sfx('hit');
  },
};

const FOES = {
  list: [], spawnT: 4, boss: null,
  fsmDef: { initial: 'wander', states: {
    wander: { update(f, s, dt) { if (s.t > f.turnT) { s.t = 0; f.turnT = 1 + Math.random() * 2; const a = Math.random() * 6.28; f.vx = Math.cos(a) * 0.6; f.vz = Math.sin(a) * 0.6; } FOES.moveBy(f, f.vx * dt, f.vz * dt); if (FOES.repelled(f)) s.go('flee'); else if (FOES.pd(f) < 9) s.go('chase'); } },
    chase: { update(f, s, dt) { const d = FOES.pd(f); if (FOES.repelled(f)) return s.go('flee'); if (d > 15) return s.go('wander'); if (d < (f.mini ? 2.3 : 1.25)) return s.go('attack'); const sp = f.speed * (f.slowUntil > SAVE.S.time ? 0.5 : 1); FOES.moveBy(f, (PLAYER.x - f.x) / d * sp * dt, (PLAYER.z - f.z) / d * sp * dt); } },
    attack: { enter(f) { f.tint = 0.4; f.tintCol = [1, 0.9, 0.6]; }, update(f, s) { if (s.t > (f.windup || 0.5)) { f.tint = 0; if (f.mini) AUDIO.sfx('slam'); if (FOES.pd(f) < (f.reach || 1.7) && !FOES.repelled(f)) PLAYER.damage(f.dmg, f.dmgType); s.go('recover'); } } },
    recover: { update(f, s, dt) { if (s.t > 0.9) s.go('chase'); const d = FOES.pd(f) || 1; FOES.moveBy(f, -(PLAYER.x - f.x) / d * dt * 0.8, -(PLAYER.z - f.z) / d * dt * 0.8); } },
    flee: { update(f, s, dt) { const src = FOES.repelSource(f); if (!src) { if (s.t > 1) s.go('wander'); return; } const d = dist2(f.x, f.z, src[0], src[1]) || 1; FOES.moveBy(f, (f.x - src[0]) / d * f.speed * 1.2 * dt, (f.z - src[1]) / d * f.speed * 1.2 * dt); } },
    dying: { enter(f) { AUDIO.sfx('poof'); FOES.onDeath(f); }, update(f, s) { f.dissolve = s.t / 0.8; if (s.t > 0.85) FOES.remove(f); } },
  } },
  pd: f => dist2(f.x, f.z, PLAYER.x, PLAYER.z),
  moveBy(f, dx, dz) { const nx = f.x + dx, nz = f.z + dz; if (WORLD.walkableAt(nx, f.z) && !FOES.inArena(nx, f.z, f)) f.x = nx; if (WORLD.walkableAt(f.x, nz) && !FOES.inArena(f.x, nz, f)) f.z = nz; if (Math.abs(dx) > 0.002) f.facing = dx < 0 ? 1 : 0; },
  inArena(x, z, f) { return !f.boss && f.kind === 'imp' && z > CFG.L - 34; },
  repelSource(f) {

  },
  repelled(f) { return !f.boss && !f.mini && !!this.repelSource(f); },
  /** kind is a FOE_TYPES key; ent (optional) is the saved cave dweller this foe embodies */
  spawn(kind, x, z, ent = null) {

  },
  /** a foe has fallen: saved cave dwellers stay dead; a guardian leaves its prize */
  onDeath(f) {
    const e = f.ent; if (!e || !e.fsm.is('alive')) return;

  },
  remove(f) { if (f.ent && f.ent.foe === f) f.ent.foe = null; const i = this.list.indexOf(f); if (i >= 0) this.list.splice(i, 1); if (f.mesh) { R.scene.remove(f.mesh); f.mesh.material.dispose(); } if (PLAYER.target === f) PLAYER.target = null; },
  clear() { for (const f of [...this.list]) this.remove(f); this.boss = null; },
  clearNear(x, z, r) { for (const f of [...this.list]) if (!f.boss && dist2(f.x, f.z, x, z) < r) this.remove(f); },
  hurt(f, dmg, ench) {

  kill(f) { if (f.boss) { f.hp = 0; f.ent.fsm.go('dying'); AUDIO.sfx('roar'); FOES.clear(); return; } if (!f.fsm.is('dying')) f.fsm.go('dying'); },
  update(dt) {

        f.summon = 13; for (let k = 0; k < 2; k++) { const a = Math.random() * 6.28, x = f.x + Math.cos(a) * 2.5, z = f.z + Math.sin(a) * 2.5; if (WORLD.walkableAt(x, z)) this.spawn(f.summonKind, x, z).fsm.go('chase'); }

      m.position.set(f.x, -m.userData.foot + Math.sin(S.time * 5 + f.z) * 0.06, f.z);
      const u = m.material.uniforms; u.uFlip.value = f.facing; f.tint = Math.max(0, f.tint - dt * 2); u.uTint.value = f.tint; if (f.tintCol) u.uTintCol.value.set(...f.tintCol); u.uDissolve.value = f.dissolve;

    }
  },
  // ---- boss ----
  bossWake(e) {

  },
  bossUpdate(e, dt) {

      if (b.wind <= 0) { AUDIO.sfx('slam'); if (d < 3.6) PLAYER.damage(enraged ? 22 : 17, 'frost'); b.atk = enraged ? 1.6 : 2.4; }
    } else {
      if (d > 2.6 && d < 26) { const nx = b.x + (PLAYER.x - b.x) / d * sp * dt, nz = b.z + (PLAYER.z - b.z) / d * sp * dt; if (WORLD.walkableAt(nx, nz)) { b.x = nx; b.z = nz; } b.facing = PLAYER.x < b.x ? 1 : 0; }

      if ((b.summon -= dt) <= 0) { b.summon = enraged ? 10 : 14; for (let k = 0; k < 2; k++) { const a = Math.random() * 6.28, x = b.x + Math.cos(a) * 3, z = b.z + Math.sin(a) * 3; if (WORLD.walkableAt(x, z)) this.spawn('frostblot', x, z).fsm.go('chase'); } }

  },
};

// =============================================================================
// §18 PATHFINDING  -  A* on the cell grid, 8-way without corner cutting,
//   then string-pulled to smooth hand-drawn-ish walking lines.
// =============================================================================
const PATH = {
  passFn(body) { return body ? (i => WORLD.body[i] === body && !(WORLD.flags[i] & F_EDGE)) : (i => WORLD.walkable(i)); },
  astar(sx, sz, isGoal, hx, hz, body, closest = false) {

    const start = WORLD.idx(sx, sz); if (!WORLD.inBounds(sx, sz)) return null;

    const g = this.g, came = this.came, closed = this.closed, stamp = this.stamp; const ver = ++this.ver;
    const heap = [], push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };

    const H = i => { const x = i % W + 0.5, z = (i / W | 0) + 0.5; return Math.hypot(x - hx, z - hz); };

    while (heap.length && nodes++ < 40000) {
      const [, i] = pop(); if (stamp[i] === ver && closed[i] === 1) continue;
      closed[i] = 1;
      if (isGoal(i)) return trace(i);
      const hi = H(i); if (hi < bestH - 1e-6 || (Math.abs(hi - bestH) < 1e-6 && g[i] < g[best])) { bestH = hi; best = i; }
      const x = i % W, z = i / W | 0;
      for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dz) continue; const nx = x + dx, nz = z + dz; if (nx < 0 || nz < 0 || nx >= W || nz >= L) continue;
        const j = nz * W + nx; if (!pass(j)) continue;
        if (dx && dz && (!pass(z * W + nx) || !pass(nz * W + x))) continue;
        const ng = g[i] + (dx && dz ? 1.4142 : 1);
        if (stamp[j] !== ver) { stamp[j] = ver; closed[j] = 0; g[j] = Infinity; }
        if (closed[j] || ng >= g[j]) continue;
        g[j] = ng; came[j] = i; push(ng + H(j), j);
      }
    }
    if (closest && best !== start) { const p = trace(best); p.partial = true; return p; }
    return null;
  },
  smooth(cells, sx, sz, ex, ez, body) {
    const W = CFG.W, pts = cells.map(i => [i % W + 0.5, (i / W | 0) + 0.5]);
    if (ex !== undefined) pts[pts.length - 1] = [ex, ez];

        if (edge(12) || edge(14)) nav = -1; if (edge(13) || edge(15)) nav = 1; if (edge(14)) lr = -1; if (edge(15)) lr = 1;
        if (!nav && Math.abs(gy) > 0.6 && this.padRepeat <= 0) { nav = gy > 0 ? -1 : 1; this.padRepeat = 0.28; }
        if (!lr && Math.abs(gx) > 0.6 && this.padRepeat <= 0) { lr = gx > 0 ? 1 : -1; this.padRepeat = 0.28; }
        const ae = document.activeElement;
        if (lr && ae && ae.type === 'range') { ae.value = +ae.value + lr * +ae.step; ae.dispatchEvent(new Event('input')); }
        else if (lr && top.el.querySelector('.ui-car-stage')) top.el.dispatchEvent(new KeyboardEvent('keydown', { key: lr < 0 ? 'ArrowLeft' : 'ArrowRight', bubbles: true }));
        else if (nav || lr) this.focusStep(top.el, nav || lr);
        if (fire(0) && ae && top.el.contains(ae)) { if (ae.type === 'checkbox') ae.click(); else if (ae.tagName === 'BUTTON') ae.click(); }
        if (fire(1) || fire(9)) MODAL.back();
      } else if (SAVE.S && GAME.ready && !GAME.loading) {
        if (fire(0)) { const ae = document.activeElement; if (ae && $('#tools').contains(ae)) ae.click(); else GAME.primary(); }
        if (fire(2)) COMBAT.playerAttack(COMBAT.nearestFoe(2.4));
        if (fire(3)) UI.inventory();
        if (fire(9)) UI.menu();
        if (fire(8)) UI.journal();
        if (edge(4) || edge(14)) this.focusStep($('#tools'), -1);
        if (edge(5) || edge(15)) this.focusStep($('#tools'), 1);
        if (pressed(12)) this.zoom(1 - dt); if (pressed(13)) this.zoom(1 + dt);
        if (ry) this.zoom(1 + ry * dt * 1.5);
      } else if (fire(9) || fire(0)) { if (!MODAL.isOpen()) UI.menu(); }
      this.padPrev = gp.buttons.map(b => b.pressed);
    }
    if (this.blocked()) return;
    const mx = clamp(ix + gx, -1, 1), my = clamp(iy + gy, -1, 1);
    if (Math.abs(mx) + Math.abs(my) > 0.01) { const w = this.toWorld(mx, my); PLAYER.move = w; this.kbMoving = true; }
    else if (this.kbMoving) { PLAYER.move = { x: 0, z: 0 }; this.kbMoving = false; }
    this.updateHold();
  },
  focusStep(root, d) {
    const els = [...root.querySelectorAll('button:not([disabled]),input,textarea,select,[tabindex="0"]')].filter(el => el.offsetParent !== null);
    if (!els.length) return; const i = els.indexOf(document.activeElement);
    const n = els[i < 0 ? (d > 0 ? 0 : els.length - 1) : (i + d + els.length) % els.length];
    n.focus(); n.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  },
};

// =============================================================================
// §25 GAME FLOW  (APP FSM: title -> loading -> playing; ITEM_FSM for stateful items)
// =============================================================================
const APP = new FSM({ initial: 'boot', states: {
  boot: {}, title: { enter() { HUD.title(true); } , exit() { HUD.title(false); } },
  loading: { enter() { HUD.title(false); } },
  playing: { enter() { HUD.loading(false); } },
} }, null);
/** stateful items get their own FSMs so animations/sounds can hook their changes */
const ITEM_FSM = {
  defs: { stone: { initial: 'dull', states: { dull: { on: { REMEMBER: 'glowing' } }, glowing: { on: { RETURN: 'dull' } } } } },
  live: {},
  init() { const S = SAVE.S; const f = this.live.stone = new FSM(this.defs.stone, S); f.restore(S.returnPos ? 'glowing' : 'dull'); f.on(() => { BUS.emit('inv'); SAVE.touch(); GAME.proxDirty = true; }); },
};
// =============================================================================
// §25b GAME  -  new game, rehydrate, proximity actions, items, day/night,
//   guidance, main loop.

const GAME = {
  ents: new Map(), steps: [], campfires: [], nearbyCache: [], prox: [], proxDirty: true, proxT: 0, cullT: 0, objT: 0, obj: null,
  get ready() { return APP.is('playing'); }, get loading() { return APP.is('loading'); }, dayLight: 1, night: 0, lastRender: 0, saveT: 5, markerMesh: null,
  randomSeed() { const a = ['holly', 'ivy', 'tinsel', 'bauble', 'sprout', 'pudding', 'robin', 'frost', 'snowdrop', 'mince', 'sleigh', 'cocoa', 'ginger', 'star', 'candle', 'carol', 'mitten', 'scarf', 'walnut', 'chestnut', 'cranberry', 'yule', 'wreath', 'jingle']; const r = () => a[Math.floor(Math.random() * a.length)]; return `${r()}-${r()}-${Math.floor(Math.random() * 900 + 100)}`; },
  async generate(seedNum, attempt0, cavesPref) {
    for (let a = attempt0; a < attempt0 + 60; a++) for (const caves of (cavesPref === false ? [false] : [true, false])) {

        const res = PROVER.run(specs, plan);

  async prepare() {

  async newGame(seedStr) {

      const seedNum = hashStr(seedStr), gen = await this.generate(seedNum, 0);

        player: { x: st[0], z: st[1], hp: CFG.BASE_HP, respawn: null, boatId: null, buffs: {} },
        inv: [], equip: { weapon: null, amulet: null, ring: null, cloak: null }, books: {}, ents: {}, dyn: [], nextDyn: 0, nextBook: 0, returnPos: null, won: false };

  },
  async resume() {

  async enter(gen) {

        const sv = S.ents[spec.id], items = (sv && sv.d.items) || [];

    for (const rec of S.dyn.slice()) this.spawn(clone(rec), true, rec);

  spawn(spec, dynamic, saved) {

  envActions() {

    const am = SAVE.S.equip.amulet;

  },
  landNear() { for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) { const cx = Math.floor(PLAYER.x) + dx, cz = Math.floor(PLAYER.z) + dz; if (WORLD.walkableAt(cx, cz) && dist2(PLAYER.x, PLAYER.z, cx + 0.5, cz + 0.5) <= CFG.REACH + 0.6) return true; } return false; },
  computeProx() {
    const list = [], px = PLAYER.x, pz = PLAYER.z;

      for (const e of this.nearbyCache) {

    list.sort((a, b) => (!!a.note - !!b.note) || (b.prio - a.prio) || (a.dd - b.dd));

  primary() { const a = this.prox.find(a => !a.note); if (a) { AUDIO.sfx('ui'); a.run(); } else if (this.prox[0]) this.prox[0].run(); },
  invoke() {

    P.invokeAt = SAVE.S.time + 12; SAVE.touch(); AUDIO.sfx('magic'); PLAYER.gesture();
    let n = 0; for (const f of [...FOES.list]) if (dist2(f.x, f.z, PLAYER.x, PLAYER.z) < 4.8) { FOES.hurt(f, 25, ''); n++; }
    HUD.toast(n ? `A burst of light strikes ${n} foe${n > 1 ? 's' : ''}.` : 'A burst of light - nothing to strike.'); this.proxDirty = true;
  },
  fillFlask() { const i = SAVE.S.inv.find(x => x.t === 'flask_empty'); if (!i) return; INV.removeInst(i, 1); INV.add('flask_full', 1); AUDIO.sfx('splash'); },
  canPlace(x, z, what) {
    if (PLAYER.boat) return 'Not from a boat.';

    const i = WORLD.idx(cx, cz), f = WORLD.flags[i];

    const zone = WORLD.zoneAt(x, z); // indoors first: house floors are no-plant ground too, which gave the path message

    if (zone && what === 'plant') return 'Nothing will grow down here.';
