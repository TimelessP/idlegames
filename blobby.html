<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Blobby Virtual Pet</title>

<link rel="stylesheet" href="assets/fonts/nunito.css" />

<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="IdleGames">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blobby Virtual Pet">
<link rel="apple-touch-icon" href="assets/appicons/idle-games-512x512px.png">
<script src="assets/js/pwa.js" defer></script>
<meta name="theme-color" content="#8B6914">
<link rel="icon" href="favicon.ico" type="image/x-icon">

<style>
/* ═══════════════════════════════════════════════════════
   THEME & COLOUR VARIABLES
═══════════════════════════════════════════════════════ */
:root {
  --bg:        #FFF9E6;
  --surface:   #FFFFFF;
  --surface2:  #FFF0CC;
  --border:    #2D2D2D;
  --text:      #2D2D2D;
  --dim:       #7A6F5A;
  --accent:    #FF6B9D;
  --accent2:   #CC4477;
  --teal:      #4ECDC4;
  --teal2:     #2BA8A0;
  --yellow:    #FFD93D;
  --yellow2:   #997A00;
  --green:     #6BCB77;
  --green2:    #3A9946;
  --purple:    #C77DFF;
  --purple2:   #8B3FC8;
  --shadow:    rgba(45,45,45,0.15);
  --pet-body:  #FFB347;
  --pet-body2: #FF9020;
  --pet-hi:    #FFD090;
  box-sizing: border-box;
}

[data-theme="dark"] {
  --bg:        #1A1A2E;
  --surface:   #16213E;
  --surface2:  #0F3460;
  --border:    #E8E8FF;
  --text:      #E8E8FF;
  --dim:       #A0AEC0;
  --yellow2:   #FFD93D;
  --shadow:    rgba(0,0,0,0.4);
}
@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    --bg:        #1A1A2E;
    --surface:   #16213E;
    --surface2:  #0F3460;
    --border:    #E8E8FF;
    --text:      #E8E8FF;
    --dim:       #A0AEC0;
    --yellow2:   #FFD93D;
    --shadow:    rgba(0,0,0,0.4);
  }
}
[data-theme="light"] {
  --bg: #FFF9E6; --surface: #FFFFFF; --surface2: #FFF0CC;
  --border: #2D2D2D; --text: #2D2D2D; --dim: #7A6F5A;
  --yellow2: #997A00;
  --shadow: rgba(45,45,45,0.15);
}

/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; width: 100%;
  font-family: 'Nunito', 'Varela Round', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ═══════════════════════════════════════════════════════
   CARTOON BUTTON BASE
═══════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit; font-weight: 800; font-size: clamp(13px, 3.5vw, 15px);
  border: 3px solid var(--border); border-radius: 999px;
  padding: clamp(4px, 1.2vh, 8px) clamp(10px, 3vw, 18px); cursor: pointer; outline: none;
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s, color 0.15s;
  box-shadow: 0 3px 0 var(--border);
  position: relative; top: 0; white-space: nowrap;
}
.btn:hover { filter: brightness(1.05); }
.btn:active { top: 2px; box-shadow: 0 1px 0 var(--border); }
.btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.btn-accent  { background: var(--accent);  color: #fff; }
.btn-teal    { background: var(--teal);    color: #2D2D2D; }
.btn-yellow  { background: var(--yellow);  color: #2D2D2D; }
.btn-green   { background: var(--green);   color: #2D2D2D; }
.btn-purple  { background: var(--purple);  color: #2D2D2D; }
.btn-surface { background: var(--surface); color: var(--text); }
.btn-sm { font-size: 12px; padding: 4px 10px; box-shadow: 0 2px 0 var(--border); }
.btn-sm:active { top: 1px; box-shadow: 0 1px 0 var(--border); }
.btn-danger { background: #FF4444; color: #fff; }
.btn-icon { width: clamp(36px, 10vw, 44px); height: clamp(36px, 10vw, 44px); padding: 0; border-radius: 12px; font-size: 18px; flex-shrink: 0; }

/* ═══════════════════════════════════════════════════════
   CARTOON PANEL
═══════════════════════════════════════════════════════ */
.panel {
  background: var(--surface);
  border: 3px solid var(--border);
  border-radius: 16px;
  box-shadow: 3px 3px 0 var(--border);
}

/* ═══════════════════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════════════════ */
#loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  background: var(--bg); z-index: 1000;
  transition: opacity 0.5s;
}
#loading-screen.fade-out { opacity: 0; pointer-events: none; }
.load-blob { animation: load-float 2s ease-in-out infinite; }
@keyframes load-float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}
#load-title { font-size: 28px; font-weight: 900; color: var(--accent); -webkit-text-stroke: 1px var(--border); }
#load-sub   { font-size: 16px; color: var(--dim); font-weight: 700; }
.progress-wrap {
  width: 240px; background: var(--surface2);
  border: 3px solid var(--border); border-radius: 999px;
  height: 26px; overflow: hidden; box-shadow: 3px 3px 0 var(--border);
}
.progress-bar {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--yellow));
  border-radius: 999px; transition: width 0.4s; width: 0%;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 8px; font-size: 12px; font-weight: 800; color: #2D2D2D;
}
#load-status { font-size: 13px; color: var(--dim); font-weight: 700; }

/* ═══════════════════════════════════════════════════════
   MAIN APP & RESPONSIVE RE-FLOW LAYOUT
═══════════════════════════════════════════════════════ */
#app {
  display: none; 
  height: 100vh; 
  height: 100dvh;
  width: 100vw;
  max-width: 1200px;
  margin: 0 auto;
  padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  gap: clamp(4px, 1.2vh, 10px);
  box-sizing: border-box;
}
#app.visible { display: flex; }

/* PORTRAIT & NARROW MOBILE DEFAULT LAYOUT */
#app {
  flex-direction: column;
}

.main-stage-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 6px;
  position: relative;
}

/* LANDSCAPE / DESKTOP WIDE LAYOUT */
@media (min-aspect-ratio: 1/1) and (min-width: 640px) {
  #app {
    flex-direction: column;
  }
  .main-stage-container {
    flex-direction: row;
    align-items: stroke;
  }
  #pet-stage {
    flex: 1.2 !important;
    height: 100%;
  }
  #response-area {
    flex: 1 !important;
    justify-content: center;
    max-width: 480px;
  }
}

/* ═══════════════════════════════════════════════════════
   TOP NAVIGATION BAR
═══════════════════════════════════════════════════════ */
#top-navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-shrink: 0;
  width: 100%;
  z-index: 50;
}

.nav-left, .nav-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

#pet-name-wrap {
  font-size: clamp(14px, 4vw, 18px); font-weight: 900; color: var(--accent);
  -webkit-text-stroke: 0.5px var(--border);
  cursor: pointer; border-bottom: 2px dashed var(--accent); padding-bottom: 1px;
}
#pet-name-input {
  font-family: inherit; font-weight: 900; font-size: clamp(14px, 4vw, 18px);
  color: var(--accent); background: transparent;
  border: none; border-bottom: 2px solid var(--accent); outline: none; width: 80px;
}
#credits-display {
  display: flex; align-items: center; gap: 4px;
  font-size: clamp(13px, 3.5vw, 16px); font-weight: 900; color: var(--yellow2);
  padding: 4px 8px;
}

/* ═══════════════════════════════════════════════════════
   STATS BAR
═══════════════════════════════════════════════════════ */
#stats-bar {
  display: flex; align-items: center; justify-content: space-around; gap: 6px;
  padding: 4px 8px; flex-shrink: 0; width: 100%;
}
.stat-bar-item { display: flex; flex-direction: column; gap: 2px; flex: 1; max-width: 120px; }
.stat-bar-label { font-size: 10px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-bar-track { height: 8px; background: var(--surface2); border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s; }
.stat-bar-fill.hunger { background: linear-gradient(90deg, var(--accent), var(--yellow)); }
.stat-bar-fill.energy { background: linear-gradient(90deg, var(--teal), var(--yellow)); }
.stat-bar-fill.happy  { background: linear-gradient(90deg, var(--green), var(--teal)); }
#level-badge {
  background: var(--purple); color: #2D2D2D;
  border: 2px solid var(--border); border-radius: 999px;
  font-size: 11px; font-weight: 900; padding: 2px 8px;
  box-shadow: 2px 2px 0 var(--border); flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════
   PET STAGE
═══════════════════════════════════════════════════════ */
#pet-stage {
  flex: 1; position: relative;
  display: flex; align-items: center; justify-content: center;
  min-height: 100px; width: 100%; overflow: hidden;
}
#pet-svg-wrap {
  position: relative; 
  width: min(100%, 260px, 32vh); 
  height: min(100%, 260px, 32vh); 
  aspect-ratio: 1/1;
  cursor: pointer;
}
#pet-svg-wrap svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(4px 6px 0px rgba(45,45,45,0.25)); }
#pet-group, #props-layer { transform-origin: center; }

#pet-group.anim-happy   { animation: pet-bounce 0.5s ease forwards; }
@keyframes pet-bounce {
  0%   { transform: translateY(0); }
  35%  { transform: translateY(-36px) scale(1.05); }
  60%  { transform: translateY(-18px) scale(0.97); }
  80%  { transform: translateY(-26px) scale(1.03); }
  100% { transform: translateY(0) scale(1); }
}
#pet-group.anim-excited { animation: pet-shake 0.6s ease forwards; }
@keyframes pet-shake {
  0%,100% { transform: translateX(0); }
  15%  { transform: translateX(-12px); }
  30%  { transform: translateX(12px); }
  45%  { transform: translateX(-10px); }
  60%  { transform: translateX(10px); }
  75%  { transform: translateX(-6px); }
  90%  { transform: translateX(6px); }
}
#pet-group.anim-spin    { animation: pet-spin 0.8s ease forwards; }
@keyframes pet-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
#pet-group.anim-shiver  { animation: pet-shiver 0.4s ease forwards; }
@keyframes pet-shiver {
  0%,100% { transform: translateX(0) scale(1); }
  20%  { transform: translateX(-5px) scale(0.98); }
  40%  { transform: translateX(5px) scale(1.02); }
  60%  { transform: translateX(-4px) scale(0.99); }
  80%  { transform: translateX(4px) scale(1.01); }
}

/* Speech bubble */
#speech-bubble {
  position: absolute; top: 0px; right: 0px; max-width: 180px;
  background: var(--surface); border: 2px solid var(--border);
  border-radius: 14px; padding: 6px 10px; font-size: clamp(11px, 3vw, 13px);
  font-weight: 700; line-height: 1.2; box-shadow: 3px 3px 0 var(--border);
  opacity: 0; transform: scale(0.5) translateY(20px);
  transform-origin: bottom left; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; z-index: 10;
}
#speech-bubble.visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
#speech-bubble::after {
  content:''; position:absolute; bottom:-12px; left:16px;
  width:0; height:0; border-left:8px solid transparent;
  border-right:5px solid transparent; border-top:12px solid var(--border);
}
#speech-bubble::before {
  content:''; position:absolute; bottom:-8px; left:17px;
  width:0; height:0; border-left:7px solid transparent;
  border-right:4px solid transparent; border-top:10px solid var(--surface); z-index:1;
}
#speech-text { font-style: italic; color: var(--text); }
#speech-timer {
  display: block; height: 3px; background: var(--accent);
  margin-top: 4px; border-radius: 999px;
  transform-origin: left; transform: scaleX(1);
}
#speech-timer.draining { transform: scaleX(0); }

/* Floaters & Animations */
.floater {
  position: absolute; font-size: 20px; pointer-events: none;
  animation: floater-rise 1.8s ease forwards; z-index: 20;
}
@keyframes floater-rise {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
}
.credit-pop {
  position: fixed; font-size: 18px; font-weight: 900;
  color: var(--yellow2); -webkit-text-stroke: 0.5px var(--border);
  pointer-events: none; animation: credit-rise 1.2s ease forwards; z-index: 500;
}
@keyframes credit-rise {
  0%   { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-50px); }
}
.confetti-piece {
  position: fixed; width: 8px; height: 8px;
  border-radius: 2px; pointer-events: none; z-index: 600;
}

/* ═══════════════════════════════════════════════════════
   RESPONSE AREA
═══════════════════════════════════════════════════════ */
#response-area {
  flex-shrink: 0; display: flex; flex-direction: column;
  gap: 4px; padding: 0 2px; min-height: 0; width: 100%;
}
.resp-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; background: var(--surface);
  border: 2px solid var(--border); border-radius: 12px;
  padding: clamp(4px, 1vh, 8px) 10px; font-family: inherit; font-size: clamp(11px, 3.2vw, 13px);
  font-weight: 700; color: var(--text); cursor: pointer; text-align: left;
  box-shadow: 0 3px 0 var(--border); position: relative; top: 0;
  transition: top 0.08s, box-shadow 0.08s, background 0.15s;
  animation: slide-up 0.25s ease backwards;
}
.resp-btn:nth-child(2) { animation-delay: 0.07s; }
.resp-btn:nth-child(3) { animation-delay: 0.14s; }
@keyframes slide-up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.resp-btn:hover { background: var(--surface2); }
.resp-btn:active { top: 2px; box-shadow: 0 1px 0 var(--border); }
.resp-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
.resp-main { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.resp-text { font-size: clamp(11px, 3.2vw, 13px); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.resp-effects { font-size: 10px; font-weight: 600; color: var(--dim); margin-top: 1px; }
.resp-badge {
  flex-shrink: 0; font-size: 11px; font-weight: 900;
  background: var(--yellow); color: #2D2D2D;
  border: 2px solid var(--border); border-radius: 999px;
  padding: 1px 6px; margin-left: 6px; box-shadow: 1px 1px 0 var(--border);
}
.resp-badge.item { background: var(--accent); color: #fff; }
.resp-badge.big  { background: var(--green);  color: #2D2D2D; }

#thinking-wrap { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; color: var(--dim); }
.think-dot { width: 8px; height: 8px; background: var(--accent); border: 2px solid var(--border); border-radius: 50%; animation: think-pulse 0.8s ease-in-out infinite; }
.think-dot:nth-child(2) { animation-delay: 0.2s; }
.think-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes think-pulse { 0%,100% { transform:scale(0.7);opacity:0.5; } 50% { transform:scale(1.2);opacity:1; } }

/* ═══════════════════════════════════════════════════════
   TOOLBAR
═══════════════════════════════════════════════════════ */
#toolbar {
  flex-shrink: 0; display: flex; gap: 6px;
  justify-content: center; padding: 2px 0; width: 100%;
}
#toolbar .btn { flex: 1; max-width: 160px; }

/* ═══════════════════════════════════════════════════════
   BURGER MENU & DRAWER
═══════════════════════════════════════════════════════ */
#burger-menu-btn {
  background: var(--surface);
  color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
.burger-bar {
  width: 16px; height: 2px; background: var(--text); border-radius: 2px;
}

#burger-drawer-overlay {
  position: fixed; inset: 0; background: rgba(45,45,45,0.5);
  display: flex; justify-content: flex-start;
  z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#burger-drawer-overlay.open { opacity: 1; pointer-events: auto; }

#burger-drawer {
  background: var(--bg); border-right: 3px solid var(--border);
  width: 280px; max-width: 80vw; height: 100%;
  padding: 20px 16px; display: flex; flex-direction: column; gap: 12px;
  transform: translateX(-100%); transition: transform 0.3s ease;
  box-shadow: 4px 0 0 var(--border); overflow-y: auto;
}
#burger-drawer-overlay.open #burger-drawer { transform: translateX(0); }

.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--border); padding-bottom: 12px; margin-bottom: 8px;
}
.drawer-title { font-size: 20px; font-weight: 900; color: var(--accent); }
.drawer-menu-list { display: flex; flex-direction: column; gap: 10px; }
.drawer-menu-list .btn { width: 100%; justify-content: flex-start; text-align: left; }

/* Hidden file inputs */
#import-file-input { display: none; }

/* ═══════════════════════════════════════════════════════
   SHOP / PACK OVERLAY
═══════════════════════════════════════════════════════ */
#shop-overlay {
  position: fixed; inset: 0; background: rgba(45,45,45,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#shop-overlay.open { opacity: 1; pointer-events: auto; }
#shop-panel {
  background: var(--bg); border: 3px solid var(--border);
  border-radius: 24px 24px 0 0; width: 100%; max-width: 540px;
  max-height: 85vh; max-height: 85dvh; overflow-y: auto; padding: 16px 16px 28px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  box-shadow: 0 -4px 0 var(--border);
}
#shop-overlay.open #shop-panel { transform: translateY(0); }

#shop-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
#shop-title { font-size: 20px; font-weight: 900; color: var(--accent); -webkit-text-stroke: 0.5px var(--border); }
#shop-credits-display { font-size: 15px; font-weight: 900; color: var(--yellow2); }
.shop-tabs { display: flex; gap: 6px; border-bottom: 3px solid var(--border); margin-bottom: 14px; }
.shop-tab {
  background: none; border: none; border-bottom: 3px solid transparent;
  margin-bottom: -3px; font-family: inherit; font-size: 15px; font-weight: 800;
  color: var(--dim); padding: 6px 14px; cursor: pointer; border-radius: 8px 8px 0 0;
  transition: color 0.15s, background 0.15s;
}
.shop-tab:hover { background: var(--surface2); color: var(--text); }
.shop-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface2); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Sub-categories Pills for Shop Tab */
.shop-categories {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.shop-categories::-webkit-scrollbar { display: none; }
.cat-btn {
  background: var(--surface); border: 2px solid var(--border); border-radius: 999px;
  padding: 4px 12px; font-family: inherit; font-size: 12px; font-weight: 800;
  color: var(--text); cursor: pointer; white-space: nowrap; box-shadow: 0 2px 0 var(--border);
  transition: all 0.15s;
}
.cat-btn:hover { background: var(--surface2); }
.cat-btn.active { background: var(--yellow); color: #2D2D2D; border-color: var(--border); }

#shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.shop-card {
  background: var(--surface); border: 3px solid var(--border); border-radius: 16px;
  padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 3px 3px 0 var(--border); transition: transform 0.1s;
}
.shop-card:hover { transform: translateY(-2px); }
.shop-icon { font-size: 34px; line-height: 1; }
.shop-name { font-size: 13px; font-weight: 800; text-align: center; color: var(--text); }
.shop-price { font-size: 12px; font-weight: 900; color: var(--yellow2); background: var(--surface2); border: 2px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.shop-tag { font-size: 11px; font-weight: 700; color: var(--dim); background: var(--surface2); padding: 2px 6px; border-radius: 999px; text-align: center; }
.shop-buy-btn { width: 100%; font-size: 12px; padding: 6px 10px; }

/* Pack manager */
#pack-section { display: flex; flex-direction: column; gap: 12px; }
#pack-upload-area {
  background: var(--surface2); border: 3px dashed var(--border);
  border-radius: 16px; padding: 16px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
#pack-upload-area p { font-size: 13px; font-weight: 700; color: var(--dim); }
#pack-upload-label {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--teal); color: #2D2D2D; font-family: inherit; font-weight: 800;
  font-size: 14px; border: 3px solid var(--border); border-radius: 999px;
  padding: 8px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--border);
  transition: top 0.08s; position: relative; top: 0;
}
#pack-upload-label:hover { filter: brightness(1.05); }
#pack-upload-label:active { top: 3px; box-shadow: 0 1px 0 var(--border); }
#pack-upload { display: none; }
#pack-list { display: flex; flex-direction: column; gap: 8px; }
.pack-item {
  background: var(--surface); border: 3px solid var(--border); border-radius: 14px;
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  box-shadow: 3px 3px 0 var(--border);
}
.pack-icon { font-size: 24px; flex-shrink: 0; }
.pack-info { flex: 1; }
.pack-name { font-size: 14px; font-weight: 800; color: var(--text); }
.pack-meta { font-size: 11px; font-weight: 600; color: var(--dim); margin-top: 1px; }
.pack-badge {
  font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 999px;
  border: 2px solid var(--border);
}
.pack-badge.builtin  { background: var(--yellow); color: #2D2D2D; }
.pack-badge.custom   { background: var(--teal);   color: #2D2D2D; }
.pack-delete-btn { background: none; border: 2px solid var(--border); color: var(--dim); font-size: 16px; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
.pack-delete-btn:hover { background: #FF4444; color: #fff; border-color: #FF4444; }

#pack-stats {
  background: var(--surface2); border: 2px solid var(--border); border-radius: 12px;
  padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--dim); text-align: center;
}

/* ═══════════════════════════════════════════════════════
   TOASTS
═══════════════════════════════════════════════════════ */
#bonus-toast, #info-toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-100px);
  border: 3px solid var(--border); border-radius: 16px;
  padding: 10px 20px; font-size: 15px; font-weight: 900;
  box-shadow: 4px 4px 0 var(--border);
  transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  z-index: 700; text-align: center; pointer-events: none; max-width: 300px;
}
#bonus-toast { background: var(--yellow); color: #2D2D2D; }
#info-toast  { background: var(--teal); color: #2D2D2D; font-size: 14px; }
#bonus-toast.show, #info-toast.show { transform: translateX(-50%) translateY(0); }

@media (min-width: 521px) {
  #shop-panel { border-radius: 24px; max-height: 75vh; margin-bottom: 40px; }
  #shop-overlay { align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }

const SAVE_KEY = 'virtualpet_v2';
const XP_THRESHOLDS = [0, 100, 250, 500, 900, 1500, 2300, 3400, 5000, 7000, 10000];

const DEFAULT_STATE = {
  petName: 'Blobby', credits: 100, xp: 0, level: 1,
  happiness: 80, hunger: 80, energy: 80,
  lastSaveTime: Date.now(), lastDailyBonus: null,
  inventory: [], equipped: [], treats: 0,
  interactionCount: 0, currentEmotion: 'happy',
  muted: false, theme: 'system',
  recentEvents: [],
  deletedBuiltin: false
};

let state = { ...DEFAULT_STATE };
let activeCategory = 'all';

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) state = { ...DEFAULT_STATE, ...JSON.parse(raw) };
  } catch(e) { console.warn('State load error', e); }
}

function saveState() {
  state.lastSaveTime = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e) { console.warn('Save error', e); }
}

function applyTimeDecay() {
  const now = Date.now();
  const elapsed = Math.max(0, now - (state.lastSaveTime || now));
  const mins = elapsed / 60000;
  state.hunger   = Math.max(0, state.hunger   - Math.min(60, Math.floor(mins / 10)));
  state.energy   = Math.max(0, state.energy   - Math.min(50, Math.floor(mins / 15)));
  // Passive credits: 5 per hour
  const gain = Math.floor(mins / 60 * 5);
  if (gain > 0) {
    state.credits += gain;
    if (gain >= 5) setTimeout(() => showCreditPop(`+${gain} 🪙 (time bonus!)`), 800);
  }
  // Daily bonus
  const today = new Date().toISOString().slice(0, 10);
  if (state.lastDailyBonus !== today) {
    state.credits += 50; state.lastDailyBonus = today;
    setTimeout(showDailyBonus, 1200);
  }
  saveState();
}

function deriveEmotion() {
  if (state.hunger   < 25) return 'hungry';
  if (state.energy   < 20) return 'sleepy';
  if (state.happiness >= 80) return 'happy';
  if (state.happiness >= 55) return 'neutral';
  if (state.happiness >= 35) return 'bored';
  return 'sad';
}

function earnCredits(amount) {
  state.credits += amount;
  state.xp      += amount;
  checkLevelUp();
  saveState(); updateUI();
  showCreditPop(`+${amount} 🪙`);
}

function checkLevelUp() {
  const needed = XP_THRESHOLDS[state.level] ?? Infinity;
  if (state.xp >= needed && state.level < XP_THRESHOLDS.length - 1) {
    state.level++;
    triggerLevelUp();
  }
}

// INDEXEDDB — USER PACK STORAGE
// ═══════════════════════════════════════════════════════════════════

const DB_NAME    = 'blobby_pet_db';
const DB_VERSION = 1;
const STORE_NAME = 'poke_packs';
let   db         = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME))
        d.createObjectStore(STORE_NAME, { keyPath: 'pack_id' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

function idbPut(pack) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(pack);
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  });
}

function idbGetAll() {
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}

function idbDelete(packId) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(packId);
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  });
}

function idbClearAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
  });
}

// ═══════════════════════════════════════════════════════════════════

let allPacks   = [];
let eventPool  = [];

async function rebuildEventPool() {
  let userPacks = [];
  if (db) {
    try { userPacks = await idbGetAll(); } catch(e){}
  }
  
  const builtinPacks = state.deletedBuiltin ? [] : [DEFAULT_POKES_PACK];
  allPacks = [...builtinPacks, ...userPacks];
  eventPool = allPacks.flatMap(p => p.events || []);
}

function selectEvent(emotion) {
  if (!eventPool.length) return null;

  const recent = new Set(state.recentEvents || []);
  const MAX_RECENT = Math.min(Math.max(6, Math.floor(eventPool.length * 0.6)), 18);

  let candidates = eventPool.filter(e =>
    !recent.has(e.event_id) &&
    (!e.mood_tags || e.mood_tags.includes(emotion))
  );
  if (!candidates.length) candidates = eventPool.filter(e => !recent.has(e.event_id));
  if (!candidates.length) {
    state.recentEvents = [];
    candidates = eventPool.filter(e => !e.mood_tags || e.mood_tags.includes(emotion));
  }
  if (!candidates.length) candidates = eventPool;

  const ev = candidates[Math.floor(Math.random() * candidates.length)];

  if (!state.recentEvents) state.recentEvents = [];
  state.recentEvents.push(ev.event_id);
  if (state.recentEvents.length > MAX_RECENT) state.recentEvents.shift();

  return ev;
}

let audioCtx = null;
function getCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur=0.15, type='sine', vol=0.18) {
  if (state.muted) return;
  try {
    const ctx  = getCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playPop()     { playTone(880, 0.1,  'sine',   0.15); }

/* Delta Time Ambient Animation System (25 FPS) */
let lastFrameTime = performance.now();
const targetFPS = 25;
const frameInterval = 1000 / targetFPS; 
let idleTime = 0;

let blobY = 0;
let blobScaleY = 1;
let propY = 0;
let propScaleY = 1;
let propVY = 0;
let propVScale = 0;

function animationLoop(now) {
  requestAnimationFrame(animationLoop);
  const delta = now - lastFrameTime;

  if (delta >= frameInterval) {
    const dt = delta / 1000;
    lastFrameTime = now - (delta % frameInterval);

    idleTime += dt;

    const floatFreq = 2.2;
    const floatAmp = 9.0;
    const squashFreq = 4.4;
    const squashAmp = 0.025;

    blobY = Math.sin(idleTime * floatFreq) * floatAmp;
    blobScaleY = 1 + Math.sin(idleTime * squashFreq) * squashAmp;

    petGroup.style.transform = `translateY(${blobY}px) scaleY(${blobScaleY})`;

    const stiffness = 80.0;
    const damping = 8.5;

    const forceY = (blobY - propY) * stiffness;
    propVY += forceY * dt;
    propVY -= propVY * damping * dt;
    propY += propVY * dt;

    const forceScale = (blobScaleY - propScaleY) * stiffness;
    propVScale += forceScale * dt;
    propVScale -= propVScale * damping * dt;
    propScaleY += propVScale * dt;

    const relPropY = propY - blobY;
    const relPropScaleY = blobScaleY !== 0 ? propScaleY / blobScaleY : 1;

    propsLayer.style.transform = `translateY(${relPropY}px) scaleY(${relPropScaleY})`;
  }
}

function triggerAnim(anim) {
  petGroup.style.animation = 'none';

  const map = { happy:'anim-happy', excited:'anim-excited', spin:'anim-spin', shiver:'anim-shiver' };

  requestAnimationFrame(() => {

  });

// ═══════════════════════════════════════════════════════════════════
// SPEECH & INTERACTION STATE MACHINE
// ═══════════════════════════════════════════════════════════════════

const FSMState = {
  IDLE: 'IDLE',
  THINKING: 'THINKING',
  INTERACTING: 'INTERACTING'
};

let currentFSMState = FSMState.IDLE;
let speechTimeout = null;
let stateTimer = null;
let nextInteractionTimer = null;

function transitionTo(newState, options = {}) {
  if (stateTimer) { clearTimeout(stateTimer); stateTimer = null; }
  if (nextInteractionTimer) { clearTimeout(nextInteractionTimer); nextInteractionTimer = null; }

  currentFSMState = newState;

  if (newState === FSMState.IDLE) {
    showThinking(false);
    clearResponses();
    if (options.hideSpeechImmediate) hideSpeech();
    nextInteractionTimer = setTimeout(() => {
      startInteraction();
    }, 25000 + Math.random() * 10000);
  } 
  else if (newState === FSMState.THINKING) {
    clearResponses();
    showThinking(true);
  } 
  else if (newState === FSMState.INTERACTING) {
    showThinking(false);
  }
}

function showSpeech(text, timed=false) {
  const bubble = document.getElementById('speech-bubble');
  const timer  = document.getElementById('speech-timer');
  document.getElementById('speech-text').textContent = text;
  bubble.classList.add('visible');
  
  if (speechTimeout) { clearTimeout(speechTimeout); speechTimeout = null; }
  timer.style.transition = 'none'; 
  timer.style.transform = 'scaleX(1)';
  timer.classList.remove('draining');

  if (timed) {
    requestAnimationFrame(() => {
      timer.style.transition = 'transform 14s linear';
      timer.classList.add('draining');
    });
    speechTimeout = setTimeout(hideSpeech, 14000);
  }
}

function hideSpeech() {
  document.getElementById('speech-bubble').classList.remove('visible');
  if (speechTimeout) { clearTimeout(speechTimeout); speechTimeout = null; }
}

function showThinking(yes) {
  document.getElementById('thinking-wrap').style.display = yes ? 'flex' : 'none';
}

function clearResponses() {
  document.querySelectorAll('.resp-btn').forEach(b => b.remove());
}

function buildEffectLabel(effect) {
  const parts = [];
  if (effect.health   > 0) parts.push(`❤️+${effect.health}`);
  if (effect.energy   > 0) parts.push(`⚡+${effect.energy}`);
  if (effect.fun      > 0) parts.push(`💖+${effect.fun}`);
  if (effect.resource > 0) parts.push(`🎁×${effect.resource}`);
  return parts.slice(0, 3).join('  ');
}

function showPackResponses(event) {
  const area = document.getElementById('response-area');
  clearResponses();

  event.responses.forEach((resp, i) => {
    const reward   = resp.reward || {};
    const effect   = reward.effect || {};
    const isItem   = reward.type === 'item';
    const credits  = isItem ? Math.max(1, Math.floor((reward.amount||1)*3)) : (reward.amount || 0);
    const effectLbl= buildEffectLabel(effect);

    const btn = document.createElement('button');
    btn.className = 'resp-btn';
    btn.setAttribute('tabindex','0');

    const badgeCls = isItem ? 'resp-badge item' : (credits >= 10 ? 'resp-badge big' : 'resp-badge');
    const badgeTxt = isItem
      ? `${ITEM_ICONS[reward.item] || '🎁'} +treat`
      : `+${credits} 🪙`;

    btn.innerHTML = `
      <div class="resp-main">
        <div class="resp-text">${resp.text}</div>
        ${effectLbl ? `<div class="resp-effects">${effectLbl}</div>` : ''}
      </div>
      <span class="${badgeCls}">${badgeTxt}</span>`;

    btn.addEventListener('click', () => onPackResponsePick(resp, event, credits, btn));
    area.appendChild(btn);
  });
}

function onPackResponsePick(resp, event, credits, btn) {
  if (currentFSMState !== FSMState.INTERACTING) return;
  
  hideSpeech();
  clearResponses();

  playPop();

  const reward  = resp.reward || {};
  const effect  = reward.effect || {};

  if (effect.health)   state.hunger    = Math.min(100, state.hunger    + effect.health);
  if (effect.energy)   state.energy    = Math.min(100, state.energy    + effect.energy);
  if (effect.fun)      state.happiness = Math.min(100, state.happiness + effect.fun);
  if (effect.resource) state.treats   += effect.resource;

  if (reward.type === 'item') {
    state.treats += (reward.amount || 1);
    setTimeout(() => showItemToast(reward.item, reward.amount || 1), 400);
  }

  state.happiness = Math.min(100, state.happiness + 5);
  state.interactionCount++;

  const funBoost = effect.fun || 0;
  let emotion = 'neutral', anim = 'shiver';
  if (funBoost >= 25 || reward.type==='item') { emotion='excited'; anim='excited'; }
  else if (funBoost >= 15) { emotion='happy';   anim='happy';   }
  else if (funBoost >= 8)  { emotion='happy';   anim='spin';    }

  earnCredits(credits);
  setEmotion(emotion);
  triggerAnim(anim);
  if (['happy','excited'].includes(emotion)) playHappy();

  saveState(); updateUI();

  transitionTo(FSMState.IDLE, { hideSpeechImmediate: true });
}

function startInteraction() {
  if (!eventPool.length) {
    hideSpeech();
    clearResponses();
    transitionTo(FSMState.IDLE);
    return;
  }

  transitionTo(FSMState.THINKING);

  const delay = 800 + Math.random()*600;
  stateTimer = setTimeout(() => {
    const emotion = deriveEmotion();
    const event   = selectEvent(emotion);
    if (!event) {
      transitionTo(FSMState.IDLE);
      return;
    }
    
    transitionTo(FSMState.INTERACTING);
    showSpeech(event.statement, true);
    showPackResponses(event);
  }, delay);
}

document.getElementById('btn-export').addEventListener('click', async () => {
  let userPacks = [];
  if (db) {
    try { userPacks = await idbGetAll(); } catch(e){}
  }
  
  const exportData = {
    version: 2,
    exportDate: new Date().toISOString(),
    gameState: state,
    uploadedPacks: userPacks
  };

  const jsonStr = JSON.stringify(exportData, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `blobby-save-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  closeDrawer();

// Import Game JSON
const importFileInput = document.getElementById('import-file-input');
document.getElementById('btn-import').addEventListener('click', () => {
  importFileInput.click();
});

importFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (!data.gameState) {
      throw new Error('Invalid save file layout.');
    }

    state = { ...DEFAULT_STATE, ...data.gameState };
    saveState();

    if (Array.isArray(data.uploadedPacks) && db) {
      for (const pack of data.uploadedPacks) {
        if (pack.pack_id && Array.isArray(pack.events)) {
          await idbPut(pack);
        }
      }
    }

    await rebuildEventPool();
    updateUI();
    closeDrawer();
    showInfoToast('📥 Game imported successfully!');
    playHappy();
    startInteraction();
  } catch (err) {
    showInfoToast(`❌ Import failed: ${err.message}`);
  }
  e.target.value = '';
});

function renderShopCategories() {
  const container = document.getElementById('shop-categories');
  container.innerHTML = '';
  SHOP_CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = `cat-btn ${activeCategory === cat.id ? 'active' : ''}`;
    btn.textContent = cat.name;
    btn.addEventListener('click', () => {
      activeCategory = cat.id;
      playPop();
      renderShopCategories();
      renderShop();
    });
    container.appendChild(btn);
  });
}

function renderShop() {
  const grid = document.getElementById('shop-grid');
  grid.innerHTML = '';
  
  const filtered = activeCategory === 'all' 
    ? SHOP_ITEMS 
    : SHOP_ITEMS.filter(item => item.cat === activeCategory);

  for (const item of filtered) {
    const owned    = (state.inventory||[]).includes(item.id);
    const equipped = (state.equipped ||[]).includes(item.id);
    const afford   = state.credits >= item.price;
    const isTreat  = item.type === 'treat';

    let action = '';
    if (isTreat) {
      action = `<button class="btn btn-accent shop-buy-btn" data-buy="${item.id}" ${afford?'':'disabled'}>${afford?'Buy':'🔒 '+item.price+' 🪙'}</button>`;
    } else if (owned) {
      const lbl = equipped ? 'Unequip' : 'Equip';
      const cls = equipped ? 'btn-surface' : 'btn-teal';
      action = `<button class="btn ${cls} shop-buy-btn" data-equip="${item.id}">${lbl}</button>`;
    } else {
      action = `<button class="btn btn-accent shop-buy-btn" data-buy="${item.id}" ${afford?'':'disabled'}>${afford?'Buy':'🔒 '+item.price+' 🪙'}</button>`;
    }

    const card = document.createElement('div');
    card.className = 'shop-card';
    card.innerHTML = `<div class="shop-icon">${item.icon}</div>
      <div class="shop-name">${item.name}</div>
      <div class="shop-price">🪙 ${item.price}</div>
      <div class="shop-tag">${item.desc}</div>
      ${action}`;
    card.querySelector('[data-buy]')?.addEventListener('click',   () => buyItem(item));
    card.querySelector('[data-equip]')?.addEventListener('click', () => equipToggle(item));
    grid.appendChild(card);
  }
}

function buyItem(item) {
  if (state.credits < item.price) return;
  state.credits -= item.price; playPop();
  if (item.type === 'treat') {
    state.treats++;
    if (item.id === 'pizza')    { state.hunger = Math.min(100,state.hunger+30); state.happiness = Math.min(100,state.happiness+20); playHappy(); triggerAnim('happy'); }
    if (item.id === 'cake')     { state.hunger = Math.min(100,state.hunger+50); state.happiness = Math.min(100,state.happiness+35); playHappy(); triggerAnim('excited'); spawnFloaters('🎂',3); }
    if (item.id === 'donut')    { state.hunger = Math.min(100,state.hunger+20); state.happiness = Math.min(100,state.happiness+15); playHappy(); triggerAnim('happy'); }
    if (item.id === 'icecream') { state.hunger = Math.min(100,state.hunger+25); state.happiness = Math.min(100,state.happiness+20); playHappy(); triggerAnim('excited'); }
    if (item.id === 'sushi')    { state.hunger = Math.min(100,state.hunger+40); state.happiness = Math.min(100,state.happiness+25); playHappy(); triggerAnim('happy'); }
    if (item.id === 'boba')     { state.hunger = Math.min(100,state.hunger+20); state.energy = Math.min(100,state.energy+35); playHappy(); triggerAnim('excited'); }
  } else {
    if (!state.inventory) state.inventory = [];
    if (!state.equipped)  state.equipped  = [];
    state.inventory.push(item.id);
    state.equipped.push(item.id);
    playHappy();
  }
  saveState(); updateUI();
}

function equipToggle(item) {
  if (!state.equipped) state.equipped = [];
  const idx = state.equipped.indexOf(item.id);
  if (idx >= 0) state.equipped.splice(idx,1);
  else state.equipped.push(item.id);
  playPop(); saveState(); updateUI();
}

async function renderPackManager() {
  await rebuildEventPool();

  list.innerHTML = '';

  const totalEvents = allPacks.reduce((s,p) => s + (p.events?.length||0), 0);
  stats.textContent = `${allPacks.length} pack(s) loaded · ${totalEvents} interaction(s) in pool`;

  allPacks.forEach(p => {
    const isBuiltin = !!p.builtin;
    const card = document.createElement('div');
    card.className = 'pack-item';
    card.innerHTML = `
      <div class="pack-icon">${isBuiltin ? '📦' : '🧩'}</div>
      <div class="pack-info">
        <div class="pack-name">${p.pack_name || p.pack_id}</div>

    card.querySelector('.pack-delete-btn').addEventListener('click', async () => {
      if (!confirm(`Delete pack "${p.pack_name || p.pack_id}"?`)) return;

        state.deletedBuiltin = true;

        await idbDelete(p.pack_id);

      playPop();
      renderPackManager();
      updateUI();
    });
    list.appendChild(card);
  });
}

// Upload pack handler
document.getElementById('pack-upload').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);

    if (!data.pack_id || !Array.isArray(data.events)) {
      throw new Error('Invalid pack schema. Must contain pack_id and events array.');
    }

    if (db) await idbPut(data);
    playHappy();
    showInfoToast(`📦 Loaded "${data.pack_name || data.pack_id}" (${data.events.length} events)!`);
    renderPackManager();
    updateUI();
  } catch(err) {
    showInfoToast(`❌ Could not load pack: ${err.message}`);
  }
  e.target.value = '';
});

// Shop overlay tabs
document.querySelectorAll('.shop-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    const target = document.getElementById('tab-' + tab.dataset.tab);
    if (target) target.classList.add('active');
    playPop();
    if (tab.dataset.tab === 'packs') renderPackManager();
  });
});

document.getElementById('btn-shop').addEventListener('click', () => {
  document.getElementById('shop-overlay').classList.add('open');
  playPop();
});
document.getElementById('btn-close-shop').addEventListener('click', () => {
  document.getElementById('shop-overlay').classList.remove('open');
  playPop();
});

// ═══════════════════════════════════════════════════════════════════
// EVENT LISTENERS & INITIALISATION
// ═══════════════════════════════════════════════════════════════════

// Poke button
document.getElementById('btn-poke').addEventListener('click', () => {
  playPop();
  triggerAnim('happy');
  state.happiness = Math.min(100, state.happiness + 8);
  saveState(); updateUI();
  startInteraction();
});

// Pet click/poke
document.getElementById('pet-svg-wrap').addEventListener('click', () => {
  playPop();
  triggerAnim('excited');
  spawnFloaters('💖', 2);
  state.happiness = Math.min(100, state.happiness + 5);
  saveState(); updateUI();
  if (currentFSMState === FSMState.IDLE) startInteraction();
});

// Feed button
document.getElementById('btn-feed').addEventListener('click', () => {
  if (state.treats <= 0) return;
  state.treats--;
  state.hunger    = Math.min(100, state.hunger + 35);
  state.happiness = Math.min(100, state.happiness + 15);
  playHappy(); triggerAnim('happy');
  spawnFloaters('🍕', 3);
  saveState(); updateUI();
  setEmotion('happy');
  showSpeech('Mmmm! Delicious! 🍕');
});

// Sound toggle
document.getElementById('btn-settings').addEventListener('click', () => {
  state.muted = !state.muted;
  document.getElementById('btn-settings').textContent = state.muted ? '🔇' : '⚙️';
  showInfoToast(state.muted ? '🔇 Muted' : '🔊 Sound On');
  saveState();
});

// Theme toggle button
document.getElementById('theme-btn').addEventListener('click', () => {
  const modes = ['system', 'light', 'dark'];
  const nextMode = modes[(modes.indexOf(state.theme || 'system') + 1) % modes.length];
  applyTheme(nextMode);
  saveState();
  playPop();
});

// Pet rename
const nameWrap = document.getElementById('pet-name-wrap');
nameWrap.addEventListener('click', renamePet);
nameWrap.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') renamePet(); });

function renamePet() {
  const current = state.petName || 'Blobby';
  const inp     = document.createElement('input');
  inp.id        = 'pet-name-input';
  inp.value     = current;
  inp.maxLength = 12;
  nameWrap.replaceWith(inp);
  inp.focus(); inp.select();

  function commit() {
    const val = inp.value.trim() || current;
    state.petName = val;
    saveState();
    const span    = document.createElement('span');
    span.id       = 'pet-name-wrap';
    span.tabIndex = 0;
    span.role     = 'button';
    span.title    = 'Click to rename';
    span.textContent = val;
    span.addEventListener('click', renamePet);
    span.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') renamePet(); });
    inp.replaceWith(span);
  }

  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if (e.key==='Enter') commit(); });
}

// ═══════════════════════════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════════════════════════

async function init() {
  loadState();
  applyTheme(state.theme || 'system');
  applyTimeDecay();

  // Loading progress animation
  const bar = document.getElementById('load-bar');
  const steps = [
    { p:30,  t:'Checking tummy…' },
    { p:60,  t:'Loading accessories…' },
    { p:85,  t:'Waking Blobby up…' },
    { p:100, t:'Ready!' },
  ];
  for (const s of steps) {
    await new Promise(r => setTimeout(r, 180));
    bar.style.width = s.p + '%';
    bar.textContent = s.p + '%';
    document.getElementById('load-status').textContent = s.t;
  }

  try { db = await openDB(); } catch(e) { console.warn('IndexedDB unavailable', e); }

  await rebuildEventPool();

  document.getElementById('loading-screen').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
  }, 500);

  renderShopCategories();
  updateUI();
  updatePupils();
  requestAnimationFrame(animationLoop);

  // Initial interaction trigger
  setTimeout(() => {
    startInteraction();
  }, 1200);
}

document.addEventListener('DOMContentLoaded', init);
</script>
