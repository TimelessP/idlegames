// ---------- terrain painter for interior floors (called from TERRAIN.chunkGen) ----------
TERRAIN.interiorGen = function* (cx0, cz0) {
  const W = CFG.W, fl = (x, z) => (x < 0 || x >= W || z < 0 || z >= CFG.L_ALL) ? 0 : WORLD.floor[(z | 0) * W + (x | 0)];
  let any = false;
  for (let z = cz0 - 1; z < cz0 + 17 && !any; z++) for (let x = cx0 - 1; x < cx0 + 17; x++) if (fl(x, z)) { any = true; break; }
  if (!any) return null; // all dark: no texture needed
  const N = CFG.CHUNK * CFG.TEX_PX, px = CFG.TEX_PX, data = new Uint8Array(N * N * 4), S = WORLD.seedNum;
  const col = [0, 0, 0];
  const rugs = WORLD.rugs.filter(r => r.x + r.rx > cx0 && r.x - r.rx < cx0 + 16 && r.z + r.rz > cz0 && r.z - r.rz < cz0 + 16);
  for (let r = 0; r < N; r++) {
    const wz = cz0 + (r + 0.5) / px;
    for (let c = 0; c < N; c++) {
      const wx = cx0 + (c + 0.5) / px, o = (r * N + c) * 4;
      const jx = (vnoise(wx * 1.6, wz * 1.6, S + 71) - 0.5) * 0.34, jz = (vnoise(wx * 1.6, wz * 1.6, S + 72) - 0.5) * 0.34;
      const t = fl(Math.floor(wx + jx), Math.floor(wz + jz));
      let wm = 0;
      if (!t) { col[0] = 13; col[1] = 11; col[2] = 10; }
      else {
        if (t === FLOOR.house) {
          const bz = Math.floor(wz * 2.2), off = hash01(bz, 7, S) * 3, bx = Math.floor((wx + off) / 2.6), hsh = hash01(bx, bz, S + 3);
          const g = vnoise(wx * 0.7, wz * 14, S + 5) * 0.16;
          const a = hexRgb('#b07a48'), b = hexRgb('#8e5e34'); for (let k = 0; k < 3; k++) col[k] = lerp(a[k], b[k], hsh) * (0.92 + g);
          if ((wz * 2.2) % 1 < 0.07 || ((wx + off) / 2.6) % 1 < 0.025) { col[0] *= 0.45; col[1] *= 0.42; col[2] *= 0.4; }
          for (const rg of rugs) {
            const e = ((wx - rg.x) / rg.rx) ** 2 + ((wz - rg.z) / rg.rz) ** 2;
            if (e < 1) { const rc = hexRgb(rg.c), band = e > 0.72 && e < 0.84; for (let k = 0; k < 3; k++) col[k] = band ? 230 - k * 20 : rc[k] * (0.9 + 0.1 * Math.sin(wx * 6) * Math.sin(wz * 6)); if (e > 0.95) col[0] = col[1] = col[2] = 40; }
          }
        } else {
          const base = { [FLOOR.fire]: ['#4e2e24', '#6a3a2a'], [FLOOR.swamp]: ['#3a4630', '#4e5a3a'], [FLOOR.ice]: ['#bcd2e0', '#dce9f2'] }[t];
          const n = fbm(wx * 0.45, wz * 0.45, S + 80, 3), a = hexRgb(base[0]), b = hexRgb(base[1]);
          for (let k = 0; k < 3; k++) col[k] = lerp(a[k], b[k], n);
          // cracks (voronoi edges)
          const cs = 1.15, gx = Math.floor(wx / cs), gz = Math.floor(wz / cs); let f1 = 9, f2 = 9, id = 0;
          for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const qx = gx + i, qz = gz + j, fx = (qx + 0.5 + 0.8 * (hash01(qx, qz, S + 91) - 0.5)) * cs, fz = (qz + 0.5 + 0.8 * (hash01(qx, qz, S + 92) - 0.5)) * cs, d = Math.hypot(wx - fx, wz - fz); if (d < f1) { f2 = f1; f1 = d; id = ihash(qx, qz, S + 93); } else if (d < f2) f2 = d; }
          const edge = f2 - f1 < 0.05;
          if (t === FLOOR.fire) { if (edge && (id & 3) === 0) { col[0] = 255; col[1] = 140; col[2] = 50; } else if (edge) { col[0] *= 0.5; col[1] *= 0.45; col[2] *= 0.4; } }
          if (t === FLOOR.swamp) { const pud = fbm(wx * 0.3, wz * 0.3, S + 95, 2); if (pud > 0.6) { const w2 = clamp((pud - 0.6) * 8, 0, 1); col[0] = lerp(col[0], 78, w2); col[1] = lerp(col[1], 104, w2); col[2] = lerp(col[2], 90, w2); wm = w2 * 0.8; } else if (edge) { col[0] *= 0.6; col[1] *= 0.62; col[2] *= 0.6; } }
          if (t === FLOOR.ice) { if (edge) { col[0] = 110; col[1] = 150; col[2] = 180; } else if (hash01(Math.floor(wx * 8), Math.floor(wz * 8), S + 96) < 0.012) { col[0] = col[1] = col[2] = 255; } }
        }
        // ink line where floor meets the dark
        const e = 0.1;
        if (!fl(Math.floor(wx + jx + e), Math.floor(wz + jz)) || !fl(Math.floor(wx + jx - e), Math.floor(wz + jz)) || !fl(Math.floor(wx + jx), Math.floor(wz + jz + e)) || !fl(Math.floor(wx + jx), Math.floor(wz + jz - e))) { col[0] = 28; col[1] = 24; col[2] = 21; }
      }
      const g = 0.94 + 0.06 * hash01(Math.floor(wx * 16), Math.floor(wz * 16), S + 51);
      data[o] = clamp(col[0] * g, 0, 255); data[o + 1] = clamp(col[1] * g, 0, 255); data[o + 2] = clamp(col[2] * g, 0, 255); data[o + 3] = wm * 255;
    }
    if ((r & 15) === 15) yield r / N;

};

  actions: e => [act('entercave', 'Enter ' + CAVE_TYPES[e.d.type].name, ['door', { cave: true }], () => GAME.enterPocket(e.d.pocket), { prio: 5 })],
  light: e => ({ x: e.x, z: e.z - 0.8, r: 3.5, i: 0.6, c: hexRgb(CAVE_TYPES[e.d.type].glow).map(v => v / 255) }),
  shadow: () => 4,
};
KINDS.bed = {
  visual(e) { e.setSprite('bed_' + ((e.d.q | 0) % QUILTS.length)); },
  actions: e => [act('sleep', 'Sleep in bed', ['bed', { quilt: QUILTS[(e.d.q | 0) % QUILTS.length] }], () => PLAYER.rest(e), { prio: 3 })],
  shadow: () => 2.4,
};
KINDS.hearth = {
  initial: e => e.d.lit ? 'lit' : 'cold',
  fsm: { states: {
    cold: { on: { LIGHT: 'lit' } },
    lit: { enter(e) { if (GAME.campfires && !GAME.campfires.includes(e)) GAME.campfires.push(e); },
      update(e, f) { const fi = Math.floor(f.t * 6) % 4; if (fi !== e.anim && e.mesh) { e.anim = fi; R.setFrame(e.mesh, e.spr, fi + 1); } } },
  } },
  visual(e) { e.setSprite('hearth', e.fsm.is('lit') ? 1 + (e.anim | 0) : 0); },
  actions(e) {
    if (e.fsm.is('cold')) { const ok = has('wood'); return [act('lighthearth', 'Light fireplace (1 wood)', ['campfire', { frame: 0 }], () => {
      if (!has('wood')) { HUD.toast('You need 1 wood to light the fire.'); return; } INV.remove('wood', 1); e.d.lit = true; AUDIO.sfx('fire'); e.fsm.send('LIGHT'); HUD.toast('The fire takes. The room glows.');
    }, { prio: 4, note: ok ? '' : 'Needs 1 wood' })]; }
    return KINDS.campfire.actions(e);
  },
  light: e => e.fsm.is('lit') ? ({ x: e.x, z: e.z - 0.6, r: 8, i: 0.85, c: [1, 0.6, 0.3] }) : null,
  shadow: () => 0,
};
KINDS.table = { visual(e) { e.setSprite('table'); }, shadow: () => 2 };
KINDS.shrooms = {
  initial: e => e.d.picked ? 'picked' : 'grown',
  fsm: { states: {
    grown: { on: { PICK: 'picked' } },
    picked: { update(e, f) { if (SAVE.S.clock >= (e.d.until || 0)) { e.d.picked = false; f.go('grown'); } } }, // regrow at dawn
  } },
  visual(e) { e.setSprite(`shrooms_${e.d.type}_${e.fsm.is('picked') ? 1 : 0}`); },
  actions: e => e.fsm.is('grown') ? [act('pickshroom', 'Pick mushrooms', ['mushroom'], () => { PLAYER.gesture(); INV.add('mushroom', 2); e.d.picked = true; e.d.until = GAME.nextDawn(); e.fsm.send('PICK'); }, { prio: 3 })] : [],
  light: e => e.fsm.is('grown') ? ({ x: e.x, z: e.z, r: 2.5, i: 0.35, c: hexRgb(CAVE_TYPES[e.d.type].glow).map(v => v / 255) }) : null,
  shadow: () => 0.9,
};
/** a cave dweller: the entity remembers whether it lives (always saved); its foe appears when you come near */
KINDS.minion = {
  initial: e => e.d.dead ? 'dead' : 'alive',
  fsm: { states: { alive: { on: { DIE: 'dead' } }, dead: {} } },
  update(e) {
    if (!e.fsm.is('alive') || e.foe || GAME.zone !== e.zone || PLAYER.fsm.is('dead')) return;
    if (dist2(PLAYER.x, PLAYER.z, e.x, e.z) < (e.kind === 'miniboss' ? 13 : 15)) e.foe = FOES.spawn(e.d.ft, e.x, e.z, e);
  },
};
KINDS.miniboss = KINDS.minion;
KINDS.well.actions = e => [act('drawwater', 'Draw water', ['flask', { full: true }], () => {
  const empties = INV.count('flask_empty');
  if (empties) { INV.remove('flask_empty', empties); INV.add('flask_full', empties); }
  else if (INV.count('flask_full') < 3) INV.add('flask_full', 1);
  else { HUD.toast('You already carry plenty of water.'); return; }
  AUDIO.sfx('splash');

// =============================================================================
// §17 PLAYER / COMBAT / FOES
// =============================================================================
const PLAYER = {
  x: 0, z: 0, mesh: null, held: null, path: [], pending: null, target: null, facing: 0, boat: null,
  move: { x: 0, z: 0 }, walkT: 0, stepT: 0, attackCd: 0, actDone: null, actDur: 0, fishT: 0, saveT: 0,
  fsm: null,
  fsmDef: { initial: 'idle', states: {
    idle: {}, walk: {},
    act: { update(p, f) { if (f.t >= p.actDur) { const cb = p.actDone; p.actDone = null; f.go('idle'); if (cb) cb(); } } },
    fish: { update(p, f) { if (f.t >= p.fishT) { f.go('idle'); if (Math.random() < 0.85) { INV.add('fish_raw', 1); AUDIO.sfx('splash'); } else { HUD.toast('It got away.'); AUDIO.sfx('splash'); } } } },
    rest: { update(p, f, dt) { p.heal(dt * 40, true); if (f.t > 2.2) { f.go('idle'); if (GAME.isNight()) { GAME.skipToDawn(); HUD.toast('You rest until dawn.'); } else HUD.toast('Rested. If you fall, you will wake here.'); } } },
    dead: { update(p, f) { if (p.mesh) p.mesh.material.uniforms.uDissolve.value = Math.min(0.95, f.t / 1.2); if (f.t > 1.3 && !p.deadShown) { p.deadShown = true; UI.dead(); } } },
  } },
  init() {
    this.fsm = new FSM(this.fsmDef, this);
    const P = SAVE.S.player; this.x = P.x; this.z = P.z; this.path = []; this.pending = null; this.boat = null; this.deadShown = false;
    if (this.mesh) { R.scene.remove(this.mesh); } if (this.held) R.scene.remove(this.held);
    this.mesh = R.paper(ATLAS.sprites.get('wanderer'), { flow: 0.4 });
    this.held = null;
    if (P.boatId) { const b = GAME.ents.get(P.boatId); if (b) { this.boat = b; } }
    if (P.hp <= 0) P.hp = this.maxHp;
  },
  get maxHp() { let m = CFG.BASE_HP; for (const k in SAVE.S.equip) { const it = SAVE.S.equip[k]; if (it && ITEMS[it.t].maxhp) m += ITEMS[it.t].maxhp; } return m; },
  get hp() { return SAVE.S.player.hp; },
  heal(n, quiet) { const P = SAVE.S.player; const before = P.hp; P.hp = Math.min(this.maxHp, P.hp + n); if (!quiet && P.hp > before) HUD.toast(`+${Math.round(P.hp - before)} health`); SAVE.touch(); HUD.health(); },
  buff(name) { const b = SAVE.S.player.buffs; return b[name] && b[name] > SAVE.S.time; },
  damage(n, type = 'blunt') {
    if (this.fsm.is('dead')) return;
    const eq = SAVE.S.equip; let m = 1;
    for (const k in eq) { const it = eq[k]; if (!it) continue; const d = ITEMS[it.t]; // worn protection
      if (d.ward) m *= 1 - d.ward; if (d.resist && d.resist[type]) m *= 1 - d.resist[type]; if (type === 'frost' && d.frost) m *= 1 - d.frost; }
    if (type === 'frost' && this.buff('frostward')) m *= 0.5;
    const P = SAVE.S.player; P.hp = Math.max(0, P.hp - n * m); SAVE.touch(); HUD.health(); AUDIO.sfx('hurt');
    this.flash = 0.25;
    if (this.fsm.is('fish', 'rest')) this.fsm.go('idle');
    if (P.hp <= 0) { this.fsm.go('dead'); this.path = []; }
  },
  respawn() {
    const P = SAVE.S.player; const r = P.respawn || [SAVE.S.start[0], SAVE.S.start[1]];
    this.leaveBoat(true); this.x = r[0]; this.z = r[1]; P.hp = this.maxHp; this.deadShown = false; this.fsm.go('idle');
    if (this.mesh) this.mesh.material.uniforms.uDissolve.value = 0;
    FOES.clearNear(this.x, this.z, 14); HUD.health(); SAVE.touch(); R.updateCamera(0, true);
  },
  busy() { return this.fsm.is('act', 'fish', 'rest', 'dead'); },
  gesture(cb, dur = 0.45, held) { this.actDur = dur; this.actDone = cb || null; this.showHeld(held); this.fsm.go('act'); },
  showHeld(inst) {
    if (this.held) { R.scene.remove(this.held); this.held.material.dispose(); this.held = null; }
    if (!inst) return; this.held = R.paper(SPRITES.item(inst), { flow: 0.6 });
  },
  /** three tool swings at a target (axe on trees, pickaxe on rocks), then done() */
  startSwing(target, tool, done) {
    if (!has(tool)) { HUD.toast(`You need a ${ITEMS[tool].name.toLowerCase()}.`); return; }
    let swings = 0; this.faceTo(target.x);
    const swing = () => { AUDIO.sfx(tool === 'pickaxe' ? 'crack' : 'chop'); if (target.mesh) { target.mesh.material.uniforms.uTint.value = 0.35; setTimeout(() => target.mesh && (target.mesh.material.uniforms.uTint.value = 0), 120); }
      if (++swings < 3) this.gesture(swing, 0.42, { t: tool }); else { this.showHeld(null); done(); } };
    this.gesture(swing, 0.42, { t: tool });
  },
  startChop(tree) { this.startSwing(tree, 'axe', () => tree.fsm.send('CHOP')); },
  startFish() { if (!has('rod')) { HUD.toast('You need a fishing rod.'); return; } this.fishT = 2.2 + Math.random() * 2.4; this.showHeld({ t: 'rod' }); this.fsm.go('fish'); AUDIO.sfx('splash'); HUD.toast('Fishing... (move to stop)', 1600); },
  rest(fire) { this.faceTo(fire.x); SAVE.S.player.respawn = [fire.x - 1.2, fire.z - 0.8]; if (!WORLD.walkableAt(fire.x - 1.2, fire.z - 0.8)) SAVE.S.player.respawn = [this.x, this.z]; this.fsm.go('rest'); AUDIO.sfx('fire'); SAVE.touch(); },
  faceTo(x) { this.facing = x > this.x ? 1 : 0; },
  board(b) { this.boat = b; this.path = []; this.x = b.x; this.z = b.z; SAVE.S.player.boatId = b.id; SAVE.touch(); HUD.toast('You hop into the boat.'); AUDIO.sfx('splash'); GAME.proxDirty = true; },
  leaveBoat(teleport = false) {
    if (!this.boat) return true;
    const b = this.boat;
    if (!teleport) {
      let best = null, bd = 9;
      for (let dz = -3; dz <= 3; dz++) for (let dx = -3; dx <= 3; dx++) { const cx = Math.floor(this.x) + dx, cz = Math.floor(this.z) + dz; if (!WORLD.walkableAt(cx, cz)) continue; const d = dist2(this.x, this.z, cx + 0.5, cz + 0.5); if (d < bd) { bd = d; best = [cx + 0.5, cz + 0.5]; } }
      if (!best || bd > CFG.REACH + 0.6) { HUD.toast('Too far from land.'); return false; }
      b.x = this.x; b.z = this.z; this.x = best[0]; this.z = best[1];
    }
    b.persist(); this.boat = null; SAVE.S.player.boatId = null; SAVE.touch(); GAME.proxDirty = true; return true;
  },
  canStand(x, z) {
    if (this.boat) { if (!WORLD.inBounds(x, z)) return false; const i = WORLD.idx(x, z); return WORLD.body[i] === this.boat.d.body && !(WORLD.flags[i] & F_EDGE); }
    for (const [ox, oz] of [[-0.18, -0.12], [0.18, -0.12], [-0.18, 0.12], [0.18, 0.12]]) if (!WORLD.walkableAt(x + ox, z + oz)) return false;
    return true;
  },
  stepMove(dx, dz) {
    const nx = this.x + dx, nz = this.z + dz; let moved = false;
    if (this.canStand(nx, this.z)) { this.x = nx; moved = true; }
    if (this.canStand(this.x, nz)) { this.z = nz; moved = true; }
    if (Math.abs(dx) > 0.001) this.facing = dx < 0 ? 1 : 0;
    return moved;
  },
  walkTo(x, z, then = null) {
    if (this.fsm.is('dead')) return;
    let path = PATH.toPoint(this.x, this.z, x, z, this.boat ? this.boat.d.body : 0);
    if (path && path.partial) { // unreachable: go as close as possible, but only if that actually gets nearer without a long detour
      const end = path[path.length - 1], now = dist2(this.x, this.z, x, z), after = end ? dist2(end[0], end[1], x, z) : now;
      if (!end || after > now - 1 || PATH.length(this.x, this.z, path) > now * 1.6 + 4) path = null;
      else HUD.toast(this.boat ? 'The boat can only get this close.' : 'You cannot get across there - going as close as you can.', 2200);
    }
    if (!path) { this.path = []; this.pending = null; this.target = null; HUD.toast(this.boat ? 'The boat cannot go there.' : 'You cannot get there from here.', 1800); return false; }
    if (!path.partial && PATH.length(this.x, this.z, path) > dist2(this.x, this.z, x, z) * 2 + 8) HUD.toast('Taking the long way round.', 1800);
    if (this.boat && !then && !WORLD.isWaterAt(x, z) && WORLD.walkableAt(x, z)) then = () => { if (GAME.landNear()) { this.leaveBoat(); this.walkTo(x, z); } }; // tap land from a boat: row there and step out
    this.path = path; this.pending = then; this.target = null; if (this.fsm.is('fish', 'rest')) this.fsm.go('idle'); return true;
  },
  interact(ent) {
    if (this.fsm.is('dead')) return;
    const reach = CFG.REACH + ent.r - 0.3;
    const run = () => { const a = GAME.actionsFor(ent).find(a => !a.note); if (a) { AUDIO.sfx('ui'); a.run(); } else { const n = GAME.actionsFor(ent)[0]; if (n) n.run(); } };
    if (dist2(this.x, this.z, ent.x, ent.z) <= reach) { this.path = []; run(); return; }
    const path = PATH.toEntity(this.x, this.z, ent, this.boat ? this.boat.d.body : 0);
    if (!path) { this.path = []; this.pending = null; HUD.toast('You cannot reach that from here.', 1800); return; }
    if (PATH.length(this.x, this.z, path) > dist2(this.x, this.z, ent.x, ent.z) * 2 + 8) HUD.toast('Taking the long way round.', 1800);
    this.path = path; this.pending = () => { if (dist2(this.x, this.z, ent.x, ent.z) <= reach + 0.4) run(); };
  },
  update(dt) {
    if (!this.fsm) return;
    this.fsm.update(dt); this.attackCd -= dt;
    const st = this.fsm.state;
    let mx = this.move.x, mz = this.move.z; const mag = Math.hypot(mx, mz);
    const speed = (this.boat ? CFG.BOAT_SPEED : CFG.SPEED) * (this.buff('swift') ? 1.6 : 1);
    let walking = false;
    if (st !== 'dead' && st !== 'rest') {
      if (mag > 0.05) {
        if (this.fsm.is('fish', 'act')) { if (this.fsm.is('fish')) this.fsm.go('idle'); }
        this.path = []; this.pending = null; this.target = null;
        if (!this.fsm.is('act')) { const k = Math.min(1, mag); walking = this.stepMove(mx / mag * speed * k * dt, mz / mag * speed * k * dt); }
      } else if (this.path.length && !this.fsm.is('act')) {
        const [tx, tz] = this.path[0], dx = tx - this.x, dz = tz - this.z, d = Math.hypot(dx, dz), s = speed * dt;
        if (d <= s) { this.x = tx; this.z = tz; this.path.shift(); if (!this.path.length) { const p = this.pending; this.pending = null; if (p) p(); } }
        else { this.x += dx / d * s; this.z += dz / d * s; this.facing = dx < 0 ? 1 : 0; }
        walking = true;
      }
    }
    if (walking && !this.fsm.is('walk') && !this.busy()) this.fsm.go('walk');
    if (!walking && this.fsm.is('walk')) this.fsm.go('idle');
    // boat follows
    if (this.boat) { this.boat.x = this.x; this.boat.z = this.z; if (this.boat.mesh) this.boat.mesh.position.set(this.x, this.boat.mesh.position.y, this.z + 0.05); }
    // footsteps & autosave of position
    if (walking) { this.walkT += dt; if ((this.stepT -= dt) <= 0) { this.stepT = 0.38; AUDIO.sfx(this.boat ? 'paddle' : 'step'); } if ((this.saveT -= dt) <= 0) { this.saveT = 1.5; SAVE.touch(); } }
    // auto pickup
    if (!this.boat) for (const e of GAME.nearbyCache) if (e.kind === 'pickup' && e.fsm.is('here') && dist2(e.x, e.z, this.x, this.z) < 0.75) KINDS.pickup.take(e);
    // auto attack
    if (SETTINGS.v.controls.autoAttack && !walking && this.fsm.is('idle') && this.attackCd <= 0) { const f = COMBAT.nearestFoe(1.9); if (f) COMBAT.playerAttack(f); }
    if (this.target && this.target.hp > 0 && this.attackCd <= 0 && !walking) { if (dist2(this.target.x, this.target.z, this.x, this.z) < 2) COMBAT.playerAttack(this.target); }
    // visuals
    const m = this.mesh; if (!m) return; const spr = m.userData.spr;
    let fi = 0;
    if (this.boat) fi = 6; else if (this.fsm.is('walk')) fi = 1 + Math.floor(this.walkT * 8) % 4; else if (this.fsm.is('act', 'fish')) fi = 5; else if (this.fsm.is('rest')) fi = 6;
    R.setFrame(m, spr, fi); m.material.uniforms.uFlip.value = this.facing;
    this.flash = Math.max(0, (this.flash || 0) - dt); m.material.uniforms.uTint.value = this.flash > 0 ? 0.5 : 0;
    m.position.set(this.x, -m.userData.foot + (this.boat ? 0.05 : 0), this.z);
    if (this.held) {
      const swing = this.fsm.is('act') ? Math.sin(this.fsm.t / this.actDur * Math.PI) : 0.3;
      const side = this.facing ? -1 : 1; this.held.position.set(this.x - side * 0.45, 0.55 + swing * 0.35, this.z - 0.05);
      this.held.material.uniforms.uFlip.value = this.facing;
      if (!this.fsm.is('act', 'fish')) this.showHeld(null);
    }
  },
};

const COMBAT = {
  weapon() {
    const w = SAVE.S.equip.weapon || SAVE.S.inv.find(i => i.t === 'sword');
    return w ? { dmg: ITEMS.sword.dmg, ench: w.ench || '', inst: w } : { dmg: 4, ench: '', inst: null };
  },
  nearestFoe(r) { let best = null, bd = r; for (const f of FOES.list) { if (f.hp <= 0) continue; const d = dist2(f.x, f.z, PLAYER.x, PLAYER.z); if (d < bd) { bd = d; best = f; } } return best; },
  playerAttack(target) {
    if (PLAYER.attackCd > 0 || PLAYER.fsm.is('dead', 'rest')) return;
    if (target instanceof Ent) target = FOES.boss;
    if (!target || target.hp <= 0) return;
    PLAYER.attackCd = 0.6; PLAYER.faceTo(target.x); PLAYER.target = target;
    const w = this.weapon();
    PLAYER.gesture(null, 0.3, w.inst || null);
    if (dist2(target.x, target.z, PLAYER.x, PLAYER.z) > 2.3 + (target.boss ? 2 : 0)) { HUD.toast('Too far away.', 900); return; }
    FOES.hurt(target, w.dmg, w.ench); AUDIO.sfx('hit');
  },
};

const FOES = {
  list: [], spawnT: 4, boss: null,
  fsmDef: { initial: 'wander', states: {
    wander: { update(f, s, dt) { if (s.t > f.turnT) { s.t = 0; f.turnT = 1 + Math.random() * 2; const a = Math.random() * 6.28; f.vx = Math.cos(a) * 0.6; f.vz = Math.sin(a) * 0.6; } FOES.moveBy(f, f.vx * dt, f.vz * dt); if (FOES.repelled(f)) s.go('flee'); else if (FOES.pd(f) < 9) s.go('chase'); } },
    chase: { update(f, s, dt) { const d = FOES.pd(f); if (FOES.repelled(f)) return s.go('flee'); if (d > 15) return s.go('wander'); if (d < (f.mini ? 2.3 : 1.25)) return s.go('attack'); const sp = f.speed * (f.slowUntil > SAVE.S.time ? 0.5 : 1); FOES.moveBy(f, (PLAYER.x - f.x) / d * sp * dt, (PLAYER.z - f.z) / d * sp * dt); } },
    attack: { enter(f) { f.tint = 0.4; f.tintCol = [1, 0.9, 0.6]; }, update(f, s) { if (s.t > (f.windup || 0.5)) { f.tint = 0; if (f.mini) AUDIO.sfx('slam'); if (FOES.pd(f) < (f.reach || 1.7) && !FOES.repelled(f)) PLAYER.damage(f.dmg, f.dmgType); s.go('recover'); } } },
    recover: { update(f, s, dt) { if (s.t > 0.9) s.go('chase'); const d = FOES.pd(f) || 1; FOES.moveBy(f, -(PLAYER.x - f.x) / d * dt * 0.8, -(PLAYER.z - f.z) / d * dt * 0.8); } },
    flee: { update(f, s, dt) { const src = FOES.repelSource(f); if (!src) { if (s.t > 1) s.go('wander'); return; } const d = dist2(f.x, f.z, src[0], src[1]) || 1; FOES.moveBy(f, (f.x - src[0]) / d * f.speed * 1.2 * dt, (f.z - src[1]) / d * f.speed * 1.2 * dt); } },
    dying: { enter(f) { AUDIO.sfx('poof'); FOES.onDeath(f); }, update(f, s) { f.dissolve = s.t / 0.8; if (s.t > 0.85) FOES.remove(f); } },
  } },
  pd: f => dist2(f.x, f.z, PLAYER.x, PLAYER.z),
  moveBy(f, dx, dz) { const nx = f.x + dx, nz = f.z + dz; if (WORLD.walkableAt(nx, f.z) && !FOES.inArena(nx, f.z, f)) f.x = nx; if (WORLD.walkableAt(f.x, nz) && !FOES.inArena(f.x, nz, f)) f.z = nz; if (Math.abs(dx) > 0.002) f.facing = dx < 0 ? 1 : 0; },
  inArena(x, z, f) { return !f.boss && f.kind === 'imp' && z > CFG.L - 34; },
  repelSource(f) {
    for (const r of GAME.repellers()) if (dist2(r.x, r.z, f.x, f.z) < r.r) return [r.x, r.z];
    if (PLAYER.buff('ward') && FOES.pd(f) < 5.5) return [PLAYER.x, PLAYER.z];
    return null;
  },
  repelled(f) { return !f.boss && !f.mini && !!this.repelSource(f); },
  /** kind is a FOE_TYPES key; ent (optional) is the saved cave dweller this foe embodies */
  spawn(kind, x, z, ent = null) {
    const T = FOE_TYPES[kind] || FOE_TYPES.imp;
    const f = { kind, x, z, name: T.name, hp: T.hp, maxHp: T.hp, speed: T.speed, dmg: T.dmg, dmgType: T.type, res: T.res || {}, mini: !!T.mini, reach: T.reach, windup: T.windup, summonKind: T.minion,

    }
  },
  // ---- boss ----
  bossWake(e) {

// =============================================================================
// §18 PATHFINDING  -  A* on the cell grid, 8-way without corner cutting,
//   then string-pulled to smooth hand-drawn-ish walking lines.
// =============================================================================
const PATH = {
  passFn(body) { return body ? (i => WORLD.body[i] === body && !(WORLD.flags[i] & F_EDGE)) : (i => WORLD.walkable(i)); },
  astar(sx, sz, isGoal, hx, hz, body, closest = false) {
    const W = CFG.W, L = CFG.L_ALL, n = W * L, pass = this.passFn(body);
    const start = WORLD.idx(sx, sz); if (!WORLD.inBounds(sx, sz)) return null;
    if (!this.g || this.g.length !== n) { this.g = new Float32Array(n); this.came = new Int32Array(n); this.closed = new Uint8Array(n); this.stamp = new Uint32Array(n); this.ver = 0; }
    const g = this.g, came = this.came, closed = this.closed, stamp = this.stamp; const ver = ++this.ver;
    const heap = [], push = (f, i) => { heap.push([f, i]); let k = heap.length - 1; while (k > 0) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; } };

    const H = i => { const x = i % W + 0.5, z = (i / W | 0) + 0.5; return Math.hypot(x - hx, z - hz); };
    stamp[start] = ver; g[start] = 0; closed[start] = 0; came[start] = -1; push(H(start), start);

    const trace = i => { const out = []; let k = i; while (k !== -1) { out.push(k); k = came[k]; } return out.reverse(); };
    while (heap.length && nodes++ < 40000) {
      const [, i] = pop(); if (stamp[i] === ver && closed[i] === 1) continue;
      closed[i] = 1;
      if (isGoal(i)) return trace(i);
      const hi = H(i); if (hi < bestH - 1e-6 || (Math.abs(hi - bestH) < 1e-6 && g[i] < g[best])) { bestH = hi; best = i; }

        const j = nz * W + nx; if (!pass(j)) continue;
        if (dx && dz && (!pass(z * W + nx) || !pass(nz * W + x))) continue;
        const ng = g[i] + (dx && dz ? 1.4142 : 1);
        if (stamp[j] !== ver) { stamp[j] = ver; closed[j] = 0; g[j] = Infinity; }
        if (closed[j] || ng >= g[j]) continue;
        g[j] = ng; came[j] = i; push(ng + H(j), j);
      }
    }
    if (closest && best !== start) { const p = trace(best); p.partial = true; return p; }
    return null;
  },
  smooth(cells, sx, sz, ex, ez, body) {
    const W = CFG.W, pts = cells.map(i => [i % W + 0.5, (i / W | 0) + 0.5]);
    if (ex !== undefined) pts[pts.length - 1] = [ex, ez];
    const pass = this.passFn(body);
    const clear = (ax, az, bx, bz) => { const d = Math.hypot(bx - ax, bz - az), n = Math.ceil(d / 0.2); for (let k = 1; k <= n; k++) { const t = k / n, x = ax + (bx - ax) * t, z = az + (bz - az) * t; for (const [ox, oz] of [[-0.2, -0.13], [0.2, -0.13], [-0.2, 0.13], [0.2, 0.13]]) { const cx = x + ox, cz = z + oz; if (!WORLD.inBounds(cx, cz) || !pass(WORLD.idx(cx, cz))) return false; } } return true; };
    const out = []; let cx = sx, cz = sz, k = 0;
    while (k < pts.length) { let far = k; for (let j = pts.length - 1; j > k; j--) if (clear(cx, cz, pts[j][0], pts[j][1])) { far = j; break; } out.push(pts[far]); cx = pts[far][0]; cz = pts[far][1]; k = far + 1; }
    return out;
  },
  length(sx, sz, pts) { let L = 0, px = sx, pz = sz; for (const [x, z] of pts) { L += dist2(px, pz, x, z); px = x; pz = z; } return L; },
  nearestPassable(x, z, body, r = 3) {

  toPoint(sx, sz, x, z, body) {

  toEntity(sx, sz, e, body) {

    return cells ? this.smooth(cells, sx, sz, undefined, undefined, body) : null;

};

// =============================================================================
// §19 AUDIO  -  everything synthesised: sfx, wind, birds, crickets, water, fire

const AUDIO = {

  apply() { if (!this.ctx) return; const a = SETTINGS.v.audio; this.master.gain.value = a.master; this.fx.gain.value = a.effects; this.amb.gain.value = a.ambient; },

  init() {

    document.addEventListener('keydown', e => { if (!e.repeat) this.keyDownAt[e.key] = performance.now(); }, true);

// =============================================================================
// §24 INPUT  -  pointer (mouse/touch/pen/trackpad), keyboard, gamepad.
//   A "press" only counts when it starts and ends on the same object.
// =============================================================================
const INPUT = {
  keys: new Set(), keyCtx: {}, padCtx: {}, pointers: new Map(), pinch: null, padPrev: [], padRepeat: 0, padMove: { x: 0, z: 0 }, holdMove: null, zoomVel: 0,
  init() {
    const cv = R.renderer.domElement;
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.moveP(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.dropPointer(e.pointerId));
    cv.addEventListener('lostpointercapture', e => { if (this.pointers.has(e.pointerId)) this.dropPointer(e.pointerId); });
    // if the game layer turns inert (a modal opened mid-press) the release never reaches the canvas: forget the pointer anyway

// =============================================================================
const APP = new FSM({ initial: 'boot', states: {
  boot: {}, title: { enter() { HUD.title(true); } , exit() { HUD.title(false); } },
  loading: { enter() { HUD.title(false); } },
  playing: { enter() { HUD.loading(false); } },

const ITEM_FSM = {
  defs: { stone: { initial: 'dull', states: { dull: { on: { REMEMBER: 'glowing' } }, glowing: { on: { RETURN: 'dull' } } } } },
  live: {},
  init() { const S = SAVE.S; const f = this.live.stone = new FSM(this.defs.stone, S); f.restore(S.returnPos ? 'glowing' : 'dull'); f.on(() => { BUS.emit('inv'); SAVE.touch(); GAME.proxDirty = true; }); },
};

        if (q.t === 'wheat') text += ' - plant wheat seeds and harvest when golden';
      }
      if (s.type === 'enchant' && !INV.has('ember')) text += ' (you need the Ember Crystal)';
      return { text, target, step: s };
    }
    return null;
  },
  victory() { SAVE.S.won = true; SAVE.touch(); HUD.bossBar(false); AUDIO.sfx('victory'); setTimeout(() => UI.victory(), 600); },
  syncToSave() {
    const S = SAVE.S; if (!S || !this.ready) return;
    const rx = Math.round(PLAYER.x * 100) / 100, rz = Math.round(PLAYER.z * 100) / 100;
    if (S.player.x !== rx || S.player.z !== rz) { S.player.x = rx; S.player.z = rz; SAVE.dirty = true; }
    if (PLAYER.boat) { const rec = S.dyn.find(r => r.id === PLAYER.boat.id); if (rec) { rec.x = rx; rec.z = rz; } }
  },
  refreshNearby() {
    const px = PLAYER.x, pz = PLAYER.z, list = [], zone = this.zone = WORLD.zoneAt(px, pz);
    for (const b of R.batches) b.visible = !zone;
    if (zone) R.U.uClip.value.set(zone.x0 - 1, zone.z0 - 1, zone.x1 + 1, zone.z1 + 1); else R.U.uClip.value.set(-1e4, -1e4, 1e4, CFG.L + 20);
    for (const [, m] of R.chunkMeshes) { const [x0, z0, x1, z1] = m.userData.box; m.visible = zone ? (x1 > zone.x0 - 2 && x0 < zone.x1 + 2 && z1 > zone.z0 - 2 && z0 < zone.z1 + 2) : z0 < CFG.L + 16; }
    for (const e of this.ents.values()) {
      const dz = e.z - pz, dx = e.x - px;
      const near = dz > -22 && dz < 60 && Math.abs(dx) < 46 && e.zone === zone;
      if (e.mesh) e.mesh.visible = near && !(e.kind === 'boss' && e.fsm.is('defeated'));
      if (e.extra) for (const m of e.extra) m.visible = Math.abs(dz) < 60 && e.zone === zone;
      if (near || e.kind === 'boss') list.push(e);
    }
    this.nearbyCache = list;
  },
  // ---------- main loop ----------
  frame(now) {
    requestAnimationFrame(t => this.frame(t));
    const minDt = 1000 / SETTINGS.v.graphics.fps;
    if (now - this.lastRender < minDt - 2) return;
    const dt = Math.min(0.1, (now - this.lastRender) / 1000 || 0.016); this.lastRender = now;
    INPUT.poll(dt);
    if (!this.ready) { if (R.renderer && SAVE.S && !this.loading) R.render(); return; }
    R.U.uTime.value += dt;
    const paused = MODAL.isOpen();
    if (!paused) {
      this.updateDay(dt);
      PLAYER.update(dt);
      for (const e of this.nearbyCache) { e.fsm.update(dt); if (e.K.update) e.K.update(e, dt); }
      FOES.update(dt);
      if ((this.cullT -= dt) <= 0) { this.cullT = 0.25; this.refreshNearby(); }
      if ((this.proxT -= dt) <= 0 || this.proxDirty) { this.proxT = 0.2; this.proxDirty = false; this.computeProx(); HUD.tools(this.prox); }
      if ((this.saveT -= dt) <= 0) { this.saveT = 5; SAVE.touch(); }
      if (SAVE.S.player.hp > PLAYER.maxHp) { SAVE.S.player.hp = PLAYER.maxHp; HUD.health(); }
      HUD.health();
    }
    // camera, lights, shadows
    R.target.set(PLAYER.x, 0, PLAYER.z + 2); R.updateCamera(dt);
    const lights = [];
    const glowK = this.zone ? 1 : 0.2 + 0.8 * this.night; // fire light barely tints the ground by day, glows at night and indoors
    for (const e of this.nearbyCache) if (e.K.light) { const l = e.K.light(e); if (l) { l.i *= glowK; lights.push(l); } }
    if (this.zone && this.zone.kind === 'cave') lights.push({ x: PLAYER.x, z: PLAYER.z, r: 7, i: 0.7, c: [1, 0.88, 0.66] }); // your lantern in the dark
    else if (!this.zone && this.night > 0.05) lights.push({ x: PLAYER.x, z: PLAYER.z, r: 5.5, i: 0.55 * this.night, c: [1, 0.85, 0.6] });
    R.setLights(lights);
    R.shadowsBegin();
    for (const e of this.nearbyCache) { if (!e.mesh || !e.mesh.visible || !e.K.shadow) continue; const w = e.K.shadow(e); if (w) R.shadow(e.x, e.z, w); }
    if (!PLAYER.boat) R.shadow(PLAYER.x, PLAYER.z, 0.9);
    for (const f of FOES.list) if (!f.boss) R.shadow(f.x, f.z, 0.9);
    R.shadowsEnd();
    R.updateParticles(dt, seasonAt(PLAYER.z), this.isNight());
    if (this.markerMesh && this.markerMesh.visible) { this.markerT -= dt; this.markerMesh.material.uniforms.uDissolve.value = 1 - this.markerT / 0.5; if (this.markerT <= 0) this.markerMesh.visible = false; }
    if ((this.objT -= dt) <= 0) {
      this.objT = 0.5; this.obj = this.objective(); const z = this.zone;
      if (!z) HUD.hint(this.obj ? this.obj.text : '');
      else if (z.kind === 'house') HUD.hint('Indoors. Leave by the door when you are ready.');
      else { const b = this.ents.get(z.bossId), cleared = !b || b.fsm.is('dead'); this.caveCleared = cleared;
        HUD.hint(CAVE_TYPES[z.type].name + (cleared ? ' - cleared! Walk back to the entrance, or use your Return Stone.' : ' - find the keys, open the gates, face its guardian.')); }
    }
    const zz = this.zone; // in a cleared cave the dot leads back to the entrance; in a house it rests
    HUD.dot(zz ? (zz.kind === 'cave' && this.caveCleared ? { x: zz.door[0], z: zz.door[1] } : null) : this.obj && this.obj.target);
    // ambience
    if (!paused) {
      let fire = 0; for (const e of this.campfires) fire = Math.max(fire, 1 - dist2(e.x, e.z, PLAYER.x, PLAYER.z) / 9);
      for (const e of this.torches || []) if (e.fsm.is('lit')) fire = Math.max(fire, 0.5 * (1 - dist2(e.x, e.z, PLAYER.x, PLAYER.z) / 6));
      AUDIO.ambient(dt, { zone: this.zone, season: seasonAt(PLAYER.z), night: this.isNight(), water: WORLD.waterKind(PLAYER.x, PLAYER.z, 5), fire: Math.max(0, fire) });
    }
    R.pumpTerrain(3, 0, 14);
    R.render();
  },
};

// =============================================================================
// §26 BOOT
// =============================================================================
(function boot() {
  SETTINGS.load(); PAINTER.init();
  // extra SVG filter for glowing parts of icons
  $('svg defs').insertAdjacentHTML('beforeend', '<filter id="f-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>');
  const setVh = () => {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    const vv = window.visualViewport; const vh = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', vh + 'px');
    const mr = $('#modal-root'); if (mr) mr.style.top = (vv ? vv.offsetTop : 0) + 'px';
  };
  setVh(); window.addEventListener('resize', setVh); if (window.visualViewport) { visualViewport.addEventListener('resize', setVh); visualViewport.addEventListener('scroll', setVh); }
  MODAL.init(); R.init($('#game')); HUD.init(); INPUT.init();
  BUS.on('settings', ({ section }) => { if (section === 'graphics') R.resize(); if (section === 'controls') GAME.objT = 0; });
  BUS.on('inv', () => { GAME.proxDirty = true; });
  PLAYER.move = { x: 0, z: 0 };
  requestAnimationFrame(t => { GAME.lastRender = t; GAME.frame(t); });
  if (SAVE.exists()) GAME.resume(); else APP.go('title');
  window.__inkwash = { APP, ITEM_FSM, GAME, SAVE, WORLD, PLAYER, PROVER, POP, R, FOES, INV, UI, MODAL, PATH, COMBAT, KINDS, ITEMS, TERRAIN, ATLAS }; // handy for debugging
})();

</script>
<script src="parental.js"></script>
