<!DOCTYPE html>
<!--
================================================================================
 Idle Games  -  launcher for the collection of games and tools
================================================================================
 SECTION INDEX (search for the tag, e.g. "§5")
  §1 CSS ........... tokens (light/dark, follows html[data-theme] and the system),
                     top bar, filter row (scrolls away with the list), card grid
                     (phones: compact rows), sheets, toasts
  §2 HTML .......... top bar, list (filters, notices, grid, footer), sheets, toasts
  §3 DATA .......... the catalogue (unchanged shape)
  §4 UTILITIES ..... DOM builder, SVG icons, toasts, storage
  §5 LAYERS/INPUT .. history-backed sheets (Back closes the top one), presses
                     act on release, gamepad
  §6 STATE ......... favourites, filters, theme, parental wrapper, play times
  §7 LIST .......... filtering, cached cards, render
  §8 SHEETS ........ settings, parental, play times, documentary video
  §9 BOOT .......... wiring, shortcuts, top-bar fit, viewport height
 STORAGE (unchanged)
  idlegames-favorites ........ ["id", ...]
  idlegames-ui-state ......... {sort, category, favoritesOnly}
  launcher-theme ............. "system" | "light" | "dark"
  idlegames-parental-schedule  [{days:[0..6], from:"HH:MM", to:"HH:MM"}]
  idlegames-parental-v1 ...... owned by parental.js
================================================================================
-->

  <style>

    --accent: #a5abff; --accent-soft: #23264a; --on-accent: #0c0e24; --ok: #5fd08c; --ok-soft: #15301f; --bad: #ff7a70; --bad-soft: #3a1b19;

  --accent: #a5abff; --accent-soft: #23264a; --on-accent: #0c0e24; --ok: #5fd08c; --ok-soft: #15301f; --bad: #ff7a70; --bad-soft: #3a1b19;

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font: var(--fs)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; -webkit-text-size-adjust: 100%; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: var(--tap); min-width: var(--tap); padding: 0 1em;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; white-space: nowrap; touch-action: manipulation; user-select: none; -webkit-user-select: none; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); } .btn[disabled] { opacity: .45; cursor: default; }
.btn.icon { padding: 0; width: var(--tap); }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; font-weight: 650; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }

/* ---- frame ---- */
#app { position: fixed; inset: 0; height: var(--app-h); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
#top { display: flex; align-items: center; gap: 6px; padding: calc(5px + var(--safe-t)) calc(8px + var(--safe-r)) 5px calc(8px + var(--safe-l)); background: var(--surface); border-bottom: 1px solid var(--line); min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding-right: 6px; color: inherit; text-decoration: none; border-radius: var(--r); flex: none; }

.search { position: relative; flex: 1 1 auto; min-width: 0; max-width: 620px; margin: 0 auto; }

#main { overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 12px calc(12px + var(--safe-r)) calc(16px + var(--safe-b)) calc(12px + var(--safe-l)); display: flex; flex-direction: column; gap: 10px; }

/* ---- filters (scroll away with the list) ---- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 12px; }

.card .go:focus-visible { outline-offset: -3px; }
.thumb { position: relative; aspect-ratio: 2 / 1; background: var(--surface-2); overflow: hidden; flex: none; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .25s ease; }
.card:hover .thumb img { transform: scale(1.03); }
.mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.6em; font-weight: 800; letter-spacing: .02em; color: #fff; background: hsl(var(--hue) 38% 36%); }
.badge { position: absolute; left: 8px; top: 8px; padding: .1em .6em; border-radius: 999px; font-size: .75em; font-weight: 700; letter-spacing: .03em; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); }

.adm input { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
.card.hidden-kid .thumb { opacity: .45; }
/* phones: compact rows so more fit on screen */
@media (max-width: 599px) {
  .grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }

  .thumb { margin: 10px 0 0 10px; border-radius: 6px; }

}
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 16px; text-align: center; color: var(--text-2); }

#sheets { position: fixed; inset: 0; z-index: 1000; display: none; height: var(--app-h); }

.backdrop { position: absolute; inset: 0; background: rgba(8,10,14,.55); }

  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden; }

@media (max-width: 760px) { .sheet { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: auto; border-radius: 14px 14px 0 0; max-height: calc(var(--app-h) - 28px - var(--safe-t)); padding-bottom: var(--safe-b); }
  .sheet.wide { width: auto; } }
.s-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); }

.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .bar .grow { flex: 1; }
.field { display: flex; flex-direction: column; gap: 4px; } .field span { font-size: .92em; color: var(--text-2); } .field .inp { width: 100%; }

/* ---- toasts float over the top bar, never push content ---- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(6px + var(--safe-t)); z-index: 1100; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, 94vw); }

  if (PARENTAL.admin()) {
    box.append(h('div', { class: 'note warn' }, h('span', { class: 'ic', html: ICON.unlock }),
      h('div', { class: 'msg' }, h('b', { text: 'Parental admin mode' }), h('span', { text: 'Use “Visible when locked” on each card. Admin mode locks itself after 15 minutes.' })),
      h('div', { class: 'acts' },
        h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.clock, 'Play times'), onclick: openSchedule }),
        h('button', { class: 'btn primary', type: 'button', html: btnHTML(ICON.lock, 'Lock now'), onclick: lockNow }))));
  } else if (PARENTAL.enabled() && !PARENTAL.playTimeNow()) {
    const when = SCHEDULE.summary();
    box.append(h('div', { class: 'note warn' }, h('span', { class: 'ic', html: ICON.clock }),
      h('div', { class: 'msg' }, h('b', { text: 'It is not play time right now' }), h('span', { text: when ? `Games open during: ${when}.` : 'Ask a grown-up to unlock.' }))));
  }
}

function render() {
  const admin = PARENTAL.admin();
  if (admin !== LIST.adminMode) { LIST.cache.clear(); LIST.adminMode = admin; LIST.lastKey = null; }
  const items = LIST.visible(), key = items.map(i => i.id).join(',');
  if (key !== LIST.lastKey) { $('#grid').replaceChildren(...items.map(i => LIST.card(i))); LIST.lastKey = key; }

  const filtered = !!STATE.search.trim() || STATE.category !== 'all' || STATE.favoritesOnly;
  $('#count').textContent = filtered ? `Showing ${items.length} of ${LIST.total}` : `${LIST.total} games and tools`;
  $('#reset').hidden = !filtered;
  $('#q-clear').hidden = !STATE.search;
  $$('.chips [data-cat]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === STATE.category)));
  const fo = $('#fav-only'); fo.setAttribute('aria-pressed', String(STATE.favoritesOnly)); fo.innerHTML = btnHTML(STATE.favoritesOnly ? ICON.heartOn : ICON.heart, 'Favourites');
  $('#tag-sel').value = TAGS.includes(STATE.category) ? STATE.category : '';
  $('#sort-sel').value = STATE.sort;

  const empty = $('#empty'); empty.hidden = items.length > 0; $('#grid').hidden = !items.length;
  if (!items.length) {
    const favEmpty = STATE.favoritesOnly && !STATE.favorites.size;
    empty.replaceChildren(h('span', { html: favEmpty ? ICON.heart : ICON.search }),
      h('h2', { text: favEmpty ? 'No favourites yet' : 'Nothing matches' }),
      h('p', { text: favEmpty ? 'Tap the heart on any game or tool to keep it here.' : 'Try a different word, or clear the filters.' }),
      h('button', { class: 'btn primary', type: 'button', text: 'Show everything', onclick: clearFilters }));
  }
  const lock = $('#lock-btn'), st = admin ? 'admin' : PARENTAL.enabled() ? 'on' : 'off';
  lock.dataset.state = st; lock.innerHTML = st === 'admin' ? ICON.unlock : ICON.lock;
  lock.setAttribute('aria-label', { off: 'Parental controls (off)', on: 'Parental controls (locked)', admin: 'Parental controls (admin mode)' }[st]);
  lock.title = lock.getAttribute('aria-label');
  renderNotices();
}

// =============================================================================
// §8 SHEETS
// =============================================================================
const ABOUT = {
  privacy: ['Privacy', 'This site is local-first. It collects no analytics and does not track you. Favourites and settings are kept in this browser’s local storage. Documentaries load from YouTube (privacy-enhanced mode) only when you choose to watch one.'],
  terms: ['Terms of use', 'These games and tools are free to play and use. The source code is open under the MIT Licence: you may use, copy, change and share it, as long as the copyright and licence notice come with it. Everything is provided as is, without warranty of any kind, and the authors are not liable for any loss or damage arising from its use.',
    { href: 'https://github.com/TimelessP/idlegames/blob/main/LICENSE', label: 'Read the MIT Licence' }],
  a11y: ['Accessibility', 'Everything works with mouse, touch, keyboard and game controller. Press / to search, Escape or Back to close a panel. Text can be zoomed, colours meet WCAG AA in light and dark themes, and motion is reduced when your system asks for it.'],
};
function openAbout(which) {
  LAYERS.open('About Idle Games', b => {
    for (const k of ['privacy', 'terms', 'a11y']) b.append(h('div', { class: 'sec', id: `about-${k}` }, h('h3', { text: ABOUT[k][0] }), h('p', { text: ABOUT[k][1] }),
      ABOUT[k][2] ? h('a', { class: 'btn', href: ABOUT[k][2].href, target: '_blank', rel: 'noopener', html: btnHTML(ICON.ext, ABOUT[k][2].label), style: 'align-self:flex-start' }) : null));
    const v = $('#ver').dataset.version;
    b.append(h('div', { class: 'sec' }, h('p', { text: `${v ? 'Version ' + v + ' · ' : ''}© ${new Date().getFullYear()} Timeless Prototype` }),
      h('a', { class: 'btn', href: 'https://github.com/TimelessP/idlegames', rel: 'noopener', target: '_blank', html: btnHTML(ICON.ext, 'Source on GitHub') })));
    if (which) requestAnimationFrame(() => { const s = $(`#about-${which}`, b); if (s) s.scrollIntoView({ block: 'start' }); });
  });
}

function openSettings() {
  LAYERS.open('Settings', b => {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Theme' });
    const paint = () => $$('button', seg).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.t === THEME.get())));
    for (const [t, ic, label] of [['system', ICON.auto, 'Automatic'], ['light', ICON.sun, 'Light'], ['dark', ICON.moon, 'Dark']])
      seg.append(h('button', { class: 'btn', type: 'button', 'data-t': t, html: btnHTML(ic, label), onclick: () => { THEME.set(t); paint(); } }));
    paint();
    const st = PARENTAL.admin() ? ['admin', ICON.unlock, 'Admin mode is open'] : PARENTAL.enabled() ? ['on', ICON.lock, 'On and locked'] : ['', ICON.lock, 'Off'];
    b.append(
      h('div', { class: 'sec' }, h('h3', { text: 'Theme' }), seg),
      h('div', { class: 'sec' }, h('h3', { text: 'Parental controls' }),
        h('div', { class: 'bar' }, h('span', { class: 'status ' + st[0], html: st[1] + `<span>${st[2]}</span>` }), h('span', { class: 'grow' }),
          h('button', { class: 'btn', type: 'button', text: PARENTAL.enabled() ? 'Manage' : 'Set up', onclick: openParental }))),
      h('div', { class: 'sec' }, h('h3', { text: 'Share' }),
        h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.share, 'Share this collection'), onclick: sharePage })),
      h('div', { class: 'sec' }, h('h3', { text: 'About' }),
        h('div', { class: 'bar' }, ['privacy', 'terms', 'a11y'].map(k => h('button', { class: 'btn', type: 'button', text: ABOUT[k][0], onclick: () => openAbout(k) })))));
  });
}

function sharePage() {
  const url = location.href.split('#')[0];
  const copy = () => {
    const done = () => toast('Link copied.', 'success');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(() => toast('Could not copy the link.', 'error'));
    else toast('Could not copy the link.', 'error');
  };
  if (navigator.share) navigator.share({ title: 'Idle Games Collection', text: 'Relaxing idle games, puzzles, and tools.', url }).catch(err => { if (!err || err.name !== 'AbortError') copy(); });
  else copy();
}

function lockNow() { try { window.parental.signOut(); } catch (e) { /* ignore */ } render(); toast('Locked. Hidden games are hidden again.', 'success'); }

function openParental() {
  if (!PARENTAL.api()) { toast('Parental controls did not load. Reload the page and try again.', 'error'); return; }
  LAYERS.open('Parental controls', (b, layer) => {
    const draw = () => {
      b.replaceChildren();
      const err = h('p', { class: 'err', role: 'alert', hidden: true });
      const fail = m => { err.textContent = m; err.hidden = false; };
      if (!PARENTAL.enabled()) {
        const p1 = h('input', { class: 'inp', type: 'password', autocomplete: 'new-password', 'data-autofocus': true });
        const p2 = h('input', { class: 'inp', type: 'password', autocomplete: 'new-password' });
        const go = async () => {
          if (!p1.value) return fail('Choose a password.');
          if (p1.value !== p2.value) return fail('The two passwords do not match.');
          await window.parental.setPassword(p1.value);
          LAYERS.closeAll(); render(); toast('Parental controls are on. You are in admin mode for 15 minutes.', 'success', 5000);
        };
        const form = h('form', { class: 'sec', onsubmit: e => { e.preventDefault(); go(); } },
          h('p', { text: 'Set a password to turn parental controls on. You can then choose which games stay visible when locked, and set play times.' }),
          h('label', { class: 'field' }, h('span', { text: 'Password' }), p1),
          h('label', { class: 'field' }, h('span', { text: 'Password again' }), p2), err,
          h('button', { class: 'btn primary wide', type: 'submit', html: btnHTML(ICON.lock, 'Turn on parental controls') }));
        b.append(form);
      } else if (!PARENTAL.admin()) {
        const pw = h('input', { class: 'inp', type: 'password', autocomplete: 'current-password', 'data-autofocus': true });
        const go = async () => { if (await window.parental.verifyPassword(pw.value)) { LAYERS.closeAll(); render(); toast('Admin mode open for 15 minutes.', 'success'); } else { pw.value = ''; fail('That password is not right.'); pw.focus(); } };
        b.append(h('form', { class: 'sec', onsubmit: e => { e.preventDefault(); go(); } },
          h('div', { class: 'status on', html: ICON.lock + '<span>Parental controls are on</span>' }),
          h('p', { text: 'Enter the password to choose visible games and set play times.' }),
          h('label', { class: 'field' }, h('span', { text: 'Password' }), pw), err,
          h('button', { class: 'btn primary wide', type: 'submit', html: btnHTML(ICON.unlock, 'Open admin mode') })));
      } else {
        const when = SCHEDULE.summary();
        b.append(
          h('div', { class: 'sec' }, h('div', { class: 'status admin', html: ICON.unlock + '<span>Admin mode is open</span>' }),
            h('p', { text: 'Each card now has a “Visible when locked” switch. Admin mode locks itself after 15 minutes.' })),
          h('div', { class: 'sec' }, h('h3', { text: 'Play times' }), h('p', { text: when ? `Games open during: ${when}.` : 'No limits: games can be played at any time.' }),
            h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.clock, 'Edit play times'), onclick: openSchedule })),
          h('div', { class: 'sec' },
            h('button', { class: 'btn primary wide', type: 'button', html: btnHTML(ICON.lock, 'Lock now'), 'data-autofocus': true, onclick: () => { LAYERS.closeAll(); lockNow(); } }),
            h('button', { class: 'btn danger wide', type: 'button', text: 'Turn parental controls off…', onclick: confirmDisable })));
      }
    };
    layer.draw = draw; draw();
  }, { tag: 'admin' });
}

function confirmDisable() {
  LAYERS.open('Turn parental controls off?', b => b.append(
    h('p', { text: 'This removes the password, shows every game again and forgets which games were hidden. Play times are kept but not enforced.' }),
    h('div', { class: 'bar' }, h('button', { class: 'btn', type: 'button', text: 'Cancel', 'data-autofocus': true, onclick: () => LAYERS.back() }), h('span', { class: 'grow' }),
      h('button', { class: 'btn danger solid', type: 'button', text: 'Turn off', onclick: () => {
        try { window.parental.disable(); } catch (e) { /* ignore */ }
        LAYERS.closeAll(); setTimeout(() => { render(); toast('Parental controls are off.', 'success'); }, 60);
      } }))), { tag: 'admin' });
}

function openSchedule() {
  LAYERS.open('Play times', b => {
    const rows = SCHEDULE.get(), list = h('div', { class: 'sec' });
    const save = () => { SCHEDULE.save(rows); renderNotices(); };
    const add = h('button', { class: 'btn', type: 'button', html: btnHTML(ICON.plus, 'Add a time range') });
    const draw = () => {
      list.replaceChildren();
      if (!rows.length) list.append(h('p', { text: 'No play times set, so games can be played at any time.' }));
      rows.forEach((r, idx) => {
        r.days = Array.isArray(r.days) ? r.days : [];
        const why = h('div', { class: 'why' }), box = h('div', { class: 'sched' });
        const check = () => { const pr = SCHEDULE.problem(r); why.innerHTML = pr ? ICON.warn + `<span>${pr} This range is ignored until then.</span>` : ''; why.hidden = !pr; box.classList.toggle('bad', !!pr); };
        const days = h('div', { class: 'days', role: 'group', 'aria-label': `Days for range ${idx + 1}` },
          [1, 2, 3, 4, 5, 6, 0].map(d => {
            const btn = h('button', { class: 'btn', type: 'button', text: SCHEDULE.DAYS[d], 'aria-label': SCHEDULE.FULL[d], 'aria-pressed': String(r.days.includes(d)) });
            btn.addEventListener('click', () => { r.days = r.days.includes(d) ? r.days.filter(x => x !== d) : [...r.days, d].sort(); btn.setAttribute('aria-pressed', String(r.days.includes(d))); save(); check(); });
            return btn;
          }));
        const time = k => { const i = h('input', { class: 'inp', type: 'time', value: r[k] || '', 'aria-label': `${k === 'from' ? 'From' : 'Until'}, range ${idx + 1}` }); i.addEventListener('change', () => { r[k] = i.value; save(); check(); }); return i; };
        box.append(days, h('div', { class: 'times' }, h('span', { text: 'From' }), time('from'), h('span', { text: 'until' }), time('to'), h('span', { class: 'grow', style: 'flex:1' }),
          h('button', { class: 'btn ghost danger', type: 'button', html: btnHTML(ICON.trash, 'Remove'), onclick: () => { rows.splice(idx, 1); save(); draw(); add.focus(); } })), why);
        check(); list.append(box);
      });
      add.hidden = rows.length >= 10;
    };
    add.addEventListener('click', () => { rows.push({ days: [1, 2, 3, 4, 5], from: '', to: '' }); save(); draw(); const l = $$('.sched', list).pop(); if (l) { $('input', l).focus(); l.scrollIntoView({ block: 'nearest' }); } });
    b.append(h('p', { text: 'When parental controls are locked, games only open during these times. Outside them, games send players back here.' }), list, add);
    draw();
  }, { tag: 'admin' });
}

function openVideo(item) {
  const v = item.video, title = v.title || item.title;
  const q = new URLSearchParams({ autoplay: '1', rel: '0', modestbranding: '1' });
  LAYERS.open(title, b => b.append(
    h('div', { class: 'video' }, h('iframe', { src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.youtubeId)}?${q}`, title,
      allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share', allowfullscreen: true, referrerpolicy: 'strict-origin-when-cross-origin' })),
    h('p', { text: v.description || `A documentary about ${item.title}.` }),
    h('div', { class: 'bar' },
      h('a', { class: 'btn primary', href: item.href, html: btnHTML(ICON.play, `Open ${item.title}`) }), h('span', { class: 'grow' }),
      h('a', { class: 'btn', href: `https://youtu.be/${encodeURIComponent(v.youtubeId)}`, target: '_blank', rel: 'noopener noreferrer', html: btnHTML(ICON.ext, 'YouTube') }))),
  { cls: 'wide' });   // closing removes the iframe, which stops playback
}

// =============================================================================
// §9 BOOT
// =============================================================================
/** measure, never guess: hide the name next to the logo only when the bar would overflow */
function fitTop() {
  const top = $('#top'), s = $('.search', top); top.classList.remove('compact');
  if (s.getBoundingClientRect().width < 200 || top.scrollWidth > top.clientWidth) top.classList.add('compact');
}
function setViewportHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty('--app-h', `${Math.round(vv ? vv.height : innerHeight)}px`); }

function boot() {
  THEME.init(); loadState(); LAYERS.init(); GAMEPAD.init();
  // forget visible/hidden choices for apps that are no longer in the catalogue (keeps the ones we still have)
  try { if (window.parental && window.parental.pruneAllowed) window.parental.pruneAllowed(DATA.map(d => d.href)); } catch (e) { /* ignore */ }
  $('#year').textContent = new Date().getFullYear();
  $('#search-icon').outerHTML = ICON.search;
  $('#q-clear').innerHTML = ICON.x; $('#settings-btn').innerHTML = ICON.settings;
  $('#tag-sel').append(...TAGS.map(t => h('option', { value: t, text: t })));

  const q = $('#q');
  q.addEventListener('input', () => { STATE.search = q.value; $('#main').scrollTop = 0; render(); });
  q.addEventListener('keydown', e => { if (e.key === 'Escape' && q.value) { e.preventDefault(); e.stopPropagation(); q.value = ''; STATE.search = ''; render(); } });
  $('#q-clear').addEventListener('click', () => { q.value = ''; STATE.search = ''; render(); q.focus(); });
  $$('.chips [data-cat]').forEach(b => b.addEventListener('click', () => setCategory(b.dataset.cat)));
  $('#fav-only').addEventListener('click', () => { STATE.favoritesOnly = !STATE.favoritesOnly; saveUI(); render(); });
  $('#tag-sel').addEventListener('change', e => setCategory(e.target.value || 'all'));
  $('#sort-sel').addEventListener('change', e => { STATE.sort = e.target.value; saveUI(); render(); });
  $('#reset').addEventListener('click', clearFilters);
  $('#settings-btn').addEventListener('click', openSettings);
  $('#lock-btn').addEventListener('click', openParental);
  $$('[data-about]').forEach(b => b.addEventListener('click', () => openAbout(b.dataset.about)));

  // keys act on release, only if pressed in the same layer
  const KEYS = {};
  addEventListener('keydown', e => { if (!e.repeat) KEYS[e.key] = LAYERS.stack.length;
    if (e.key === '/' && !LAYERS.stack.length && !(e.target.closest && e.target.closest('input,select,textarea'))) e.preventDefault(); });
  addEventListener('keyup', e => {
    const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (!same) return;
    if (e.key === 'Escape') { if (LAYERS.stack.length) LAYERS.back(); return; }
    if (LAYERS.stack.length || (e.target.closest && e.target.closest('input,select,textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { q.focus(); q.select(); }
  });

  // parental session ended (15-minute timer) or changed in another tab
  addEventListener('parental-expired', () => {
    if (LAYERS.stack.some(l => l.tag === 'admin')) LAYERS.closeAll();
    setTimeout(() => { render(); toast('Admin mode ended. Parental lock is back on.'); }, 60);
  });
  addEventListener('storage', e => {
    if (e.key === LS.fav) { loadState(); LIST.cache.forEach((c, id) => LIST.paintFav(c, id)); }
    render();
  });
  // play times change with the clock: refresh the notice each minute
  setInterval(() => { if (PARENTAL.enabled()) renderNotices(); }, 60000);

  setViewportHeight();
  if (window.visualViewport) visualViewport.addEventListener('resize', setViewportHeight); else addEventListener('resize', setViewportHeight);
  new ResizeObserver(fitTop).observe($('#top'));
  render(); fitTop();
}
boot();
</script>
</body>
