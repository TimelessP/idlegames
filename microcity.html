<!doctype html>
<!--
================================================================================
 MICRO CITY  -  a living ink-and-acrylic city you can watch, follow and poke
 Authors: Timeless Prototype and Opus 5.5
================================================================================
 The simulation (roads, lanes, people, events) lives in assets/js/microcity-sim.js
 and has no DOM. This page paints it, plays it and lets you drive the camera.

 SECTION INDEX  (search for the tag)
 §1  CSS ............ tokens (light/dark UI), frame, hud, chip, sheets, toasts
 §2  HTML ........... #app, canvas, hud, chip, sheets, loading
 §3  BOOT & PREFS ... imports, PREFS (persisted), theme, h(), ICON, toast
 §4  LAYERS ......... sheets backed by history, press quarantine, keys on release
 §5  ART KIT ........ palette, noise, textures, ink lines, tint cache, sprites
 §6  GROUND ......... ground painter, LOD chunks, night lightmap with shadows
 §7  BUILDINGS ...... facade/roof bake, details, brand signs, windows, night bake
 §8  RENDER ......... camera, culling, sun shadows, sorted scene, vehicles,
                      people, trees, props, interiors, emissives, particles
 §9  AUDIO .......... procedural WebAudio, positional around the camera centre
 §10 UI ............. menu, live events, stats + charts, places, settings, help
 §11 INPUT .......... pointer/touch/pinch/wheel/trackpad, keyboard, gamepad
 §12 LOOP ........... fixed-step sim, follow camera, cues, frame
================================================================================
-->
