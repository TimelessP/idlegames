<!DOCTYPE html>
<!--
================================================================================
 Prompt Chat Lab  -  chat with the AI model built into Chrome (Prompt API).
                     No keys, no server: the model runs on this device.
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (Automatic / Light / Dark), frame, setup card, chat
                     bubbles, docked composer, sheets, toasts
  §2 HTML .......... top bar, setup card, messages, composer
  §3 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), storage
  §4 LAYERS/INPUT .. history-backed sheets, act on release, gamepad
  §5 MODEL ......... availability, session create with download progress and the
                     stall watchdog (unchanged timings), streaming with Stop
  §6 CHAT .......... transcript (kept across reloads and replayed into the new
                     session as context), render, copy
  §7 UI ............ setup states, settings, help, keyboard, boot
 STORAGE (new)
  prompt-chat-v1 ...... {messages:[{role:"user"|"assistant", text}], draft, system}
  prompt-chat-theme ... "system" | "light" | "dark"
================================================================================
-->

  <meta name="description" content="Chat with the AI model built into Chrome. No API keys and no server: it runs on your device.">
  <link rel="icon" href="favicon.ico">
  <script>

  </script>
