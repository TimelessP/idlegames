<!DOCTYPE html>
<!--
================================================================================
 Timers Studio  -  as many countdown timers as you like, with sound and
                   notifications that still arrive when the page is closed
================================================================================
 SECTION INDEX (search for the tag, e.g. "§6")
  §1 CSS ........... tokens (Automatic / Light / Dark), frame, quick chips, timer
                     cards (state shown by colour + word + icon), sheets, toasts
  §2 HTML .......... top bar, quick start, timer grid
  §3 UTILITIES ..... DOM builder, SVG icons, toasts (with Undo), storage
  §4 LAYERS/INPUT .. history-backed sheets, act on release, gamepad
  §5 STATE ......... timers + settings (unchanged keys and record shape)
  §6 SERVICE WORKER  timer-sync / timer-cancel out, timer-finished in (unchanged
                     protocol, see scripts/sw.template.js)
  §7 TIMERS ........ start, pause, reset, +1 min, finish (sound + one notification)
  §8 UI ............ cards, editor, settings, help, keyboard, boot
 STORAGE (unchanged)
  idlegames-timers .......... [{id, name, duration, remaining, running, finished, endTime,
                               soundPreference, notifyPreference, startUrl}]  (times in ms)
  idlegames-timers-settings . {theme: "system"|"light"|"dark", sound: bool, notify: bool}
================================================================================
-->
<html lang="en" data-theme="system">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="IdleGames">
  <meta name="color-scheme" content="light dark">
  <title>Timers Studio</title>
  <meta name="description" content="Run as many countdown timers as you like, with sound and notifications, even when the page is closed.">
  <link rel="icon" href="favicon.ico">
  <script>
    try { const s = JSON.parse(localStorage.getItem('idlegames-timers-settings') || '{}'); if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme; } catch (e) { /* ignore */ }
  </script>

        tog('notify', 'Notification', st === 'denied' ? 'Blocked for this site in the browser settings.' : st === 'unsupported' ? 'Not supported by this browser.' : 'Arrives even when this page is closed.'),
        h('p', { class: 'small', text: 'Each timer can override these in its own settings.' })));
  });
}
function openHelp() {
  LAYERS.open('How Timers Studio works', b => b.append(
    h('ul', {},
      h('li', { html: '<b>Quick start</b> buttons make and start a timer in one tap. <b>New timer</b> lets you name it and choose any length, up to days.' }),
      h('li', { html: 'Run as many timers as you like at once. The nearest one counts down in the browser tab’s title.' }),
      h('li', { html: 'Timers keep going when you close the page; with notifications allowed, you are told when they finish.' }),
      h('li', { html: '<b>+1 min</b> adds time, even to a running timer. Deleting a timer can be undone straight away.' })),
    h('div', { class: 'sec' }, h('h3', { text: 'Keyboard' }), h('p', { html: '<kbd>N</kbd> new timer · <kbd>1</kbd>–<kbd>9</kbd> quick start (1, 3, 5, 10, 15, 25, 30, 45, 60 minutes) · <kbd>?</kbd> this help · <kbd>Esc</kbd> close a panel.' }))));
}
function fitTop() { const t = $('#top'), sp = $('.spacer', t), over = () => t.scrollWidth > t.clientWidth || sp.getBoundingClientRect().width < 8; t.classList.remove('compact', 'tiny'); for (const c of ['compact', 'tiny']) if (over()) t.classList.add(c); }
function setViewportHeight() { const vv = window.visualViewport; document.documentElement.style.setProperty('--app-h', `${Math.round(vv ? vv.height : innerHeight)}px`); }
function boot() {
  LAYERS.init(); GAMEPAD.init(); load(); THEME.apply();
  $('#games').innerHTML = btnHTML(ICON.back, 'Games'); $('#add-btn').innerHTML = btnHTML(ICON.plus, 'Timer'); $('#help-btn').innerHTML = ICON.help; $('#settings-btn').innerHTML = ICON.settings;
  $('#quick').append(h('span', { class: 'lab', text: 'Quick start' }), ...QUICK.map(m => h('button', { class: 'btn', type: 'button', text: m >= 60 ? '1 h' : `${m} min`, 'aria-label': `Start a ${m >= 60 ? '1 hour' : m + ' minute'} timer`, onclick: () => TM.quick(m) })));
  $('#add-btn').addEventListener('click', () => edit(null)); $('#help-btn').addEventListener('click', openHelp); $('#settings-btn').addEventListener('click', openSettings);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data; if (!d || !d.type) return;

    if (d.type === 'timer-notification-clicked') { const c = $(`.tcard[data-id="${CSS.escape(String(d.timerId))}"]`); if (c) c.scrollIntoView({ block: 'center' }); }
  });
  const KEYS = {};
  addEventListener('keydown', e => { if (!e.repeat) KEYS[e.key] = LAYERS.stack.length; });
  addEventListener('keyup', e => { const same = KEYS[e.key] === LAYERS.stack.length; delete KEYS[e.key]; if (!same) return;
    if (e.key === 'Escape') { if (LAYERS.stack.length) LAYERS.back(); return; }
    if (LAYERS.stack.length || (e.target.closest && e.target.closest('input,select,textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;

  new ResizeObserver(fitTop).observe($('#top')); fitTop();
  UI.renderAll(); save();
  const missed = timers.filter(t => t.missed); if (missed.length) toast(`${missed.map(t => t.name).join(', ')} finished while you were away.`, 'info', 6000);
  setInterval(() => TM.tick(), 250); TM.tick();
}
boot();
