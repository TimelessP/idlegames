/* artificial horizon — pitch ladder every 10°, rotates against bank */
function drawADI(cv,s){
  const c=cv.getContext('2d'),W=cv.width,R=W/2,k=R*1.7;
  c.clearRect(0,0,W,W);c.save();c.beginPath();c.arc(R,R,R-3,0,TAU);c.clip();
  c.translate(R,R);c.rotate(-s.bank);
  const hy=s.pitchA*k;
  c.fillStyle='#4f7d90';c.fillRect(-W,-W*2+hy,W*2,W*2);
  c.fillStyle='#7a5a3a';c.fillRect(-W,hy,W*2,W*2);
  c.strokeStyle='rgba(244,236,220,.9)';c.lineWidth=2;c.beginPath();c.moveTo(-W,hy);c.lineTo(W,hy);c.stroke();
  c.lineWidth=1.5;c.strokeStyle='rgba(244,236,220,.55)';c.fillStyle='rgba(244,236,220,.7)';c.font='12px monospace';c.textAlign='center';
  for(let d=-30;d<=30;d+=10){if(!d)continue;const y=hy-d*Math.PI/180*k,w=Math.abs(d)%20?14:26;
    c.beginPath();c.moveTo(-w,y);c.lineTo(w,y);c.stroke();if(!(Math.abs(d)%20))c.fillText(Math.abs(d),w+14,y+4)}
  c.restore();
  c.strokeStyle='#3a3128';c.lineWidth=3;c.beginPath();c.arc(R,R,R-2,0,TAU);c.stroke();
  c.strokeStyle='#f0b93f';c.lineWidth=3;c.beginPath();c.moveTo(R-34,R);c.lineTo(R-10,R);c.lineTo(R-10,R+7);c.moveTo(R+34,R);c.lineTo(R+10,R);c.lineTo(R+10,R+7);c.stroke();
  c.fillStyle='#f0b93f';c.fillRect(R-2,R-2,4,4);
}
/* electric motor note: two detuned oscillators through a low-pass, pitch follows throttle and airspeed */
function planeEngine(s,off){
  if(!SET.audio||!A.ctx)return;
  try{
    const c=A.ctx;let E=FL.eng;
    if(!E){E=FL.eng={o:c.createOscillator(),o2:c.createOscillator(),g:c.createGain(),f:c.createBiquadFilter()};
      E.o.type='sawtooth';E.o2.type='triangle';E.f.type='lowpass';E.f.frequency.value=600;E.g.gain.value=0;
      E.o.connect(E.f);E.o2.connect(E.f);E.f.connect(E.g);E.g.connect(c.destination);E.o.start();E.o2.start()}
    const t=c.currentTime,live=s.pow>0.3&&!off,w=live?s.thr:0;
    E.g.gain.setTargetAtTime(live?0.008+0.026*w:0,t,0.12);
    E.o.frequency.setTargetAtTime(58+w*150+Math.min(s.va,30)*0.8,t,0.15);
    E.o2.frequency.setTargetAtTime(116+w*300,t,0.15);
    E.f.frequency.setTargetAtTime(360+w*900,t,0.2);
  }catch(e){}
}

/* buggy electric motor: lower, grittier hum with speed-dependent whine */
function buggyEngine(s,off){
  if(!SET.audio||!A.ctx)return;
  try{
    const c=A.ctx;let E=FL.buggyEng;
    if(!E){E=FL.buggyEng={o:c.createOscillator(),o2:c.createOscillator(),g:c.createGain(),f:c.createBiquadFilter()};
      E.o.type='sawtooth';E.o2.type='square';E.f.type='lowpass';E.f.frequency.value=400;E.g.gain.value=0;
      E.o.connect(E.f);E.o2.connect(E.f);E.f.connect(E.g);E.g.connect(c.destination);E.o.start();E.o2.start()}
    const t=c.currentTime,live=s.pow>0.3&&!off,w=live?Math.abs(s.throttle):0,spd=live?Math.abs(s.speed):0;
    
    // Throttle hold attenuation: after 2s held, fade to 25% by 10s
    let holdAtten = 1;
    if(live && w > 0.1){
      s.throttleHeld = (s.throttleHeld || 0) + (1/60); // approximate dt
      if(s.throttleHeld > 2){
        holdAtten = 1 - 0.75 * Math.min(1, (s.throttleHeld - 2) / 8); // 2s→10s: 100%→25%
      }
    }else{
      s.throttleHeld = 0;
    }
    
    const baseGain = 0.006+0.022*w+0.008*spd;
    E.g.gain.setTargetAtTime(live?baseGain*holdAtten:0,t,0.1);
    E.o.frequency.setTargetAtTime(42+w*80+spd*1.2,t,0.1);
    E.o2.frequency.setTargetAtTime(84+w*160+spd*2.4,t,0.1);
    E.f.frequency.setTargetAtTime(200+w*400+spd*6,t,0.15);
  }catch(e){}
}

/* buggy horn: a cheerful toot while space is held */
function buggyHorn(s, dt){
  if(!SET.audio||!A.ctx)return;
  try{
    const c=A.ctx;let H=FL.buggyHorn;
    const want = !uiBlocking() && G.drive===s && Keys['Space'] && s.pow>0.3;
    if(want){
      if(!H){
        // Create a horn-like sound with multiple oscillators (fundamental + harmonics)
        const o1=c.createOscillator(); // fundamental
        const o2=c.createOscillator(); // 2nd harmonic
        const o3=c.createOscillator(); // 3rd harmonic
        const g=c.createGain();
        o1.type='sawtooth'; o2.type='sawtooth'; o3.type='sawtooth';
        o1.frequency.value=220;      // A3 - fundamental
        o2.frequency.value=440;      // A4 - 2nd harmonic
        o3.frequency.value=660;      // E5 - 3rd harmonic
        const g1=c.createGain(); g1.gain.value=0.6;  // fundamental strongest
        const g2=c.createGain(); g2.gain.value=0.3;  // 2nd harmonic
        const g3=c.createGain(); g3.gain.value=0.15; // 3rd harmonic
        o1.connect(g1); o2.connect(g2); o3.connect(g3);
        g1.connect(g); g2.connect(g); g3.connect(g);
        g.connect(c.destination);
        // Start with master gain at 0 to avoid click, then ramp up
        g.gain.value = 0;
        o1.start(); o2.start(); o3.start();
        H=FL.buggyHorn={o1,o2,o3,g1,g2,g3,g,attack:0,releasing:false};
      }
      H.releasing = false;
      const t=c.currentTime;
      // Quick attack, then sustain
      H.attack = Math.min(1, H.attack + dt * 8);
      H.g.gain.setTargetAtTime(0.06 * H.attack, t, 0.01);
      // Subtle vibrato on the fundamental only
      const vibrato = Math.sin(t * 5) * 2; // very subtle, slow vibrato
      H.o1.frequency.setTargetAtTime(220 + vibrato, t, 0.1);
      H.o2.frequency.setTargetAtTime(440 + vibrato * 2, t, 0.1);
      H.o3.frequency.setTargetAtTime(660 + vibrato * 3, t, 0.1);
    }else if(H && !H.releasing){
      H.releasing = true;
      const t=c.currentTime;
      H.g.gain.setTargetAtTime(0, t, 0.05);
      // Stop after fade out
      setTimeout(() => {
        if(H){
          H.o1.stop(); H.o2.stop(); H.o3.stop();
          H.o1.disconnect(); H.o2.disconnect(); H.o3.disconnect();
          H.g1.disconnect(); H.g2.disconnect(); H.g3.disconnect();
          H.g.disconnect();
          FL.buggyHorn=null;
        }
      }, 120);
    }
  }catch(e){}
}

function playerTick(dt){
  dtSafe=dt;
  if(P.dead){Drifter.dispatch('revive');P.hp=0.4;P.hyd=0.5;P.nut=0.5;}
  fwd.set(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
  rgt.set(Math.cos(P.yaw),0,-Math.sin(P.yaw));
  let ix=0,iz=0;
  if(!uiBlocking()&&!G.drive){
    if(Keys['KeyW']||Keys['ArrowUp'])iz+=1;
    if(Keys['KeyS']||Keys['ArrowDown'])iz-=1;
    if(Keys['KeyD']||Keys['ArrowRight'])ix+=1;
    if(Keys['KeyA']||Keys['ArrowLeft'])ix-=1;
  }
  if(!uiBlocking()&&!G.drive){ix+=TOUCH.x;iz+=TOUCH.z}
  const mag=Math.hypot(ix,iz);
  if(mag>1){ix/=mag;iz/=mag}
  Drifter.ctx.crouchWant=!!(Keys['ControlLeft']||Keys['KeyC']&&!Keys['KeyE']);
  const sprint=(Keys['ShiftLeft']||Keys['ShiftRight'])&&P.sta>0.06&&!Drifter.ctx.crouchWant&&mag>0;
  let speed=sprint?7.4:(Drifter.ctx.crouchWant?2.2:4.3);
  if(iz<0)speed*=0.72;
  if(bagMass()>G.cap)speed*=0.55;
  const tx=(fwd.x*iz+rgt.x*ix)*speed, tz=(fwd.z*iz+rgt.z*ix)*speed;
  const acc=P.ground?14:3.4;
  P.vx=lerp(P.vx,tx,clamp(acc*dt,0,1));
  P.vz=lerp(P.vz,tz,clamp(acc*dt,0,1));
  P.x+=P.vx*dt;P.z+=P.vz*dt;
  P.vy-=23*dt;
  P.y+=P.vy*dt;
  const gy=heightAt(P.x,P.z);
  if(P.y<=gy){if(P.vy<-9){puff(P.x,gy+0.1,P.z,4,0xd8c6a4,1.2);SFX('step')}
    P.y=gy;P.vy=0;
    if(!P.ground)Drifter.dispatch('land');
    P.ground=true;}
  else{P.ground=false;Drifter.dispatch('air')}
  if(G.drive)driveTick(dt);
  const spd=Math.hypot(P.vx,P.vz);
  Drifter.ctx.spd=spd;
  if(P.ground){
    if(Drifter.ctx.crouchWant)Drifter.dispatch('crouch');else if(Drifter.state==='crouch')Drifter.dispatch('uncrouch');
    Drifter.dispatch('move');
  }
  Drifter.update(dt);
  /* footfalls */
  if(P.ground&&spd>1){
    P.step+=spd*dt;
    if(P.step>2.1){P.step=0;puff(P.x,P.y+0.05,P.z,1,0xcbb896,0.7);SFX('step')}
  }
  /* stamina, thirst, hunger, cold */
  if(sprint)P.sta=Math.max(0,P.sta-0.21*dt);else P.sta=Math.min(1,P.sta+0.085*dt);
  const cold=isNight()&&!nearWarm(P.x,P.z);
  P.hyd=Math.max(0,P.hyd-0.0009*dt*(cold?1.4:1));
  P.nut=Math.max(0,P.nut-0.0007*dt*(cold?1.3:1));
  P.warm=lerp(P.warm,cold?0:1,dt*0.6);
  if(P.hyd<=0||P.nut<=0)P.hp-=0.005*dt;
  if(cold)P.hp-=0.0015*dt;
  if(nearWarm(P.x,P.z)&&P.hyd>0.05&&P.nut>0.05&&P.hp<1)P.hp=Math.min(1,P.hp+0.02*dt);
  P.hp=clamp(P.hp,0,1);
  if(P.hp<=0){Drifter.dispatch('die');P.hp=0.45;P.hyd=Math.max(P.hyd,0.45);P.nut=Math.max(P.nut,0.35);P.x=7;P.z=7;P.vx=P.vz=0;P.y=heightAt(7,7);Drifter.dispatch('revive');SFX('bad');log('you black out and wake at the old camp, parched.','bad')}
  /* hand */
  const eye=1.68-0.62*Drifter.ctx.crouch-(G.drive?0.5:0);
  const bobY=Math.sin(Drifter.ctx.bobT*2)*0.035*clamp(spd/4,0,1.6);
  const bobX=Math.cos(Drifter.ctx.bobT)*0.028*clamp(spd/4,0,1.6);
  camera.position.set(P.x+bobX*0.4,P.y+eye+bobY,P.z);
  if(G.drive&&G.drive.camPos)camera.position.copy(G.drive.camPos);
  const inBuggy=G.drive&&G.drive.type==='buggy';
  const viewYaw=inBuggy?G.drive.yaw+Math.PI+G.drive.look.yaw:P.yaw;
  const viewPitch=inBuggy?G.drive.look.pitch:P.pitch;
  camera.rotation.set(viewPitch,viewYaw,Math.sin(Drifter.ctx.bobT)*0.004*clamp(spd/4,0,1.4),'YXZ');
  if(isPlane())planeCamera(G.drive,dt);
  vmSwing=Math.max(0,vmSwing-dt*3.2);
  if(viewModel){
    const s1=Math.sin(vmSwing*Math.PI)*0.5;
    viewModel.position.set(0.28+Math.sin(Drifter.ctx.bobT)*0.012,-0.26+Math.sin(Drifter.ctx.bobT*2)*0.01-s1*0.1,-0.42+s1*0.14);
    viewModel.rotation.set(-0.3+s1*0.9,0.2-s1*0.3,0.1);
  if(vmLens)vmLens.material=G.findOn?MAT.lampOn:MAT.glow;
  if(vmFlame)vmFlame.scale.y=2.4+Math.sin(now()*17)*.35+Math.sin(now()*7.3)*.25;
  }
  if(handsLight)handsLight.intensity=lerp(handsLight.intensity,(isNight()?2.2:0),dt*3);
}

  G.findOn=!G.findOn;SFX('pick');log('scrap-finder '+(G.findOn?'ON — draining charge':'OFF — saving charge'),G.findOn?'gold':'');
}
function driveTick(dt){
  if(G.drive.type==='plane')return planeTick(G.drive,dt);
  const s=G.drive,V=WORKS.buggy.veh,bl=uiBlocking();
  const thr=bl?0:((Keys['KeyW']||Keys['ArrowUp']?1:0)-(Keys['KeyS']||Keys['ArrowDown']?1:0)+TOUCH.z);
  const stg=bl?0:((Keys['KeyD']||Keys['ArrowRight']?1:0)-(Keys['KeyA']||Keys['ArrowLeft']?1:0)+TOUCH.x);
  const live=s.pow>0.3;
  
  s.speed = s.speed || 0;
  s.throttle = clamp(thr, -1, 1);
  s.isGrounded = true;
  
  const turn = -clamp(stg, -1, 1) * 1.7 * dt * clamp(Math.abs(s.speed) / 5, 0, 1) * (s.speed < 0 ? -1 : 1);
  s.rot += turn;
  s.yaw = s.rot;
  P.yaw = s.yaw + Math.PI + (s.look ? s.look.yaw : 0);
  P.pitch = s.look ? s.look.pitch : 0;

  if(live) s.speed += s.throttle * (s.throttle > 0 ? 10 : 7) * dt;
  s.speed += clamp((s.groundSlope || 0) * 22, -16, 16) * dt;
  const drag = s.throttle <= 0.1 ? 0.92 : 0.995;
  s.speed *= Math.pow(drag, dt * 60.0);
  
  // Apply brake
  if(!bl && Keys['Space']) s.speed -= s.speed * Math.min(1, 3 * dt);
  
  s.speed = clamp(s.speed, -6, 17);
  s.pos.x += Math.sin(s.yaw) * s.speed * dt;
  s.pos.z += Math.cos(s.yaw) * s.speed * dt;
  s.groundSlope = updateVehicleGroundPhysics(s, dt, false);
  
  // Battery drain
  if(live) s.flat = false;
  else if(!s.flat && Math.abs(s.speed) > 0.5) { s.flat = true; log('the buggy battery is flat','bad'); }
  s.pow = Math.max(0, s.pow - (Math.abs(s.speed) * V.drain + 0.05) * dt);
  
  // Update mesh position and the terrain-aligned visual orientation.
  s.mesh.position.copy(s.pos);
  s.mesh.updateMatrixWorld(true);
  s.camPos = s.mesh.localToWorld(new THREE.Vector3(0, 1.6, 0.45));
  if(SET.buggyView==='chase'){
    const L=s.look,vy=s.yaw+Math.PI+L.yaw,cp=Math.cos(L.pitch),D=7.2;
    let cx=s.pos.x+Math.sin(vy)*cp*D,cz=s.pos.z+Math.cos(vy)*cp*D;
    let cy=s.pos.y+2.4+Math.sin(L.pitch)*D*0.8;
    const gy=heightAt(cx,cz)+0.7;if(cy<gy)cy=gy;
    s.camPos=new THREE.Vector3(cx,cy,cz);
  }
  
  // Wheel rotation animation
  if(s.wheels) for(const w of s.wheels) w.rotation.x += s.speed * dt * 2.6;
  
  // Dust puffs
  const sn = Math.sin(s.rot), cs = Math.cos(s.rot);
  if(Math.abs(s.speed) > 4 && Math.random() < dt * 14) 
    puff(s.x - sn * 1.3, s.y + 0.1, s.z - cs * 1.3, 1, 0xcbb896, 1.4);
  
  // Buggy engine sound
  buggyEngine(s, false);
  
  // Buggy horn
  buggyHorn(s, dt);
  
  // Sync player position
  P.x = s.x; P.z = s.z; P.y = s.y; P.vy = 0; P.vx = P.vz = 0;
}

function frontDot(x,z){
  const dx=x-P.x,dz=z-P.z,d=Math.hypot(dx,dz);
  if(d<0.01)return 1;
  return (dx*fwd.x+dz*fwd.z)/d;
}
function pickTarget(){
  if(G.drive)return null;
  let best=null,score=-1;
  for(const f of featuresNear(P.x,P.z,G.reach+1.4)){
    if(G.spents.has(f.id))continue;
    const dx=f.x-P.x,dz=f.z-P.z,d=Math.hypot(dx,dz);
    if(d>G.reach+0.9)continue;
    const dot=frontDot(f.x,f.z);
    if(dot<0.45)continue;
    const s=dot*2-d*0.25;
    if(s>score){score=s;best={kind:'feature',ref:f,d}}
  }
  for(const s of G.struct){
    const dx=s.x-P.x,dz=s.z-P.z,d=Math.hypot(dx,dz);
    if(d>3.0)continue;
    const dot=frontDot(s.x,s.z);
    if(dot<0.55)continue;
    const sc=dot*2.2-d*0.2+0.4;
    if(sc>score){score=sc;best={kind:'struct',ref:s,d}}
  }
  for(const t of G.traders){
    if(!t.stall||!t.stall.visible)continue;
    const dx=t.x-P.x,dz=t.z-P.z,d=Math.hypot(dx,dz);
    if(d>4.0)continue;
    if(frontDot(t.x,t.z)<0.6)continue;
    const sc=3.0-d*0.1;
    if(sc>score){score=sc;best={kind:'trader',ref:t,d}}
  }
  return best;
}
function featureAction(f){
  if(f.d.hp===0)return null;
  const bonus=G.tool==='crowbar'?1.6:1;
  return{
    label:'salvage '+f.d.n,
    sub:'hold E — '+(G.tool==='crowbar'?'crowbar bonus ×1.6':'bare hands'),
    time:f.d.hp,
    run(){
      const got=[];
      for(const [id,q] of (f.loot||[])){
        const n=Math.max(0,Math.round(q*bonus));
        if(n>0){invAdd(id,n);got.push(n+'× '+itemName(id))}
      }
      if(!got.length)got.push('nothing worth carrying');
      G.stats.salv++;
      puff(f.x,f.y+0.6,f.z,10,0xb08a5a,2.2);
      log('salvaged '+f.d.n+' — '+got.join(', '),'good');
      SFX('hit');
      G.spents.add(f.id);
      const m=World.feats.get(f.id);
      if(m){dropFeat(m);World.feats.delete(f.id)}
    }

}

function stationOk(r){
  if(r.bench&&!G.bench&&!G.inv.toolkit)return false;
  if(r.stove&&!hasWorkingAssembly('stove'))return false;
  if(r.mill&&!hasWorkingAssembly('pulp_mill'))return false;
  return true;
}
function recipeReady(r){return hasAll(r.i)&&stationOk(r)}
function stationLack(r){
  if(r.bench&&!G.bench&&!G.inv.toolkit)return 'workbench or toolkit';
  if(r.stove&&!hasWorkingAssembly('stove'))return 'powered stove nearby';
  if(r.mill&&!hasWorkingAssembly('pulp_mill'))return 'hand pulp mill nearby';
  return '';
}
function refundRecipe(r){for(const k in r.i)invAdd(k,r.i[k])}
function cancelQueued(n){

  const r=RECIPES[q[n]];refundRecipe(r);q.splice(n,1);

function cancelRunning(){

const Build={on:false,type:null,rot:0,ok:false,x:0,z:0,y:0,reason:''};
function startBuild(type){
  if(Build.on&&Build.type===type){stopBuild();return}
  if(!(G.inv[WORKS[type].kit]>0)){SFX('bad');log('no kit for '+WORKS[type].n+' — fabricate one first','bad');return}
  stopBuild();

  const d={type};ghost=structureMesh(d);if(d.pDisc)d.pDisc.visible=false;
  GHOSTMAT=new THREE.MeshBasicMaterial({color:0x9aae6f,transparent:true,opacity:0.34,depthWrite:false});
  ghost.traverse(o=>{if(o.isMesh){o.material=GHOSTMAT;o.castShadow=false;o.receiveShadow=false}});
  closePanel();grabLock(3);
  log('assembling '+WORKS[type].n+' — click to set, R to turn, B to stop');
}
function stopBuild(){
  if(ghost){scene.remove(ghost);ghost.traverse(o=>{if(o.isMesh&&o.geometry&&o.userData.own)o.geometry.dispose()});ghost=null}
  Build.on=false;Build.type=null;
}
function buildTick(){
  if(!Build.on||!ghost)return;
  const d=WORKS[Build.type];
  const gx=Math.round(P.x+fwd.x*(d.dist||3.2)),gz=Math.round(P.z+fwd.z*(d.dist||3.2));
  Build.x=gx;Build.z=gz;Build.y=heightAt(gx,gz);
  ghost.position.set(gx,Build.y+(d.cgh||0),gz);
  ghost.rotation.y=Build.rot;
  const slope=Math.max(
    Math.abs(heightAt(gx+1.2,gz)-Build.y),Math.abs(heightAt(gx,gz+1.2)-Build.y),
    Math.abs(heightAt(gx-1.2,gz)-Build.y),Math.abs(heightAt(gx,gz-1.2)-Build.y));
  let ok=slope<0.95&&(G.inv[WORKS[Build.type].kit]||0)>0;
  let reason=ok?'':'ground too steep';
  if(ok&&d.cgh){const cr=Math.cos(Build.rot),sr=Math.sin(Build.rot);
    const tipH=Math.max(heightAt(gx+cr*4.7,gz-sr*4.7),heightAt(gx-cr*4.7,gz+sr*4.7))-Build.y,tailH=heightAt(gx-sr*4.3,gz-cr*4.3)-Build.y;
    if(tipH>1.5){ok=false;reason='a wingtip would strike the slope'}else if(tailH>0.9){ok=false;reason='the tail would strike the slope'}}
  if(ok){
    for(const s of G.struct){
      if(Math.abs(s.x-gx)<(d.size[0]+WORKS[s.type].size[0])*0.5&&Math.abs(s.z-gz)<(d.size[2]+WORKS[s.type].size[2])*0.5){
        ok=false;reason='something is already here';break;
      }
    }
  }
  if(ok)for(const f of featuresNear(gx,gz,Math.max(d.size[0],d.size[2])*0.6)){
    if(['outcrop','spire','mast','wreck','pod','tank','stone','stack'].includes(f.t)&&Math.hypot(f.x-gx,f.z-gz)<Math.max(d.size[0],d.size[2])*0.55){
      ok=false;reason='ground is occupied';break;
    }
  }
  if(ok&&!(G.inv[WORKS[Build.type].kit]>0)){ok=false;reason='no kit left'}
  Build.ok=ok;Build.reason=reason;
  GHOSTMAT.color.set(ok?0x9aae6f:0xc4442c);
}

  if(!Build.on||!Build.ok){SFX('bad');if(Build.reason)log(Build.reason,'bad');return}

  const k=chunkKey(cx,cz);
  if(World.chunks.has(k))return;
  const g=buildChunk(cx,cz);
  const mesh=new THREE.Mesh(g,MAT.sand);
  mesh.position.set(cx*CFG.CH,0,cz*CFG.CH);
  mesh.receiveShadow=true;mesh.castShadow=true;
  mesh.matrixAutoUpdate=false;mesh.updateMatrix();
  World.group.add(mesh);
  const entry={mesh,g,feats:[]};
  const x0=cx*CFG.CH,z0=cz*CFG.CH;
  const c0=Math.floor(x0/FCELL),c1=Math.floor((x0+CFG.CH-0.001)/FCELL),
        d0=Math.floor(z0/FCELL),d1=Math.floor((z0+CFG.CH-0.001)/FCELL);
  for(let fz=d0;fz<=d1;fz++)for(let fx=c0;fx<=c1;fx++){
    for(const f of cellFeatures(fx,fz)){
      if(f.x<x0||f.x>=x0+CFG.CH||f.z<z0||f.z>=z0+CFG.CH)continue;
      if(G.spents.has(f.id))continue;
      const m=featureMesh(f);
      entry.feats.push(f.id);
      World.feats.set(f.id,m);
      World.group.add(m);
    }
  }
  World.chunks.set(k,entry);
  World.built++;
}
function dropChunk(k){
  const e=World.chunks.get(k);
  if(!e)return;
  World.group.remove(e.mesh);e.g.dispose();
  for(const id of e.feats){const m=World.feats.get(id);if(m){dropFeat(m)}World.feats.delete(id)}
  World.chunks.delete(k);
}
function fillFeats(e,cx,cz){
  const x0=cx*CFG.CH,z0=cz*CFG.CH;
  const c0=Math.floor(x0/FCELL),c1=Math.floor((x0+CFG.CH-0.001)/FCELL),d0=Math.floor(z0/FCELL),d1=Math.floor((z0+CFG.CH-0.001)/FCELL);
  for(let fz=d0;fz<=d1;fz++)for(let fx=c0;fx<=c1;fx++)for(const f of cellFeatures(fx,fz)){
    if(f.x<x0||f.x>=x0+CFG.CH||f.z<z0||f.z>=z0+CFG.CH||G.spents.has(f.id))continue;
    const m=featureMesh(f);e.feats.push(f.id);World.feats.set(f.id,m);World.group.add(m);
  }
}
function respawnScrap(){
  G.epochDay=Day.ctx.day;EPOCH++;G.spents.clear();_fc.clear();
  for(const [k,e] of World.chunks){
    for(const id of e.feats){const m=World.feats.get(id);if(m)dropFeat(m);World.feats.delete(id)}
    e.feats=[];const [cx,cz]=k.split(',').map(Number);fillFeats(e,cx,cz);
  }
  log('the night wind scours the flats — fresh scrap has surfaced','gold');
}
function streamWorld(px,pz){
  const R=SET.draw;
  const ccx=Math.floor(px/CFG.CH),ccz=Math.floor(pz/CFG.CH);
  if(ccx===World.cx&&ccz===World.cz&&World.chunks.size)return;
  World.cx=ccx;World.cz=ccz;
  for(const [k,e] of World.chunks){
    const [a,b]=k.split(',').map(Number);
    if(Math.abs(a-ccx)>R+1||Math.abs(b-ccz)>R+1)dropChunk(k);
  }
  const want=[];
  for(let dz=-R;dz<=R;dz++)for(let dx=-R;dx<=R;dx++){
    if(dx*dx+dz*dz>R*R+1)continue;
    want.push([ccx+dx,ccz+dz,Math.abs(dx)+Math.abs(dz)]);
  }
  want.sort((a,b)=>a[2]-b[2]);
  World.want=want;World.wi=0;
}
function streamTick(px,pz){
  streamWorld(px,pz);
  if(!World.want)return;
  let built=0;
  while(World.wi<World.want.length&&built<2){
    const [cx,cz]=World.want[World.wi++];
    if(!World.chunks.has(chunkKey(cx,cz))){addChunk(cx,cz);built++}
  }
  if(World.wi>=World.want.length)World.want=null;
  if(World.horizon){
    const qx=Math.round(px/128)*128,qz=Math.round(pz/128)*128;
    if(World.hx!==qx||World.hz!==qz){
      World.hx=qx;World.hz=qz;World.rebuildHorizon();
    }
  }
}

const FIRST=['Ilya','Marek','Sura','Ovid','Tam','Renn','Kesh','Ada','Juno','Bex','Corin','Vesh','Nadi','Otto','Sable','Wren','Ivo','Mara'];
const LAST=['Vant','Solano','Kerr','Dunmore','Ilves','Brack','Oyelaran','Ferrin','Hask','Ruiz','Ansel','Vok','Crane','Pell','Mordak'];
const TITLE=['salt-line trader','ash-route buyer','bone-dust merchant','well-walker','tin pedlar','dust assessor','dune broker','relic factor','cable runner','ferry hand'];
const CATS=['part','mat','water','food','tool','kit'];
const CATLIKE={part:'metal',mat:'stock',water:'water',food:'food',tool:'tools',kit:'built work'};
/* ═══ ERRANDS ═══
   Every trader who walks in may carry one errand. It asks only for things a drifter can come by without a trader — scavenged,
   or crafted from scavenged parts — never canvas, which only traders supply (it is the reward instead).
   The pool is derived from the live tables (FEATDEF loot, RECIPES), so it stays right as the game grows.
   One errand at a time. While it is open, the giver's stay timer is frozen: he waits. "Send on" abandons it.
   The errand lives in G.quest, which is written into the save; traders are not restored on load, so the giver is
   re-created from his saved seed and walks back in as the same person. */
const QP={pool:null};
function questPool(){
  if(QP.pool)return QP.pool;
  const base=new Set(['water','dew','pear','root','bean']);                       // structure outputs: still-water, dew, crops
  for(const k in FEATDEF){const d=FEATDEF[k];for(const e of (d.loot||[]))base.add(e[0]);for(const e of (d.lootSet||[]))base.add(e[0])}
  base.delete('cloth');
  const ok=new Set(base);let ch=true;
  while(ch){ch=false;for(const r of RECIPES){const o=r.o[0];if(ok.has(o)||o==='cloth')continue;if(Object.keys(r.i).every(i=>i!=='cloth'&&ok.has(i))){ok.add(o);ch=true}}}
  const never=new Set(['book','welder','finder','kite','cloth','k_buggy','k_plane']);
  return QP.pool=[...ok].filter(id=>ITEMS[id]&&!never.has(id)&&!(ITEMS[id].c==='kit'&&ITEMS[id].v>190))
    .map(id=>({id,v:ITEMS[id].v,w:ITEMS[id].w||0,kit:ITEMS[id].c==='kit',base:base.has(id)}));
}
const QT=[[40,90],[90,170],[170,320]];
function genQuest(tr){
  const r=mulberry32(((tr.seed^0x9e3779b1)>>>0)||1),pool=questPool();
  const tier=r()<.5?0:r()<.72?1:2,target=QT[tier][0]+r()*(QT[tier][1]-QT[tier][0]);
  const maxV=[22,70,200][tier],kinds=tier===0?1+(r()<.45?1:0):tier===1?2:2+(r()<.5?1:0);
  const cand=pool.filter(p=>p.v<=maxV&&(tier>0||!p.kit));
  const want=[];let total=0,mass=0;
  for(let k=0;k<kinds;k++){
    const left=cand.filter(c=>!want.some(w=>w.id===c.id));if(!left.length)break;
    let sum=0;const ws=left.map(c=>{const w=(c.base?3:1.6)/Math.sqrt(c.v);sum+=w;return w});
    let x=r()*sum,pick=left[left.length-1];for(let i=0;i<left.length;i++){x-=ws[i];if(x<=0){pick=left[i];break}}
    let n=Math.max(1,Math.round(((target-total)/(kinds-k))/pick.v));
    n=Math.min(n,pick.kit?1:Math.max(1,Math.floor(10/Math.max(.2,pick.w))),9);
    if(pick.w>0&&mass+n*pick.w>26)n=Math.max(1,Math.floor((26-mass)/pick.w));
    want.push({id:pick.id,n});total+=n*pick.v;mass+=n*pick.w;
  }
  const scrap=Math.max(10,Math.round(total*(1.5+r()*.45)/5)*5);
  const cloth=tier===0?(r()<.4?1:0):tier===1?1+((r()*3)|0):3+((r()*4)|0);
  const list=want.map(w=>w.n+' × '+itemName(w.id)).join(', '),cl=cloth?' I keep a bolt of canvas for people who deliver.':'';
  const lines=[
    `The road has been hard on my stock. Bring me ${list} and there is scrap in it for you.${cl}`,
    `A ${tr.title} is only as good as the next load, and I am short. I need ${list}.${cl}`,
    `${list}. That is all of it. Fetch them and I will not leave until we are square.${cl}`,
    `Somebody down the line is asking for ${list}. You find it, I carry it, we both eat.${cl}`,
    `I will wait on ${list}. This camp is as good a place as any to wait.${cl}`
  ];
  return{id:'q'+tr.seed,tier,giver:{seed:tr.seed,name:tr.name,title:tr.title,coat:tr.coat},want,pay:{scrap,cloth},text:lines[(r()*lines.length)|0],state:'open'};
}
const questHolds=tr=>!!(G.quest&&G.quest.state==='active'&&G.quest.giver&&G.quest.giver.seed===tr.seed);
const questHave=q=>q.want.every(w=>(G.inv[w.id]||0)>=w.n);
const questPay=p=>p.scrap+' scrap'+(p.cloth?' + '+p.cloth+' canvas strip'+(p.cloth>1?'s':''):'');
const firstName=tr=>tr.name.split(' ')[0];
function questAccept(tr){
  if(G.quest||!tr.offer)return;
  G.quest=Object.assign({},tr.offer,{state:'active',day:Day.ctx.day});tr.offer=null;
  if((tr.stayLeft||0)<60)tr.stayLeft=60;
  log(firstName(tr)+' needs '+G.quest.want.map(w=>w.n+' '+itemName(w.id)).join(', ')+'. They will wait.','gold');
  saveGame();refreshPanel();
}
function questDeliver(tr){
  const q=G.quest;if(!questHolds(tr))return;
  if(!questHave(q)){log('you are still short of what '+firstName(tr)+' asked for','bad');return}
  for(const w of q.want){invTake(w.id,w.n);tr.stock[w.id]=(tr.stock[w.id]||0)+w.n}
  G.cash+=q.pay.scrap;if(q.pay.cloth)invAdd('cloth',q.pay.cloth);
  G.stats.quests=(G.stats.quests||0)+1;G.quest=null;
  tr.stayLeft=Math.min(tr.stayLeft||45,45);
  SFX('coin');log(firstName(tr)+' pays '+questPay(q.pay)+'. "We are square."','gold');
  saveGame();refreshPanel();
}
function questAbandon(tr){
  if(!questHolds(tr))return;
  log(firstName(tr)+"'s errand is dropped.");
  G.quest=null;saveGame();
}
function questResume(){
  const q=G.quest;if(!q||q.state!=='active'||!q.giver)return;
  if(G.traders.some(t=>t.seed===q.giver.seed))return;
  makeTrader('quest',{seed:q.giver.seed});
}
function questBlock(tr){
  const q=G.quest;
  if(questHolds(tr)){
    const rows=q.want.map(w=>{const have=G.inv[w.id]||0;return `<span class="${have>=w.n?'ok':'no'}">${Math.min(have,w.n)}/${w.n} ${itemName(w.id)}</span>`}).join('');
    return `<div class="rule"></div><div class="grp-h"><b>errand</b></div><p class="desc">${q.text}</p>
      <div class="cost" style="margin-top:5px">${rows}</div>
      <div class="kv" style="display:flex;justify-content:space-between;margin-top:6px"><span class="lbl">pays</span><span class="num">${questPay(q.pay)}</span></div>
      <div style="margin-top:8px"><button class="btn sm ${questHave(q)?'pri':'gho'}" data-act="qdone" data-id="${tr.id}">hand it over</button></div>`;
  }
  if(tr.offer&&!G.quest){
    const o=tr.offer,rows=o.want.map(w=>`<span class="${(G.inv[w.id]||0)>=w.n?'ok':''}">${w.n} × ${itemName(w.id)}</span>`).join('');
    return `<div class="rule"></div><div class="grp-h"><b>an errand</b></div><p class="desc">${o.text}</p>
      <div class="cost" style="margin-top:5px">${rows}</div>
      <div class="kv" style="display:flex;justify-content:space-between;margin-top:6px"><span class="lbl">pays</span><span class="num">${questPay(o.pay)}</span></div>
      <div style="margin-top:8px"><button class="btn sm pri" data-act="qaccept" data-id="${tr.id}">take the errand</button></div>`;
  }
  if(tr.offer&&G.quest)return `<p class="desc" style="margin-top:6px">${firstName(tr)} has an errand of their own, but you are already carrying one.</p>`;
  return '';
}

function makeTrader(cause,forced){
  const seed=(forced&&forced.seed)||((Math.random()*0xffffff)|0),r=mulberry32(seed);
  const tr={id:G.tid++,seed,
    name:FIRST[(r()*FIRST.length)|0]+' '+LAST[(r()*LAST.length)|0],
    title:TITLE[(r()*TITLE.length)|0],
    coat:[0x6a4a30,0x4a4438,0x5c3a3a,0x3f4a44,0x6b5230,0x40404a][(r()*6)|0],
    w:{},stock:{},likes:[],hates:[],cause,stay:CFG.dayLen,gone:false};
  const liked=[];
  const nLike=1+((r()*3)|0);
  for(let i=0;i<nLike;i++)liked.push(CATS[(r()*CATS.length)|0]);
  for(const c of CATS)tr.w[c]=liked.includes(c)?1.35+r()*0.5:0.85+r()*0.3;
  for(let i=0;i<2;i++){const id=ITEM_IDS[(r()*ITEM_IDS.length)|0];tr.w[id]=1.6+r()*0.7;tr.likes.push(id)}
  const hate=ITEM_IDS[(r()*ITEM_IDS.length)|0];
  tr.w[hate]=0.45;tr.hates.push(hate);
  for(const id in tr.w)if(ITEM_IDS.includes(id)&&r()<0.45)tr.w[id]=0.6+r()*0.5;
  const stock=[['water',6],['dew',8],['jerky',4],['stew',3],['cell',3],['cloth',5],['seed',4],
    ['lens',2],['wire',5],['fibre',6],['bean',6],['root',6],['k_lamp',1],['k_battery',1],
    ['k_tank',1],['k_crate',2],['canister',4],['gear',2],['stone',8],['bandage',2],['plate',6],['pipe',4],['rod',3],['bolt',6],['hull',2],['bracket',3],['pear',5],['clay',4],['k_solar',1],['k_wall',2],['k_trough',1],['toolkit',1]];
  const lines=7+((r()*6)|0);
  for(let i=0;i<lines;i++){
    const s=stock[(r()*stock.length)|0];
    tr.stock[s[0]]=(tr.stock[s[0]]||0)+(1+((r()*4)|0));
  }
  tr.offer=forced?null:genQuest(tr);
  tr.mesh=traderMesh(tr);
  const a=r()*TAU;
  tr.sx=P.x+Math.cos(a)*105;tr.sz=P.z+Math.sin(a)*105;
  tr.tx=P.x+Math.cos(a)*6.5;tr.tz=P.z+Math.sin(a)*6.5;
  tr.x=tr.sx;tr.z=tr.sz;tr.rot=a+Math.PI;tr.dx=Math.cos(a);tr.dz=Math.sin(a);tr.dx=Math.cos(a);tr.dz=Math.sin(a);
  tr.mesh.position.set(tr.x,heightAt(tr.x,tr.z),tr.z);
  scene.add(tr.mesh);
  G.traders.push(tr);
  tr.visit=Sequence('visit:'+tr.name,[
    ()=>machine('approach',{ctx:{tr},initial:'walking',
      states:{
        walking:{enter(m){m.ctx.t0=now()},update(m,dt){
          if(walkTo(m.ctx.tr,m.ctx.tr.tx,m.ctx.tr.tz,dt*1.55))m.set('here');
          if(now()-m.ctx.t0>90)m.set('here');
        }},
        here:{final:true,enter(m){
          m.ctx.tr.stall.visible=true;
          m.ctx.tr.mesh.position.set(m.ctx.tr.tx,heightAt(m.ctx.tr.tx,m.ctx.tr.tz),m.ctx.tr.tz);
          m.ctx.tr.x=m.ctx.tr.tx;m.ctx.tr.z=m.ctx.tr.tz;
          m.ctx.tr.rot=Math.atan2(P.x-m.ctx.tr.tx,P.z-m.ctx.tr.tz)+Math.PI;
        }}
      },
      trans:[{event:'arrive',from:'walking',to:'here'}]}),
    ()=>machine('pitch',{ctx:{tr},initial:'talking',
      states:{talking:{update(m,dt){
        if(m.time>2.6)m.set('done');
        m.ctx.tr.face=lerp(m.ctx.tr.face||0,0,dt*4);
      }},done:{final:true}}
    }),
    ()=>machine('market',{ctx:{tr},initial:'trading',
      states:{
        trading:{enter(m){m.ctx.tr.stayLeft=m.ctx.tr.stay},update(m,dt){
          if(!questHolds(m.ctx.tr))m.ctx.tr.stayLeft-=dt;
          if(m.ctx.tr.stayLeft<=0)m.set('leaving');
        }},
        leaving:{final:true}}
      ,
      trans:[{event:'timeout',from:'trading',to:'leaving'}]}),
    ()=>machine('pack',{ctx:{tr},initial:'packing',
      states:{packing:{update(m,dt){if(m.time>2.6)m.set('done')}},done:{final:true}}}),
    ()=>machine('leave',{ctx:{tr},initial:'walking',
      states:{walking:{enter(m){m.ctx.t0=now();m.ctx.tr.stall.visible=false},update(m,dt){
        if(walkTo(m.ctx.tr,m.ctx.tr.x+(m.ctx.tr.dx||40),m.ctx.tr.z+(m.ctx.tr.dz||0),dt*1.5))m.set('gone');
        if(now()-m.ctx.t0>60)m.set('gone');
      }},
        gone:{final:true,enter(m){
          scene.remove(m.ctx.tr.mesh);
          const i=G.traders.indexOf(m.ctx.tr);
          if(i>=0)G.traders.splice(i,1);
          m.ctx.tr.gone=true;
          if(questHolds(m.ctx.tr))questAbandon(m.ctx.tr);
          log(m.ctx.tr.name+' moves on down the line.','gold');
        }}}
      ,trans:[{event:'leave',from:'walking',to:'gone'}]})
  ]);
  tr.visit.onEvent=(ev)=>{ if(ev==='done'){} };
  tr.visit.start();
  log(tr.name+' — '+tr.title+' — walks in from the horizon.','gold');
  return tr;
}
function walkTo(tr,tx,tz,dt){
  const dx=tx-tr.x,dz=tz-tr.z,d=Math.hypot(dx,dz);
  if(d<0.35)return true;
  const sp=1.35;
  tr.x+=dx/d*sp*dt;tr.z+=dz/d*sp*dt;
  tr.mesh.position.set(tr.x,heightAt(tr.x,tr.z),tr.z);
  tr.rot=Math.atan2(dx,dz);
  const sw=Math.sin(now()*7)*0.5;
  tr.legs[0].rotation.x=sw;tr.legs[1].rotation.x=-sw;
  tr.arms[0].rotation.x=-sw*0.7;tr.arms[1].rotation.x=sw*0.7;
  tr.mesh.rotation.y=lerp(tr.mesh.rotation.y,tr.rot+Math.PI,dt*3);
  return false;
}
function spawnTrader(cause){
  if(G.traders.length>=3)return;
  makeTrader(cause||'wander');
  SFX('coin');
}
function traderTick(dt){
  /* an unadorned desert is a rare thing; signs and kites both pull */
  if(G.traders.length<3){
    G.attractPassive=(G.attractPassive||0)+dt*(0.0009+G.lure*0.0016);
    if(G.attractPassive>1&&G.lure>0){G.attractPassive=0;spawnTrader('sign')}
  }
  for(const tr of [...G.traders]){
    tr.visit.update(dt);
    traderPose(tr,dt);
    if(tr.canopy)tr.canopy.rotation.z=Math.sin(now()*1.3+tr.id)*0.06;
    /* the trader turns to watch you */
    if(tr.stall.visible&&Math.hypot(P.x-tr.x,P.z-tr.z)<9){
      const want=Math.atan2(P.x-tr.x,P.z-tr.z)+Math.PI;
      let d=want-tr.mesh.rotation.y;
      while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
      tr.mesh.rotation.y+=d*clamp(dt*3,0,1);
    }
    traderStallPin(tr);
  }
}

function priceBuy(tr,id){const it=ITEMS[id];if(!it)return 1;return Math.max(1,Math.round(it.v*1.55/(tr.w[id]||tr.w[it.c]||1)))}
function priceSell(tr,id){const it=ITEMS[id];if(!it)return 1;return Math.max(1,Math.round(it.v*0.72*(tr.w[id]||tr.w[it.c]||1)))}

const SET={sens:1,draw:6,shadow:true,audio:true,guide:false,seen:false,fov:74,showFps:false,fpsCap:0,buggyView:'cockpit'};
const FPS_CAPS=[0,30,45,60];
const fpsCapLabel=i=>FPS_CAPS[i|0]?FPS_CAPS[i|0]+' fps limit':'unlimited (display rate)';
let autosaveAcc=0,skipUnloadSave=false;

function loadSettings(){
  try{const s=JSON.parse(localStorage.getItem(KEY_SET)||'{}');Object.assign(SET,s)}catch(e){}

}
function gameSaveData(){
  return {v:1,seed:SEED,ep:EPOCH,epd:G.epochDay||0,t:Day.ctx.t,day:Day.ctx.day,
    p:{x:P.x,z:P.z,yaw:P.yaw},inv:G.inv,tool:G.tool,kiteFly:G.kiteFly,cash:G.cash||0,
    fq:[...(Fab.state==='running'?[RECIPES.indexOf(Fab.ctx.r)]:[]),...G.fabQ],
    spents:[...G.spents],stats:G.stats,wp:G.waypoints,
    book:G.bookPages,st:G.struct.filter(s=>!s.fixed).map(s=>({t:s.type,x:+s.x.toFixed(2),z:+s.z.toFixed(2),r:+s.rot.toFixed(3),
      pow:+s.pow.toFixed(1),dew:+s.dew.toFixed(2),water:+s.water.toFixed(2),
      fluid:+s.fluid.toFixed(2),grow:+s.grow.toFixed(3),seeded:!!s.seeded,ripe:!!s.ripe})),
    tr:G.traders.map(t=>({x:t.x,z:t.z,name:t.name,title:t.title,stay:t.stayLeft||0})),
    q:G.quest||null};
}
function validateGameSave(d){
  const finite=v=>typeof v==='number'&&Number.isFinite(v);
  const owns=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  if(!d||typeof d!=='object'||Array.isArray(d)||d.v!==1)return 'unsupported save format';
  if(!Number.isInteger(d.seed)||d.seed<0||d.seed>0xffffffff)return 'invalid world seed';
  if(!finite(d.t)||d.t<0||d.t>=1||!Number.isInteger(d.day)||d.day<1)return 'invalid world time';
  if(!d.p||!finite(d.p.x)||!finite(d.p.z)||!finite(d.p.yaw))return 'invalid player position';
  if(!d.inv||typeof d.inv!=='object'||Array.isArray(d.inv))return 'invalid inventory';
  for(const [id,count] of Object.entries(d.inv))
    if(!owns(ITEMS,id)||!finite(count)||count<0||count>1000000)return 'invalid inventory contents';
  if(d.tool!==undefined&&d.tool!=='hands'&&(!owns(ITEMS,d.tool)||ITEMS[d.tool].c!=='tool'))return 'invalid equipped tool';
  if(d.cash!==undefined&&(!finite(d.cash)||d.cash<0))return 'invalid currency';
  if(d.ep!==undefined&&(!Number.isInteger(d.ep)||d.ep<0))return 'invalid world epoch';
  if(d.epd!==undefined&&(!Number.isInteger(d.epd)||d.epd<0))return 'invalid scrap epoch';
  if(d.book!==undefined){
    if(!Array.isArray(d.book)||d.book.length<1||d.book.length>120)return 'invalid journal pages';
    let chars=0,strokes=0,points=0;
    for(const page of d.book){
      if(!page||typeof page!=='object'||Array.isArray(page)||typeof page.text!=='string'||page.text.length>5000||!Array.isArray(page.strokes)||page.strokes.length>100)return 'invalid journal page';
      chars+=page.text.length;strokes+=page.strokes.length;
      for(const stroke of page.strokes){
        if(!stroke||typeof stroke!=='object'||typeof stroke.erase!=='boolean'||!Array.isArray(stroke.points)||stroke.points.length<2||stroke.points.length>160)return 'invalid journal drawing';
        points+=stroke.points.length;
        for(const point of stroke.points)
          if(!Array.isArray(point)||point.length!==2||!finite(point[0])||!finite(point[1])||point[0]<0||point[0]>1||point[1]<0||point[1]>1)return 'invalid journal drawing';
      }
    }
    if(chars>600000||strokes>6000||points>12000)return 'journal is too large';
  }
  if(d.st!==undefined&&(!Array.isArray(d.st)||d.st.length>2000))return 'invalid structures';
  for(const s of d.st||[])
    if(!s||!owns(WORKS,s.t)||!finite(s.x)||!finite(s.z)||!finite(s.r)||
      ['pow','dew','water','fluid','grow'].some(k=>s[k]!==undefined&&(!finite(s[k])||s[k]<0))||
      (s.grow!==undefined&&s.grow>1))return 'invalid structure data';
  if(d.spents!==undefined&&(!Array.isArray(d.spents)||d.spents.length>100000||d.spents.some(id=>typeof id!=='string')))return 'invalid salvage records';
  if(d.stats!==undefined&&(!d.stats||typeof d.stats!=='object'||Array.isArray(d.stats)||Object.values(d.stats).some(v=>!finite(v)||v<0)))return 'invalid statistics';
  if(d.wp!==undefined&&(!Array.isArray(d.wp)||d.wp.length>3||d.wp.some(p=>p&&(!finite(p.x)||!finite(p.z)||(p.y!==undefined&&!finite(p.y))))))return 'invalid waypoints';
  return '';
}
function saveGame(){
  try{
    const data=gameSaveData();
    localStorage.setItem(KEY_SAVE,JSON.stringify(data));
    SET.seen=true;saveSettings();
    return true;
  }catch(e){return false}
}
function readSave(){
  try{const d=JSON.parse(localStorage.getItem(KEY_SAVE)||'null');return validateGameSave(d)?null:d}catch(e){return null}
}
function applySave(d){
  SEED=d.seed>>>0;EPOCH=d.ep||0;G.epochDay=d.epd||0;
  Day.ctx.t=d.t;Day.ctx.day=d.day||1;
  Day.set(d.t>=0.75?'night':'day');
  P.x=d.p.x;P.z=d.p.z;P.yaw=d.p.yaw;P.y=heightAt(P.x,P.z);
  G.bookPages=d.book||[{text:'',strokes:[]}];
  G.inv=d.inv||{};G.tool=d.tool||'hands';G.kiteFly=!!d.kiteFly;G.cash=d.cash||0;G.fabQ=Array.isArray(d.fq)?d.fq.filter(i=>Number.isInteger(i)&&RECIPES[i]).slice(0,12):[];
  G.waypoints=Array.isArray(d.wp)?d.wp.slice(0,3).map(p=>p&&Number.isFinite(+p.x)&&Number.isFinite(+p.z)?{x:+p.x,y:Number.isFinite(+p.y)?+p.y:undefined,z:+p.z}:null):[null,null,null];
  while(G.waypoints.length<3)G.waypoints.push(null);
  G.spents=new Set(d.spents||[]);Object.assign(G.stats,d.stats||{});
  G.quest=(d.q&&d.q.state==='active'&&Array.isArray(d.q.want)&&d.q.giver&&Number.isFinite(+d.q.giver.seed))?d.q:null;
  bootCamp(true);
  for(const s of (d.st||[])){
    const o=makeStructure(s.t,s.x,s.z,s.r,heightAt(s.x,s.z));
    o.pow=s.pow||0;o.dew=s.dew||0;o.water=s.water||0;o.fluid=s.fluid||0;
    o.grow=s.grow||0;o.seeded=!!s.seeded;o.ripe=!!s.ripe;
  }
  log('camp recovered from local storage','gold');
  questResume();
}
function loadGame(){const d=readSave();if(!d)return false;applySave(d);return true}
function wipeGame(){
  try{localStorage.removeItem(KEY_SAVE)}catch(e){}
  skipUnloadSave=true;
  SET.seen=false;SET.guide=true;saveSettings();
}

let bookPageIndex=0,bookTool='write',activeBookStroke=null,bookSaveTimer=0,bookInkPoints=0;
function countBookInkPoints(){return G.bookPages.reduce((sum,page)=>sum+page.strokes.reduce((n,stroke)=>n+stroke.points.length,0),0)}
function saveBookNow(){clearTimeout(bookSaveTimer);bookSaveTimer=0;saveGame()}
function saveBookSoon(){clearTimeout(bookSaveTimer);bookSaveTimer=setTimeout(saveBookNow,350)}
function bookPageMarkup(){
  const pages=G.bookPages,index=clamp(bookPageIndex,0,pages.length-1),page=pages[index];
  bookPageIndex=index;
  return `<div class="book-controls"><div class="group">
    <label for="book-page-number" class="lbl">page</label>
    <input id="book-page-number" data-book-page type="number" min="1" max="${pages.length}" value="${index+1}" aria-label="Selected page">
    <span class="lbl">/ ${pages.length}</span>
  </div><div class="group">
    <button class="btn sm" data-book-act="insert" ${pages.length>=120?'disabled':''}>insert after</button>
    <button class="btn sm" data-book-act="append" ${pages.length>=120?'disabled':''}>append</button>
    <button class="btn sm gho" data-book-act="rip" ${pages.length<=1?'disabled':''}>rip page</button>
  </div></div>
  <div class="book-controls"><p class="book-note">${page.text.length} / 5000 characters · ${page.strokes.length} ink marks</p>
    <div class="group" role="group" aria-label="Page tool">
      <button class="btn sm ${bookTool==='write'?'on':''}" data-book-tool="write">write</button>
      <button class="btn sm ${bookTool==='draw'?'on':''}" data-book-tool="draw">draw</button>
      <button class="btn sm ${bookTool==='erase'?'on':''}" data-book-tool="erase">erase</button>
    </div>
  </div>
  <div class="book-page ${bookTool==='write'?'':'is-drawing'}">
    <textarea data-book-text maxlength="5000" aria-label="Write on this journal page" placeholder="Write on this page…"></textarea>
    <canvas data-book-canvas aria-label="Draw or erase on this journal page"></canvas>
    <span class="book-page-no">${index+1}</span>
  </div>`;
}
function drawBookPage(){
  const canvasEl=$('#md-b [data-book-canvas]');
  if(!canvasEl||!G.bookPages[bookPageIndex])return;
  const rect=canvasEl.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);
  if(!rect.width||!rect.height)return;
  canvasEl.width=Math.round(rect.width*ratio);canvasEl.height=Math.round(rect.height*ratio);
  const ctx=canvasEl.getContext('2d');ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const stroke of G.bookPages[bookPageIndex].strokes){
    if(stroke.points.length<2)continue;
    ctx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';
    ctx.strokeStyle='#342b20';ctx.lineWidth=(stroke.erase?24:3.2)*ratio;
    ctx.beginPath();ctx.moveTo(stroke.points[0][0]*canvasEl.width,stroke.points[0][1]*canvasEl.height);
    for(let i=1;i<stroke.points.length;i++)ctx.lineTo(stroke.points[i][0]*canvasEl.width,stroke.points[i][1]*canvasEl.height);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
}
function renderBookPage(){
  const body=$('#md-b');body.innerHTML=bookPageMarkup();
  const text=body.querySelector('[data-book-text]');
  text.value=G.bookPages[bookPageIndex].text;
  drawBookPage();
}
function openBook(){
  if(!G.bookPages.length)G.bookPages=[{text:'',strokes:[]}];
  bookPageIndex=0;bookTool='write';bookInkPoints=countBookInkPoints();closePanel();
  MODAL.open('scrap journal',`${G.bookPages.length} page${G.bookPages.length===1?'':'s'} · kept with your camp`,
    '<div id="book-editor"></div>',[{label:'close journal',cls:'pri',fn:saveBookNow}]);
  renderBookPage();
  $('#md-t').textContent='scrap journal';
  $('#md-s').textContent=`${G.bookPages.length} page${G.bookPages.length===1?'':'s'} · page ${bookPageIndex+1}`;
}
$('#md-b').addEventListener('input',e=>{
  const text=e.target.closest('[data-book-text]');
  if(!text)return;
  const page=G.bookPages[bookPageIndex];
  if(!page)return;
  page.text=text.value.slice(0,5000);
  const note=$('#md-b .book-note');if(note)note.textContent=`${page.text.length} / 5000 characters · ${page.strokes.length} ink marks`;
  saveBookSoon();
});
$('#md-b').addEventListener('change',e=>{
  const input=e.target.closest('[data-book-page]');
  if(!input)return;
  bookPageIndex=clamp((Number(input.value)||1)-1,0,G.bookPages.length-1);
  renderBookPage();
  $('#md-s').textContent=`${G.bookPages.length} page${G.bookPages.length===1?'':'s'} · page ${bookPageIndex+1}`;
});
$('#md-b').addEventListener('click',e=>{
  const tool=e.target.closest('[data-book-tool]');
  if(tool){bookTool=tool.dataset.bookTool;renderBookPage();if(bookTool==='write')$('#md-b [data-book-text]').focus();return}
  const button=e.target.closest('[data-book-act]');
  if(!button||button.disabled)return;
  if(button.dataset.bookAct==='append'&&G.bookPages.length<120){
    G.bookPages.push({text:'',strokes:[]});bookPageIndex=G.bookPages.length-1;
  }else if(button.dataset.bookAct==='insert'&&G.bookPages.length<120){
    G.bookPages.splice(bookPageIndex+1,0,{text:'',strokes:[]});bookPageIndex++;
  }else if(button.dataset.bookAct==='rip'&&G.bookPages.length>1){
    const [removed]=G.bookPages.splice(bookPageIndex,1);
    bookInkPoints-=removed.strokes.reduce((n,stroke)=>n+stroke.points.length,0);
    bookPageIndex=Math.max(0,bookPageIndex-1);
  }else return;
  saveBookNow();renderBookPage();
  $('#md-s').textContent=`${G.bookPages.length} page${G.bookPages.length===1?'':'s'} · page ${bookPageIndex+1}`;
});
$('#md-b').addEventListener('pointerdown',e=>{
  const canvasEl=e.target.closest('[data-book-canvas]');
  if(!canvasEl||bookTool==='write')return;
  if(bookInkPoints>=11999){log('the journal has no room for more ink marks','bad');return}
  const page=G.bookPages[bookPageIndex],rect=canvasEl.getBoundingClientRect();
  if(!page||!rect.width||!rect.height)return;
  e.preventDefault();canvasEl.setPointerCapture(e.pointerId);
  if(page.strokes.length>=100){const old=page.strokes.shift();bookInkPoints-=old.points.length}
  const point=[clamp((e.clientX-rect.left)/rect.width,0,1),clamp((e.clientY-rect.top)/rect.height,0,1)];
  activeBookStroke={erase:bookTool==='erase',points:[point]};page.strokes.push(activeBookStroke);
  bookInkPoints++;
});
$('#md-b').addEventListener('pointermove',e=>{
  if(!activeBookStroke)return;
  const canvasEl=e.target.closest('[data-book-canvas]');
  if(!canvasEl)return;
  const rect=canvasEl.getBoundingClientRect(),points=activeBookStroke.points;
  const point=[clamp((e.clientX-rect.left)/rect.width,0,1),clamp((e.clientY-rect.top)/rect.height,0,1)];
  const last=points[points.length-1];
  if(Math.hypot(point[0]-last[0],point[1]-last[1])<0.002)return;
  if(points.length>=160)points[points.length-1]=point;
  else if(bookInkPoints<12000){points.push(point);bookInkPoints++}
  drawBookPage();
});
function finishBookStroke(){
  if(!activeBookStroke)return;
  if(activeBookStroke.points.length===1){activeBookStroke.points.push(activeBookStroke.points[0].slice());bookInkPoints++}
  activeBookStroke=null;drawBookPage();saveBookSoon();
}
$('#md-b').addEventListener('pointerup',finishBookStroke);
$('#md-b').addEventListener('pointercancel',finishBookStroke);

async function importGameSave(file){
  if(!file)return;
  if(file.size>4*1024*1024){log('save file is larger than 4 MB','bad');return}
  let data;
  try{data=JSON.parse(await file.text())}catch(e){log('that file is not valid JSON','bad');return}
  const problem=validateGameSave(data);
  if(problem){log('cannot load checkpoint — '+problem,'bad');return}
  MODAL.open('load checkpoint','replace the current camp',
    '<p class="desc">This checkpoint is for seed 0x'+(data.seed>>>0).toString(16).toUpperCase().padStart(8,'0')+' on day '+data.day+'. Loading it replaces the current saved world and reloads the game.</p>',[
      {label:'cancel',cls:'gho'},
      {label:'load checkpoint',cls:'pri',fn(){
        try{
          localStorage.setItem(KEY_SAVE,JSON.stringify(data));
          SET.seen=true;saveSettings();skipUnloadSave=true;location.reload();
        }catch(e){log('checkpoint could not be stored in this browser','bad')}
      }}
    ]);
}

      h+=`<div class="rowi">${glyphSw(k)}<div class="nm"><b>${it.n}</b><i>${it.d}</i></div>
        <div class="qt">${G.inv[k]}</div><div class="qty">`;
      if(k==='water'||k==='dew')h+=`<button class="btn sm" data-act="drink" data-id="${k}">drink</button>`;
      if(['pear','root','bean','stew','jerky'].includes(k))h+=`<button class="btn sm" data-act="eat" data-id="${k}">eat</button>`;
      if(k==='bandage')h+=`<button class="btn sm" data-act="use" data-id="${k}">apply</button>`;
      if(['crowbar','lantern','finder'].includes(k))h+=`<button class="btn sm ${G.tool===k?'on':''}" data-act="equip" data-id="${k}">${G.tool===k?'held':'hold'}</button>`;
      if(k==='kite')h+=`<button class="btn sm ${G.kiteFly?'on':''}" data-act="kite">${G.kiteFly?'reel':'fly'}</button>`;
      if(k==='finder')h+=`<button class="btn sm ${G.findOn?'on':''}" data-act="scan">${G.findOn?'scan on':'scan off'}</button>`;

  if(e.code==='Tab')e.preventDefault();
  Keys[e.code]=true;
  if(DETAIL&&(e.code==='Escape'||e.code==='Tab')){MODAL.close();grabLock(2);return}
  if(MODAL.on)return;
  switch(e.code){
    case 'KeyI':case 'KeyC':case 'KeyB':case 'KeyT':case 'KeyM':case 'KeyH':case 'KeyP':{
      const map={KeyI:'satchel',KeyC:'fab',KeyB:'build',KeyT:'trade',KeyM:'map',KeyH:'help',KeyP:'set'};
      if(selectedPanel===map[e.code])closePanel();else{selectedPanel=map[e.code];refreshPanel()}
      e.preventDefault();break;
    }
    case 'Escape':
      if(selectedPanel)closePanel();
      else{lookDrag=false;if(pointerHeld)document.exitPointerLock()}
      break;
    case 'KeyR': if(Build.on)Build.rot+=TAU/8; break;
    case 'Space':
      if(!uiBlocking()&&P.ground&&!P.dead&&!G.drive){P.vy=7.1;P.ground=false;Drifter.dispatch('air');SFX('step')}
      e.preventDefault();break;
    case 'KeyK': toggleKite(); break;
    case 'KeyV': toggleView(); break;
    case 'KeyF': toggleFinder(); break;
    case 'Tab': openDetail('cond'); break;
    case 'KeyN': if(isPlane()){SET.invert=!SET.invert;saveSettings();log('pitch '+(SET.invert?'inverted — W pulls up':'normal — W noses down'))} break;
    case 'KeyG':{ // eat the best thing in the bag
      const f=['stew','jerky','pear','root','bean'].find(k=>G.inv[k]>0);
      if(f)eat(f);else log('nothing edible in the satchel','bad');
      break;
    }
    case 'KeyE': if(G.drive&&!e.repeat)exitBuggy(); break;
    case 'KeyQ': if(!G.drive&&G.tool!=='hands'){G.tool='hands';refreshViewModel();log('stowed the tool')} break;
    case 'Digit1': selectedPanel='fab';refreshPanel();break;
    case 'Digit2': selectedPanel='build';refreshPanel();break;
  }
});
addEventListener('keyup',e=>{Keys[e.code]=false});
function grabLock(n){
  if(pointerHeld||n<=0||selectedPanel!==null||MODAL.on)return;
  const again=()=>setTimeout(()=>grabLock(n-1),1100);
  try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(again)}catch(err){again()}
}
document.addEventListener('pointerlockerror',()=>setTimeout(()=>grabLock(2),1100));
canvas.addEventListener('mousedown',e=>{
  if(e.button===0){
    if(Build.on&&pointerHeld){tryPlace();return}
    lookDrag=true;
    if(!pointerHeld)grabLock(3);
  }
  if(e.button===2&&Build.on)Build.rot-=TAU/8;
});
addEventListener('mouseup',()=>{lookDrag=false});
addEventListener('mousemove',e=>{
  if(!pointerHeld&&!lookDrag)return;
  if(uiBlocking())return;
  const dx=e.movementX||0,dy=e.movementY||0;
  if(isPlane()){planeLook(dx,dy);return}
  if(G.drive&&G.drive.type==='buggy'){
    const look=G.drive.look,turn=dx*0.0021*SET.sens;
    look.yaw=((look.yaw-turn+Math.PI)%TAU+TAU)%TAU-Math.PI;
    look.pitch=clamp(look.pitch-dy*0.0021*SET.sens,-1.2,1.2);
    P.yaw=G.drive.yaw+Math.PI+look.yaw;
    P.pitch=look.pitch;
    return;
  }
  P.yaw-=dx*0.0021*SET.sens;
  P.pitch=clamp(P.pitch-dy*0.0021*SET.sens,-1.48,1.48);
});

function eat(id){
  if(!G.inv[id])return;
  invTake(id,1);
  if(id==='water'||id==='dew'){P.hyd=Math.min(1,P.hyd+(id==='water'?0.46:0.28))}
  else P.nut=Math.min(1,P.nut+({stew:0.5,jerky:0.32,pear:0.14,root:0.16,bean:0.15}[id]||0.15));
  if(id==='bandage')P.hp=Math.min(1,P.hp+0.35);
  log('ate '+itemName(id),'good');SFX('pick');refreshPanel();
}
$('#dbody').addEventListener('click',e=>{
  const t=e.target.closest('[data-set]');
  if(t&&t.classList.contains('tog')){
    const k=t.dataset.set;SET[k]=!SET[k];
    if(k==='shadow')SHADOWS=SET.shadow;
    saveSettings();refreshPanel();return;
  }
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'craft':startCraft(RECIPES[+b.dataset.i]);break;
    case 'uncraft':cancelQueued(+b.dataset.i);break;
    case 'cancelrun':cancelRunning();break;
    case 'build':startBuild(id);break;
    case 'recover':{const s=G.struct.find(x=>x.id== +id);if(s){invAdd(WORKS[s.type].refund[0],1);removeStructure(s,false);log('stripped '+WORKS[s.type].n,'good');saveGame();refreshPanel()}break}
    case 'drink':drink(id);break;
    case 'eat':eat(id);break;
    case 'use':eat(id);break;
    case 'book':openBook();break;
    case 'drop':{const n=G.inv[id];if(n>1){invTake(id,1);log('dropped 1× '+itemName(id))}else{invTake(id,n);log('dropped '+itemName(id))}SFX('pick');refreshPanel();break}
    case 'equip':{G.tool=G.tool===id?'hands':id;refreshViewModel();SFX('pick');refreshPanel();break}
    case 'kite':toggleKite();refreshPanel();break;
    case 'scan':toggleFinder();refreshPanel();break;
    case 'mark':WAY={x:+b.dataset.x,z:+b.dataset.z};log('waypoint pinned · '+Math.hypot(WAY.x-P.x,WAY.z-P.z).toFixed(0)+' m');SFX('pick');break;
    case 'waypoint':{
      const slot=clamp(+id,0,2);
      G.waypoints[slot]={x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2)};
      if(saveGame())log('WP'+(slot+1)+' saved · '+Math.hypot(P.x-G.waypoints[slot].x,P.z-G.waypoints[slot].z).toFixed(0)+' m','good');
      else log('waypoint could not be saved','bad');
      SFX('pick');refreshPanel();break;
    }
    case 'tsel':TRADER_SEL=+id;refreshPanel();break;
    case 'tdismiss':{const t2=G.traders.find(x=>x.id== +id);if(t2){if(questHolds(t2))questAbandon(t2);t2.visit.dispatch('timeout');log('you send them on','gold')}refreshPanel();break}
    case 'qaccept':{const t2=G.traders.find(x=>x.id== +id);if(t2)questAccept(t2);break}
    case 'qdone':{const t2=G.traders.find(x=>x.id== +id);if(t2)questDeliver(t2);break}
    case 'buy':trade(+0,id,1,false);break;
    case 'buy5':trade(0,id,5,false);break;
    case 'sell':trade(0,id,1,true);break;
    case 'sell5':trade(0,id,5,true);break;
    case 'sellstruct':{
      const s=G.struct.find(x=>x.id== +id);
      const t2=G.traders.find(x=>x.id===TRADER_SEL)||G.traders[0];
      if(s&&t2){
        const k=WORKS[s.type].kit,p=priceSell(t2,k);
        G.cash+=p;t2.stock[k]=(t2.stock[k]||0)+1;
        removeStructure(s,false);
        G.stats.traded++;
        log('traded the '+WORKS[s.type].n+' away for '+p+' scrap','gold');
        SFX('coin');saveGame();
      }
      refreshPanel();break}
    case 'save':saveGame()?log('camp written to local storage','good'):log('storage refused the write','bad');refreshPanel();break;
    case 'export-save':exportGameSave();break;
    case 'import-save':saveFileInput.click();break;
    case 'guide':showGuide();break;
    case 'wipe':MODAL.open('burn this world','this cannot be undone',
      '<p class="desc">The saved camp, the seed and every mark you have made on the desert will be erased.</p>',
      [{label:'keep it',cls:''},{label:'burn it',cls:'pri',fn(){wipeGame();location.reload()}}]);break;
  }
});

function drink(id){
  if(!G.inv[id])return;
  invTake(id,1);
  P.hyd=Math.min(1,P.hyd+(id==='water'?0.46:0.28));
  if(id==='dew')P.hp=Math.max(0,P.hp-0.01);
  log('drank '+itemName(id),'good');SFX('pick');refreshPanel();
}
function trade(_t,id,n,sell){
  const t=G.traders.find(x=>x.id===TRADER_SEL)||G.traders[0];
  if(!t)return;
  if(sell){
    const have=G.inv[id]||0,k=Math.min(have,n);
    if(k<1){log('nothing to sell','bad');SFX('bad');refreshPanel();return}
    const p=priceSell(t,id)*k;
    invTake(id,k);
    t.stock[id]=(t.stock[id]||0)+k;
    G.cash+=p;
    log('sold '+k+'× '+itemName(id)+' for '+p+' scrap','good');
    G.stats.traded+=k;SFX('coin');
  }else{
    const have=t.stock[id]||0;
    if(have<n){log(t.name+' has no more of that','bad');SFX('bad');return}
    const cost=priceBuy(t,id)*n;
    if(G.cash<cost){log('not enough scrap — sell something first','bad');SFX('bad');return}
    G.cash-=cost;t.stock[id]=have-n;
    invAdd(id,n);log('bought '+n+'× '+itemName(id)+' for '+cost+' scrap','good');G.stats.traded+=n;SFX('coin');
  }
  saveGame();refreshPanel();
}

let campBuilt=false;
function bootCamp(rebuilt){
  if(campBuilt)return;
  campBuilt=true;
  for(const a of [['shelter',9.5,9.5,-0.4],['workbench',13.5,13.0,2.2],['crate',12.4,11.4,0]]){

let fps=60,hudAcc=0;
const headingDeg=()=>heading();
function buildCompass(){
  const strip=$('#cstrip');
  let h='';
  for(let d=-180;d<=900;d+=15){
    const maj=((d%45)+45)%45===0,x=d*2;
    h+=`<div class="tk ${maj?'maj':''}" style="left:${x}px"></div>`;
    if(((d%45)+45)%45===0){
      const q=(((d%360)+360)%360)/45,n=['N','NE','E','SE','S','SW','W','NW'][q];
      h+=`<div class="cl ${q%2?'ic':''}" style="left:${x}px">${n}</div>`;
    }
  }
  strip.innerHTML=h;
}
function drawArc(){
  const t=Day.ctx.t;
  const isD=t<0.75;
  const f=isD?t/0.75:(t-0.75)/0.25;
  const x=4+184*f;
  const y=isD?22-19*Math.sin(Math.PI*f):22+9*Math.sin(Math.PI*f);
  const a=$('#arc-sun');
  a.setAttribute('cx',x.toFixed(1));a.setAttribute('cy',y.toFixed(1));
  a.setAttribute('fill',isD?'#f0b93f':'#93a9d4');
  a.setAttribute('r',isD?2.6:2);
  const n=$('#arc-now');
  n.setAttribute('x1',x.toFixed(1));n.setAttribute('x2',x.toFixed(1));
  const d=$('#arc-day');
  d.setAttribute('d','M4,22 A 92,19 0 0 1 188,22');
  const nd=$('#arc-night');
  nd.setAttribute('d','M4,22 L188,22 L188,30 L4,30 Z');
}
function scannerList(){
  const rng=120*(G.findBoost||1),r2=rng*rng,out=[];
  for(const f of featuresNear(P.x,P.z,rng)){
    if(G.spents.has(f.id))continue;
    const d2=(f.x-P.x)**2+(f.z-P.z)**2;
    if(d2>r2)continue;
    out.push({x:f.x,z:f.z,d:f.d,dist:Math.sqrt(d2),d2,mark:f.d.mark});
  }
  out.sort((a,b)=>a.d2-b.d2);
  return out.slice(0,26);
}
const _v=new THREE.Vector3();
function projectHUDMarker(x,y,z){
  _v.set(x,y,z).applyMatrix4(camera.matrixWorldInverse);
  if(_v.z>=-0.05)return null;
  const s=-10/_v.z;
  _v.x*=s;_v.y*=s;_v.z=-10;
  _v.applyMatrix4(camera.projectionMatrix);
  return _v;
}
function drawMarkers(){
  const box=$('#markers');
  const W=innerWidth,H=innerHeight;
  let h='';
  if(G.findOn)for(const f of scannerList()){
    const dx=f.x-P.x,dz=f.z-P.z,dd=Math.hypot(dx,dz);
    if(dd<3)continue;
    _v.set(f.x,heightAt(f.x,f.z)+1.2,f.z);
    _v.project(camera);
    if(_v.z>1)continue;
    const sx=(_v.x*0.5+0.5)*W,sy=(-_v.y*0.5+0.5)*H;
    if(sx<-40||sx>W+40||sy<-20||sy>H+20)continue;
    h+=`<div class="mk2 ${f.mark?'':'w'}" style="left:${sx.toFixed(0)}px;top:${sy.toFixed(0)}px">
      <span class="g">${f.mark?'◆':'◇'}</span>${f.d.n} ${dd.toFixed(0)}m</div>`;
  }
  if(WAY){
    const p=projectHUDMarker(WAY.x,heightAt(WAY.x,WAY.z)+1.2,WAY.z);
    if(p){
      const sx=clamp((p.x*0.5+0.5)*W,20,W-20),sy=clamp((-p.y*0.5+0.5)*H,20,H-20);
      h+=`<div class="mk2 t" style="left:${sx.toFixed(0)}px;top:${sy.toFixed(0)}px">
        <span class="g">▼</span>waypoint ${Math.hypot(WAY.x-P.x,WAY.z-P.z).toFixed(0)}m</div>`;
    }
  }
  for(let i=0;i<G.waypoints.length;i++){
    const waypoint=G.waypoints[i];
    if(!waypoint)continue;
    const distance=Math.hypot(waypoint.x-P.x,waypoint.z-P.z);
    const wy=waypoint.y!==undefined?waypoint.y+1.5:heightAt(waypoint.x,waypoint.z)+1.5;
    const p=projectHUDMarker(waypoint.x,wy,waypoint.z);
    if(!p)continue;
    const sx=clamp((p.x*0.5+0.5)*W,20,W-20),sy=clamp((-p.y*0.5+0.5)*H,20,H-20);
    h+=`<div class="mk2 t" style="left:${sx.toFixed(0)}px;top:${sy.toFixed(0)}px">
      <span class="g">WP${i+1}</span>${distance.toFixed(0)}m</div>`;
  }
  for(const tr of G.traders){
    _v.set(tr.x,heightAt(tr.x,tr.z)+2.4,tr.z).project(camera);
    if(_v.z>1)continue;
    const sx=(_v.x*0.5+0.5)*W,sy=(-_v.y*0.5+0.5)*H;
    if(sx<-40||sx>W+40)continue;
    h+=`<div class="mk2 t" style="left:${sx.toFixed(0)}px;top:${sy.toFixed(0)}px">
      <span class="g">☗</span>${tr.name.split(' ')[0]} ${Math.hypot(tr.x-P.x,tr.z-P.z).toFixed(0)}m</div>`;
  }
  box.innerHTML=h;
}

  .tcb.hot,.tcb:active{border-color:var(--amber);color:var(--amber)}
  .tcb.hid{display:none}
  @media (pointer:coarse){#hotbar{bottom:8px}#hotbar .k{display:none}#hotbar .slot{padding:6px 7px}#log{bottom:70px}#locline{display:none}}`;
  document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend',
   '<div id="joy"><small>move</small><i></i></div><div id="lookr"><small>look</small><i></i></div>'+
   '<div id="tc"><button class="tcb big" data-k="act">act</button><button class="tcb" data-k="jump">jump</button><button class="tcb" data-k="run">run</button></div>'+
   '<div id="tc2"><button class="tcb" data-k="view">view</button><button class="tcb" data-k="rec">recover</button><button class="tcb" data-k="set">set</button><button class="tcb" data-k="turn">turn</button><button class="tcb" data-k="scan">scan</button><button class="tcb" data-k="kite">kite</button><button class="tcb" data-k="eat">eat</button><button class="tcb" data-k="stow">stow</button></div>');
  const tc=$('#tc'),tc2=$('#tc2'),J=$('#joy'),LR=$('#lookr'),knob=J.querySelector('i'),lknob=LR.querySelector('i');
  const btn=k=>document.querySelector('.tcb[data-k='+k+']');
  const actB=btn('act'),jumpB=btn('jump');
  touchSync=function(){
    document.body.classList.toggle('tplay',started&&!uiBlocking());
    const drv=!!G.drive,pl=isPlane();
    actB.textContent=drv?'exit':'act';
    jumpB.textContent=pl?'thr':'jump';
    btn('view').classList.toggle('hid',!drv);
    btn('rec').classList.toggle('hid',!(Hands.ctx.alt&&!drv));
    btn('set').classList.toggle('hid',!Build.on);
    btn('turn').classList.toggle('hid',!Build.on);
    btn('scan').classList.toggle('hid',!(G.inv.finder>0));
    btn('stow').classList.toggle('hid',!(G.tool!=='hands'&&!drv));
    btn('kite').classList.toggle('hid',drv);
    btn('eat').classList.toggle('hid',drv);
  };
  const onBtn=e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
    switch(b.dataset.k){
      case 'act':if(G.drive){exitBuggy();break}Keys['KeyE']=true;b.classList.add('hot');break;
      case 'rec':Keys['KeyX']=true;b.classList.add('hot');break;
      case 'jump':if(isPlane()){G.drive.thr=G.drive.thr>0.3?0:0.7;break}if(!uiBlocking()&&P.ground&&!G.drive){P.vy=7.1;P.ground=false;Drifter.dispatch('air');SFX('step')}break;
      case 'run':Keys['ShiftLeft']=!Keys['ShiftLeft'];b.classList.toggle('hot',!!Keys['ShiftLeft']);break;
      case 'view':toggleView();break;
      case 'stow':if(!G.drive&&G.tool!=='hands'){G.tool='hands';refreshViewModel();log('stowed the tool')}break;
      case 'kite':toggleKite();break;
      case 'scan':toggleFinder();break;
      case 'set':if(Build.on)tryPlace();break;
      case 'turn':if(Build.on)Build.rot+=TAU/8;break;
      case 'eat':{const f=['stew','jerky','pear','root','bean'].find(k=>G.inv[k]>0);if(f)eat(f);else log('nothing edible in the satchel','bad')}break;
    }};
  tc.addEventListener('pointerdown',onBtn);tc2.addEventListener('pointerdown',onBtn);
  const rel=()=>{Keys['KeyE']=false;Keys['KeyX']=false;actB.classList.remove('hot');btn('rec').classList.remove('hot')};
  addEventListener('pointerup',rel);addEventListener('pointercancel',rel);addEventListener('blur',rel);
  let joy=null,look=null;
  const homeJoy=()=>{J.style.left=J.style.top=J.style.bottom='';J.classList.remove('act');knob.style.transform=''};
  const homeLook=()=>{LR.style.left=LR.style.top=LR.style.right=LR.style.bottom='';LR.classList.remove('act');lknob.style.transform=''};
  const place=(el,x,y)=>{const r=el.offsetWidth/2;el.style.left=(x-r)+'px';el.style.top=(y-r)+'px';el.style.right='auto';el.style.bottom='auto'};
  canvas.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){
    if(t.clientX<innerWidth*0.40&&!joy){joy={id:t.identifier,x:t.clientX,y:t.clientY};place(J,t.clientX,t.clientY);J.classList.add('act')}
    else if(!look){look={id:t.identifier,x:t.clientX,y:t.clientY,ox:t.clientX,oy:t.clientY};place(LR,t.clientX,t.clientY);LR.classList.add('act')}}},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){
    if(joy&&t.identifier===joy.id){let dx=t.clientX-joy.x,dy=t.clientY-joy.y;const m=Math.hypot(dx,dy);if(m>46){dx*=46/m;dy*=46/m}
      TOUCH.x=dx/46;TOUCH.z=-dy/46;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
    else if(look&&t.identifier===look.id){
      let kx=t.clientX-look.ox,ky=t.clientY-look.oy;const km=Math.hypot(kx,ky);if(km>46){kx*=46/km;ky*=46/km}
      lknob.style.transform='translate('+kx+'px,'+ky+'px)';
      if(!uiBlocking()){
      const dx=(t.clientX-look.x)*2.5,dy=(t.clientY-look.y)*2.5;
      if(isPlane())planeLook(dx,dy);
      else if(G.drive&&G.drive.type==='buggy'){
        const view=G.drive.look,turn=dx*0.0021*SET.sens;
        view.yaw=((view.yaw-turn+Math.PI)%TAU+TAU)%TAU-Math.PI;
        view.pitch=clamp(view.pitch-dy*0.0021*SET.sens,-1.2,1.2);
        P.yaw=G.drive.yaw+Math.PI+view.yaw;
        P.pitch=view.pitch;
      }else{P.yaw-=dx*0.0021*SET.sens;P.pitch=clamp(P.pitch-dy*0.0021*SET.sens,-1.48,1.48)}
    }look.x=t.clientX;look.y=t.clientY}}},{passive:false});
  const end=e=>{for(const t of e.changedTouches){
    if(joy&&t.identifier===joy.id){joy=null;TOUCH.x=TOUCH.z=0;homeJoy()}
    if(look&&t.identifier===look.id){look=null;homeLook()}}};
  canvas.addEventListener('touchend',end);canvas.addEventListener('touchcancel',end);
})();

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&DETAIL){MODAL.close();grabLock(2)}});
$('#hb').addEventListener('click',()=>openDetail('cond'));
$('#ck').addEventListener('click',()=>openDetail('clock'));
const BOOTLINES=[
  ['<b>Scrap Frontier</b> — 1 file, 0 assets, 0 build steps','plain'],
  ['reading settings from localStorage','plain'],
  ['rolling terrain seed from the coordinate field','plain'],
  ['grinding rust textures at 256²','plain'],
  ['hashing the finite state machine kernel','plain'],
  ['welding sky, sun, shadow frustum','plain'],
  ['streaming desert cells around the drifter','plain'],
  ['pitching the first camp','good'],
  ['ready','gold']
];
let bootI=0;
function bootType(){
  const el=$('#bootlog');
  if(bootI>=BOOTLINES.length){
    $('#bootgo').disabled=false;
    $('#bootgo').classList.add('pri');
    return;
  }
  const [txt,cls]=BOOTLINES[bootI++];
  const d=document.createElement('div');
  d.className=cls;d.innerHTML=txt;
  el.appendChild(d);
  while(el.childElementCount>11)el.removeChild(el.firstChild);
  setTimeout(bootType,120+Math.random()*180);
}
function say(t,c){const d=document.createElement('div');d.className=c||'plain';d.innerHTML=t;$('#bootlog').appendChild(d);while($('#bootlog').childElementCount>11)$('#bootlog').removeChild($('#bootlog').firstChild)}
let ready=false;
async function boot(){
  $('#bootlog').innerHTML='';
  say('<b>Scrap Frontier</b> — one file holds the whole desert','gold');
  loadSettings();
  const saved=readSave();
  if(saved)SEED=saved.seed>>>0;else SEED=(Math.random()*0xffffffff)>>>0;
  say('seed 0x'+(SEED>>>0).toString(16).toUpperCase()+(saved?' — a saved camp is waiting':' — rolling a fresh one'),'good');
  try{await loadThree()}catch(e){
    say('<u>renderer unavailable</u> — the vendored Three.js module could not load.','');
    $('#bootgo').textContent='renderer unavailable';
    return;
  }
  say('grinding rust, sand, rock and cloth at 256²','plain');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',stencil:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(SET.fov,innerWidth/innerHeight,0.08,1600);
  forgeTextures();buildGeo();buildMats();buildSky();say("weathering the kit — rust, canvas, sandstone","plain");await forgeAsm(t=>say(t,"plain"));
  say('welding sky dome, sun, shadow frustum','plain');
  worldInit();initPuffs();buildKite();buildViewModel();
  if(saved)applySave(saved);else bootCamp(false);
  Drifter.start();Fab.start();Hands.start();Weather.start();
  GHOSTMAT=new THREE.MeshBasicMaterial({color:0x9aae6f,transparent:true,opacity:0.34,depthWrite:false});
  SHADOWS=SET.shadow;WINDMUL.value=1;
  for(let i=0;i<40;i++)streamTick(P.x,P.z);
  streamWorld(P.x,P.z);World.wi=0;World.want=null;
  say('streaming desert cells around the drifter','plain');
  buildCompass();
  ready=true;
  say('ready — the desert is where you left it','good');
  $('#bootgo').disabled=false;
  $('#bootgo').classList.add('pri');
  saveGame();
}
$('#bootgo').onclick=()=>{
  $('#boot').style.transition='opacity .6s';
  $('#boot').style.opacity=0;
  setTimeout(()=>{$('#boot').style.display='none'},620);
  $('#hud').classList.add('on');
  started=true;
  log('you wake under a dead drifter\'s lean-to. the desert is very large.');
  log('hold <b>E</b> on a heap of rust to take it apart');
  const guideNow=SET.guide;
  if(guideNow){setTimeout(showGuide,300);SET.guide=false;SET.seen=true;saveSettings()}
  else grabLock(2);
};
$('#bootreset').onclick=()=>{wipeGame();location.reload()};
boot();

/* ───────────────────────────────────────────────────────────────────────
   §16  LOOP
   ─────────────────────────────────────────────────────────────────────── */
let started=false,last=now();
const App=machine('app',{initial:'run',states:{
  idle:{update(){}},
  run:{update(m,dt){step(dt)}},
  hold:{update(){}}
},trans:[{event:'run',from:'*',to:'run'},{event:'hold',from:'*',to:'hold'}]});
App.start();
function step(dt){
  Day.update(dt);
  if(Day.ctx.t>0.95&&G.epochDay!==Day.ctx.day)respawnScrap();
  Weather.update(dt);
  const blocked=uiBlocking();
  if(!blocked)playerTick(dt);else playerTick(0);
  streamTick(P.x,P.z);
  Grid.acc+=dt;
  if(Grid.acc>0.25){Grid.acc=0;gridTick(0.25)}
  Hands.update(dt);
  Fab.update(dt);
  buildTick();
  kiteTick(dt);
  traderTick(dt);
  animateStructures(dt);
  tickPuffs(dt);
  /* the scanner burns charge and refills itself off your own grid */
  if(G.findOn){
    G.findChg=Math.max(0,G.findChg-dt*0.0045);
    if(nearPower(P.x,P.z,15))G.findChg=Math.min(1,G.findChg+dt*0.08);
    if(G.findChg<=0){G.findOn=false;log('the finder dies. recharge it inside your powered camp.','bad')}
  }
  updateSky(dt,P.x,P.z);
  autosaveAcc+=dt;
  if(autosaveAcc>20){autosaveAcc=0;saveGame()}
  hudAcc+=dt;
  if(hudAcc>0.12){hudAcc=0;hudTick(dt);drawMarkers();if(selectedPanel==='fab'&&Fab.state==='running'){const fb=$('#fq-bar'),fp=$('#fq-pct');if(fb){const p=clamp(1-Fab.ctx.left/Fab.ctx.total,0,1);fb.style.width=(p*100)+'%';fp.textContent=Math.round(p*100)+'%'}}}
}
function frame(){
  requestAnimationFrame(frame);
  const t=now();
  const cap=FPS_CAPS[SET.fpsCap|0];
  if(cap&&t-last<1/cap-0.004)return;
  let dt=t-last;last=t;
  if(dt>0.1)dt=0.1;
  fps=lerp(fps,1/Math.max(dt,0.0001),0.06);
  if(ready&&started)App.update(dt);
  else if(ready){updateSky(dt,0,0);}
  if(renderer&&scene&&camera)renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  if(!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
addEventListener('beforeunload',()=>{if(ready&&!skipUnloadSave)saveGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ready&&!skipUnloadSave)saveGame()});
frame();

</script>
